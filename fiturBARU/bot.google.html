<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Bot - Indramayu Club</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Google Sans',Roboto,Arial}
body{background:#0a0a0a;color:white;min-height:100vh}
.header{background:#111;padding:15px;position:sticky;top:0;z-index:100;box-shadow:0 2px 10px #000}
.logo{font-size:24px;font-weight:bold;text-align:center;margin-bottom:15px}
.logo span{color:#4285F4}.logo b{color:#EA4335}.logo i{color:#FBBC05}.logo u{color:#34A853;text-decoration:none}
.search-box{display:flex;gap:8px;background:#202124;border-radius:30px;padding:8px 15px;border:1px solid #5f6368}
.search-box:focus-within{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
.search-box input{flex:1;background:transparent;border:none;color:white;font-size:16px;outline:none}
.search-box button{background:transparent;border:none;font-size:20px;cursor:pointer}
.btns{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:20px;border:1px solid #5f6368;background:#303134;color:white;cursor:pointer;font-size:14px}
.btn:hover{background:#3c4043}
.btn.active{background:#8ab4f8;color:#202124;border-color:#8ab4f8}
.iframe-wrap{margin-top:15px;height:75vh;border-radius:12px;overflow:hidden;background:white}
iframe{width:100%;height:100%;border:none;background:white}
.quick{padding:15px;display:flex;gap:8px;overflow-x:auto}
.chip{white-space:nowrap;padding:8px 14px;background:#202124;border-radius:20px;font-size:13px;border:1px solid #3c4043;cursor:pointer}
.chip:hover{background:#303134}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span>G</span><b>o</b><i>o</i><span>g</span><b>l</b><i>e</i> <u>Bot</u> - Indramayu</div>

  <div class="search-box">
    <span>🔍</span>
    <input id="q" type="text" placeholder="Cari apa saja... (misal: cuaca indramayu, jadwal sholat, harga emas)" autofocus onkeypress="if(event.key==='Enter') goSearch()">
    <button onclick="startVoice()" title="Voice">🎤</button>
    <button onclick="goSearch()" title="Search">➤</button>
  </div>

  <div class="btns">
    <button class="btn active" onclick="setMode('google')">🌐 Google</button>
    <button class="btn" onclick="setMode('images')">🖼️ Gambar</button>
    <button class="btn" onclick="setMode('videos')">🎥 Video</button>
    <button class="btn" onclick="setMode('maps')">🗺️ Maps</button>
    <button class="btn" onclick="setMode('news')">📰 Berita</button>
  </div>

  <div class="quick">
    <div class="chip" onclick="quickSearch('cuaca indramayu hari ini')">Cuaca Indramayu</div>
    <div class="chip" onclick="quickSearch('jadwal sholat indramayu')">Jadwal Sholat</div>
    <div class="chip" onclick="quickSearch('berita indramayu terbaru')">Berita Indramayu</div>
    <div class="chip" onclick="quickSearch('harga emas hari ini')">Harga Emas</div>
    <div class="chip" onclick="quickSearch('translate indonesia jawa')">Translate Jawa</div>
    <div class="chip" onclick="quickSearch('kitab makrifat')">Kitab Makrifat</div>
  </div>
</div>

<div class="iframe-wrap">
  <iframe id="gFrame" src="https://www.google.com/search?igu=1&q=indramayu+club+makrifat"></iframe>
</div>

<script>
let mode = 'google';
function setMode(m){
  mode=m;
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  goSearch();
}
function quickSearch(text){
  document.getElementById('q').value=text;
  goSearch();
}
function goSearch(){
  let q = document.getElementById('q').value || 'indramayu club';
  let url = '';
  if(mode=='google') url = 'https://www.google.com/search?igu=1&q=' + encodeURIComponent(q);
  if(mode=='images') url = 'https://www.google.com/search?igu=1&tbm=isch&q=' + encodeURIComponent(q);
  if(mode=='videos') url = 'https://www.google.com/search?igu=1&tbm=vid&q=' + encodeURIComponent(q);
  if(mode=='maps') url = 'https://www.google.com/maps/search/' + encodeURIComponent(q);
  if(mode=='news') url = 'https://www.google.com/search?igu=1&tbm=nws&q=' + encodeURIComponent(q);

  document.getElementById('gFrame').src = url;

  // Simpan history ke bot email
  try{ google.script.run.botLogSearch(q); }catch(e){}
}

function startVoice(){
  if(!('webkitSpeechRecognition' in window)){
    alert('Voice tidak support di browser ini, pakai Chrome HP');
    return;
  }
  let rec = new webkitSpeechRecognition();
  rec.lang='id-ID';
  rec.onresult=function(e){
    document.getElementById('q').value = e.results[0][0].transcript;
    goSearch();
  }
  rec.start();
}

// auto focus
window.onload = ()=> document.getElementById('q').focus();
</script>

</body>
</html>
