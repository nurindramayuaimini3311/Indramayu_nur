<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alwi Creative Lab — AI HTML Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,'Segoe UI',Roboto,sans-serif}
body{min-height:100vh;background:linear-gradient(160deg,#111827,#1f2937 60%,#312e81);color:#e5e7eb;padding:18px 12px 80px}
.wrap{max-width:860px;margin:0 auto}
header{text-align:center;margin-bottom:14px}
h1{font-size:22px;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.badge{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:6px 14px;border-radius:999px;font-size:13px}
.kartu{background:rgba(17,24,39,.75);border:1px solid rgba(99,102,241,.35);border-radius:16px;padding:16px;margin-top:14px;backdrop-filter:blur(8px)}
label{font-size:12px;font-weight:700;color:#93c5fd;letter-spacing:.05em}
textarea{width:100%;min-height:110px;background:#0b1220;color:#e5e7eb;border:1px solid #334155;border-radius:12px;padding:12px;font-size:14px;outline:none;resize:vertical;margin-top:6px}
textarea:focus{border-color:#60a5fa}
.baris{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
select{background:#0b1220;color:#e5e7eb;border:1px solid #334155;border-radius:10px;padding:10px;font-size:13px}
button{border:none;border-radius:12px;padding:11px 18px;font-weight:800;cursor:pointer;font-size:14px}
button:disabled{opacity:.55}
.utama{flex:1;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}
.sec{background:#1f2937;color:#cbd5e1;border:1px solid #374151}
.status{font-size:12px;color:#9ca3af;margin-top:8px;min-height:16px}
pre{background:#0b1220;border:1px solid #334155;border-radius:12px;padding:12px;font-size:12px;overflow:auto;max-height:260px;display:none;margin-top:12px;white-space:pre-wrap;color:#86efac}
iframe{width:100%;height:340px;border:none;border-radius:12px;margin-top:12px;background:#fff;display:none}
footer{text-align:center;font-size:11px;color:#6b7280;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🧪 Alwi Creative Lab</h1>
  <div style="font-size:13px;color:#9ca3af">AI HTML Builder — mesin qwen2.5 di server ALWI</div>
  <div class="badges">
    <span class="badge">👤 <b id="bnama">Member ALWI</b></span>
    <span class="badge">📅 <span id="btanggal">-</span></span>
    <span class="badge">⚙️ <span id="bmodel">qwen2.5:1.5b</span></span>
  </div>
</header>

<div class="kartu">
  <label>DESKRIPKAN HALAMAN YANG MAU DIBUAT</label>
  <textarea id="ide" placeholder="Contoh: buatkan halaman undangan pernikahan tema biru dengan nama pengantin Budi & Sari, tanggal 10 September 2026..."></textarea>
  <div class="baris">
    <select id="model">
      <option value="qwen2.5:1.5b">qwen2.5 1.5B — pintar</option>
      <option value="qwen2.5:0.5b">qwen2.5 0.5B — cepat</option>
      <option value="Alwi">qwen-coder — kode</option>
    </select>
    <button class="utama" id="btnGo" onclick="buat()">✨ Buat Halaman</button>
    <button class="sec" onclick="unduh()">⬇️ Unduh</button>
    <button class="sec" onclick="bersih()">🗑️ Bersih</button>
  </div>
  <div class="status" id="status">Siap. Tulis ide lalu tekan Buat Halaman.</div>
</div>

<div class="kartu" id="kartuHasil" style="display:none">
  <label>HASIL — PRATINJAU LANGSUNG</label>
  <iframe id="preview" sandbox="allow-scripts"></iframe>
  <button class="sec" style="margin-top:10px" onclick="lihatKode()" id="btnKode">&lt;/&gt; Lihat Kode</button>
  <pre id="kode"></pre>
</div>

<footer>Alwi Creative Lab • Server Memori ALWI :4000 → Ollama :11434 • <span id="thn"></span></footer>
</div>

<script>
var API="http://34.170.37.50:8080";
var q=new URLSearchParams(location.search);
var nm=(q.get("nama")||"").trim()||"Member ALWI";
document.getElementById("bnama").textContent=nm;
document.title=nm+" • Alwi Creative Lab";
document.getElementById("btanggal").textContent=new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
document.getElementById("thn").textContent=new Date().getFullYear();
document.getElementById("model").addEventListener("change",function(){document.getElementById("bmodel").textContent=this.value});
var hasil="";

function status(t){document.getElementById("status").textContent=t}

function buat(){
  var ide=document.getElementById("ide").value.trim();
  if(!ide){status("⚠️ Tulis dulu idenya.");return}
  var model=document.getElementById("model").value;
  document.getElementById("bmodel").textContent=model;
  var btn=document.getElementById("btnGo");btn.disabled=true;
  status("⏳ "+model+" sedang merakit halaman... (20-90 detik)");
  var prompt="Kamu adalah pembuat halaman web. Buat SATU file HTML lengkap (doctype, head, style inline, body) berdasarkan permintaan ini. Gunakan bahasa Indonesia untuk teksnya. HANYA keluarkan kode HTML tanpa penjelasan apa pun.\n\nPERMINTAAN: "+ide;
  fetch(API+"/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:model,prompt:prompt,maks:2048})})
  .then(function(r){return r.json()})
  .then(function(d){
    btn.disabled=false;
    if(!d.response){status("❌ AI tidak menjawab: "+(d.error||d.galat||"?"));return}
    hasil=pisahKode(d.response);
    tampilkan();
    status("✅ Selesai! ("+hasil.length+" karakter) — cek pratinjau di bawah.");
  })
  .catch(function(e){btn.disabled=false;status("❌ Gagal: "+e.message)});
}

function pisahKode(t){
  var a=t.indexOf("<!DOCTYPE"),b=t.toLowerCase().indexOf("<!doctype");
  var i=(a>-1)?a:b;
  if(i<0){i=t.indexOf("<html")}
  if(i<0)i=0;
  var j=t.lastIndexOf("</html>");
  return j>i?t.slice(i,j+7):t.slice(i);
}

function tampilkan(){
  document.getElementById("kartuHasil").style.display="block";
  var f=document.getElementById("preview");
  f.srcdoc=hasil;f.style.display="block";
  document.getElementById("kode").textContent=hasil;
  document.getElementById("kartuHasil").scrollIntoView({behavior:"smooth"});
}

function lihatKode(){
  var k=document.getElementById("kode");
  var buka=k.style.display==="block";
  k.style.display=buka?"none":"block";
  document.getElementById("btnKode").textContent=buka?"</> Lihat Kode":"Tutup Kode";
}

function unduh(){
  if(!hasil){status("⚠️ Belum ada hasil.");return}
  var b=new Blob([hasil],{type:"text/html"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="alwi-halaman-"+Date.now()+".html";a.click();
}

function bersih(){
  hasil="";document.getElementById("ide").value="";
  document.getElementById("kartuHasil").style.display="none";
  document.getElementById("preview").srcdoc="";
  status("Siap. Tulis ide lalu tekan Buat Halaman.");
}
</script>

<script src="/alwi_bubble.js"></script>

<script src="/alwi_poin.js"></script>
</body>
</html>
