<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buku Tamu 1 — META ALWI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;background:linear-gradient(160deg,#27ae60,#0a2e1c);color:#fff;display:flex;flex-direction:column;align-items:center;padding:24px 14px 90px}
.kartu{background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border:1px solid rgba(201,168,76,.6);border-radius:20px;padding:22px;width:100%;max-width:480px;margin-top:18px;text-align:center}
.logo{width:74px;height:74px;border-radius:50%;object-fit:cover;border:3px solid #C9A84C}
h1{font-size:24px;margin:12px 0 4px;color:#f0c040}
.badge{display:inline-flex;gap:8px;align-items:center;background:rgba(0,0,0,.25);padding:6px 14px;border-radius:999px;font-size:13px;margin-top:8px}
.info{text-align:left;line-height:1.8;font-size:15px;margin-top:12px}
.info li{margin-left:18px}
.tamu{width:100%;max-width:480px;margin-top:20px;text-align:left}
.tamu h2{font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.baris2{display:flex;gap:8px;margin-bottom:10px}
input,textarea{width:100%;border:none;border-radius:12px;padding:11px 13px;font-size:14px;outline:none;background:rgba(255,255,255,.92);color:#111;font-family:inherit}
textarea{resize:vertical;min-height:70px}
button{border:none;background:#C9A84C;color:#0a2e1c;font-weight:800;border-radius:12px;padding:11px 18px;cursor:pointer;flex:none}
button:active{transform:scale(.97)}
.daftar{display:flex;flex-direction:column;gap:9px;max-height:320px;overflow:auto;margin-top:6px}
.item{background:rgba(0,0,0,.32);border-radius:12px;padding:10px 13px;font-size:14px}
.item b{color:#ffd76a}.item small{opacity:.75;display:block;margin-top:2px}
footer{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:9px;font-size:11px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px)}
</style>
</head>
<body>
<div class="kartu">
  <img class="logo" src="img/icon-192.png" alt="ALWI">
  <h1>Buku Tamu 1 — ALWI</h1>
  <div class="badge">👤 <b id="nama">Member ALWI</b></div>
  <div class="badge">📅 <span id="tanggal">-</span></div>
  <ul class="info">
    <li>Tinggalkan pesan & doa di buku tamu</li>
    <li>Pesan tersimpan permanen di server</li>
    <li>Cocok untuk acara, promo & kenangan</li>
  </ul>
</div>

<div class="tamu">
  <h2>📖 Buku Tamu <small id="hit"></small></h2>
  <div class="baris2" style="margin-bottom:10px"><input id="pengunjung" placeholder="Nama kamu (opsional)"></div>
  <textarea id="teks" placeholder="Tulis pesan..." maxlength="500"></textarea>
  <div style="display:flex;justify-content:flex-end;margin-top:10px"><button onclick="kirim()">Tanda Tangan ✍️</button></div>
  <div class="daftar" id="daftar"><div class="item">Memuat…</div></div>
</div>

<footer>META ALWI • Indramayu • Server Memori ALWI :4000</footer>

<script>
var API="http://34.170.37.50:8080";
var ID="buku-tamu-1";
var p=new URLSearchParams(location.search);
var nm=(p.get("nama")||"").trim()||"Member ALWI";
document.getElementById("nama").textContent=nm;
document.getElementById("tanggal").textContent=new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
document.title=nm+" • Buku Tamu 1 — ALWI";
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function muat(){
  fetch(API+"/api/memori").then(function(r){return r.json()}).then(function(d){
    var arr=(d.komentar&&d.komentar[ID])||[];
    var w=document.getElementById("daftar");
    document.getElementById("hit").textContent="("+arr.length+")";
    if(!arr.length){w.innerHTML='<div class="item">Belum ada tamu — tandatangan pertama milikmu!</div>';return}
    w.innerHTML=arr.slice().reverse().map(function(k){
      var t=new Date(k.waktu).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
      return '<div class="item"><b>'+esc(k.nama)+'</b>: '+esc(k.teks)+'<small>'+t+'</small></div>'
    }).join("");
  }).catch(function(){document.getElementById("daftar").innerHTML='<div class="item">Server memori tidak terjangkau.</div>'});
}
function kirim(){
  var t=document.getElementById("teks");var v=t.value.trim();if(!v)return;
  var pengirim=document.getElementById("pengunjung").value.trim()||nm;
  fetch(API+"/api/komentar",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({postId:ID,nama:pengirim+" ("+new Date().toLocaleDateString("id-ID")+")",teks:v})})
  .then(function(r){return r.json()}).then(function(j){if(j.ok){t.value="";muat()}});
}
document.getElementById("teks").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))kirim()});
muat();
</script>

<script src="/alwi_bubble.js"></script>

<script src="/alwi_poin.js"></script>
</body>
</html>
