l, dan di puncaknya ada kepala ayam yang matanya masih berkedip.","Perempuan itu berhenti di depan gapura dan menoleh ke Alwi. 'Gantian,' bisiknya. Suaranya bukan dari mulut, tapi dari dalam kepala Alwi. Alwi ingin lari, tapi kakinya tertancap di tanah basah yang tiba-tiba berubah menjadi lumpur hitam berbau kemenyan.","Keesokan paginya, warga menemukan Alwi pingsan di bawah gapura. Tumpengnya hilang. Di tempatnya, hanya ada seonggok tanah liat berbentuk tumpeng, masih hangat. Dan di lengan Alwi, ada cap stempel hitam berbentuk gapura joglo yang tidak bisa hilang, bahkan setelah digosok dengan sabun."],jw:["Deso Kalikunting ora tau ngrayakake purnama koyo deso liyane. Yen wulan bunder sampurno lan ora ono bayangane, diarani Wulan Mati. Ing wengi iku, kabeh lawang joglo kudu ditutup, lan siji tumpeng cilik kudu diselehke ing ngisor Gapura Dhandhang.","Alwi lagi telung dino dadi tukang jaga wengi balai deso. Dheweke ngiro kuwi mung mitos kanggo meden-medeni bocah cilik. Nanging ing wengi iku, angin mandeg total. Jangkrik wae meneng. Mung suoro jantungne dewe sing krungu banter banget.","Pas jam rolas bengi, dheweke weruh. Wong wedok tuwo rambute dowo nutupi rai, mlaku tanpa napak lemah menyang gapura. Nggowo tumpeng sing persis koyo sing wis diselehke Alwi mau sore. Bedane, tumpeng duweke wong wedok iku isih kemebul, lan ing pucuke ono sirah pitik sing mripate isih kedhep-kedhep.","Wong wedok iku mandeg ing ngarep gapura lan noleh marang Alwi. 'Genten,' bisike. Suwarane ora soko cangkem, nanging soko njero sirahe Alwi. Alwi pengen mlayu, nanging sikile kecemplung ing lemah teles sing ujug-ujug dadi lendhut ireng mambu menyan.","Esuk harine, warga nemu Alwi semaput ing ngisor gapura. Tumpenge ilang. Ing panggone, mung ono tumpukan lempung awangun tumpeng, isih anget. Lan ing lengene Alwi, ono cap ireng awangun gapura joglo sing ora iso ilang, senajan wis digosok nganggo sabun."],en:["Kalikunting village never celebrated the full moon like other villages. When the moon was perfectly round and cast no shadow, they called it the Dead Moon. On that night, all joglo doors must be shut, and a small tumpeng offering must be placed under the Dhandhang Gate.","Alwi had only been the night guard of the village hall for three days. He thought it was just a myth to scare children. But that night, the wind stopped completely. Even the crickets went silent. Only his own heartbeat sounded too loud.","Exactly at midnight, he saw her. An old woman with long hair covering her face, gliding without touching the ground toward the gate. She carried a tumpeng identical to the one Alwi had placed that afternoon. Except hers was still steaming, and on its peak was a chicken head whose eyes were still blinking.","The woman stopped before the gate and turned to Alwi. 'Your turn,' she whispered. The voice didn't come from her mouth, but from inside Alwi's head. Alwi wanted to run, but his feet were stuck in wet soil that had suddenly turned into black mud smelling of incense.","The next morning, villagers found Alwi unconscious under the gate. His offering was gone. In its place was only a mound of clay shaped like a tumpeng, still warm. And on Alwi's arm, there was a black stamp in the shape of the joglo gate that wouldn't disappear, even after scrubbing with soap."]}},{id:2,titles:{id:"Bab 2: Gantian Jaga Gapura",jw:"Bab 2: Genten Jogo Gapura",en:"Chapter 2: Taking Turns Guarding the Gate"},paragraphs:{id:["Sejak malam Purnama Mati itu, Alwi tidak bisa tidur. Setiap kali ia memejamkan mata, ia melihat gapura itu terbuka. Di baliknya bukan jalan desa, tapi lorong panjang dari kayu jati tua yang tidak pernah habis.","Mbah Suro, sesepuh desa, akhirnya datang ke balai desa. Ia melihat cap di lengan Alwi dan wajahnya pucat. 'Kowe wis dipilih, Le. Gapura Dhandhang itu bukan gapura biasa. Itu tapal batas. Di baliknya, ada yang nunggu dijaga.'","'Yang jaga sebelumnya adalah ibumu,' lanjut Mbah Suro pelan. Alwi membeku. Ibunya meninggal saat Alwi berumur tujuh tahun, dikabarkan hilang di sawah. 'Ibumu jaga selama 20 tahun. Sekarang gantian kamu.'","Malam kedua, Alwi dipaksa duduk di bawah gapura. Mbah Suro memberinya dupa dan mantra. 'Ojo noleh mburi, senajan ono sing nyeluk jenengmu.' Jam satu malam, Alwi mendengar suara ibunya. Jelas sekali. 'Alwi... nak... tulung ibu...' Suara itu dari belakangnya, dari dalam lorong kayu yang seharusnya tidak ada.","Air matanya jatuh, tapi ia ingat pesan Mbah Suro. Ia tidak menoleh. Lalu ia merasakan tangan dingin menyentuh pundaknya. Tangan yang sangat ia kenal, tangan yang dulu mengusap kepalanya saat demam. Tangan ibunya. Namun ketika ia memberanikan diri melirik ke bawah, tangan itu memiliki kuku sepanjang pisau dan kulit bersisik seperti ular."],jw:["Wiwit wengi Wulan Mati iku, Alwi ora iso turu. Saben merem, dheweke weruh gapura iku kebukak. Ing mburine dudu dalan deso, nanging lorong dowo soko kayu jati tuwo sing ora ono enteke.","Mbah Suro, sesepuh deso, pungkasane teko ing balai deso. Dheweke weruh cap ing lengene Alwi lan raine pucet. 'Kowe wis dipilih, Le. Gapura Dhandhang kuwi dudu gapura biasa. Kuwi tapel wates. Ing mburine, ono sing nunggu dijogo.'","'Sing jogo sakdurunge kuwi ibumu,' Mbah Suro neruske alon. Alwi kaku. Ibune meninggal pas Alwi umur pitung tahun, jarene ilang ing sawah. 'Ibumu jogo suwene 20 tahun. Saiki genten kowe.'","Wengi keloro, Alwi dipeksa lungguh ing ngisor gapura. Mbah Suro ngekei dupa lan mantra. 'Ojo noleh mburi, senajan ono sing nyeluk jenengmu.' Jam siji bengi, Alwi krungu suwarane ibune. Cetho banget. 'Alwi... nak... tulung ibu...' Suwara iku soko mburine, soko njero lorong kayu sing kudune ora ono.","Eluhe mili, nanging dheweke kelingan pesene Mbah Suro. Ora noleh. Banjur dheweke ngrasake tangan adhem ndemok pundhake. Tangan sing banget dheweke apal, tangan sing biyen ngelus sirahe pas lara. Tangane ibune. Nanging pas dheweke wani nglirik ngisor, tangan iku kukune dowo koyo lading lan kulite sisikan koyo ulo."],en:["Since that Dead Moon night, Alwi couldn't sleep. Every time he closed his eyes, he saw the gate open. Behind it was not the village road, but an endless corridor made of old teak wood.","Mbah Suro, the village elder, finally came to the village hall. He saw the stamp on Alwi's arm and turned pale. 'You have been chosen, kid. The Dhandhang Gate is not an ordinary gate. It's a boundary. Behind it, something waits to be guarded.'","'The one who guarded before was your mother,' Mbah Suro continued quietly. Alwi froze. His mother had died when Alwi was seven, said to have disappeared in the rice fields. 'Your mother guarded for 20 years. Now it's your turn.'","On the second night, Alwi was forced to sit under the gate. Mbah Suro gave him incense and a mantra. 'Don't look back, even if someone calls your name.' At one in the morning, Alwi heard his mother's voice. Crystal clear. 'Alwi... my child... help mother...' The voice came from behind him, from inside the wooden corridor that shouldn't exist.","Tears fell, but he remembered Mbah Suro's warning. He didn't look back. Then he felt a cold hand touch his shoulder. A hand he knew so well, the hand that used to stroke his head when he had a fever. His mother's hand. But when he dared to glance down, the hand had nails as long as knives and skin scaly like a snake."]}},{id:3,titles:{id:"Bab 3: Suster Lorong 7",jw:"Bab 3: Suster Lorong Pitu",en:"Chapter 3: The Nurse of Corridor 7"},paragraphs:{id:["Gapura itu akhirnya terbuka penuh pada malam ketiga. Alwi tidak lagi bisa melawan. Cap di lengannya berdenyut seperti jantung kedua, menariknya masuk ke dalam lorong kayu. Di sana, udara berbau antiseptik dan anyir darah.","Lorong itu ternyata adalah rumah sakit tua. Lantainya berderit, lampu neon berkedip-kedip. Di ujung lorong, ada papan bertuliskan LORONG 7 - RUANG BERSALIN. Dari dalam, terdengar tangisan bayi yang tidak pernah berhenti.","Seorang suster berjalan mendekat. Wajahnya cantik, tapi pucat pasi. Seragamnya putih bersih, kecuali di bagian perut yang basah oleh darah. 'Sudah waktunya,' katanya sambil tersenyum. Senyum yang terlalu lebar, memperlihatkan gusi hitam.","Suster itu menarik Alwi masuk ke ruang bersalin. Di atas ranjang, ada ibunya. Masih muda, masih sama seperti 15 tahun lalu, sedang berjuang melahirkan. Dan di samping ranjang, berdiri sosok Alwi kecil umur tujuh tahun, menangis kebingungan.","Alwi mengerti sekarang. Ibunya tidak hilang di sawah. Ibunya meninggal saat melahirkannya di rumah sakit ini, yang dulu berdiri di tempat gapura itu berada. Dan Gapura Joglo Dhandhang adalah pintu yang menahan arwah-arwah penasaran yang tidak sempat lahir dan tidak sempat mati. Suster itu menatap Alwi. 'Kamu yang terakhir lahir di sini. Kamu kuncinya. Tetap di sini, atau biarkan mereka semua keluar ke desa.'"],jw:["Gapura iku pungkasane kebukak kebak ing wengi katelu. Alwi wis ora iso nglawan. Cap ing lengene ndedeg koyo jantung keloro, narik mlebu ing lorong kayu. Ing kono, hawa mambu antiseptik lan anyir getih.","Lorong iku jebule rumah sakit tuwo. Lantaine kriet-kriet, lampu neon kedhep-kedhep. Ing pucuk lorong, ono papan tulisan LORONG 7 - RUANG BABARAN. Soko njero, krungu tangise bayi sing ora mandeg-mandeg.","Suster mlaku nyedhak. Raine ayu, nanging pucet pasi. Seragame putih resik, kajobo ing bagian weteng sing teles getih. 'Wis wayahe,' jare karo mesem. Meseme kebacut amba, nganti ketok gusi ireng.","Suster iku narik Alwi mlebu ing ruang babaran. Ing nduwur ranjang, ono ibune. Isih nom, isih podo koyo 15 tahun kepungkur, lagi berjuang nglairake. Lan ing sandhing ranjang, ngadeg sosok Alwi cilik umur pitung tahun, nangis bingung.","Alwi mudeng saiki. Ibune ora ilang ing sawah. Ibune meninggal pas nglairake dheweke ing rumah sakit iki, sing biyen ngadeg ing panggonan gapura iki. Lan Gapura Joglo Dhandhang kuwi lawang sing nahan arwah-arwah penasaran sing ora sempat lair lan ora sempat mati. Suster iku nyawang Alwi. 'Kowe sing terakhir lair ing kene. Kowe kuncine. Tetepo ing kene, opo benke dheweke kabeh metu menyang deso.'"],en:["The gate finally opened fully on the third night. Alwi could no longer resist. The stamp on his arm throbbed like a second heart, pulling him into the wooden corridor. Inside, the air smelled of antiseptic and blood.","The corridor turned out to be an old hospital. The floor creaked, fluorescent lights flickered. At the end, a sign read CORRIDOR 7 - DELIVERY ROOM. From inside, came the endless crying of a baby.","A nurse walked toward him. Her face was beautiful, but deathly pale. Her uniform was spotless white, except for the belly area soaked in blood. 'It's time,' she said with a smile. A smile too wide, revealing black gums.","The nurse pulled Alwi into the delivery room. On the bed was his mother. Still young, still the same as 15 years ago, struggling to give birth. And beside the bed, stood little Alwi at seven years old, crying in confusion.","Alwi understood now. His mother didn't disappear in the rice fields. His mother died giving birth to him in this hospital, which once stood where the gate now stands. And the Joglo Dhandhang Gate is the door holding back the restless spirits who never got to be born and never got to die. The nurse stared at Alwi. 'You were the last one born here. You are the key. Stay here, or let them all out into the village.'"]}}];function zi(){let[e,t]=F.useState("id"),[n,r]=F.useState(0),[l,u]=F.useState(!1),[o,i]=F.useState(0),[a,f]=F.useState(1),[p,v]=F.useState([]),[m,w]=F.useState(""),[k,S]=F.useState(!1),[A,c]=F.useState(!1),[s,d]=F.useState(!0),[g,N]=F.useState(0),[P,z]=F.useState(null),[T,Y]=F.useState(0),[x,Le]=F.useState(null),Dr=F.useRef(null),Ec=F.useRef(null),Ee=F.useRef(null),_t=Qt[n],ye=F.useMemo(()=>{let _=_t.paragraphs[e],Q=[],J=0;return _.forEach((ne,Ct)=>{(ne.match(/[^.!?]+[.!?]+/g)||[ne]).forEach((Cn)=>{let Mr=Cn.trim();if(Mr)Q.push({text:Mr,paraIdx:Ct,globalIdx:J++})})}),Q},[_t,e]);F.useEffect(()=>{if(typeof window>"u")return;Ee.current=window.speechSynthesis;let _=()=>{let Q=Ee.
