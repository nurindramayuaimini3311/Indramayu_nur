<!DOCTYPE html>
<html>
  <head>
      <base target="_top">
          <style>
                /* CSS MATRIKS FULL SCREEN & SCROLL */
                      html, body { 
                              margin: 0; padding: 0; 
                                      height: 100%; width: 100%; 
                                              overflow: hidden; /* Lock scroll utama body */
                                                      font-family: 'Courier New', monospace; /* Gaya Matrix */
                                                              background-color: #000; 
                                                                      color: #00ff00; /* Hijau Matrix */
                                                                              font-size: 11px; /* Teks Kecil */
                                                                                    }
                                                                                          
                                                                                                /* Container Utama Full Screen */
                                                                                                      .matrix-layout { 
                                                                                                              display: flex; flex-direction: column; 
                                                                                                                      height: 100vh; width: 100vw; 
                                                                                                                            }
                                                                                                                                  
                                                                                                                                        /* Header Fixed (Full Width) */
                                                                                                                                              .blog-header { 
                                                                                                                                                      padding: 8px; 
                                                                                                                                                              background: #111; 
                                                                                                                                                                      border-bottom: 1px solid #00ff00; 
                                                                                                                                                                              text-align: center; 
                                                                                                                                                                                      flex-shrink: 0;
                                                                                                                                                                                            }
                                                                                                                                                                                                  .blog-header h1 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }
                                                                                                                                                                                                        
                                                                                                                                                                                                              /* Post Body Kecil */
                                                                                                                                                                                                                    .post-body { padding: 5px 8px; font-style: italic; color: #888; border-bottom: 1px solid #333; flex-shrink: 0; }
                                                                                                                                                                                                                          
                                                                                                                                                                                                                                /* Kolom Komentar Full Scroll & Layar Panjang */
                                                                                                                                                                                                                                      .scroll-comment-area { 
                                                                                                                                                                                                                                              flex: 1; /* Isi sisa layar */
                                                                                                                                                                                                                                                      overflow-y: scroll; /* Aktifkan scroll panjang */
                                                                                                                                                                                                                                                              padding: 8px;
                                                                                                                                                                                                                                                                      background: #050505;
                                                                                                                                                                                                                                                                              border-bottom: 1px solid #333;
                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                /* Styling Baris Komentar Kecil & Padat */
                                                                                                                                                                                                                                                                                                      .comment-bar { 
                                                                                                                                                                                                                                                                                                              display: flex; gap: 8px; 
                                                                                                                                                                                                                                                                                                                      margin-bottom: 8px; 
                                                                                                                                                                                                                                                                                                                              padding-bottom: 8px; 
                                                                                                                                                                                                                                                                                                                                      border-bottom: 1px solid #222; 
                                                                                                                                                                                                                                                                                                                                              align-items: flex-start;
                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                .member-icon { 
                                                                                                                                                                                                                                                                                                                                                                        width: 25px; height: 25px; 
                                                                                                                                                                                                                                                                                                                                                                                background: #222; border: 1px solid #00ff00; border-radius: 50%; 
                                                                                                                                                                                                                                                                                                                                                                                        display: flex; align-items: center; justify-content: center; 
                                                                                                                                                                                                                                                                                                                                                                                                font-size: 10px; flex-shrink: 0;
                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                            .comment-content { flex: 1; line-height: 1.2; }
                                                                                                                                                                                                                                                                                                                                                                                                                  .author-name { font-weight: bold; color: #58a6ff; } /* Biru imahazzah */
                                                                                                                                                                                                                                                                                                                                                                                                                        .rating-stars { color: #fbc02d; font-size: 9px; }
                                                                                                                                                                                                                                                                                                                                                                                                                              .meta-info { font-size: 9px; color: #666; display: flex; gap: 10px; margin-top: 3px;}

                                                                                                                                                                                                                                                                                                                                                                                                                                    /* Tombol Jempol Kecil (Like) */
                                                                                                                                                                                                                                                                                                                                                                                                                                          .like-btn { 
                                                                                                                                                                                                                                                                                                                                                                                                                                                  background: none; border: none; padding: 0; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                          cursor: pointer; font-size: 12px; color: #666; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  transition: 0.2s;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .like-btn:hover { color: #fbc02d; text-shadow: 0 0 5px #fbc02d; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .like-btn.liked { color: #fbc02d; }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          /* Form Input Hemat Ruang di Bawah */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .form-input-bar { 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        padding: 8px; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                background: #111; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        border-top: 1px solid #00ff00; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                flex-shrink: 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .input-group { display: flex; gap: 5px; margin-bottom: 5px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        input, select, textarea { 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                background: #000; color: #00ff00; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        border: 1px solid #333; border-radius: 2px; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                padding: 5px; font-family: monospace; font-size: 11px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        box-sizing: border-box;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    textarea { width: 100%; resize: none; margin-bottom: 5px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                /* Tombol Image Browser & Kirim */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .action-buttons { display: flex; gap: 5px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .btn-upload { background: #222; border: 1px solid #555; cursor: pointer; color: #888; flex: 1; text-align: center; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .btn-upload:hover { color: #fff; border-color: #fff; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .btn-publish { background: #004400; border: 1px solid #00ff00; cursor: pointer; color: #00ff00; font-weight: bold; flex: 2; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .btn-publish:hover { background: #006600; box-shadow: 0 0 5px #00ff00; }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    #status-msg { font-size: 10px; text-align: center; color: #00ff00; margin-top: 5px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="matrix-layout">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="blog-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <h1>INDRAMAYU CLUB MAGAZINE</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="post-body">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  Servis Utama imahazzah51: Full Full Full Screen Connect...
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="scroll-comment-area" id="feed">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="comment-bar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="member-icon">👤</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="comment-content">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="rating-stars">⭐⭐⭐⭐⭐</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <span class="author-name">Admin</span>: Saraf Nur Aktif via Google Drive
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="meta-info">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span>Tadi</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <button class="like-btn" onclick="tambahSuka(this)">👍 <span class="like-count">0</span></button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="form-input-bar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="input-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="text" id="nama" placeholder="ID Member/Nama" value="Member Makrifat">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <select id="rating">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <option value="5">⭐⭐⭐⭐⭐</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <option value="4">⭐⭐⭐⭐</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <option value="3">⭐⭐⭐</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <textarea id="pesan" rows="2" placeholder="Tulis rincian servis..."></textarea>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="action-buttons">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <label class="btn-upload">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <input type="file" id="foto" accept="image/*" style="display:none;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          + LAMPIRAN FOTO
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button class="btn-publish" onclick="terbitkan()">PUBLIKASIKAN</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div id="status-msg"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // Fungsi Tombol Jempol Kecil
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function tambahSuka(btn) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let countSpan = btn.querySelector('.like-count');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let count = parseInt(countSpan.innerText);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!btn.classList.contains('liked')) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          count++;
