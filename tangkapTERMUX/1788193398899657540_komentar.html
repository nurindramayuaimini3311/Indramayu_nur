<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>IMC SULTAN - Live Comments</title>
    <style>
        :root {
            --emas: #d4af37;
            --hitam: #0d0d0d;
            --putih-bersih: #ffffff;
            --abu-sultan: #f8f9fa;
            --border-color: #eaeaea;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--putih-bersih);
            color: var(--hitam);
            min-height: 200vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: var(--hitam);
            font-weight: 700;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--emas);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .comment-box {
            background: var(--abu-sultan);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            margin-bottom: 40px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--putih-bersih);
            color: var(--hitam);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--emas);
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.2);
        }

        .btn-kirim {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--hitam), #262626);
            color: var(--putih-bersih);
            border: 1px solid var(--emas);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-kirim:hover {
            background: linear-gradient(135deg, var(--emas), #b89324);
            color: var(--hitam);
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .comment-card {
            background: var(--putih-bersih);
            border-left: 4px solid var(--emas);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            transition: transform 0.2s;
        }

        .comment-card:hover {
            transform: translateX(5px);
            background: var(--abu-sultan);
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .comment-nama {
            font-weight: bold;
            color: var(--hitam);
            font-size: 15px;
        }

        .comment-waktu {
            font-size: 11px;
            color: #999;
        }

        .comment-teks {
            font-size: 14px;
            color: #444;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>💬 ROOM KOMENTAR SULTAN</h2>

        <!-- Kotak Input Komentar -->
        <div class="comment-box">
            <div class="input-group">
                <input type="text" id="nama" placeholder="Masukkan nama Anda..." required>
            </div>
            <div class="input-group">
                <textarea id="komentar" rows="4" placeholder="Tulis komentar resmi di sini..." required></textarea>
            </div>
            <button class="btn-kirim" onclick="kirimKomentar()">KIRIM KOMENTAR</button>
        </div>

        <!-- Wadah List Komentar Masuk -->
        <div class="comments-list" id="comments-list">
            <p style="text-align:center; color:#999;">Memuat komentar...</p>
        </div>
    </div>

    <script>
        // Ganti dengan URL deployment Web App Google Apps Script Anda yang terbaru
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzT-YHefWhX_i7708vNMsUwooJcOTEsyCCDlKfiwPIJ5bk_pJnOV-lvRwcNtz59WrzJWA/exec";

        async function muatKomentar() {
            try {
                let respon = await fetch(WEB_APP_URL);
                let data = await respon.json();
                let wadah = document.getElementById("comments-list");
                wadah.innerHTML = "";

                if(data.length === 0) {
                    wadah.innerHTML = '<p style="text-align:center; color:#999;">Belum ada komentar.</p>';
                    return;
                }

                data.forEach(item => {
                    let tgl = new Date(item.waktu).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });
                    wadah.innerHTML += `
                        <div class="comment-card">
                            <div class="comment-header">
                                <div class="comment-nama">👤 ${item.nama}</div>
                                <div class="comment-waktu">${tgl}</div>
                            </div>
                            <div class="comment-teks">${item.komentar}</div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Gagal memuat data komentar:", err);
            }
        }

        async function kirimKomentar() {
            let nama = document.getElementById("nama").value.trim();
            let komentar = document.getElementById("komentar").value.trim();

            if (!nama || !komentar) {
                alert("Nama dan komentar tidak boleh kosong!");
                return;
            }

            let dataKirim = { nama: nama, komentar: komentar };

            try {
                document.querySelector(".btn-kirim").innerText = "MENGIRIM...";
                
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify(dataKirim)
                });

                document.getElementById("komentar").value = "";
                document.querySelector(".btn-kirim").innerText = "KIRIM KOMENTAR";
                muatKomentar();
            } catch (err) {
                alert("Komentar gagal terkirim, periksa koneksi atau konfigurasi deployment.");
                document.querySelector(".btn-kirim").innerText = "KIRIM KOMENTAR";
            }
        }

        window.onload = muatKomentar;
    </script>
</body>
</html>
