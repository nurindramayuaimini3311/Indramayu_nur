<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#10b981">
<title>🧭 Kompas Kiblat — Alwi Club</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#064e3b,#065f46,#047857);min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#ecfdf5;padding:16px}
  h1{font-size:1.1rem;margin-bottom:4px}
  .sub{font-size:12px;color:#a7f3d0;margin-bottom:16px}
  .compass-wrap{position:relative;width:240px;height:240px;margin:0 auto 12px}
  .compass-dial{width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#f3f4f6 0%,#e5e7eb 100%);border:8px solid #10b981;position:relative;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
  .mark{position:absolute;font-size:15px;font-weight:800;color:#374151}
  .mark.n{top:8px;left:50%;transform:translateX(-50%)}
  .mark.s{bottom:8px;left:50%;transform:translateX(-50%)}
  .mark.e{right:8px;top:50%;transform:translateY(-50%)}
  .mark.w{left:8px;top:50%;transform:translateY(-50%)}
  .needle{position:absolute;left:50%;top:50%;width:5px;height:100px;margin:-100px 0 0 -2.5px;background:linear-gradient(#10b981 0 50%,#dc2626 50% 100%);transform-origin:50% 100%;border-radius:3px;transition:transform 0.3s}
  .needle::before{content:'';position:absolute;left:50%;bottom:0;width:16px;height:16px;margin:0 0 -8px -8px;background:#d1d5db;border-radius:50%}
  .center{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;background:#10b981;border-radius:50%;z-index:2}
  .kaaba{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:18px;z-index:3}
  .reading{font-weight:800;font-size:20px;color:#d1fae5;margin:8px 0 4px}
  .info{font-size:13px;color:#a7f3d0;margin-bottom:8px;text-align:center;line-height:1.5}
  .warn{font-size:12px;color:#fbbf24;margin-bottom:12px;text-align:center}
  .status{background:rgba(255,255,255,0.15);border-radius:12px;padding:12px;margin-top:12px;width:100%;max-width:300px;font-size:12px;line-height:1.6}
  .status b{color:#d1fae5}
  footer{margin-top:auto;padding-top:16px;font-size:11px;color:#6ee7b7;text-align:center}
</style>
</head>
<body>
  <h1>🧭 Kompas Kiblat</h1>
  <div class="sub">Arahkan jarum ke arah Ka'bah — Makkah</div>

  <div class="compass-wrap">
    <div class="kaaba">🕋</div>
    <div class="compass-dial">
      <span class="mark n">U</span>
      <span class="mark s">S</span>
      <span class="mark e">T</span>
      <span class="mark w">B</span>
      <div class="needle" id="needle"></div>
      <div class="center"></div>
    </div>
  </div>

  <div class="reading" id="reading">Mendapatkan arah…</div>
  <div class="info" id="info"></div>
  <div class="warn" id="warn"></div>

  <div class="status">
    <b>Status:</b> <span id="stGps">⏳ GPS...</span><br>
    <b>Kompas:</b> <span id="stKompas">⏳ Sensor...</span><br>
    <b>Kiblat:</b> <span id="stKiblat">—</span>
  </div>

  <footer>Alwi Club — Indramayu 🌐</footer>

<script>
var K = { qibla: null, heading: null, gpsOk: false, kompasOk: false };

// === GPS → hitung arah kiblat ===
function hitungKiblat() {
  if (!navigator.geolocation) {
    document.getElementById('stGps').textContent = '❌ Tidak didukung';
    K.qibla = 295; // fallback Indonesia
    updateInfo();
    return;
  }
  navigator.geolocation.getCurrentPosition(function(p) {
    var lat = p.coords.latitude, lng = p.coords.longitude;
    var klat = 21.422487, klng = 39.826206;
    var dLat = (klat - lat) * Math.PI / 180;
    var dLng = (klng - lng) * Math.PI / 180;
    var la1 = lat * Math.PI / 180, la2 = klat * Math.PI / 180;
    var y = Math.sin(dLng) * Math.cos(la2);
    var x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLng);
    var brg = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    K.qibla = brg;
    K.gpsOk = true;
    document.getElementById('stGps').textContent = '✅ ' + lat.toFixed(4) + ', ' + lng.toFixed(4);
    updateInfo();
  }, function() {
    K.qibla = 295;
    document.getElementById('stGps').textContent = '⚠️ GPS ditolak (fallback 295°)';
    updateInfo();
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}

// === Sensor Kompas ===
function aktifkanKompas() {
  if ('DeviceOrientationEvent' in window && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(function(s) {
      if (s === 'granted') { window.addEventListener('deviceorientation', onKompas); K.kompasOk = true; document.getElementById('stKompas').textContent = '✅ Aktif'; }
      else { document.getElementById('stKompas').textContent = '❌ Izin ditolak'; }
    }).catch(function() {
      document.getElementById('stKompas').textContent = '❌ Gagal izin';
    });
  } else if ('DeviceOrientationEvent' in window) {
    window.addEventListener('deviceorientation', onKompas);
    setTimeout(function() {
      if (K.heading != null) { K.kompasOk = true; document.getElementById('stKompas').textContent = '✅ Aktif'; }
    }, 1500);
  } else {
    document.getElementById('stKompas').textContent = '❌ Tidak didukung';
  }
  document.getElementById('warn').textContent = '💡 Putar/arahkan HP perlahan';
}

function onKompas(e) {
  var hdg = e.webkitCompassHeading != null ? e.webkitCompassHeading : (e.alpha != null ? 360 - e.alpha : null);
  if (hdg == null) return;
  K.heading = hdg;
  updateJarum();
}

function updateJarum() {
  if (K.qibla == null || K.heading == null) return;
  var rel = K.qibla - K.heading;
  document.getElementById('needle').style.transform = 'rotate(' + rel + 'deg)';
  document.getElementById('reading').textContent = 'Kiblat: ' + K.qibla.toFixed(1) + '°';
  document.getElementById('stKiblat').textContent = K.qibla.toFixed(1) + '° dari Utara';
}

function updateInfo() {
  if (K.qibla != null) {
    document.getElementById('info').textContent =
      'Arah kiblat dari lokasi Anda: ' + K.qibla.toFixed(1) + '°\n(' + arahTeks(K.qibla) + ')';
  }
  updateJarum();
}

function arahTeks(d) {
  var dirs = ['Utara','Timur Laut','Timur','Tenggara','Selatan','Barat Daya','Barat','Barat Laut'];
  return dirs[Math.round(d / 45) % 8];
}

// === Mulai ===
hitungKiblat();
aktifkanKompas();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script></body>
</html>
