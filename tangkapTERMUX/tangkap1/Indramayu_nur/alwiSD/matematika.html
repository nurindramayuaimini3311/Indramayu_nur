<!DOCTYPE html>
<html lang="id">
<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>
(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {
        options = Object.assign({}, options, { passive: true });
      }
    }
    return origAdd.call(this, type, listener, options);
  };
})();
</script><script>window.Intl=window.Intl||{};Intl.t=function(s){return(Intl._locale&&Intl._locale[s])||s;};</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matematika SD - Petualangan Alwi</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Nunito',sans-serif}
body{background:#FFF8E1;min-height:100vh;padding:12px}
.container{max-width:420px;margin:0 auto}
.header{background:#4CAF50;border-radius:20px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;color:white;margin-bottom:14px;box-shadow:0 6px 0 #2E7D32}
.card{background:white;border-radius:24px;padding:20px;box-shadow:0 8px 0 #FFE082;border:3px solid #FFD54F;margin-bottom:14px}
.btn{width:100%;padding:14px;border:none;border-radius:16px;font-size:18px;font-weight:900;cursor:pointer;margin:6px 0;transition:.1s}
.btn:active{transform:scale(0.96)}
.btn-green{background:#4CAF50;color:white;box-shadow:0 5px 0 #2E7D32}
.btn-yellow{background:#FFEB3B;color:#5D4037;box-shadow:0 5px 0 #F9A825}
.btn-blue{background:#29B6F6;color:white;box-shadow:0 5px 0 #0277BD}
.btn-orange{background:#FF7043;color:white;box-shadow:0 5px 0 #BF360C}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.soal{font-size:38px;font-weight:900;text-align:center;margin:10px 0;color:#3E2723}
.pilihan{padding:16px;font-size:22px;font-weight:800;border-radius:16px;border:3px solid #FFE082;background:white;cursor:pointer}
.pilihan:hover{background:#FFF9C4}
.pilihan.benar{background:#A5D6A7;border-color:#4CAF50}
.pilihan.salah{background:#EF9A9A;border-color:#E53935}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:white;border-radius:14px;padding:8px;text-align:center;font-weight:800;border:2px solid #FFE082}
.progress{height:12px;background:#FFE082;border-radius:10px;overflow:hidden;margin:10px 0}
.bar{height:100%;background:#4CAF50;width:0%;transition:.4s}
.hud{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}
.badge{background:#FF7043;color:white;padding:4px 10px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div><div style="font-size:12px;opacity:.9">PETUALANGAN</div><div style="font-size:20px;font-weight:900">MATEMATIKA ALWI</div></div>
    <div style="font-size:28px">🎒</div>
  </div>

  <div id="menu">
    <div class="card">
      <h3 style="text-align:center;margin-bottom:8px">Pilih Kelas 📚</h3>
      <button class="btn btn-green" onclick="mulai('sd12')">SD Kelas 1-2<br><small style="font-weight:700">Tambah & Kurang</small></button>
      <button class="btn btn-yellow" onclick="mulai('sd34')">SD Kelas 3-4<br><small>Kali & Bagi</small></button>
      <button class="btn btn-blue" onclick="mulai('sd56')">SD Kelas 5-6<br><small>Pecahan & Cerita</small></button>
    </div>
    <div class="card" style="background:#E1F5FE;border-color:#81D4FA">
      <b>Cara Main:</b><br>
      • Jawab 10 soal secepatnya<br>
      • Benar +10 poin, Combo +5<br>
      • File ini taruh di folder alwiSD kamu!
    </div>
  </div>

  <div id="game" style="display:none">
    <div class="stats">
      <div class="stat">❤️ <span id="nyawa">3</span></div>
      <div class="stat">⭐ <span id="skor">0</span></div>
      <div class="stat">🔥 <span id="combo">0</span></div>
    </div>
    <div class="hud"><span id="soalKe">Soal 1/10</span><span class="badge" id="levelBadge">KELAS 1-2</span></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="card">
      <div id="cerita" style="text-align:center;font-size:13px;color:#795548;margin-bottom:6px"></div>
      <div class="soal" id="soalText">5 + 3 = ?</div>
      <div class="grid2" id="opsi"></div>
    </div>
    <button class="btn btn-orange" onclick="kembaliMenu()">Keluar</button>
  </div>

  <div id="hasil" style="display:none">
    <div class="card" style="text-align:center">
      <div style="font-size:60px" id="emojiHasil">🎉</div>
      <h2 id="judulHasil">HEBAT!</h2>
      <p id="descHasil"></p>
      <h1 style="font-size:48px;color:#4CAF50" id="skorAkhir">0</h1>
      <button class="btn btn-green" onclick="mulai(lastMode)">Main Lagi</button>
      <button class="btn btn-yellow" onclick="kembaliMenu()">Ganti Kelas</button>
    </div>
  </div>
</div>

<script>
let mode='', skor=0, combo=0, nyawa=3, idx=0, lastMode='sd12';
let soalList=[];
const suara = {
  benar: ()=>{ try{ let a=new (window.AudioContext||window.webkitAudioContext)(); let o=a.createOscillator(); o.frequency.value=600; o.connect(a.destination); o.start(); setTimeout(()=>o.stop(),120)}catch(e){} },
  salah: ()=>{ try{ let a=new (window.AudioContext||window.webkitAudioContext)(); let o=a.createOscillator(); o.frequency.value=200; o.connect(a.destination); o.start(); setTimeout(()=>o.stop(),200)}catch(e){} }
};

function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a }

function buatSoal(tipe){
 let s=[];
 for(let i=0;i<10;i++){
  if(tipe=='sd12'){
   let a=rand(1,20), b=rand(1,20), op=Math.random()>0.5?'+':'-';
   if(op=='-' && b>a) [a,b]=[b,a];
   let kunci= op=='+'?a+b:a-b;
   s.push({t:`${a} ${op} ${b} = ?`, k:kunci, o:acakOpsi(kunci), c:''});
  } else if(tipe=='sd34'){
   let a=rand(2,12), b=rand(2,12), op=['x',':'][rand(0,1)];
   let kunci, txt;
   if(op=='x'){kunci=a*b; txt=`${a} x ${b} = ?`;}
   else{kunci=a; txt=`${a*b} : ${b} = ?`;}
   s.push({t:txt,k:kunci,o:acakOpsi(kunci),c:''});
  } else {
   let tipe2=rand(1,3);
   if(tipe2==1){
    let a=rand(1,5), b=rand(2,5), c=rand(1,b-1);
    let kunci=a + c/b;
    s.push({t:`${a} + ${c}/${b} = ?`, k:`${a} ${c}/${b}`, o:[`${a} ${c}/${b}`,`${a+1} ${c}/${b}`,`${a} ${c+1}/${b}`,`${a+1}/${b}`], c:'Pecahan campuran', isText:true});
   } else if(tipe2==2){
    let total=rand(20,100), beli=rand(10,30);
    s.push({t:`Alwi punya ${total} mangga, dijual ${beli}. Sisa?`, k:total-beli, o:acakOpsi(total-beli), c:`Cerita Indramayu 🥭`});
   } else {
    let k=rand(2,6)*2;
    s.push({t:`KPK dari ${k} dan ${k*2} = ?`, k:k*2, o:acakOpsi(k*2), c:'KPK'});
   }
  }
 }
 return s;
}
function acakOpsi(k){
 let arr=[k];
 while(arr.length<4){ let v=k+rand(-8,8); if(v<0) v=rand(0,10); if(!arr.includes(v)) arr.push(v); }
 return arr.sort(()=>Math.random()-0.5);
}
function mulai(m){
 mode=m; lastMode=m; skor=0; combo=0; nyawa=3; idx=0;
 soalList=buatSoal(m);
 document.getElementById('menu').style.display='none';
 document.getElementById('hasil').style.display='none';
 document.getElementById('game').style.display='block';
 document.getElementById('levelBadge').innerText=m.toUpperCase();
 updateHUD(); tampilSoal();
}
function updateHUD(){
 document.getElementById('skor').innerText=skor;
 document.getElementById('combo').innerText=combo;
 document.getElementById('nyawa').innerText=nyawa;
 document.getElementById('soalKe').innerText=`Soal ${idx+1}/10`;
 document.getElementById('bar').style.width=(idx/10*100)+'%';
}
function tampilSoal(){
 let cur=soalList[idx];
 document.getElementById('soalText').innerText=cur.t;
 document.getElementById('cerita').innerText=cur.c;
 let wadah=document.getElementById('opsi'); wadah.innerHTML='';
 cur.o.forEach(v=>{
  let btn=document.createElement('button'); btn.className='pilihan'; btn.innerText=v;
  btn.onclick=()=>jawab(v, cur.k, btn);
  wadah.appendChild(btn);
 });
}
function jawab(pilih, kunci, el){
 let benar = pilih==kunci;
 let semua=document.querySelectorAll('.pilihan');
 semua.forEach(b=>b.style.pointerEvents='none');
 if(benar){
  el.classList.add('benar'); skor+=10+combo; combo++; suara.benar();
 } else {
  el.classList.add('salah'); nyawa--; combo=0; suara.salah();
  semua.forEach(b=>{ if(b.innerText==kunci) b.classList.add('benar'); });
 }
 setTimeout(()=>{
  idx++;
  if(idx>=10 || nyawa<=0) selesai();
  else { updateHUD(); tampilSoal(); }
 },700);
}
function selesai(){
 document.getElementById('game').style.display='none';
 document.getElementById('hasil').style.display='block';
 document.getElementById('skorAkhir').innerText=skor;
 if(skor>=80){ document.getElementById('emojiHasil').innerText='🏆'; document.getElementById('judulHasil').innerText='LUAR BIASA!'; }
 else if(skor>=50){ document.getElementById('emojiHasil').innerText='🎉'; document.getElementById('judulHasil').innerText='HEBAT!'; }
 else { document.getElementById('emojiHasil').innerText='💪'; document.getElementById('judulHasil').innerText='SEMANGAT LAGI!'; }
 document.getElementById('descHasil').innerText=`Kamu menjawab ${idx} soal dengan ${3-nyawa} kesalahan. Skor: ${skor}`;
}
function kembaliMenu(){
 document.getElementById('game').style.display='none';
 document.getElementById('hasil').style.display='none';
 document.getElementById('menu').style.display='block';
}
</script>
<script>poinBelajar()</script><script src="../alwi_bubble4.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script></body>
</html>
