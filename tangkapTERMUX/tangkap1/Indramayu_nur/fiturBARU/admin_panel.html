<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - INDRAMAYU CLUB</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      background: rgba(201, 168, 76, 0.1);
      border: 2px solid #c9a84c;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .header h1 {
      color: #FFD700;
      margin-bottom: 5px;
      font-size: 28px;
    }
    
    .header p {
      color: #aaa;
      font-size: 13px;
    }
    
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .stat-card {
      background: rgba(17, 17, 17, 0.8);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }
    
    .stat-number {
      font-size: 32px;
      font-weight: bold;
      color: #FFD700;
      margin-bottom: 5px;
    }
    
    .stat-label {
      font-size: 12px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 2px solid #222;
      padding-bottom: 10px;
    }
    
    .tab-btn {
      background: transparent;
      border: 1px solid #333;
      color: #aaa;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s;
    }
    
    .tab-btn.active {
      background: #c9a84c;
      border-color: #c9a84c;
      color: #000;
    }
    
    .tab-btn:hover {
      border-color: #c9a84c;
      color: #c9a84c;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .panel {
      background: rgba(17, 17, 17, 0.8);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      font-size: 12px;
      color: #FFD700;
      margin-bottom: 5px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    input[type="text"], textarea, select {
      width: 100%;
      padding: 10px;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: 0.3s;
    }
    
    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: #c9a84c;
      box-shadow: 0 0 8px rgba(201, 168, 76, 0.3);
    }
    
    textarea {
      resize: vertical;
      min-height: 100px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
    
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.3s;
      display: inline-block;
    }
    
    .btn-primary {
      background: #c9a84c;
      color: #000;
    }
    
    .btn-primary:hover {
      background: #FFD700;
      transform: translateY(-2px);
    }
    
    .btn-danger {
      background: #c62828;
      color: #fff;
    }
    
    .btn-danger:hover {
      background: #e53935;
    }
    
    .btn-success {
      background: #2e7d32;
      color: #fff;
    }
    
    .btn-success:hover {
      background: #43a047;
    }
    
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    
    .member-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    
    .member-table th {
      background: rgba(201, 168, 76, 0.2);
      color: #FFD700;
      padding: 10px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #333;
    }
    
    .member-table td {
      padding: 10px;
      border-bottom: 1px solid #222;
      color: #ddd;
    }
    
    .member-table tr:hover {
      background: rgba(201, 168, 76, 0.05);
    }
    
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    
    .badge-gold {
      background: rgba(255, 215, 0, 0.2);
      color: #FFD700;
    }
    
    .message {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
      display: none;
    }
    
    .message.success {
      background: rgba(46, 125, 50, 0.2);
      border: 1px solid #2e7d32;
      color: #4caf50;
      display: block;
    }
    
    .message.error {
      background: rgba(198, 40, 40, 0.2);
      border: 1px solid #c62828;
      color: #ef5350;
      display: block;
    }
    
    .message.info {
      background: rgba(25, 118, 210, 0.2);
      border: 1px solid #1976d2;
      color: #64b5f6;
      display: block;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>⛑️ ADMIN PANEL - INDRAMAYU CLUB</h1>
    <p>Data Management & Member Reward System</p>
  </div>
  
  <!-- STATISTIK -->
  <div class="grid">
    <div class="stat-card">
      <div class="stat-number" id="totalMembers">0</div>
      <div class="stat-label">Total Member</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="totalPoin">0</div>
      <div class="stat-label">Total Poin Beredar</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="avgPoin">0</div>
      <div class="stat-label">Rata-Rata Poin</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="topMember">-</div>
      <div class="stat-label">Top Member</div>
    </div>
  </div>
  
  <!-- TAB NAVIGASI -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('members')">👥 Member List</button>
    <button class="tab-btn" onclick="switchTab('export')">💾 Export Data</button>
    <button class="tab-btn" onclick="switchTab('import')">📥 Import Data</button>
    <button class="tab-btn" onclick="switchTab('settings')">⚙️ Settings</button>
  </div>
  
  <!-- TAB: MEMBER LIST -->
  <div id="members" class="tab-content active">
    <div class="panel">
      <h3 style="color: #FFD700; margin-bottom: 15px; font-size: 16px;">📋 Daftar Member & Poin</h3>
      <div id="memberTableContainer">
        <p style="color: #aaa; text-align: center; padding: 20px;">Memuat data...</p>
      </div>
    </div>
  </div>
  
  <!-- TAB: EXPORT -->
  <div id="export" class="tab-content">
    <div class="panel">
      <h3 style="color: #FFD700; margin-bottom: 15px; font-size: 16px;">💾 Export Database</h3>
      <div id="exportMessage"></div>
      
      <div class="form-group">
        <label>Pilih Format Export:</label>
        <select id="exportFormat">
          <option value="json">JSON Format (.json)</option>
          <option value="sql">SQL Format (.sql)</option>
          <option value="csv">CSV Format (.csv)</option>
        </select>
      </div>
      
      <textarea id="exportResult" readonly placeholder="Hasil export akan muncul di sini..."></textarea>
      
      <div class="btn-group">
        <button class="btn btn-primary" onclick="exportData()">📤 Export Data</button>
        <button class="btn btn-success" onclick="downloadExport()">⬇️ Download File</button>
        <button class="btn btn-primary" onclick="copyToClipboard()">📋 Copy ke Clipboard</button>
      </div>
    </div>
  </div>
  
  <!-- TAB: IMPORT -->
  <div id="import" class="tab-content">
    <div class="panel">
      <h3 style="color: #FFD700; margin-bottom: 15px; font-size: 16px;">📥 Import Database</h3>
      <div id="importMessage"></div>
      
      <div class="form-group">
        <label>Paste JSON atau SQL Data:</label>
        <textarea id="importData" placeholder="Paste JSON array atau SQL backup di sini..."></textarea>
      </div>
      
      <div class="btn-group">
        <button class="btn btn-primary" onclick="importData()">🔄 Reclone Data</button>
        <button class="btn btn-danger" onclick="testImportData()">🧪 Test Preview</button>
      </div>
    </div>
  </div>
  
  <!-- TAB: SETTINGS -->
  <div id="settings" class="tab-content">
    <div class="panel">
      <h3 style="color: #FFD700; margin-bottom: 15px; font-size: 16px;">⚙️ Pengaturan & Backup</h3>
      <div id="settingsMessage"></div>
      
      <div class="form-group">
        <label>⚠️ Zona Berbahaya:</label>
        <p style="color: #aaa; font-size: 12px; margin-bottom: 10px;">Operasi ini tidak bisa di-undo!</p>
        <div class="btn-group">
          <button class="btn btn-danger" onclick="autoBackup()">💾 Auto Backup Sekarang</button>
          <button class="btn btn-danger" onclick="clearAllData()">🗑️ Hapus Semua Data</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="member_system.js"></script>
<script>
  // TAB SWITCHING
  function switchTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabName).classList.add('active');
    event.target.classList.add('active');
    
    if (tabName === 'members') {
      loadMemberTable();
    }
  }
  
  // LOAD MEMBER TABLE
  function loadMemberTable() {
    const members = MEMBER_SYSTEM.getAllMembers();
    const container = document.getElementById('memberTableContainer');
    
    if (members.length === 0) {
      container.innerHTML = `<p style="color: #aaa; text-align: center; padding: 20px;">Belum ada member terdaftar.</p>`;
      return;
    }
    
    // Sort by poin desc
    const sorted = members.sort((a, b) => b.poin - a.poin);
    
    let html = `<table class="member-table">
      <thead>
        <tr>
          <th>No</th>
          <th>ID Member</th>
          <th>Nama</th>
          <th>Poin</th>
          <th>Login</th>
          <th>Komentar</th>
          <th>Quiz</th>
          <th>Terakhir Login</th>
        </tr>
      </thead>
      <tbody>`;
    
    sorted.forEach((member, idx) => {
      html += `<tr>
        <td>${idx + 1}</td>
        <td><span class="badge badge-gold">${member.idMember}</span></td>
        <td>${member.nama}</td>
        <td style="color: #FFD700; font-weight: bold;">${member.poin} 🎁</td>
        <td>${member.loginCount || 0}</td>
        <td>${member.komentarCount || 0}</td>
        <td>${member.quizCount || 0}</td>
        <td>${member.lastLogin || '-'}</td>
      </tr>`;
    });
    
    html += `</tbody></table>`;
    container.innerHTML = html;
    
    // Update stats
    updateStats();
  }
  
  // UPDATE STATISTIK
  function updateStats() {
    const members = MEMBER_SYSTEM.getAllMembers();
    const totalMembers = members.length;
    const totalPoin = members.reduce((sum, m) => sum + m.poin, 0);
    const avgPoin = totalMembers > 0 ? Math.round(totalPoin / totalMembers) : 0;
    const topMember = totalMembers > 0 ? members.sort((a, b) => b.poin - a.poin)[0].nama.substring(0, 15) : '-';
    
    document.getElementById('totalMembers').textContent = totalMembers;
    document.getElementById('totalPoin').textContent = totalPoin;
    document.getElementById('avgPoin').textContent = avgPoin;
    document.getElementById('topMember').textContent = topMember;
  }
  
  // EXPORT DATA
  function exportData() {
    const format = document.getElementById('exportFormat').value;
    let result = '';
    
    if (format === 'json') {
      result = MEMBER_SYSTEM.exportToJSON();
    } else if (format === 'sql') {
      result = MEMBER_SYSTEM.exportToSQL();
    } else if (format === 'csv') {
      result = convertToCSV();
    }
    
    document.getElementById('exportResult').value = result;
    showMessage('exportMessage', 'success', '✅ Export berhasil! Copy atau download file di bawah.');
  }
  
  // CONVERT TO CSV
  function convertToCSV() {
    const members = MEMBER_SYSTEM.getAllMembers();
    let csv = 'ID Member,Nama,Poin,Login Count,Komentar,Quiz,Join Date,Last Login\n';
    
    members.forEach(m => {
      csv += `"${m.idMember}","${m.nama}",${m.poin},${m.loginCount || 0},${m.komentarCount || 0},${m.quizCount || 0},"${m.joinDate}","${m.lastLogin}"\n`;
    });
    
    return csv;
  }
  
  // DOWNLOAD EXPORT
  function downloadExport() {
    const format = document.getElementById('exportFormat').value;
    const content = document.getElementById('exportResult').value;
    
    if (!content) {
      showMessage('exportMessage', 'error', '⚠️ Tidak ada data untuk di-download!');
      return;
    }
    
    const fileExtension = format === 'json' ? 'json' : (format === 'sql' ? 'sql' : 'csv');
    const filename = `indramayu_members_${new Date().toISOString().split('T')[0]}.${fileExtension}`;
    
    const blob = new Blob([content], { type: 'text/plain' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    window.URL.revokeObjectURL(url);
    
    showMessage('exportMessage', 'success', '✅ File diunduh: ' + filename);
  }
  
  // COPY TO CLIPBOARD
  function copyToClipboard() {
    const textarea = document.getElementById('exportResult');
    textarea.select();
    document.execCommand('copy');
    showMessage('exportMessage', 'success', '✅ Copied to clipboard!');
  }
  
  // IMPORT DATA
  function importData() {
    const importStr = document.getElementById('importData').value.trim();
    
    if (!importStr) {
      showMessage('importMessage', 'error', '⚠️ Paste data terlebih dahulu!');
      return;
    }
    
    const result = MEMBER_SYSTEM.importFromJSON(importStr);
    showMessage('importMessage', result.status === 'success' ? 'success' : 'error', result.message);
    
    if (result.status === 'success') {
      document.getElementById('importData').value = '';
      updateStats();
      loadMemberTable();
    }
  }
  
  // TEST PREVIEW
  function testImportData() {
    const importStr = document.getElementById('importData').value.trim();
    try {
      const data = JSON.parse(importStr);
      showMessage('importMessage', 'info', `✅ Preview: ${Array.isArray(data) ? data.length : '1'} item(s) akan di-import`);
    } catch (e) {
      showMessage('importMessage', 'error', '❌ Format JSON tidak valid: ' + e.message);
    }
  }
  
  // AUTO BACKUP
  function autoBackup() {
    const backup = MEMBER_SYSTEM.exportToJSON();
    localStorage.setItem('indramayu_members_backup_' + Date.now(), backup);
    showMessage('settingsMessage', 'success', '✅ Backup berhasil disimpan ke browser!');
  }
  
  // CLEAR ALL DATA
  function clearAllData() {
    const result = MEMBER_SYSTEM.clearAllData();
    if (result.status === 'success') {
      showMessage('settingsMessage', 'success', result.message);
      updateStats();
      loadMemberTable();
    }
  }
  
  // SHOW MESSAGE
  function showMessage(elementId, type, text) {
    const el = document.getElementById(elementId);
    el.innerHTML = text;
    el.className = `message ${type}`;
    setTimeout(() => {
      el.className = `message`;
    }, 5000);
  }
  
  // INIT
  window.addEventListener('load', () => {
    updateStats();
    loadMemberTable();
  });
</script>

</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script></body>
</html>
