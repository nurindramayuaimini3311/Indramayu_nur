<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset PWA Indramayu Club</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, system-ui, sans-serif; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg,#a8e6ff,#fff3c4); }
    .box { background: #fff; border-radius: 20px; padding: 28px 24px; margin: 16px;
      max-width: 400px; width: 100%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
    h1 { font-size: 20px; color: #1a2a3a; margin-bottom: 8px; }
    p { color: #5a6a7a; font-size: 14px; margin-bottom: 16px; }
    #status { color: #0d6efd; font-weight: 600; min-height: 22px; margin-bottom: 14px; font-size: 15px; }
    button { background: linear-gradient(135deg,#0d6efd,#0b5ed7); color: #fff; border: none;
      border-radius: 999px; padding: 12px 24px; font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 0 #094a9e; }
    button:active { transform: translateY(2px); box-shadow: 0 2px 0 #094a9e; }
    .ok { color: #16a34a !important; }
    .bad { color: #dc2626 !important; }
    small { display: block; margin-top: 14px; color: #9aa7b8; font-size: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧹 Reset PWA &amp; Cache</h1>
    <p>Bersihkan semua service worker &amp; cache lama, lalu muat ulang aplikasi.</p>
    <div id="status">Siap...</div>
    <button id="btn" onclick="resetAll()">Mulai Reset</button>
    <small>Tekan sekali saja. Halaman akan reload otomatis ke index.html.</small>
  </div>
  <script>
    async function resetAll() {
      const s = document.getElementById('status');
      const btn = document.getElementById('btn');
      btn.disabled = true;
      try {
        s.textContent = 'Membuka semua cache...';
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
        s.textContent = 'Cache dihapus (' + keys.length + ').';
      } catch (e) {
        s.className = 'bad';
        s.textContent = 'Gagal hapus cache: ' + e.message;
      }
      try {
        s.textContent = 'Menghentikan service worker...';
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
        s.textContent = 'Service worker dimatikan (' + regs.length + ').';
      } catch (e) {
        s.className = 'bad';
        s.textContent = 'Gagal unregister: ' + e.message;
      }
      s.className = 'ok';
      s.textContent = 'Reset selesai. Buka kembali aplikasi...';
      setTimeout(() => { window.location.href = 'index.html'; }, 1200);
    }
  </script>
</body>
</html>
