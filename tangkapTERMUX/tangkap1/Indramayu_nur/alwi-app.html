<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ALWI APP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;background:#eaf4ff}
header{height:50px;background:#0b5ed7;color:#fff;display:flex;align-items:center;gap:6px;padding:0 10px;flex-shrink:0}
header b{font-size:13px;margin-right:auto}

.t.on{background:#fff;color:#0b5ed7;border-color:#fff}
main{flex:1;position:relative}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}iframe.on{display:block}

</head>
<body>
<header><b>⛑️ ALWI</b>
<button class="t on" id="a" onclick="s(0)">💬 Chat</button>
<button class="t" id="b" onclick="s(1)">🏠 Dashboard</button>
<button class="t" id="c" onclick="s(2)">🕌 Adzan</button>
<button class="t" href="#" onclick="location.reload()">⟳</button>
</header>
<main>
<iframe class="on" src="http://35.240.161.189:3000/"></iframe>
<iframe src="http://35.240.161.189:3000/"></iframe>
<iframe src="http://35.240.161.189:3000/"></iframe>
</main>
<script>
const f=document.querySelectorAll('iframe'),t=[a,b,c];
function s(i){f.forEach((x,j)=>x.classList.toggle('on',i===j));t.forEach((x,j)=>x.classList.toggle('on',i===j));}
</script><script src="alwi_bubble4.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script></body>
</html>
