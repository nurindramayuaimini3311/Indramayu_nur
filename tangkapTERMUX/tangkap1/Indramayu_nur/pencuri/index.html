<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pencuri Robi — Hub Ruangan</title>
<style>
  :root{
    --ink:#0a0d14; --moon:#cfe3ff; --moon-dim:#7f93b8;
    --amber:#ffb020; --gold:#f4d35e; --safe:#3ddc84;
    --card:#111726; --card-edge:#232c40;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; min-height:100%; background:var(--ink); font-family:'Courier New',monospace; color:var(--moon);}
  body{
    background:radial-gradient(ellipse at 50% -10%, #1a2236 0%, transparent 60%), var(--ink);
    padding:28px 18px 50px;
  }
  header{text-align:center; margin-bottom:22px;}
  header h1{font-family:Georgia,serif; font-size:28px; color:var(--gold); margin:0 0 6px;}
  header p{color:var(--moon-dim); font-size:13px; max-width:340px; margin:0 auto; line-height:1.6;}
  #resetLine{margin-top:10px;}
  #resetBtn{
    background:none; border:1px solid #2a3247; color:var(--moon-dim);
    font-size:11px; padding:6px 12px; border-radius:4px; font-family:'Courier New',monospace;
    letter-spacing:1px;
  }
  #rooms{
    max-width:420px; margin:0 auto; display:flex; flex-direction:column; gap:12px;
  }
  .card{
    background:var(--card); border:1px solid var(--card-edge); border-radius:10px;
    padding:14px 16px; display:flex; align-items:center; gap:14px;
    text-decoration:none; color:var(--moon); position:relative; overflow:hidden;
  }
  .card.locked{opacity:0.45; pointer-events:none;}
  .card .icon{font-size:30px; width:42px; text-align:center;}
  .card .info{flex:1;}
  .card .roomTitle{font-weight:bold; font-size:14px;}
  .card .roomName{color:var(--moon-dim); font-size:12px; margin-top:2px;}
  .card .diff{
    font-size:10px; letter-spacing:1px; text-transform:uppercase;
    color:var(--amber); margin-top:4px;
  }
  .card .status{font-size:20px;}
  .card.done{border-color:rgba(61,220,132,0.4);}
  .card.done .status{color:var(--safe);}
  footer{text-align:center; color:var(--moon-dim); font-size:11px; margin-top:26px; line-height:1.6;}
  footer .legend{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:8px;}
</style>
</head>
<body>
  <header>
    <h1>🥷 PENCURI ROBI</h1>
    <p>Pilih ruangan untuk disusupi. Selesaikan sebuah ruangan (bobol pintu utama →
    tengah → keluar) untuk membuka ruangan berikutnya. Zona 🚩 dekat pintu masuk
    selalu aman dari kejaran 🐕 &amp; 👮.</p>
    <div id="resetLine">
      <button id="resetBtn">Reset Progres</button>
    </div>
  </header>

  <div id="rooms"></div>

  <footer>
    <div>Progres tersimpan otomatis di perangkat ini.</div>
    <div class="legend">
      <span>🎁 Utama</span><span>🏆 Tengah</span><span>👑 Selesai</span>
      <span>👻 Tertangkap</span><span>🚩 Zona aman</span>
    </div>
  </footer>

<script>
  const UNLOCK_KEY = "pencuriRobiUnlocked";
  const rooms = [
    { idx:1, file:"ruang1.html", name:"Gudang Belakang", diff:"Mudah", icon:"🎁" },
    { idx:2, file:"ruang2.html", name:"Dapur Rumah", diff:"Sedang", icon:"🏆" },
    { idx:3, file:"ruang3.html", name:"Ruang Tamu", diff:"Sulit", icon:"🔑" },
    { idx:4, file:"ruang4.html", name:"Lantai Atas", diff:"Sangat Sulit", icon:"🗝️" },
    { idx:5, file:"ruang5.html", name:"Brankas Utama", diff:"Ekstrem — Boss", icon:"👑" },
  ];

  function getUnlocked(){
    try{ return parseInt(localStorage.getItem(UNLOCK_KEY) || "1", 10); }catch(e){ return 1; }
  }

  function render(){
    const unlocked = getUnlocked();
    const wrap = document.getElementById('rooms');
    wrap.innerHTML = '';
    rooms.forEach(r=>{
      const isDone = r.idx < unlocked;
      const isOpen = r.idx <= unlocked;
      const a = document.createElement('a');
      a.className = 'card' + (isOpen ? '' : ' locked') + (isDone ? ' done' : '');
      a.href = isOpen ? r.file : '#';
      a.innerHTML = `
        <div class="icon">${isOpen ? r.icon : '🔒'}</div>
        <div class="info">
          <div class="roomTitle">Ruangan ${r.idx}</div>
          <div class="roomName">${r.name}</div>
          <div class="diff">${r.diff}</div>
        </div>
        <div class="status">${isDone ? '✅' : (isOpen ? '▶' : '')}</div>
      `;
      wrap.appendChild(a);
    });
  }

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    try{ localStorage.setItem(UNLOCK_KEY, "1"); }catch(e){}
    render();
  });

  render();
</script>


<!-- NAV FINAL ALWI - 1x ONLY -->
<div id="alwi-rl" style="position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;z-index:9999999;padding:0 12px;pointer-events:none"><a id="rlL" style="pointer-events:auto;width:56px;height:56px;background:#FFD700;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;text-decoration:none;border:3px solid #000;box-shadow:0 4px 12px rgba(0,0,0,.5)">←</a><a id="rlR" style="pointer-events:auto;width:56px;height:56px;background:#FFD700;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;text-decoration:none;border:3px solid #000;box-shadow:0 4px 12px rgba(0,0,0,.5)">→</a></div>
<script>
(function(){
const PAGES=["/","/setting/","/alwiSD/","/fiturBARU/","/game/","/kamera-hantu/","/konten/","/kuis/","/netflix/","/pencuri/","/peta/","/peta/peta-cod.html"];
let p=location.pathname; let i=PAGES.indexOf(p);

let L=document.getElementById('rlL'), R=document.getElementById('rlR');
L.href=prev; R.href=next;
let ctx; function tuk(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.setValueAtTime(700,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(150,ctx.currentTime+0.12);g.gain.setValueAtTime(0.6,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.14);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.14);if(navigator.vibrate)navigator.vibrate(40);}catch(e){}}
[L,R].forEach(b=>b.addEventListener('click',()=>{tuk();b.style.transform='scale(0.8)';setTimeout(()=>b.style.transform='',120);}));
let sx=0;
document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>70){tuk(); setTimeout(tuk,70); if(dx>0) location.href=prev; else location.href=next;}},{passive:true});
if(location.pathname.includes('alwiSD')){
 let s=document.createElement('style');s.innerHTML="#alwi-rl a{animation:bob 0.7s infinite alternate} @keyframes bob{0%{transform:translateY(0)}100%{transform:translateY(-8px) scale(1.1)}}";document.head.appendChild(s);
}

</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script></body>
</html>
