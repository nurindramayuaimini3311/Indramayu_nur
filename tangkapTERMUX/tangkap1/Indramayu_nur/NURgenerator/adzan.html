<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🕌 DASHBOARD ADZAN — Pilihan Audio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#040d08;color:#ffd700;font-family:system-ui,sans-serif;padding:20px;min-height:100vh}
a{color:#ffd700;text-decoration:none}
h1{font-size:22px;margin-bottom:4px}
.sub{color:#94a3b8;font-size:12px;margin-bottom:16px}
hr{border:1px solid #103a22;margin:18px 0}
.panel{background:#0a1a10;border:1px solid #14532d;border-radius:14px;padding:16px;max-width:560px}
label{display:block;font-size:12px;font-weight:800;color:#86efac;margin-bottom:8px}
select{width:100%;padding:12px;border-radius:10px;border:1px solid #365314;background:#052e16;color:#fff;font-size:14px;font-weight:700;margin-bottom:12px}
audio{width:100%;height:44px;margin-bottom:10px}
.btn-main{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;font-weight:900;font-size:14px;cursor:pointer;margin-bottom:8px}
.btn-stop{width:100%;padding:10px;border:1px solid #b91c1c;background:transparent;color:#fca5a5;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}
ul{list-style:none;padding:0}
li{margin-bottom:8px}
li a{display:block;background:#0a1a10;border:1px solid #14532d;border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px;transition:.2s}
li a:hover{background:#14532d}
.now{margin-top:12px;font-size:13px;color:#86efac}
</style>
</head>
<body>
<h1>🕌 AZDAN SERVER</h1>
<p class="sub">Pilih suara adzan di dropdown, atau pilih dari daftar. Server: <b><span id="url"></span></b></p>

<div class="panel">
  <label for="adzanSelect">🎙️ Pilih Suara Adzan:</label>
  <select id="adzanSelect"></select>
  <audio id="adzanAudio" controls></audio>
  <button class="btn-main" onclick="main()">▶️ PUTAR ADZAN</button>
  <button class="btn-stop" onclick="stop()">⏹️ STOP</button>
  <div class="now" id="nowLabel"></div>
</div>

<hr>
<h2>📌 Menu Lain:</h2>
<ul>
  <li><a href="player.html?play=Adzan-Shubuh-Abu-Hazim.mp3">Adzan-Shubuh-Abu-Hazim.mp3 (Subuh)</a></li>
  <li><a href="player.html?play=Adzan-Misyari-Rasyid.mp3">Adzan-Misyari-Rasyid.mp3</a></li>
  <li><a href="player.html?play=Adzan-Bosnia.mp3">Adzan-Bosnia.mp3</a></li>
  <li><a href="player.html?play=Mecca-Adzan-2.mp3">Mecca-Adzan-2.mp3</a></li>
  <li><a href="DASHBOARD.html">⏰ DASHBOARD HITUNG MUNDUR 5 WAKTU</a></li>
  <li><a href="adzan_audio.html">🕌 Halaman Pilihan Audio Adzan</a></li>
</ul>

<script>
const ADZAN = [
  {file:'Adzan-Shubuh-Abu-Hazim.mp3',nama:'Adzan Subuh — Abu Hazim'},
  {file:'Adzan-Misyari-Rasyid.mp3',nama:'Misyari Rasyid'},
  {file:'Adzan-Bosnia.mp3',nama:'Adzan Bosnia'},
  {file:'Adzan-imam-Malaysia.mp3',nama:'Imam Malaysia'},
  {file:'Mecca-Adzan-2.mp3',nama:'Adzan Mekkah'},
  {file:'Pakistan-Adzan.mp3',nama:'Adzan Pakistan'},
  {file:'Syria-Adzan.mp3',nama:'Adzan Syria'},
  {file:'adan_madinah_32_16.mp3',nama:'Adzan Madinah'},
  {file:'adhan_from_hawai_by_abderrahim_ed.mp3',nama:'Hawai — Abderrahim Ed'},
  {file:'adzan_uea.mp3',nama:'Adzan UEA'},
  {file:'alaqsa1_64_22.mp3',nama:'Al-Aqsa 1'},
  {file:'alaqsa2_64_22.mp3',nama:'Al-Aqsa 2'},
  {file:'athan_egypt.mp3',nama:'Adzan Mesir (Egypt)'},
  {file:'doa_ketika_mendengarkan_adzan_by_saad_al-ghamidi.mp3',nama:'Doa Saat Mendengar Adzan — Al-Ghamidi'},
  {file:'doa_sesudah_adzan.mp3',nama:'Doa Sesudah Adzan'},
  {file:'ezan_from_europe.mp3',nama:'Ezan Eropa'},
  {file:'fajr_128_44.mp3',nama:'Adzan Fajr'},
  {file:'iqama.mp3',nama:'Iqamah'},
  {file:'mecca_56_22.mp3',nama:'Mekkah 56'}
];
const select = document.getElementById('adzanSelect');
const audio = document.getElementById('adzanAudio');
const nowLabel = document.getElementById('nowLabel');
const BASE = 'ADZAN/';

document.getElementById('url').innerText = location.origin;

ADZAN.forEach((a,i)=>{
  const o = document.createElement('option');
  o.value = i;
  o.textContent = a.nama;
  select.appendChild(o);
});
select.selectedIndex = 0;
muat(0);

function muat(i){
  const a = ADZAN[i];
  audio.src = BASE+a.file;
  nowLabel.textContent = '▶️ ' + a.nama;
}
select.addEventListener('change',()=>{ muat(parseInt(select.value,10)); });
function main(){ audio.play(); }
function stop(){ audio.pause(); audio.currentTime=0; }
</script><script src="../alwi_bubble2.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script></body>
</html>
