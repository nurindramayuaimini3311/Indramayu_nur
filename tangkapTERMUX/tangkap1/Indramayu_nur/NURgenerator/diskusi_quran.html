<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📖 Diskusi Al-Quran — Satu Halaman</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:linear-gradient(180deg,#04140f,#0a2540 40%,#0a1424);color:#e2e8f0}
.hbar{background:#0d6efd;color:#fff;padding:13px 16px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between}
.hbar b{font-size:16px}
.hbar a{background:#fff;color:#0d6efd;text-decoration:none;font-weight:800;font-size:11px;padding:7px 12px;border-radius:9px}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
.sec{background:rgba(255,255,255,.05);border:1px solid #0d6efd44;border-radius:16px;padding:16px;margin-bottom:22px}
.sec h2{font-size:15px;color:#7cc4ff;margin-bottom:12px;border-bottom:1px solid #0d6efd33;padding-bottom:8px}
select,input[type=number],input[type=text]{width:100%;padding:10px;border:1.4px solid #0d6efd66;border-radius:10px;background:#0a1424;color:#fff;font-size:13px;font-weight:700;margin-bottom:8px;outline:none}
.row{display:flex;gap:8px}
.row>*{flex:1}
.arab{font-size:25px;line-height:2;text-align:right;direction:rtl;font-family:'Amiri','Scheherazade New',serif;color:#fff;margin:12px 0 6px}
.id{font-size:14px;line-height:1.7;background:#062030;border-left:3px solid #0d6efd;padding:10px 12px;border-radius:8px;white-space:pre-line}
.btn{display:inline-block;padding:10px 14px;border:none;border-radius:10px;font-weight:800;font-size:12px;cursor:pointer;color:#fff;text-align:center}
.btn-b{background:#0d6efd}.btn-g{background:#059669}.btn-c{background:#0e7490}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
audio{width:100%;height:40px;margin-top:8px}
.info{font-size:12px;color:#7cc4ff;margin-bottom:4px}
.kom-list{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:10px 0;padding:2px}
.balon{background:#0f2547;border:1px solid #0d6efd55;border-radius:12px;padding:8px 10px}
.balon .nm{font-size:11px;font-weight:800;color:#7cc4ff}
.balon .tx{font-size:13px;margin-top:2px;word-break:break-word}
.member-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mcard{background:#0b1b35;border:1.4px solid #0d6efd55;border-radius:14px;padding:14px 10px;text-align:center}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;background:#0a2540;display:block;margin:0 auto 8px;border:3px solid #0d6efd}
.up{font-size:10px;font-weight:800;color:#7cc4ff;cursor:pointer;display:block;margin-bottom:6px}
.savec{width:100%;padding:8px;border:none;border-radius:9px;background:#0d6efd;color:#fff;font-weight:800;font-size:11px;cursor:pointer}
.hint{font-size:10px;color:#64748b;margin-top:6px;text-align:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#052e16;color:#d1fae5;border:1px solid #34d399;border-radius:10px;padding:10px 16px;font-size:12px;font-weight:700;z-index:99;display:none}
</style>
</head>
<body>
<div class="hbar">
  <b>📖 DISKUSI AL-QURAN — SATU HALAMAN</b>
  <a href="/">🏠 Dashboard</a>
</div>
<div class="wrap">

  <div class="sec">
    <h2>📖 BACA &amp; PUTAR AYAT</h2>
    <div class="row">
      <select id="surahSel"></select>
      <select id="ayatSel"></select>
    </div>
    <div class="bar">
      <button class="btn btn-g" onclick="main()">▶️ PUTAR</button>
      <button class="btn btn-c" onclick="salinAyat()">📋 COPY</button>
      <button class="btn btn-c" onclick="bacaAyat()">🔊 BACAKAN</button>
      <a class="btn btn-b" id="dlBtn" download>⬇️ MP3</a>
    </div>
    <div class="info" id="info"></div>
    <div class="arab" id="arab"></div>
    <div class="id" id="terjemah"></div>
    <audio id="audio" controls></audio>
  </div>

  <div class="sec">
    <h2>👥 KARTU MEMBER</h2>
    <div class="member-grid" id="mGrid"></div>
  </div>

  <div class="sec">
    <h2>💬 KOMENTAR (memori + backup localStorage)</h2>
    <div class="kom-list" id="komList"></div>
    <div class="row">
      <input id="inputKomentar" placeholder="Nama|Pesan (pakai |) lalu Enter...">
      <button class="btn btn-b" style="flex:0 0 auto" onclick="kirim()">KIRIM</button>
    </div>
    <div class="hint">Format: <b>Nama|Pesan</b> — tersimpan di memori sesi + localStorage Chrome.</div>
  </div>

</div>
<div class="toast" id="toast">✅ Tersalin</div>

<script>
/* ===== DATA AL-QURAN ===== */
var ARAB=null, IDN=null;
var surahSel=document.getElementById('surahSel'), ayatSel=document.getElementById('ayatSel');
Promise.all([
  fetch('quran_id.json').then(function(r){return r.json()}),
  fetch('quran_id_indonesian.json').then(function(r){return r.json()})
]).then(function(d){
  ARAB=d[0].data.surahs; IDN=d[1].data.surahs;
  ARAB.forEach(function(s,i){
    var o=document.createElement('option');
    o.value=i; o.textContent=(i+1)+'. '+s.englishName+' ('+s.ayahs.length+' ayat)';
    surahSel.appendChild(o);
  });
  surahSel.selectedIndex=0; muatSurah(0);
}).catch(function(e){
  document.getElementById('info').textContent='Gagal memuat: '+e.message;
});
function muatSurah(i){
  var s=ARAB[i]; ayatSel.innerHTML='';
  s.ayahs.forEach(function(a,j){
    var o=document.createElement('option'); o.value=j; o.textContent='Ayat '+a.numberInSurah; ayatSel.appendChild(o);
  });
  ayatSel.selectedIndex=0; tampil(i,0);
}
surahSel.addEventListener('change',function(){muatSurah(parseInt(surahSel.value,10))});
ayatSel.addEventListener('change',function(){tampil(parseInt(surahSel.value,10),parseInt(ayatSel.value,10))});
function tampil(si,ai){
  var s=ARAB[si],a=s.ayahs[ai];
  var idn=IDN[si]&&IDN[si].ayahs[ai]?IDN[si].ayahs[ai].text:'';
  document.getElementById('info').textContent='🕌 '+s.englishName+' — Ayat '+a.numberInSurah+'/'+s.numberOfAyahs;
  document.getElementById('arab').textContent=a.text;
  document.getElementById('terjemah').textContent=idn;
  var url='https://cdn.islamic.network/quran/audio/128/ar.alafasy/'+s.number+'.mp3';
  document.getElementById('audio').src=url;
  document.getElementById('dlBtn').href=url;
}
function main(){var a=document.getElementById('audio');a.currentTime=0;a.play();}
function salinAyat(){
  var teks='🕌 '+document.getElementById('info').textContent+'\n'+document.getElementById('arab').textContent+'\n\n'+document.getElementById('terjemah').textContent;
  (navigator.clipboard?navigator.clipboard.writeText(teks):Promise.reject()).catch(function(){
    var ta=document.createElement('textarea');ta.value=teks;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
  }).finally(function(){toast('✅ Ayat tersalin')});
}
function bacaAyat(){
  if(!('speechSynthesis' in window)){toast('Browser tak mendukung');return;}
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(document.getElementById('terjemah').textContent||document.getElementById('arab').textContent);
  u.lang='id-ID';u.rate=.9;speechSynthesis.speak(u);
}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},1800);}

/* ===== KARTU MEMBER ===== */
var M=JSON.parse(localStorage.getItem('member_slots')||'{"anda":{},"imah":{},"nur":{},"club":{}}');
var MN=[['anda','ANDA'],['imah','IMAH'],['nur','NUR'],['club','CLUB']];
function mGrid(){
  var g=document.getElementById('mGrid');g.innerHTML='';
  MN.forEach(function(s,idx){
    var st=M[s[0]]||{};
    var jk='<select id="jk'+idx+'"><option value="">Pilih</option><option value="L"'+(st.jk==='L'?' selected':'')+'>Laki-laki</option><option value="P"'+(st.jk==='P'?' selected':'')+'>Perempuan</option></select>';
    g.innerHTML+='<div class="mcard">'+
      '<img class="avatar" id="av'+idx+'" src="'+(st.foto||'')+'">'+
      '<label class="up">📷 Foto<input type="file" accept="image/*" style="display:none" onchange="foto('+idx+',this)"></label>'+
      '<input id="nm'+idx+'" placeholder="Nama" value="'+(st.nama||'')+'">'+
      '<input id="um'+idx+'" type="number" placeholder="Umur" value="'+(st.umur||'')+'">'+
      jk+'<button class="savec" onclick="simpanM('+idx+')">💾</button></div>';
  });
}
function foto(idx,inp){
  var f=inp.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){
    var img=new Image();img.onload=function(){
      var c=document.createElement('canvas');c.width=c.height=150;var x=c.getContext('2d');
      var mn=Math.min(img.width,img.height);x.imageSmoothingQuality='high';
      x.drawImage(img,(img.width-mn)/2,(img.height-mn)/2,mn,mn,0,0,150,150);
      var d=c.toDataURL('image/jpeg',.7);
      document.getElementById('av'+idx).src=d;
      M[MN[idx][0]].foto=d;localStorage.setItem('member_slots',JSON.stringify(M));
      toast('📷 Foto kecil tersimpan');
    };img.src=r.result;
  };r.readAsDataURL(f);
}
function simpanM(idx){
  var s=MN[idx][0];
  M[s].nama=document.getElementById('nm'+idx).value;
  M[s].umur=document.getElementById('um'+idx).value;
  M[s].jk=document.getElementById('jk'+idx).value;
  localStorage.setItem('member_slots',JSON.stringify(M));
  toast('💾 Member tersimpan');
}

/* ===== KOMENTAR ===== */
var MEM=[];
try{MEM=JSON.parse(localStorage.getItem('komentar_alwi_mem')||'[]');}catch(e){MEM=[];}
function renderKom(){
  var list=document.getElementById('komList');
  list.innerHTML=MEM.map(function(k){
    return '<div class="balon"><div class="nm">'+k.n+'</div><div class="tx">'+k.t+'</div></div>';
  }).join('');
  list.scrollTop=list.scrollHeight;
}
function kirim(){
  var v=document.getElementById('inputKomentar').value.trim();if(!v)return;
  var n='Member',t=v;
  if(v.indexOf('|')>-1){var p=v.split('|');n=p[0].trim()||'Member';t=p.slice(1).join('|').trim();}
  MEM.push({n:n,t:t,ts:Date.now()});
  if(MEM.length>200)MEM.shift();
  try{localStorage.setItem('komentar_alwi_mem',JSON.stringify(MEM));}catch(e){}
  renderKom();document.getElementById('inputKomentar').value='';
}
document.getElementById('inputKomentar').addEventListener('keydown',function(e){if(e.key==='Enter')kirim();});

mGrid();renderKom();
</script><script src="../alwi_bubble2.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script></body>
</html>
