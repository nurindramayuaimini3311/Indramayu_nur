<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALWI HUB — Iframe Web & Ollama</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#ffffff,#eef6ff);color:#0f172a}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:2px solid #cbd5e1}
.logo{font-family:'Cinzel',serif;font-weight:900;font-size:15px;color:#1e40af}
.tab{flex:1;border:2px solid #f59e0b;background:#fff;border-radius:12px;padding:11px 6px;
 font-weight:800;font-size:13px;color:#1e40af;cursor:pointer;text-align:center}
.tab.aktif{background:#f59e0b;color:#fff;box-shadow:0 3px 10px rgba(245,158,11,.35)}
.buka{background:#16a34a;color:#fff;text-decoration:none;border-radius:10px;padding:10px 14px;font-weight:800;font-size:12px;white-space:nowrap}
#stage{flex:1;position:relative;background:#fff}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
iframe.aktif{display:block}
.info{text-align:center;color:#64748b;font-size:12px;padding:8px}
</style>
</head>
<body>
<div class="top">
  <div class="logo">🛰️ ALWI HUB</div>
  <button class="tab aktif" data-target="frWeb">🌐 Web Statis</button>
  <button class="tab" data-target="frAi">🤖 Ollama AI</button>
  <a class="buka" id="btnBuka" href="http://35.240.161.189:3000/" target="_blank">↗ Buka</a>
</div>

<div id="stage">
  <iframe id="frWeb" class="aktif" src="http://35.240.161.189:3000/" referrerpolicy="no-referrer"></iframe>
  <iframe id="frAi" src="http://35.240.161.189:3000/" referrerpolicy="no-referrer"></iframe>
</div>
<div class="info">Kalau halaman menolak ditampilkan di dalam frame, pakai tombol ↗ Buka</div>

<script>
var tab=document.querySelectorAll('.tab'),frame={frWeb:document.getElementById('frWeb'),frAi:document.getElementById('frAi')};
var url={frWeb:'http://35.240.161.189:3000/',frAi:'http://35.240.161.189:3000/'};
var aktif='frWeb';
tab.forEach(function(t){
  t.onclick=function(){
    tab.forEach(function(x){x.classList.remove('aktif')});
    t.classList.add('aktif');
    Object.keys(frame).forEach(function(k){frame[k].classList.toggle('aktif',k===t.dataset.target)});
    aktif=t.dataset.target;
    document.getElementById('btnBuka').href=url[aktif];
  };
});
</script><script src="../alwi_bubble2.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script></body>
</html>
