<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ALWI LEVEL 3 - RAMBO CONTRA</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#fff;font-family:'Press Start 2P',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden}
#gameWrap{position:relative;margin-top:6px;box-shadow:0 0 0 4px #000,0 0 0 8px #ff4400,0 20px 40px rgba(0,0,0,.5)}
canvas{display:block;background:#87CEEB;image-rendering:pixelated;max-width:100vw;max-height:68vh;width:960px;height:540px}
#hud{position:absolute;top:0;left:0;right:0;height:54px;background:linear-gradient(#000,#111);display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:3px solid #ff4400;z-index:5;font-size:10px;line-height:1.2}
.hudLeft,.hudRight{display:flex;gap:14px;align-items:center}
.powerBar{width:92px;height:14px;background:#222;border:2px solid #fff;position:relative}
.powerFill{height:100%;background:#00ffff;width:100%;transition:width .2s}
.heart{color:#ff2222}
#controls{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;user-select:none;-webkit-user-select:none}
.btn{background:#222;border:3px solid #fff;color:#fff;font-family:'Press Start 2P',monospace;font-size:14px;padding:10px 14px;border-radius:6px;box-shadow:0 4px 0 #000;active:transform:translateY(2px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.shoot{background:#ff4400;border-color:#ffff00}
.btn.jump{background:#0088ff}
#touch{display:none;position:fixed;bottom:6px;left:0;right:0;justify-content:space-between;padding:0 10px;z-index:20;pointer-events:none}
.tGroup{display:flex;gap:8px;pointer-events:auto}
.tBtn{width:56px;height:56px;background:rgba(0,0,0,.6);border:3px solid #fff;border-radius:12px;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;touch-action:none}
.tBtn.active{background:rgba(255,68,0,.8)}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px}
#overlay h1{font-size:22px;color:#ffff00;text-shadow:4px 4px 0 #ff4400;margin-bottom:12px;line-height:1.4}
#overlay p{font-size:10px;line-height:1.8;max-width:560px;margin-bottom:16px;color:#ddd}
#startBtn{font-family:'Press Start 2P',monospace;background:#ff4400;color:#fff;border:4px solid #fff;padding:14px 26px;font-size:12px;cursor:pointer;box-shadow:0 6px 0 #000}
#startBtn:hover{background:#ffff00;color:#000}
.blink{animation:blink .6s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
@media(max-width:800px){
  #touch{display:flex}
  #controls{display:none}
  #gameWrap{margin-top:4px}
  canvas{width:min(92vw,calc((100vh - 190px)*16/9));height:auto;max-height:none}
  canvas{width:min(92vw,calc((100dvh - 190px)*16/9))}
}
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="hud">
    <div class="hudLeft">
      <div>LEVEL 3<br><span style="color:#ffff00">CONTRA</span></div>
      <div style="color:#ff8844">ALWI<br><span id="hearts" class="heart">♥♥♥</span></div>
      <div>KILL<br><span id="killTxt" style="color:#00ff88">0/15</span></div>
    </div>
    <div class="hudRight">
      <div id="fBox" style="display:flex;align-items:center;gap:6px"><span style="background:#8a2be2;color:#ffff00;border:2px solid #fff;padding:2px 5px;font-size:12px">F</span><div class="powerBar"><div id="pFill" class="powerFill"></div></div></div>
      <div>SCORE<br><span id="scoreTxt" style="color:#ffff00">00000</span></div>
    </div>
  </div>
  <div id="overlay">
    <h1>ALWI - LEVEL 3<br>RAMBO CONTRA WAR</h1>
    <p>Musuh tentara hijau menyerbu dari kanan! Kalahkan <span style="color:#00ff88">15 MUSUH</span> untuk menang. Ambil power-up <span style="background:#8a2be2;color:#ff0;padding:1px 4px">F</span> untuk rapid-fire! <br><br>PC: A/D gerak, W/↑ Lompat, SPASI Tembak<br>HP: Gunakan tombol bawah</p>
    <button id="startBtn">▶ MULAI PERANG</button>
    <p style="margin-top:12px;font-size:8px" class="blink">▼ INSERT COIN - TEKAN MULAI ▼</p>
  </div>
</div>

<div id="controls">
  <button class="btn" data-k="left">◀ A</button>
  <button class="btn" data-k="right">D ▶</button>
  <button class="btn jump" data-k="up">LOMPAT W</button>
  <button class="btn shoot" data-k="fire">TEMBAK [SPASI]</button>
</div>

<div id="touch">
  <div class="tGroup">
    <div class="tBtn" data-t="left">◀</div>
    <div class="tBtn" data-t="right">▶</div>
  </div>
  <div class="tGroup">
    <div class="tBtn" data-t="up">▲</div>
    <div class="tBtn" data-t="fire" style="background:rgba(255,68,0,.85);width:72px">●</div>
  </div>
</div>

<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=960,H=540;
const GROUND_Y=H-64;
let keys={}, gameState='menu', score=0,kills=0,lives=3,power=100, rapidTimer=0;
let player,bullets=[],eBullets=[],enemies=[],particles=[],powerups=[],camX=0;
let spawnTimer=0, difficulty=0;

// Player
function resetGame(){
  score=0;kills=0;lives=3;power=100;rapidTimer=0;
  bullets=[];eBullets=[];enemies=[];particles=[];powerups=[];
  spawnTimer=0;difficulty=0;camX=0;
  player={x:80,y:GROUND_Y-48,w:28,h:44,vx:0,vy:0,dir:1,onGround:true,shootCd:0,invul:0,frame:0};
  document.getElementById('killTxt').textContent='0/15';
  document.getElementById('scoreTxt').textContent='00000';
}

function spawnEnemy(){
  const y = GROUND_Y-36 + (Math.random()>0.5?0:-0); // slight variation
  const type=Math.random()<0.6?0:1; // 0 ground rush, 1 cover shooter
  const e={x:camX+W+40+Math.random()*200,y:y,w:26,h:36,vx:-(1.2+Math.random()*1.5+difficulty*0.2),type:type,shootCd:60+Math.random()*100,alive:true,hp: type?1:2,state:'run',t:0};
  if(type===1){
    e.w=32;e.h=38;e.vx=0;e.state='hide';e.hideTime=60;
  }
  enemies.push(e);
}
function spawnPower(){
  if(Math.random()<0.02 && powerups.length<2){
    powerups.push({x:camX+W+100,y:GROUND_Y-20,w:24,h:24,vx:-1.5,t:0});
  }
}

function rectCol(a,b){return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;}

function addExplosion(x,y,scale=1,color='#ff4400'){
  for(let i=0;i<12*scale;i++){
    particles.push({x:x,y:y,vx:(Math.random()-0.5)*8*scale,vy:(Math.random()-0.8)*6*scale,life:20+Math.random()*18,t:0,color: i%3==0?'#ffff00':i%3==1?'#ff4400':'#ff8844',size:2+Math.random()*4*scale});
  }
}
function addMuzzle(x,y,dir){
  for(let i=0;i<4;i++) particles.push({x:x,y:y,vx:dir*(2+Math.random()*4)+ (Math.random()-0.5),vy:(Math.random()-0.5)*2,life:6,t:0,color:'#ffff88',size:2});
}

function update(){
  if(gameState!=='play') return;
  difficulty=kills*0.06;
  camX+=1.0; // auto scroll Contra style
  player.frame+=0.2;

  // input
  player.vx=0;
  if(keys['a']||keys['arrowleft']) {player.vx=-3.8;player.dir=-1;}
  if(keys['d']||keys['arrowright']) {player.vx=4.6;player.dir=1;}
  // keep player inside camera
  player.x+=player.vx;
  if(player.x < camX+10) player.x=camX+10;
  if(player.x > camX+W-120) player.x=camX+W-120;

  if((keys['w']||keys['arrowup']) && player.onGround){player.vy=-11.5;player.onGround=false;}
  player.vy+=0.62; player.y+=player.vy;
  if(player.y+player.h>=GROUND_Y){player.y=GROUND_Y-player.h;player.vy=0;player.onGround=true;}
  if(player.invul>0) player.invul--;
  if(rapidTimer>0){rapidTimer--;if(rapidTimer===0) power=100;}

  if(player.shootCd>0) player.shootCd--;
  if(keys[' '] && player.shootCd<=0){
    const sp= rapidTimer>0?6:14;
    player.shootCd=sp;
    bullets.push({x:player.x+(player.dir>0?player.w-4:4),y:player.y+18,w:12,h:4,vx:player.dir*8.5,dir:player.dir});
    addMuzzle(player.x+(player.dir>0?player.w:0),player.y+20,player.dir);
  }

  spawnTimer--;
  if(spawnTimer<=0){spawnEnemy();spawnTimer=70-difficulty*12; if(spawnTimer<22) spawnTimer=22;}
  if(Math.random()<0.008) spawnPower();

  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.x+=b.vx;
    if(b.x>camX+W+30 || b.x<camX-30){bullets.splice(i,1);continue;}
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(!e.alive) continue;
      if(rectCol(b,e)){
        e.hp--; bullets.splice(i,1);
        if(e.hp<=0){e.alive=false; kills++; score+=100; addExplosion(e.x+e.w/2,e.y+e.h/2,1.4);
          document.getElementById('killTxt').textContent=kills+'/15';
          document.getElementById('scoreTxt').textContent=('00000'+score).slice(-5);
        } else {addExplosion(b.x,b.y,0.4,'#ffff00');}
        break;
      }
    }
  }

  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(!e.alive){ if(e.t++>30) enemies.splice(i,1); continue;}
    e.t++;
    if(e.type===0){ // runner
      e.x+=e.vx; e.shootCd--;
      if(e.shootCd<=0){eBullets.push({x:e.x,y:e.y+14,w:8,h:6,vx:-5,vy:(Math.random()-0.5)*0.8}); e.shootCd=90+Math.random()*70;}
      if(e.x<camX-60) enemies.splice(i,1);
    } else {
      // cover shooter: hide then pop
      if(e.state==='hide'){e.hideTime--; if(e.hideTime<=0){e.state='shoot'; e.shootCd=10;}}
      else {e.shootCd--; if(e.shootCd<=0){eBullets.push({x:e.x-6,y:e.y+16,w:9,h:6,vx:-4.5,vy:0}); e.shootCd=20; if(e.t>140){e.state='hide'; e.hideTime=80; e.t=0;}}}
    }
    if(e.alive && rectCol(player,e) && player.invul===0){hitPlayer();}
  }

  // enemy bullets
  for(let i=eBullets.length-1;i>=0;i--){
    const b=eBullets[i]; b.x+=b.vx; b.y+=b.vy||0;
    if(b.x<camX-40 || b.x>camX+W+40){eBullets.splice(i,1);continue;}
    if(rectCol(b,{x:player.x+4,y:player.y+4,w:player.w-8,h:player.h-8}) && player.invul===0){
      eBullets.splice(i,1); hitPlayer(); addExplosion(player.x+player.w/2,player.y+player.h/2,0.6);
    }
  }

  // powerups
  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i]; p.x+=p.vx; p.t+=0.15;
    if(rectCol(player,p)){powerups.splice(i,1); rapidTimer=600; power=160; score+=50; addExplosion(p.x,p.y,0.8,'#aa44ff'); continue;}
    if(p.x<camX-60) powerups.splice(i,1);
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){const pr=particles[i]; pr.x+=pr.vx; pr.y+=pr.vy; pr.vy+=0.16; pr.t++; if(pr.t>=pr.life) particles.splice(i,1);}

  if(power>0 && rapidTimer===0) power=Math.max(0,power-0.08);
  document.getElementById('pFill').style.width=Math.min(100, (rapidTimer>0?100:power))+'%';
  document.getElementById('pFill').style.background= rapidTimer>0?'#ffff00':'#00ffff';

  if(lives<=0){gameOver(false);}
  if(kills>=15){gameOver(true);}
}
function hitPlayer(){lives--; player.invul=90; document.getElementById('hearts').textContent='♥'.repeat(Math.max(0,lives)); if(lives<=0) return; addExplosion(player.x+10,player.y+10,0.5);}

// DRAW
function drawBackground(){
  // sky - bright!
  ctx.fillStyle='#5bc8ff'; ctx.fillRect(0,0,W,H);
  // clouds
  ctx.fillStyle='rgba(255,255,255,0.9)';
  for(let i=0;i<3;i++){let cx=(i*340 - camX*0.2%700); cx=((cx%900)+900)%900; ctx.beginPath(); ctx.arc(cx+80,60+i*18,18,0,Math.PI*2); ctx.arc(cx+100,58+i*18,24,0,Math.PI*2); ctx.arc(cx+125,62+i*18,18,0,Math.PI*2); ctx.fill();}
  // distant brick city parallax
  const baseX = - (camX*0.5 % 128);
  for(let x=baseX-128;x<W+128;x+=128){
    // brick buildings behind gray
    ctx.fillStyle='#c55b2a'; ctx.fillRect(x, H-220, 110, 120);
    ctx.fillStyle='#8a3d1a'; for(let by=0;by<6;by++) for(let bx=0;bx<4;bx++){ctx.fillRect(x+6+bx*26, H-215+by*18, 20,8);}
    ctx.fillStyle='#a33'; for(let k=0;k<3;k++) ctx.fillRect(x+18+k*28, H-215, 10,10);
  }
  for(let x= - (camX*0.85 % 200)-50; x<W+200; x+=200){
    // gray buildings from ref
    ctx.fillStyle='#9aa0a8'; ctx.fillRect(x, H-200, 140, 110);
    ctx.fillStyle='#6e7680'; ctx.fillRect(x, H-200, 140, 16); // roof
    // doors windows
    ctx.fillStyle='#222'; ctx.fillRect(x+52, H-125, 26, 35);
    ctx.fillStyle='#3a4250'; ctx.fillRect(x+98, H-170, 22, 22); ctx.fillStyle='#000'; ctx.fillRect(x+102, H-166,5,12);
  }
  // tower
  ctx.fillStyle='#8a8e96'; let tx= 800- (camX*1%900); // looping tower
  for(let rep=-1;rep<3;rep++){let ax=tx+rep*360; ctx.fillRect(ax, H-260, 22,160); for(let yy=0;yy<8;yy++){ctx.fillRect(ax-6, H-250+yy*20,34,4);} }

  // ground
  ctx.fillStyle='#7a7a7a'; ctx.fillRect(0,GROUND_Y,W,64);
  ctx.fillStyle='#6a6a6a'; for(let gx= -(camX%32);gx<W;gx+=32) ctx.fillRect(gx,GROUND_Y,16,4);
}

function drawPlayer(){
  const x=player.x-camX, y=player.y;
  if(player.invul%6<3||true){
  ctx.save();
  if(player.dir<0){ctx.scale(-1,1); ctx.translate(-x*2 -player.w,0);}
  let bx=x, by=y;
  if(player.dir<0) bx=x;
  // shadow
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(x+4,GROUND_Y-4,player.w,6);
  // legs - jeans blue
  ctx.fillStyle='#1e3a5a'; ctx.fillRect(x+4,y+28,10,16); ctx.fillRect(x+14,y+28,10,16);
  ctx.fillStyle='#4a2d0a'; ctx.fillRect(x+2,y+40,12,6); ctx.fillRect(x+14,y+40,12,6);
  // torso - NO SHIRT! skin
  ctx.fillStyle='#f3c08a'; ctx.fillRect(x+4,y+12,20,18);
  // chest muscles
  ctx.fillStyle='#e7a76a'; ctx.fillRect(x+6,y+14,8,5); ctx.fillRect(x+14,y+14,8,5);
  ctx.fillStyle='#000'; ctx.fillRect(x+4,y+12,20,2);
  // arms muscle
  ctx.fillStyle='#f3c08a';
  let armX = player.dir>0? x+18 : x+2;
  ctx.fillRect(armX,y+12,16,8); // holding gun arm
  ctx.fillRect(x+2,y+10,8,16);
  // headband red from foto
  ctx.fillStyle='#e7c28a'; ctx.fillRect(x+8,y+0,16,16);
  ctx.fillStyle='#ff2222'; ctx.fillRect(x+4,y+6,22,5);
  ctx.fillStyle='#ff2222'; ctx.fillRect(x-2,y+8,8,3); // tail
  ctx.fillStyle='#4b2a0a'; ctx.fillRect(x+8,y+2,14,4); // hair
  // face
  ctx.fillStyle='#000'; ctx.fillRect(x+18,y+10,2,2);
  ctx.fillStyle='#7a4a22'; ctx.fillRect(x+20,y+12,4,2); // moustache
  // big gun
  ctx.fillStyle='#3a3a44'; ctx.fillRect(x+16,y+18,28,6);
  ctx.fillStyle='#6aaaff'; ctx.fillRect(x+24,y+19,14,3);
  ctx.fillStyle='#222'; ctx.fillRect(x+38,y+16,12,10);
  ctx.fillStyle='#ffff66'; if(Math.random()<0.3 && keys[' ']){ctx.fillRect(x+48,y+18,10,4);}
  ctx.restore();
  }
}

function drawEnemies(){
  for(let e of enemies){
    if(!e.alive) continue;
    const x=e.x-camX, y=e.y;
    ctx.fillStyle='rgba(0,0,0,.2)'; ctx.fillRect(x+2,GROUND_Y-4,e.w,5);
    // green army
    ctx.fillStyle='#3a782a'; ctx.fillRect(x,y,e.w,e.h-12);
    ctx.fillStyle='#2d5f22'; ctx.fillRect(x+2,y+e.h-12,e.w-4,12);
    ctx.fillStyle='#6ab24b'; ctx.fillRect(x+4,y+2,e.w-8,6);
    ctx.fillStyle='#3b2a1a'; ctx.fillRect(x+2,y+e.h-6,e.w-4,6);
    // helmet
    ctx.fillStyle='#2f6a24'; ctx.fillRect(x+4,y-6, e.w-8,8);
    ctx.fillStyle='#000'; ctx.fillRect(x+10,y-2,2,2);
    if(e.type===1 && e.state==='hide'){ctx.fillStyle='#9aa0a8'; ctx.fillRect(x-6,y-10,e.w+12,e.h+6); ctx.fillStyle='#000'; ctx.fillRect(x+2,y-4,8,2);}
    else{
      // gun shooting yellow bullet direction left
      ctx.fillStyle='#222'; ctx.fillRect(x-12,y+10,12,4);
      if(e.shootCd<10){ctx.fillStyle='#ffff00'; ctx.fillRect(x-16,y+10,6,4);}
    }
  }
}

function drawBullets(){
  ctx.fillStyle='#00ffff';
  for(let b of bullets){const x=b.x-camX; ctx.fillStyle='#e0ffff'; ctx.fillRect(x,b.y,b.w,b.h); ctx.fillStyle='#00ddff'; ctx.fillRect(x+6,b.y+1,6,2);}
  for(let b of eBullets){const x=b.x-camX; ctx.fillStyle='#ffff00'; ctx.beginPath(); ctx.arc(x+b.w/2,b.y+3,4.5,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#ff8800'; ctx.fillRect(x,b.y+1,4,4);}
}

function drawPowerups(){
  for(let p of powerups){const x=p.x-camX, y=p.y + Math.sin(p.t)*4;
    ctx.fillStyle='#8a2be2'; ctx.fillRect(x,y,p.w,p.h); ctx.fillStyle='#000'; ctx.fillRect(x,y,p.w,p.h); ctx.fillStyle='#8a2be2'; ctx.fillRect(x+2,y+2,p.w-4,p.h-4);
    ctx.fillStyle='#ffff00'; ctx.font='bold 16px Press Start 2P'; ctx.fillText('F',x+6,y+17);
    ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fillRect(x+2,y+2,6,6);
  }
}
function drawParticles(){
  for(let pr of particles){const x=pr.x-camX; ctx.fillStyle=pr.color; ctx.globalAlpha=1-pr.t/pr.life; ctx.fillRect(x,y=pr.y-pr.t*0.1,pr.size,pr.size); }
  ctx.globalAlpha=1;
}
function loop(){
  requestAnimationFrame(loop);
  update();
  drawBackground(); drawPowerups(); drawEnemies(); drawBullets(); drawPlayer(); drawParticles();
}

function gameOver(win){
  gameState='over';
  const ov=document.getElementById('overlay');
  ov.style.display='flex';
  ov.innerHTML= win ? `<h1 style="color:#00ff88">MISI SELESAI!<br>ALWI MENANG!</h1><p>Kamu telah kalahkan 15 tentara musuh!<br>Skor Akhir: ${score}<br><br><span style="color:#ffff00">CONTRA RAMBO LEVEL 3 CLEARED</span></p><button id="startBtn" onclick="location.reload()">▶ MAIN LAGI</button>` 
  : `<h1 style="color:#ff2244">GAME OVER<br>ALWI GUGUR</h1><p>Kill: ${kills}/15<br>Skor: ${score}<br><br>Coba lagi, prajurit!</p><button id="startBtn" onclick="location.reload()">↻ COBA LAGI</button>`;
}

// input handlers
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); keys[k]=true;
  if(k===' ' ) e.preventDefault();
  if((k==='w'||k==='arrowup')&& gameState==='menu'){/* will start via button */}
});
window.addEventListener('keyup',e=> keys[e.key.toLowerCase()]=false);
document.getElementById('startBtn').addEventListener('click',()=>{ document.getElementById('overlay').style.display='none'; gameState='play'; resetGame(); });
document.querySelectorAll('.btn').forEach(b=>{ const kk=b.dataset.k; b.addEventListener('touchstart',ev=>{ev.preventDefault(); keys[kk==='left'?'a':kk==='right'?'d':kk==='up'?'w':' ']=true}); b.addEventListener('touchend',ev=>{keys[kk==='left'?'a':kk==='right'?'d':kk==='up'?'w':' ']=false}); b.addEventListener('mousedown',()=>keys[kk==='left'?'a':kk==='right'?'d':kk==='up'?'w':' ']=true); b.addEventListener('mouseup',()=>keys[kk==='left'?'a':kk==='right'?'d':kk==='up'?'w':' ']=false); });
document.querySelectorAll('.tBtn').forEach(b=>{ const map={left:'a',right:'d',up:'w',fire:' '}; const kk=map[b.dataset.t]; b.addEventListener('touchstart',ev=>{ev.preventDefault(); keys[kk]=true; b.classList.add('active')}); b.addEventListener('touchend',ev=>{keys[kk]=false; b.classList.remove('active')}); });

resetGame();
loop();
