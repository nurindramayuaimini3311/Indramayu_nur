<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LEVEL 5 - BOSS FINAL - ALWI vs LABA-LABA ROBOT ES</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}
body{background:#0b162c;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;min-height:100vh;font-family:'Press Start 2P',monospace;overflow-x:hidden;overflow-y:auto;padding-top:8px}
#gameWrap{position:relative;width:100%;max-width:900px;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center}
canvas{width:100%;height:100%;image-rendering:pixelated;border:4px solid #ffae00;box-shadow:0 0 30px #00d5ff, inset 0 0 0 4px #000;background:linear-gradient(#3ab2ff 0%, #6ecfff 40%, #0a1a3a 70%);}
#hud{position:absolute;top:0;left:0;width:100%;display:flex;justify-content:space-between;padding:8px 12px;color:#fff;text-shadow:2px 2px 0 #000;font-size:10px;pointer-events:none;z-index:5;line-height:14px}
#hudRight{text-align:right}
.bossbar{position:absolute;top:42px;left:50%;transform:translateX(-50%);width:60%;height:18px;background:#000;border:2px solid #fff;z-index:5}
.bossbar-fill{height:100%;width:100%;background:linear-gradient(90deg,#00e5ff,#0080ff);transition:width .2s}
.bossbar span{position:absolute;top:-14px;left:50%;transform:translateX(-50%);color:#ffeb00;font-size:8px;white-space:nowrap;text-shadow:2px 2px 0 #000}
#controls{position:relative;width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 14px;z-index:10;pointer-events:none;background:rgba(0,0,0,.35);border-radius:18px;border:3px solid #ffae00}
.ctrl-group{display:flex;gap:8px;pointer-events:auto}
.ctrl-btn{width:56px;height:56px;border-radius:12px;border:3px solid #fff;background:rgba(0,0,0,.45);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;font-family:inherit;backdrop-filter:blur(2px)}
.ctrl-btn:active{background:rgba(255,255,255,.4);transform:scale(.95)}
.ctrl-btn.shoot{width:76px;height:76px;background:rgba(255,80,0,.55);border-color:#ffcc00}
#centerMsg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);border:4px solid #fff;padding:24px 18px;color:#fff;text-align:center;z-index:20;display:none;min-width:70%}
#centerMsg h1{font-size:16px;color:#ffe600;margin-bottom:12px;line-height:20px}
#centerMsg p{font-size:10px;margin:8px 0;line-height:14px}
#centerMsg button{margin-top:14px;padding:10px 18px;font-family:inherit;font-size:10px;background:#ff3000;color:#fff;border:3px solid #fff;cursor:pointer}
#centerMsg button:hover{background:#fff;color:#000}
@media(max-width:600px){.ctrl-btn{width:48px;height:48px}.ctrl-btn.shoot{width:68px;height:68px}#hud{font-size:8px}}
</style>
</head>
<body>
<div id="gameWrap">
<canvas id="c" width="800" height="600"></canvas>
<div id="hud">
<div>LEVEL 5 - BOSS FINAL<br><span style="color:#ffae00">HERO: ALWI</span><br>NYAWA: <span id="livesTxt">❤❤❤</span></div>
<div id="hudRight">SKOR: <span id="scoreTxt">0</span><br>ICE DODGED: <span id="dodgeTxt">0</span></div>
</div>
<div class="bossbar"><span>👾 LABA-LABA ROBOT ES - KRISTAL BIRU ☢</span><div id="bossFill" class="bossbar-fill"></div></div>
<div id="centerMsg">
<h1 id="msgTitle">LEVEL 5 BOSS FINAL</h1>
<p id="msgBody">Kalahkan Laba-laba Robot Es! Tembak kristal biru di tengah dadanya! Hindari peluru es dari 8 tangannya!</p>
<button id="msgBtn">MULAI TEMBAK!</button>
</div>
</div>
<div id="controls">
<div class="ctrl-group">
<button class="ctrl-btn" id="bLeft">◀</button>
<button class="ctrl-group"></button>
<button class="ctrl-btn" id="bRight">▶</button>
</div>
<div class="ctrl-group" style="align-items:flex-end">
<button class="ctrl-btn" id="bJump">⤴</button>
<button class="ctrl-btn shoot" id="bShoot">🔫</button>
</div>
</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=800,H=600;
let keys={}, score=0, dodged=0, gameState='menu'; // menu, play, win, lose
let bossHP=100, bossMax=100, shake=0;
const livesMax=3; let lives=3;

// Player Alwi
const player={x:350,y:520,w:36,h:48,vx:0,vy:0,speed:5.5,jump:-14,grounded:false,dir:1,cool:0};

// Platforms - ground + 2 floating for dodge
const platforms=[{x:0,y:580,w:800,h:20},{x:80,y:460,w:140,h:14},{x:580,y:460,w:140,h:14}];

// Projectiles
let pBullets=[], eBullets=[], particles=[], floatingTexts=[];

// Boss
const boss={
 x:W/2,y:160,w:300,h:220,
 phase:0, // 0-7 hand index
 timer:0,
 moveDir:1,
 crystal:{x:W/2,y:190,w:46,h:54,hitTimer:0}
};

function reset(){
 bossHP=bossMax; lives=livesMax; score=0; dodged=0; pBullets=[]; eBullets=[]; particles=[]; floatingTexts=[];
 player.x=364; player.y=500; player.vx=0; player.vy=0;
 boss.phase=0; boss.timer=0; boss.x=W/2; gameState='play'; shake=0;
}

function rectColl(a,b){return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;}

function spawnParticle(x,y,color,ang,speed,life){particles.push({x,y,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,life,maxLife:life,color,sz:Math.random()*4+2})}
function spawnText(x,y,t,color='#fff'){floatingTexts.push({x,y,t,color,life:60,vy:-1.2})}

// Input
window.addEventListener('keydown',e=>{keys[e.code]=true; if(['Space','ArrowUp','KeyW'].includes(e.code)) e.preventDefault();});
window.addEventListener('keyup',e=>keys[e.code]=false);
function bindBtn(id,code){const el=document.getElementById(id); const down=e=>{e.preventDefault();keys[code]=true}; const up=e=>{keys[code]=false}; el.addEventListener('touchstart',down,{passive:false}); el.addEventListener('touchend',up); el.addEventListener('mousedown',down); el.addEventListener('mouseup',up); el.addEventListener('mouseleave',up);}
bindBtn('bLeft','ArrowLeft'); bindBtn('bRight','ArrowRight'); bindBtn('bJump','ArrowUp'); bindBtn('bShoot','Space');

let stars=[]; for(let i=0;i<80;i++) stars.push({x:Math.random()*W,y:Math.random()*H*0.6,s:Math.random()*2+1,tw:Math.random()*6});

function update(){
 if(gameState!=='play') return;
 // player move
 let mv=(keys['ArrowLeft']||keys['KeyA']?-1:0)+(keys['ArrowRight']||keys['KeyD']?1:0);
 player.vx=mv*player.speed;
 if(mv) player.dir=mv;
 player.vy+=0.85;
 if((keys['ArrowUp']||keys['KeyW']) && player.grounded){player.vy=player.jump;player.grounded=false;}

 player.x+=player.vx;
 player.x=Math.max(0,Math.min(W-player.w,player.x));
 player.y+=player.vy;
 // collisions platforms
 player.grounded=false;
 for(let pl of platforms){
   if(player.vy>=0 && player.y+player.h>pl.y && player.y+player.h<pl.y+pl.h+16 && player.x+player.w>pl.x && player.x<pl.x+pl.w){
     player.y=pl.y-player.h; player.vy=0; player.grounded=true;
   }
 }
 // boss movement slow
 boss.x+=boss.moveDir*0.6; if(boss.x<200||boss.x>W-200) boss.moveDir*=-1;
 boss.crystal.x=boss.x; boss.crystal.y=boss.y+30;

 // shooting player
 if(player.cool>0) player.cool--;
 if(keys['Space'] && player.cool<=0){pBullets.push({x:player.x+player.w/2-3,y:player.y, vx:0, vy:-12, w:6,h:14, dmg:2}); player.cool=10; }

 // boss attack - each hand shoots alternately
 boss.timer++;
 if(boss.timer>28){
   boss.timer=0;
   let legIndex=boss.phase%bossLegs.length;
   let leg=bossLegs[legIndex];
   let sx=boss.x+leg.dx, sy=boss.y+leg.dy;
   // aim at player
   let tx=player.x+player.w/2, ty=player.y+player.h/2;
   let ang=Math.atan2(ty-sy,tx-sx);
   let spd=3.2+Math.random()*1.2 + bossHP<50?1:0;
   eBullets.push({x:sx,y:sy,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,w:12,h:12,rot:0,active:true});
   boss.phase=(boss.phase+1)%bossLegs.length;
   // occasionally double shot when low HP
   if(bossHP<40 && Math.random()<0.4){
     let leg2=bossLegs[(legIndex+4)%8];
     let sx2=boss.x+leg2.dx; let sy2=boss.y+leg2.dy;
     let ang2=Math.atan2(ty-sy2,tx-sx2);
     eBullets.push({x:sx2,y:sy2,vx:Math.cos(ang2)*spd,vy:Math.sin(ang2)*spd,w:12,h:12,rot:0,active:true});
   }
 }

 // update bullets
 for(let i=pBullets.length-1;i>=0;i--){
   let b=pBullets[i]; b.y+=b.vy; b.x+=b.vx;
   if(b.y<-30){pBullets.splice(i,1);continue;}
   // hit crystal
   let c=boss.crystal;
   let cr={x:c.x-c.w/2,y:c.y-c.h/2,w:c.w,h:c.h};
   if(rectColl(b,cr)){
     bossHP-= (Math.random()<0.2?3:b.dmg); // crit
     if(bossHP<0) bossHP=0;
     c.hitTimer=10;
     pBullets.splice(i,1);
     score+=50;
     for(let k=0;k<6;k++) spawnParticle(c.x+(Math.random()-.5)*20,c.y+(Math.random()-.5)*15,'#66e0ff',Math.random()*6.28,Math.random()*3+2,20);
     spawnText(c.x,cr.y-10,'-2','cyan');
     shake=8;
     if(bossHP<=0){winGame();}
     continue;
   }
   // hit boss body reduce less? Only crystal counts - but allow
   let body={x:boss.x-boss.w/2,y:boss.y-boss.h/2+10,w:boss.w,h:boss.h};
   if(rectColl(b,body)){pBullets.splice(i,1); for(let k=0;k<3;k++) spawnParticle(b.x,b.y,'#ffaa00',Math.random()*6.28,2,12); }
 }

 for(let i=eBullets.length-1;i>=0;i--){
   let b=eBullets[i]; b.x+=b.vx; b.y+=b.vy; b.rot+=0.25;
   if(b.y>H+30||b.x<-30||b.x>W+30){eBullets.splice(i,1);dodged++; score+=10; continue;}
   if(rectColl(b,{x:player.x+6,y:player.y+6,w:player.w-12,h:player.h-6})){
     eBullets.splice(i,1);
     lives--; shake=18;
     for(let k=0;k<12;k++) spawnParticle(player.x+player.w/2,player.y+player.h/2,'#00d4ff',Math.random()*6.28,Math.random()*5+1,24);
     spawnText(player.x,player.y-16,'OUCH!','white');
     if(lives<=0) loseGame();
   }
 }

 // particles
 for(let i=particles.length-1;i>=0;i--){let p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--; if(p.life<=0) particles.splice(i,1);}
 for(let f of floatingTexts){f.y+=f.vy; f.life--;}
 floatingTexts=floatingTexts.filter(f=>f.life>0);

 // UI
 document.getElementById('bossFill').style.width=(bossHP/bossMax*100)+'%';
 document.getElementById('scoreTxt').textContent=score;
 document.getElementById('dodgeTxt').textContent=dodged;
 document.getElementById('livesTxt').textContent='❤'.repeat(lives)+'♡'.repeat(livesMax-lives);
}

const bossLegs=[
 {dx:-140,dy:-60},{dx:-175,dy:-10},{dx:-150,dy:40},{dx:-115,dy:95},
 {dx:115,dy:95},{dx:150,dy:40},{dx:175,dy:-10},{dx:140,dy:-60}
];

function drawBoss(){
 ctx.save();
 ctx.translate(boss.x,boss.y);
 // shadow
 ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0,90,110,22,0,0,6.28); ctx.fill();
 // legs - 8 arms
 for(let i=0;i<8;i++){
   let leg=bossLegs[i];
   let isActive=(boss.phase===i);
   ctx.save();
   ctx.translate(0,0);
   // leg segments: body to tip
   ctx.strokeStyle=isActive?'#ffffff':'#ff7a00';
   ctx.lineWidth=isActive?7:5;
   ctx.lineCap='round';
   let mx=leg.dx*0.55, my=leg.dy*0.45-10;
   ctx.beginPath(); ctx.moveTo(isActive?5*Math.random():0,10); ctx.quadraticCurveTo(mx,my,leg.dx,leg.dy); ctx.stroke();
   // joints
   ctx.fillStyle='#1a1a1a';
   ctx.beginPath(); ctx.arc(mx,my,8,0,6.28); ctx.fill();
   ctx.strokeStyle='#ff7a00'; ctx.lineWidth=2; ctx.stroke();
   // tip - ice emitter
   let glow=isActive?20:12;
   ctx.shadowColor='#00e5ff'; ctx.shadowBlur=glow;
   ctx.fillStyle='#aef6ff';
   ctx.beginPath(); ctx.arc(leg.dx,leg.dy, isActive?10:7,0,6.28); ctx.fill();
   ctx.shadowBlur=0;
   // ice spark
   if(isActive || Math.random()<0.05){
     ctx.fillStyle='rgba(150,230,255,.7)'; ctx.beginPath(); ctx.arc(leg.dx+(Math.random()-.5)*12, leg.dy+(Math.random()-.5)*12,2,0,6.28); ctx.fill();
   }
   ctx.restore();
 }
 // body main black
 ctx.fillStyle='#0e0e12';
 ctx.strokeStyle='#ff7a00'; ctx.lineWidth=3;
 ctx.beginPath(); 
 // pixel-ish abdomen shape
 ctx.moveTo(-70,-35); ctx.lineTo(70,-35); ctx.lineTo(80,10); ctx.lineTo(90,70); ctx.lineTo(50,100); ctx.lineTo(-50,100); ctx.lineTo(-90,70); ctx.lineTo(-80,10); ctx.closePath();
 ctx.fill(); ctx.stroke();
 // orange stripes
 ctx.fillStyle='#ff7a00';
 ctx.fillRect(-55,45,30,10); ctx.fillRect(25,45,30,10);
 ctx.fillRect(-60,25,25,8); ctx.fillRect(35,25,25,8);
 // chest top part
 ctx.fillStyle='#101014'; ctx.fillRect(-60,-70,120,50);
 ctx.strokeStyle='#ff7a00'; ctx.strokeRect(-60,-70,120,50);
 // eyes
 ctx.fillStyle='#ff8c00'; ctx.beginPath(); ctx.arc(-18,-60,8,0,6.28); ctx.arc(18,-60,8,0,6.28); ctx.fill();
 // crown spikes
 ctx.fillStyle='#2a2a30'; ctx.fillRect(-12,-78,6,14); ctx.fillRect(6,-78,6,14);
 // CRYSTAL BLUE ICE core
 let c=boss.crystal; let hit=boss.crystal.hitTimer>0;
 if(boss.crystal.hitTimer>0) boss.crystal.hitTimer--;
 ctx.save();
 ctx.translate(0,35);
 if(hit){ctx.shadowColor='#00ffff'; ctx.shadowBlur=30;}
 // ice block
 ctx.fillStyle='#122a44';
 ctx.beginPath(); ctx.moveTo(-22,-26); ctx.lineTo(22,-26); ctx.lineTo(28,0); ctx.lineTo(22,26); ctx.lineTo(-22,26); ctx.lineTo(-28,0); ctx.closePath(); ctx.fill();
 ctx.strokeStyle='#4ecaff'; ctx.lineWidth=2; ctx.stroke();
 // inner crystal
 let pulse=Math.sin(Date.now()*0.006)*4;
 ctx.fillStyle=hit?'#ffffff':'#7af2ff';
 ctx.beginPath(); ctx.moveTo(0,-20-pulse*0.3); ctx.lineTo(14,-5); ctx.lineTo(10,14); ctx.lineTo(0,20+pulse*0.3); ctx.lineTo(-10,14); ctx.lineTo(-14,-5); ctx.closePath(); ctx.fill();
 ctx.fillStyle='#e1ffff'; ctx.beginPath(); ctx.arc(0,0,6+pulse*0.2,0,6.28); ctx.fill();
 ctx.shadowBlur=0;
 // frozen icicles
 ctx.fillStyle='rgba(150,230,255,.8)';
 for(let k=-1;k<=1;k++){ctx.beginPath(); ctx.moveTo(k*16,22); ctx.lineTo(k*16+4,38+Math.random()*6); ctx.lineTo(k*16-4,38); ctx.closePath(); ctx.fill();}
 ctx.restore();
 ctx.restore();
}

function drawPlayer(){
 ctx.save();
 ctx.translate(player.x+player.w/2, player.y+player.h/2);
 ctx.scale(player.dir,1);
 // shadow
 ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(-14,18,28,6);
 // feet brown boots
 ctx.fillStyle='#6b3a17'; ctx.fillRect(-12,14,10,8); ctx.fillRect(2,14,10,8);
 // jeans blue
 ctx.fillStyle='#2d5a96'; ctx.fillRect(-12,6,24,12);
 // shirt orange (Alwi iconic)
 ctx.fillStyle='#ff7d00'; ctx.fillRect(-14,-8,28,16);
 // mustache
 ctx.fillStyle='#3a1f00'; ctx.fillRect(-5,-10,10,3);
 // skin
 ctx.fillStyle='#f0b88a'; ctx.fillRect(-8,-18,16,10);
 // red bandana
 ctx.fillStyle='#ff1a1a'; ctx.fillRect(-10,-20,20,6); ctx.fillRect(10,-18,8,3);
 // gun
 ctx.fillStyle='#4a4e54'; ctx.fillRect(6,-6,26,6); ctx.fillStyle='#00e5ff'; ctx.fillRect(28,-5,8,4);
 if(player.cool>5){ctx.fillStyle='#ffff66'; ctx.beginPath(); ctx.arc(36,-3,6,0,6.28); ctx.fill();}
 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 // background bright sky - not dark - but boss area darker? Requirement terang biru langit
 ctx.fillStyle='#5ec8ff'; ctx.fillRect(0,0,W,H*0.55);
 let grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,'#87dbff'); grad.addColorStop(0.4,'#3aaaff'); grad.addColorStop(0.55,'#0a2a55'); grad.addColorStop(1,'#08152f');
 ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
 // clouds bright
 ctx.fillStyle='rgba(255,255,255,.9)';
 for(let i=0;i<3;i++){let cx=(Date.now()*0.02+i*300)%(W+200)-100; ctx.beginPath(); ctx.arc(cx,70+i*20,24,0,6.28); ctx.arc(cx+22,68+i*20,18,0,6.28); ctx.arc(cx-18,72+i*20,16,0,6.28); ctx.fill();}
 // stars
 ctx.fillStyle='#aee8ff'; for(let s of stars){let a=0.5+Math.sin(Date.now()*0.002+s.tw)*0.5; ctx.globalAlpha=a; ctx.fillRect(s.x,s.y,s.s,s.s);} ctx.globalAlpha=1;

 if(shake>0){ctx.save(); ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake); shake*=0.9;}

 // platforms
 ctx.fillStyle='#1a1a1a'; ctx.strokeStyle='#ff7a00'; ctx.lineWidth=3;
 for(let pl of platforms){ctx.fillRect(pl.x,pl.y,pl.w,pl.h); ctx.strokeRect(pl.x,pl.y,pl.w,pl.h);}

 drawBoss();

 // bullets
 for(let b of pBullets){ctx.fillStyle='#ffff00'; ctx.shadowColor='#ff0'; ctx.shadowBlur=10; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.shadowBlur=0;}
 for(let b of eBullets){
   ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot);
   let g=ctx.createRadialGradient(0,0,1,0,0,7); g.addColorStop(0,'#e0ffff'); g.addColorStop(0.5,'#00c8ff'); g.addColorStop(1,'#004a66');
   ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,6,0,6.28); ctx.fill();
   ctx.strokeStyle='#aaffff'; ctx.lineWidth=1.5; ctx.stroke();
   ctx.restore();
   // trail
   ctx.fillStyle='rgba(0,200,255,.25)'; ctx.beginPath(); ctx.arc(b.x-b.vx,b.y-b.vy,4,0,6.28); ctx.fill();
 }

 drawPlayer();

 // particles
 for(let p of particles){ctx.globalAlpha=p.life/p.maxLife; ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,p.sz,p.sz);}
 ctx.globalAlpha=1;
 for(let f of floatingTexts){ctx.globalAlpha=f.life/60; ctx.fillStyle=f.color; ctx.font='bold 12px \"Press Start 2P\"'; ctx.fillText(f.t,f.x,f.y);} ctx.globalAlpha=1;

 if(shake>0) ctx.restore();
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();

function showMsg(title,body,btn){document.getElementById('msgTitle').textContent=title; document.getElementById('msgBody').textContent=body; document.getElementById('msgBtn').textContent=btn; document.getElementById('centerMsg').style.display='block';}
function hideMsg(){document.getElementById('centerMsg').style.display='none';}
showMsg('LEVEL 5 - BOSS FINAL','ALWI VS LABA-LABA ROBOT ES RAKSASA! 8 TANGAN, 100 HP! Tembak kristal biru es di dada! Hindari peluru es!','GAS POL! 🔫');

document.getElementById('msgBtn').addEventListener('click',()=>{
 if(gameState==='menu' || gameState==='play'){reset(); hideMsg(); return;}
 if(gameState==='win'){reset(); hideMsg();}
 if(gameState==='lose'){reset(); hideMsg();}
});

function winGame(){
 gameState='win'; score+=1000;
 // explosion
 for(let i=0;i<80;i++) spawnParticle(boss.x+(Math.random()-.5)*120,boss.y+(Math.random()-.5)*80,'#ff'+Math.floor(Math.random()*255).toString(16).padStart(2,'0')+'00',Math.random()*6.28,Math.random()*8+2,60);
 showMsg('BOSS HANCUR! 🎉','ALWI MENANG! Kristal biru es meledak! Laba-laba robot 8 tangan kalah! Skor akhir: '+score+' - KAMU LEGENDA!','MAIN LAGI!');
}
function loseGame(){
 gameState='lose';
 showMsg('ALWI KENA ES! 🥶','Nyawa habis terkena peluru es biru! Coba lagi hindari tembakan 8 tangannya dan fokus ke kristal!','COBA LAGI!');
}
</script><script src="../alwi_bubble4.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script></body>
</html>
