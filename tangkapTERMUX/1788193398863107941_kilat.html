<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comet Survival - Light Trail Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050811;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 100vw;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background: #000000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 229, 255, 0.15);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }

        /* Netflix Style Header Bar */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00e5ff, #3fa9f5, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .game-subtitle {
            font-size: 9px;
            color: #00e5ff;
            letter-spacing: 3px;
            opacity: 0.8;
        }

        .stats-group {
            display: flex;
            gap: 15px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat-label {
            font-size: 9px;
            color: #888;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #00e5ff;
            font-family: monospace;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #050811;
        }

        /* Overlay Touch Controller */
        .touch-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            display: flex;
            z-index: 20;
        }

        .touch-zone {
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 25px;
            background: rgba(0, 0, 0, 0.01);
            transition: background 0.1s ease;
        }

        .touch-zone:active {
            background: rgba(0, 229, 255, 0.05);
        }

        .touch-hint {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header-bar">
        <div class="title-group">
            <div class="game-title">INDRAMAYU CLUB</div>
            <div class="game-subtitle">SYSTEM ONLINE</div>
        </div>
        <div class="stats-group">
            <div class="stat-box">
                <span class="stat-label">SCORE</span>
                <span class="stat-value" id="scoreVal">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">HIGH</span>
                <span class="stat-value" id="highVal">0</span>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="touch-overlay">
        <div class="touch-zone" id="touchLeft">
            <div class="touch-hint">◄ KIRI</div>
        </div>
        <div class="touch-zone" id="touchRight">
            <div class="touch-hint">KANAN ►</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let width, height, groundY;

    function resize() {
        const container = canvas.parentElement;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        width = canvas.width;
        height = canvas.height;
        groundY = height - 60;
    }
    window.addEventListener("resize", resize);
    resize();

    // Game Variables
    let score = 0;
    let highScore = 0;

    // Input Controller (Touch & Keyboard support)
    const input = { left: false, right: false };

    const btnLeft = document.getElementById("touchLeft");
    const btnRight = document.getElementById("touchRight");

    // Touch Event Listeners
    btnLeft.addEventListener("touchstart", (e) => { e.preventDefault(); input.left = true; });
    btnLeft.addEventListener("touchend", (e) => { e.preventDefault(); input.left = false; });
    btnRight.addEventListener("touchstart", (e) => { e.preventDefault(); input.right = true; });
    btnRight.addEventListener("touchend", (e) => { e.preventDefault(); input.right = false; });

    // Keyboard Support
    window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a") input.left = true;
        if (e.key === "ArrowRight" || e.key === "d") input.right = true;
    });
    window.addEventListener("keyup", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a") input.left = false;
        if (e.key === "ArrowRight" || e.key === "d") input.right = false;
    });

    // Player Object
    class Player {
        constructor() {
            this.x = width / 2;
            this.y = groundY;
            this.vx = 0;
            this.speed = 8.5;
            this.friction = 0.82;
            this.size = 18;
        }

        update() {
            if (input.left) this.vx -= this.speed * 0.35;
            if (input.right) this.vx += this.speed * 0.35;

            this.vx *= this.friction;
            this.x += this.vx;

            if (this.x < 20) { this.x = 20; this.vx = 0; }
            if (this.x > width - 20) { this.x = width - 20; this.vx = 0; }
        }

        draw(ctx) {
            // 1. EFEK LIGHT TRAIL & GLOW CYAN / BIRU NEON
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            ctx.shadowColor = "#00e5ff";
            ctx.shadowBlur = 25;
            ctx.fillStyle = "#3fa9f5";
            
            ctx.beginPath();
            ctx.arc(this.x, this.y - 15, 8, 0, Math.PI * 2);
            ctx.fill();

            if (Math.abs(this.vx) > 1) {
                ctx.beginPath();
                ctx.arc(this.x - this.vx * 2, this.y - 15, 12, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(0, 229, 255, 0.4)";
                ctx.fill();
            }
            ctx.restore();

            // 2. STICKMAN PLAYER
            ctx.save();
            ctx.globalCompositeOperation = "source-over";
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2.5;
            ctx.lineCap = "round";

            const px = this.x;
            const py = this.y;

            // Kepala
            ctx.beginPath();
            ctx.arc(px, py - 30, 6, 0, Math.PI * 2);
            ctx.stroke();

            // Badan
            ctx.beginPath();
            ctx.moveTo(px, py - 24);
            ctx.lineTo(px, py - 10);
            ctx.stroke();

            // Kaki
            const legOffset = Math.sin(Date.now() * 0.02) * Math.min(Math.abs(this.vx) * 2, 10);
            ctx.beginPath();
            ctx.moveTo(px, py - 10);
            ctx.lineTo(px - 6 + legOffset, py);
            ctx.moveTo(px, py - 10);
            ctx.lineTo(px + 6 - legOffset, py);
            ctx.stroke();

            // Tangan
            ctx.beginPath();
            ctx.moveTo(px, py - 20);
            ctx.lineTo(px - 8 - legOffset * 0.5, py - 12);
            ctx.moveTo(px, py - 20);
            ctx.lineTo(px + 8 + legOffset * 0.5, py - 12);
            ctx.stroke();

            ctx.restore();
        }
    }

    // Comet Class
    class Comet {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * (width - 40) + 20;
            this.y = -20;
            this.r = Math.random() * 12 + 10;
            this.vy = Math.random() * 4 + 4;
            this.vx = (Math.random() - 0.5) * 2;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;

            if (this.y > groundY) {
                this.reset();
                score += 10;
                document.getElementById("scoreVal").innerText = score;
                if (score > highScore) {
                    highScore = score;
                    document.getElementById("highVal").innerText = highScore;
                }
            }
        }

        draw(ctx) {
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            ctx.shadowColor = "#ff5500";
            ctx.shadowBlur = 20;
            ctx.fillStyle = "#ffaa00";

            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x - this.vx * 5, this.y - this.vy * 5);
            ctx.strokeStyle = "rgba(255, 85, 0, 0.5)";
            ctx.lineWidth = this.r;
            ctx.stroke();

            ctx.restore();
        }
    }

    const player = new Player();
    const comets = [new Comet(), new Comet(), new Comet()];

    function clear(ctx, w, h) {
        ctx.fillStyle = "rgba(5, 8, 17, 0.22)";
        ctx.fillRect(0, 0, w, h);
    }

    function drawGround() {
        ctx.save();
        ctx.strokeStyle = "rgba(0, 229, 255, 0.3)";
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(width, groundY);
        ctx.stroke();

        ctx.strokeStyle = "rgba(0, 229, 255, 0.05)";
        for (let x = 0; x < width; x += 30) {
            ctx.beginPath();
            ctx.moveTo(x, groundY);
            ctx.lineTo(x, height);
            ctx.stroke();
        }
        ctx.restore();
    }

    function loop() {
        clear(ctx, width, height);
        drawGround();

        player.update();
        player.draw(ctx);

        comets.forEach(comet => {
            comet.update();
            comet.draw(ctx);

            const dx = comet.x - player.x;
            const dy = comet.y - (player.y - 15);
            const dist = Math.hypot(dx, dy);

            if (dist < comet.r + 10) {
                ctx.fillStyle = "rgba(255, 0, 0, 0.4)";
                ctx.fillRect(0, 0, width, height);
                score = 0;
                document.getElementById("scoreVal").innerText = score;
                comet.reset();
            }
        });

        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
