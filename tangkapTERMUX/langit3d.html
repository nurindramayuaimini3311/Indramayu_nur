<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Observatorium Alwi — Langit 3D Indramayu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

  :root{
    --void:#07070c;
    --void2:#0d0d16;
    --gold:#c9a24b;
    --gold-bright:#f2d17d;
    --brass:#8a6d2f;
    --ink:#e8e1cf;
    --dim:#7c7666;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--void);
    font-family:'EB Garamond', serif;
    color:var(--ink);
  }
  #sky{ position:fixed; inset:0; }

  /* batik ring vignette */
  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:
      radial-gradient(ellipse at center, transparent 55%, rgba(7,7,12,0.85) 100%);
  }
  .batik-frame{
    position:fixed; inset:0; pointer-events:none; z-index:6;
    border: 1px solid rgba(201,162,75,0.25);
    margin:10px;
  }
  .batik-frame::before, .batik-frame::after{
    content:''; position:absolute; width:26px; height:26px;
    border:1px solid var(--gold); opacity:0.55;
  }
  .batik-frame::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .batik-frame::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }

  header{
    position:fixed; top:0; left:0; right:0; z-index:10;
    padding:22px 28px 14px;
    display:flex; align-items:baseline; justify-content:space-between;
    pointer-events:none;
  }
  header .eyebrow{
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:0.32em;
    color:var(--brass); text-transform:uppercase;
  }
  header h1{
    font-family:'Cinzel', serif; font-weight:700; font-size:22px;
    margin:4px 0 0; letter-spacing:0.03em; color:var(--gold-bright);
    text-shadow:0 0 18px rgba(242,209,125,0.35);
  }
  header .sub{
    font-style:italic; color:var(--dim); font-size:13px; margin-top:4px;
  }

  #hud{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    padding:14px 20px 18px;
    display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;
    justify-content:space-between;
  }
  .panel{
    background:linear-gradient(180deg, rgba(13,13,22,0.92), rgba(7,7,12,0.96));
    border:1px solid rgba(201,162,75,0.35);
    padding:10px 14px;
    min-width:150px;
    backdrop-filter:blur(4px);
  }
  .panel .label{
    font-family:'Cinzel',serif; font-size:9px; letter-spacing:0.18em;
    color:var(--brass); text-transform:uppercase; margin-bottom:3px;
  }
  .panel .val{ font-size:15px; color:var(--ink); }
  .panel .val.gold{ color:var(--gold-bright); font-weight:600; }

  #controls{ display:flex; gap:8px; }
  button.ctl{
    font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.12em;
    background:transparent; color:var(--gold);
    border:1px solid var(--brass); padding:9px 13px;
    cursor:pointer; text-transform:uppercase;
    transition:all .2s;
  }
  button.ctl:hover{ background:rgba(201,162,75,0.12); color:var(--gold-bright); border-color:var(--gold); }
  button.ctl.active{ background:var(--gold); color:#07070c; border-color:var(--gold); }

  #starInfo{
    position:fixed; z-index:11; pointer-events:none;
    font-family:'Cinzel',serif; font-size:12px; color:var(--gold-bright);
    background:rgba(7,7,12,0.9); border:1px solid var(--gold);
    padding:6px 10px; display:none; letter-spacing:0.04em;
    white-space:nowrap;
  }

  #loading{
    position:fixed; inset:0; z-index:20; background:var(--void);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    gap:10px;
  }
  #loading .ring{
    width:44px; height:44px; border-radius:50%;
    border:1px solid rgba(201,162,75,0.25); border-top-color:var(--gold);
    animation:spin 1.1s linear infinite;
  }
  #loading .txt{ font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.25em; color:var(--brass); text-transform:uppercase; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width:600px){
    header h1{ font-size:17px; }
    .panel{ min-width:110px; padding:8px 10px; }
    .panel .val{ font-size:12px; }
  }
</style>
</head>
<body>

<div id="loading"><div class="ring"></div><div class="txt">Menyalakan Langit…</div></div>

<div id="sky"></div>
<div id="vignette"></div>
<div class="batik-frame"></div>

<header>
  <div>
    <div class="eyebrow">Nur Creative Lab · Indramayu Club Makrifat</div>
    <h1>Observatorium Alwi</h1>
    <div class="sub">Langit 3D — 43 bintang terang katalog nyata &amp; Bulan fase hari ini</div>
  </div>
</header>

<div id="starInfo"></div>

<div id="hud">
  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <div class="panel">
      <div class="label">Fase Bulan</div>
      <div class="val gold" id="moonPhaseName">—</div>
    </div>
    <div class="panel">
      <div class="label">Iluminasi</div>
      <div class="val" id="moonIllum">—</div>
    </div>
    <div class="panel">
      <div class="label">Bintang Terkunci</div>
      <div class="val" id="lockedStar">Sentuh sebuah bintang</div>
    </div>
  </div>
  <div id="controls">
    <button class="ctl active" id="btnRotate">Rotasi ⟲</button>
    <button class="ctl" id="btnLabels">Label ✦</button>
    <button class="ctl" id="btnMoonCam">Ke Bulan ☾</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  "use strict";

  // ---------- 1. Data katalog bintang terang (RA jam, Dec derajat, magnitudo, nama) ----------
  // Sumber: posisi nyata dari Yale Bright Star Catalog (epoch J2000, dibulatkan).
  const BRIGHT_STARS = [
    ["Sirius", 6.752, -16.716, -1.46, "#a8c6ff"],
    ["Canopus", 6.399, -52.696, -0.72, "#fff3d6"],
    ["Alpha Centauri", 14.660, -60.835, -0.27, "#fff0c8"],
    ["Arcturus", 14.261, 19.182, -0.05, "#ffcf8a"],
    ["Vega", 18.615, 38.784, 0.03, "#cfe0ff"],
    ["Capella", 5.278, 45.998, 0.08, "#fff4d6"],
    ["Rigel", 5.242, -8.202, 0.13, "#bcd4ff"],
    ["Procyon", 7.655, 5.225, 0.34, "#fff7e6"],
    ["Betelgeuse", 5.919, 7.407, 0.42, "#ffb37a"],
    ["Achernar", 1.629, -57.237, 0.46, "#b8c9ff"],
    ["Hadar", 14.064, -60.373, 0.61, "#cfe0ff"],
    ["Altair", 19.846, 8.868, 0.76, "#fbffe6"],
    ["Aldebaran", 4.599, 16.509, 0.85, "#ffb87a"],
    ["Antares", 16.490, -26.432, 0.96, "#ff8f6b"],
    ["Spica", 13.420, -11.161, 0.97, "#cfe0ff"],
    ["Pollux", 7.755, 28.026, 1.14, "#ffdca0"],
    ["Fomalhaut", 22.961, -29.622, 1.16, "#e6f0ff"],
    ["Deneb", 20.690, 45.280, 1.25, "#eaf1ff"],
    ["Regulus", 10.139, 11.967, 1.35, "#d6e2ff"],
    ["Adhara", 6.977, -28.972, 1.50, "#bcd4ff"],
    ["Castor", 7.577, 31.888, 1.58, "#eaf2ff"],
    ["Shaula", 17.560, -37.104, 1.62, "#cfe0ff"],
    ["Bellatrix", 5.418, 6.350, 1.64, "#cfe0ff"],
    ["Elnath", 5.438, 28.608, 1.65, "#eaf2ff"],
    ["Miaplacidus", 9.220, -69.717, 1.67, "#eaf2ff"],
    ["Alnilam", 5.604, -1.202, 1.69, "#bcd4ff"],
    ["Alnair", 22.137, -46.961, 1.73, "#dbe6ff"],
    ["Alnitak", 5.679, -1.943, 1.77, "#bcd4ff"],
    ["Alioth", 12.900, 55.960, 1.77, "#fbffee"],
    ["Dubhe", 11.062, 61.751, 1.79, "#ffd9a0"],
    ["Mirfak", 3.405, 49.861, 1.79, "#ffe8c2"],
    ["Wezen", 7.140, -26.393, 1.83, "#ffe0b0"],
    ["Kaus Australis", 18.403, -34.385, 1.85, "#ffe6b8"],
    ["Alkaid", 13.792, 49.313, 1.86, "#cfe0ff"],
    ["Sargas", 17.622, -43.000, 1.87, "#eaf2ff"],
    ["Avior", 8.375, -59.510, 1.86, "#ffcf8a"],
    ["Menkalinan", 5.992, 44.947, 1.90, "#fbffee"],
    ["Atria", 16.811, -69.028, 1.92, "#ffcf8a"],
    ["Alhena", 6.629, 16.399, 1.93, "#eaf2ff"],
    ["Peacock", 20.427, -56.735, 1.94, "#cfe0ff"],
    ["Polaris", 2.530, 89.264, 1.98, "#ffe8c2"],
    ["Mirzam", 6.378, -17.956, 1.98, "#bcd4ff"],
    ["Alphard", 9.460, -8.659, 1.99, "#ffcf8a"],
    ["Saiph", 5.796, -9.670, 2.06, "#bcd4ff"]
  ];

  // ---------- 2. Fase Bulan (algoritma sinodik sederhana, akurat ± jam) ----------
  function getMoonPhase(date){
    const synodic = 29.530588853;
    const knownNewMoon = new Date(Date.UTC(2000,0,6,18,14,0)); // new moon referensi
    const diffDays = (date.getTime() - knownNewMoon.getTime()) / 86400000;
    let age = diffDays % synodic;
    if (age < 0) age += synodic;
    const illum = (1 - Math.cos(2*Math.PI*age/synodic)) / 2;
    let name;
    if (age < 1.84566) name = "Bulan Baru";
    else if (age < 5.53699) name = "Sabit Awal";
    else if (age < 9.22831) name = "Kuartal Pertama";
    else if (age < 12.91963) name = "Cembung Awal";
    else if (age < 16.61096) name = "Purnama";
    else if (age < 20.30228) name = "Cembung Akhir";
    else if (age < 23.99361) name = "Kuartal Akhir";
    else if (age < 27.68493) name = "Sabit Akhir";
    else name = "Bulan Baru";
    return { age, illum, name };
  }

  // ---------- 3. Setup Three.js ----------
  const container = document.getElementById('sky');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x07070c, 0.0009);

  const camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 5000);
  camera.position.set(0, 0, 0.1);

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x07070c);
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableZoom = true;
  controls.minDistance = 0.1;
  controls.maxDistance = 5;
  controls.enablePan = false;
  controls.rotateSpeed = -0.35;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.28;

  const SPHERE_R = 400;

  function radecToVec(raHours, decDeg, radius){
    const ra = raHours * 15 * Math.PI/180;
    const dec = decDeg * Math.PI/180;
    const x = radius * Math.cos(dec) * Math.cos(ra);
    const y = radius * Math.sin(dec);
    const z = radius * Math.cos(dec) * Math.sin(ra);
    return new THREE.Vector3(x, y, z);
  }

  // ---------- 4. Latar bintang jauh (procedural, kepadatan realistis) ----------
  (function buildFieldStars(){
    const N = 6000;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(N*3);
    const col = new Float32Array(N*3);
    const sizes = new Float32Array(N);
    const tmp = new THREE.Color();
    for(let i=0;i<N;i++){
      const u = Math.random(), v = Math.random();
      const theta = 2*Math.PI*u;
      const phi = Math.acos(2*v-1);
      const r = SPHERE_R * (0.9 + Math.random()*0.1);
      const x = r*Math.sin(phi)*Math.cos(theta);
      const y = r*Math.cos(phi);
      const z = r*Math.sin(phi)*Math.sin(theta);
      pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
      const warmth = Math.random();
      tmp.setHSL(0.13 - warmth*0.13, 0.25, 0.6 + Math.random()*0.35);
      col[i*3]=tmp.r; col[i*3+1]=tmp.g; col[i*3+2]=tmp.b;
      sizes[i] = Math.random()*1.4 + 0.3;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color', new THREE.BufferAttribute(col,3));
    geo.setAttribute('size', new THREE.BufferAttribute(sizes,1));
    const mat = new THREE.PointsMaterial({ size:1.1, vertexColors:true, transparent:true, opacity:0.85, sizeAttenuation:true });
    scene.add(new THREE.Points(geo, mat));
  })();

  // ---------- 5. Bintang terang (real) + label ----------
  const starMeshes = [];
  const labelGroup = new THREE.Group();
  scene.add(labelGroup);

  BRIGHT_STARS.forEach(([name, ra, dec, mag, colorHex])=>{
    const pos = radecToVec(ra, dec, SPHERE_R * 0.98);
    const size = THREE.MathUtils.mapLinear(Math.max(-1.5, Math.min(2.1, mag)), -1.5, 2.1, 6.5, 1.8);
    const geo = new THREE.SphereGeometry(size, 12, 12);
    const mat = new THREE.MeshBasicMaterial({ color: colorHex });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(pos);
    mesh.userData = { name, ra, dec, mag };
    scene.add(mesh);
    starMeshes.push(mesh);

    // glow sprite
    const spriteMat = new THREE.SpriteMaterial({
      map: makeGlowTexture(colorHex),
      transparent:true, opacity:0.85, depthWrite:false, blending:THREE.AdditiveBlending
    });
    const sprite = new THREE.Sprite(spriteMat);
    const glowScale = size * 9;
    sprite.scale.set(glowScale, glowScale, 1);
    sprite.position.copy(pos);
    scene.add(sprite);
  });

  function makeGlowTexture(hex){
    const c = document.createElement('canvas'); c.width=c.height=128;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(64,64,0,64,64,64);
    g.addColorStop(0, hex); g.addColorStop(0.25, hex);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  }

  // ---------- 6. Bulan dengan fase real-time ----------
  const moonPhase = getMoonPhase(new Date());
  const moonRA = 10.5, moonDec = 12; // posisi ilustratif tetap di langit
  const moonDist = SPHERE_R * 0.35;
  const moonPos = radecToVec(moonRA, moonDec, moonDist);

  const moonGroup = new THREE.Group();
  moonGroup.position.copy(moonPos);
  scene.add(moonGroup);

  const moonGeo = new THREE.SphereGeometry(8, 48, 48);
  const moonCanvas = document.createElement('canvas');
  moonCanvas.width = 512; moonCanvas.height = 256;
  const mctx = moonCanvas.getContext('2d');
  const grad = mctx.createLinearGradient(0,0,512,0);
  grad.addColorStop(0,'#8f8878'); grad.addColorStop(0.5,'#d8d0bb'); grad.addColorStop(1,'#8f8878');
  mctx.fillStyle = grad; mctx.fillRect(0,0,512,256);
  for(let i=0;i<140;i++){
    mctx.fillStyle = 'rgba(90,85,70,'+(Math.random()*0.25)+')';
    mctx.beginPath();
    mctx.arc(Math.random()*512, Math.random()*256, Math.random()*10+2, 0, Math.PI*2);
    mctx.fill();
  }
  const moonTex = new THREE.CanvasTexture(moonCanvas);
  const moonMat = new THREE.MeshPhongMaterial({ map: moonTex, shininess:2 });
  const moonMesh = new THREE.Mesh(moonGeo, moonMat);
  moonGroup.add(moonMesh);

  // arah cahaya matahari sesuai fase (sederhana: sudut fase memutar terminator)
  const phaseAngle = moonPhase.age / 29.530588853 * Math.PI * 2;
  const sunDir = new THREE.Vector3(Math.cos(phaseAngle), 0.15, Math.sin(phaseAngle)).normalize();
  const moonLight = new THREE.DirectionalLight(0xfff2d6, 1.4);
  moonLight.position.copy(sunDir.clone().multiplyScalar(50)).add(moonPos);
  scene.add(moonLight);
  scene.add(new THREE.AmbientLight(0x2a2a35, 0.55));

  const moonGlowMat = new THREE.SpriteMaterial({ map: makeGlowTexture('#fff6dd'), transparent:true, opacity:0.35, depthWrite:false, blending:THREE.AdditiveBlending });
  const moonGlow = new THREE.Sprite(moonGlowMat);
  moonGlow.scale.set(40,40,1);
  moonGroup.add(moonGlow);

  document.getElementById('moonPhaseName').textContent = moonPhase.name;
  document.getElementById('moonIllum').textContent = Math.round(moonPhase.illum*100) + '%';

  // ---------- 7. Label bintang (sprite teks) ----------
  let labelsVisible = false;
  function makeLabelSprite(text){
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    ctx.font = '28px Georgia'; const w = ctx.measureText(text).width + 20;
    c.width = w; c.height = 40;
    ctx.font = '28px Georgia';
    ctx.fillStyle = 'rgba(201,162,75,0.95)';
    ctx.fillText(text, 8, 28);
    const tex = new THREE.CanvasTexture(c);
    const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(w*0.35, 14, 1);
    return sprite;
  }
  starMeshes.forEach(m=>{
    const label = makeLabelSprite(m.userData.name);
    label.position.copy(m.position).multiplyScalar(1.01);
    label.visible = false;
    labelGroup.add(label);
    m.userData.label = label;
  });

  // ---------- 8. Interaksi: raycast pilih bintang ----------
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const starInfo = document.getElementById('starInfo');
  const lockedStarEl = document.getElementById('lockedStar');

  function onPointer(ev){
    const x = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const y = ev.touches ? ev.touches[0].clientY : ev.clientY;
    mouse.x = (x/window.innerWidth)*2-1;
    mouse.y = -(y/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(starMeshes);
    if(hits.length){
      const s = hits[0].object.userData;
      starInfo.style.display='block';
      starInfo.style.left = (x+14)+'px';
      starInfo.style.top = (y-10)+'px';
      starInfo.textContent = s.name + '  ·  mag ' + s.mag.toFixed(2);
      lockedStarEl.textContent = s.name + ' (mag ' + s.mag.toFixed(2) + ')';
    } else {
      starInfo.style.display='none';
    }
  }
  renderer.domElement.addEventListener('mousemove', onPointer);
  renderer.domElement.addEventListener('touchstart', onPointer, {passive:true});

  // ---------- 9. Kontrol UI ----------
  const btnRotate = document.getElementById('btnRotate');
  btnRotate.addEventListener('click', ()=>{
    controls.autoRotate = !controls.autoRotate;
    btnRotate.classList.toggle('active', controls.autoRotate);
  });

  const btnLabels = document.getElementById('btnLabels');
  btnLabels.addEventListener('click', ()=>{
    labelsVisible = !labelsVisible;
    starMeshes.forEach(m=> m.userData.label.visible = labelsVisible);
    btnLabels.classList.toggle('active', labelsVisible);
  });

  const btnMoonCam = document.getElementById('btnMoonCam');
  btnMoonCam.addEventListener('click', ()=>{
    controls.autoRotate = false;
    btnRotate.classList.remove('active');
    const dir = moonPos.clone().normalize();
    const from = { x:camera.position.x, y:camera.position.y, z:camera.position.z };
    const to = dir.clone().multiplyScalar(0.05);
    let t = 0;
    function step(){
      t += 0.03;
      if(t>1){ t=1; }
      camera.position.set(
        from.x + (to.x-from.x)*t,
        from.y + (to.y-from.y)*t,
        from.z + (to.z-from.z)*t
      );
      controls.target.copy(dir.clone().multiplyScalar(10));
      controls.update();
      if(t<1) requestAnimationFrame(step);
    }
    step();
  });

  // ---------- 10. Resize & animate ----------
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate(){
    requestAnimationFrame(animate);
    moonGroup.rotation.y += 0.0006;
    controls.update();
    renderer.render(scene, camera);
  }

  document.getElementById('loading').style.display='none';
  animate();

})();
</script>
</body>
</html>
