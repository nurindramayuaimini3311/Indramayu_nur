<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Raider: Indramayu Club</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #000;
    color: #f5e6c8;
    font-family: 'Courier New', monospace;
    height: 100%;
    overflow: hidden;
    touch-action: none;
  }
  #gameWrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    background: #000;
  }
  #viewport {
    display: block;
    width: 100%;
    height: 100%;
  }
  #hud {
    position: absolute;
    top: 8px; left: 8px; right: 8px;
    display: flex; justify-content: space-between;
    color: #ffd700;
    font-size: 13px;
    text-shadow: 1px 1px 2px #000;
    pointer-events: none;
    z-index: 5;
  }
  #topBar {
    position: absolute; top: 8px; left: 0; right: 0;
    text-align: center; color: #fff; font-size: 12px;
    text-shadow: 1px 1px 2px #000;
    pointer-events: none;
    z-index: 5;
  }
  #menuBtn {
    position: absolute;
    bottom: 14px; left: 50%; transform: translateX(-50%);
    background: #2a5ea8; color: #fff; border: none;
    padding: 8px 22px; border-radius: 20px; font-weight: bold;
    font-size: 13px; z-index: 10;
  }
  #joystickZone {
    position: absolute; bottom: 20px; left: 20px;
    width: 110px; height: 110px;
    z-index: 10;
  }
  #joyBase {
    width: 100%; height: 100%; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.25);
    position: relative;
  }
  #joyStick {
    width: 46px; height: 46px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #d94040, #7a1414);
    position: absolute; top: 32px; left: 32px;
    box-shadow: 0 0 10px rgba(0,0,0,0.6);
  }
  #fireBtn {
    position: absolute; bottom: 34px; right: 24px;
    width: 78px; height: 78px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff5555, #a80000);
    color: #fff; font-weight: bold; font-size: 15px;
    border: 3px solid rgba(255,255,255,0.4);
    z-index: 10;
  }
  #startOverlay, #overOverlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; text-align: center; padding: 20px;
  }
  #overOverlay { display: none; }
  #startOverlay h1 { color: #ffd700; font-size: 22px; margin-bottom: 10px; letter-spacing: 2px; }
  #startOverlay p { color: #aaa; font-size: 12px; margin-bottom: 20px; line-height: 1.6; max-width: 300px; }
  .startBtn {
    background: linear-gradient(135deg, #ffd700, #b8912c);
    color: #14100a; font-weight: bold; padding: 12px 30px;
    border-radius: 8px; border: none; font-size: 15px;
  }
  #overOverlay h2 { color: #ff5555; font-size: 20px; margin-bottom: 8px; }
  #overOverlay p { color: #fff; font-size: 13px; margin-bottom: 18px; }
  #errorBox {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: none; background: #3a1414; color: #ffb3a7;
    font-size: 11px; padding: 8px 10px; z-index: 30;
  }
</style>
</head>
<body>

<div id="gameWrap">
  <canvas id="viewport"></canvas>
  <div id="topBar">1P — <span id="hiScore">0</span> HIGH &nbsp; INSERT SEMANGAT</div>
  <div id="hud">
    <span>SKOR: <span id="scoreDisplay">0</span></span>
    <span>🪙 <span id="coinDisplay">0</span></span>
    <span>✈️ <span id="livesDisplay">3</span></span>
  </div>

  <div id="joystickZone">
    <div id="joyBase"><div id="joyStick"></div></div>
  </div>
  <button id="fireBtn">TEMBAK</button>
  <button id="menuBtn">MENU</button>

  <div id="startOverlay">
    <h1>✈️ SKY RAIDER</h1>
    <p>Indramayu Club Edition — terbang, tembak tank musuh 🎯, hindari pohon 🌳, kumpulkan koin 🪙. Geser joystick kiri buat gerak, tombol merah buat tembak (auto-fire juga aktif).</p>
    <button class="startBtn" id="startBtn">MULAI MISI</button>
  </div>

  <div id="overOverlay">
    <h2 id="overTitle">MISI GAGAL</h2>
    <p id="overText">Skor: 0</p>
    <button class="startBtn" id="retryBtn">COBA LAGI</button>
  </div>

  <div id="errorBox"></div>
</div>

<script>
const canvas = document.getElementById('viewport');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('scoreDisplay');
const coinDisplay = document.getElementById('coinDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const hiScoreEl = document.getElementById('hiScore');
const startOverlay = document.getElementById('startOverlay');
const overOverlay = document.getElementById('overOverlay');
const overTitle = document.getElementById('overTitle');
const overText = document.getElementById('overText');
const startBtn = document.getElementById('startBtn');
const retryBtn = document.getElementById('retryBtn');
const fireBtn = document.getElementById('fireBtn');
const menuBtn = document.getElementById('menuBtn');
const joyBase = document.getElementById('joyBase');
const joyStick = document.getElementById('joyStick');
const errorBox = document.getElementById('errorBox');

window.onerror = function (msg, src, line) {
  errorBox.style.display = 'block';
  errorBox.textContent = '⚠️ Error: ' + msg + ' (baris ' + line + ')';
  return false;
};

let hiScore = 0;
let running = false;
let animId = null;
let state = {};

function resizeCanvas() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

// ---------- entity helpers ----------
function drawEmoji(x, y, icon, size, rot) {
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.font = size + 'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(icon, 0, 0);
  ctx.restore();
}

function drawTank(t) {
  const x = t.x, y = t.y;
  ctx.fillStyle = '#3a4a2a';
  ctx.beginPath();
  ctx.ellipse(x, y, 20, 14, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#1e2a14';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#2a3a1e';
  ctx.fillRect(x - 4, y - 16, 8, 14);
  // hp bar
  ctx.fillStyle = '#241d12';
  ctx.fillRect(x - 20, y - 26, 40, 5);
  ctx.fillStyle = '#c0392b';
  ctx.fillRect(x - 20, y - 26, 40 * (t.hp / t.maxHp), 5);
}

function initState() {
  resizeCanvas();
  state = {
    playerX: canvas.width / 2,
    playerY: canvas.height * 0.78,
    bullets: [],
    enemyBullets: [],
    tanks: [],
    trees: [],
    coins: [],
    explosions: [],
    score: 0,
    coinCount: 0,
    lives: 3,
    tick: 0,
    scrollY: 0,
    joy: { active: false, dx: 0, dy: 0 },
    fireHeld: false,
    invuln: 0,
  };
  scoreDisplay.textContent = '0';
  coinDisplay.textContent = '0';
  livesDisplay.textContent = '3';
}

function spawnTank() {
  state.tanks.push({
    x: 30 + Math.random() * (canvas.width - 60),
    y: -30,
    speed: 0.7 + Math.random() * 0.6,
    hp: 3, maxHp: 3,
    fireTimer: Math.floor(Math.random() * 90) + 60,
  });
}
function spawnTree() {
  state.trees.push({ x: 20 + Math.random() * (canvas.width - 40), y: -20, size: 26 + Math.random()*10 });
}
function spawnCoin() {
  state.coins.push({ x: 20 + Math.random() * (canvas.width - 40), y: -20, bob: Math.random()*Math.PI*2 });
}

function drawTerrain() {
  ctx.fillStyle = '#3a5a2a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    const y = ((state.scrollY * 0.5) + i * 90) % (canvas.height + 90) - 90;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y + 20);
    ctx.stroke();
  }
}

function spawnExplosion(x, y) {
  state.explosions.push({ x, y, r: 4, life: 22 });
}

function fireBullet() {
  state.bullets.push({ x: state.playerX, y: state.playerY - 20, vy: -8 });
  if (state.bullets.length > 1 && state.tick % 2 === 0) {
    // sedikit spread saat rapid fire
    state.bullets.push({ x: state.playerX - 10, y: state.playerY - 14, vy: -8 });
  }
}

function step() {
  state.tick++;
  state.scrollY += 2;

  // player move via joystick
  const spd = 4.2;
  state.playerX += state.joy.dx * spd;
  state.playerY += state.joy.dy * spd;
  state.playerX = Math.max(20, Math.min(canvas.width - 20, state.playerX));
  state.playerY = Math.max(canvas.height * 0.25, Math.min(canvas.height - 30, state.playerY));

  // auto fire
  if (state.tick % 10 === 0 || state.fireHeld && state.tick % 6 === 0) {
    fireBullet();
  }

  // spawn
  if (state.tick % 95 === 0) spawnTank();
  if (state.tick % 55 === 0) spawnTree();
  if (state.tick % 130 === 0) spawnCoin();

  // update trees
  state.trees.forEach(t => t.y += 2);
  state.trees = state.trees.filter(t => t.y < canvas.height + 30);

  // update coins
  state.coins.forEach(c => c.y += 1.6);
  state.coins = state.coins.filter(c => {
    if (Math.hypot(c.x - state.playerX, c.y - state.playerY) < 22) {
      state.coinCount++;
      state.score += 5;
      coinDisplay.textContent = state.coinCount;
      scoreDisplay.textContent = state.score;
      return false;
    }
    return c.y < canvas.height + 20;
  });

  // update tanks
  state.tanks.forEach(t => {
    t.y += t.speed;
    t.fireTimer--;
    if (t.fireTimer <= 0 && t.y > 0 && t.y < canvas.height - 40) {
      state.enemyBullets.push({ x: t.x, y: t.y, vy: 3.2 });
      t.fireTimer = 90 + Math.floor(Math.random()*60);
    }
  });
  state.tanks = state.tanks.filter(t => {
    if (t.y > canvas.height + 30) return false;
    if (t.y > canvas.height - 50 && Math.abs(t.x - state.playerX) < 26 && state.invuln <= 0) {
      hitPlayer();
      return false;
    }
    return true;
  });

  // player bullets
  state.bullets.forEach(b => b.y += b.vy);
  state.bullets = state.bullets.filter(b => b.y > -10);
  state.bullets.forEach(b => {
    state.tanks.forEach(t => {
      if (t.hp > 0 && Math.hypot(b.x - t.x, b.y - t.y) < 20) {
        t.hp--;
        b.hit = true;
        if (t.hp <= 0) {
          state.score += 25;
          scoreDisplay.textContent = state.score;
          spawnExplosion(t.x, t.y);
        }
      }
    });
  });
  state.bullets = state.bullets.filter(b => !b.hit);
  state.tanks = state.tanks.filter(t => t.hp > 0);

  // enemy bullets
  state.enemyBullets.forEach(b => b.y += b.vy);
  state.enemyBullets = state.enemyBullets.filter(b => {
    if (b.y > canvas.height + 10) return false;
    if (state.invuln <= 0 && Math.hypot(b.x - state.playerX, b.y - state.playerY) < 14) {
      hitPlayer();
      return false;
    }
    return true;
  });

  if (state.invuln > 0) state.invuln--;

  // explosions
  state.explosions.forEach(ex => { ex.r += 2.5; ex.life--; });
  state.explosions = state.explosions.filter(ex => ex.life > 0);

  // ---- draw ----
  drawTerrain();
  state.trees.forEach(t => drawEmoji(t.x, t.y, '🌳', t.size));
  state.coins.forEach(c => {
    const bobY = c.y + Math.sin(state.tick * 0.1 + c.bob) * 3;
    drawEmoji(c.x, bobY, '🪙', 20);
  });
  state.tanks.forEach(drawTank);
  ctx.fillStyle = '#ffe680';
  state.bullets.forEach(b => { ctx.fillRect(b.x - 2, b.y - 6, 4, 10); });
  ctx.fillStyle = '#ff4444';
  state.enemyBullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });
  state.explosions.forEach(ex => {
    ctx.globalAlpha = Math.max(ex.life / 22, 0);
    drawEmoji(ex.x, ex.y, '💥', 18 + ex.r);
    ctx.globalAlpha = 1;
  });

  // player plane
  if (state.invuln <= 0 || state.tick % 6 < 3) {
    drawEmoji(state.playerX, state.playerY, '✈️', 30, 0);
  }

  if (state.lives <= 0) endGame(false);
}

function hitPlayer() {
  state.lives--;
  livesDisplay.textContent = state.lives;
  state.invuln = 90;
  spawnExplosion(state.playerX, state.playerY);
}

function loop() {
  if (!running) return;
  step();
  animId = requestAnimationFrame(loop);
}

function startGame() {
  initState();
  running = true;
  startOverlay.style.display = 'none';
  overOverlay.style.display = 'none';
  errorBox.style.display = 'none';
  loop();
}

function endGame(won) {
  running = false;
  cancelAnimationFrame(animId);
  if (state.score > hiScore) { hiScore = state.score; hiScoreEl.textContent = hiScore; }
  overTitle.textContent = 'MISI GAGAL';
  overText.textContent = 'Skor: ' + state.score + ' • Koin: ' + state.coinCount;
  overOverlay.style.display = 'flex';
}

startBtn.onclick = startGame;
retryBtn.onclick = startGame;
menuBtn.onclick = () => {
  running = false;
  cancelAnimationFrame(animId);
  overOverlay.style.display = 'none';
  startOverlay.style.display = 'flex';
};

// joystick control
let joyTouchId = null;
function joyPos(e) {
  const rect = joyBase.getBoundingClientRect();
  const t = e.touches ? [...e.touches].find(t => t.identifier === joyTouchId) || e.touches[0] : e;
  return { x: t.clientX - rect.left - rect.width/2, y: t.clientY - rect.top - rect.height/2 };
}
function handleJoyStart(e) {
  e.preventDefault();
  if (e.changedTouches) joyTouchId = e.changedTouches[0].identifier;
  state.joy.active = true;
}
function handleJoyMove(e) {
  e.preventDefault();
  if (!state.joy.active) return;
  const p = joyPos(e);
  const maxR = 40;
  const dist = Math.min(Math.hypot(p.x, p.y), maxR);
  const angle = Math.atan2(p.y, p.x);
  const sx = Math.cos(angle) * dist;
  const sy = Math.sin(angle) * dist;
  joyStick.style.left = (32 + sx) + 'px';
  joyStick.style.top = (32 + sy) + 'px';
  state.joy.dx = sx / maxR;
  state.joy.dy = sy / maxR;
}
function handleJoyEnd(e) {
  e.preventDefault();
  state.joy.active = false;
  state.joy.dx = 0; state.joy.dy = 0;
  joyStick.style.left = '32px';
  joyStick.style.top = '32px';
}
joyBase.addEventListener('touchstart', handleJoyStart, { passive: false });
joyBase.addEventListener('touchmove', handleJoyMove, { passive: false });
joyBase.addEventListener('touchend', handleJoyEnd, { passive: false });
joyBase.addEventListener('mousedown', e => { state.joy.active = true; });
window.addEventListener('mousemove', e => { if (state.joy.active) handleJoyMove(e); });
window.addEventListener('mouseup', e => { if (state.joy.active) handleJoyEnd(e); });

fireBtn.addEventListener('touchstart', e => { e.preventDefault(); state.fireHeld = true; if (running) fireBullet(); }, { passive: false });
fireBtn.addEventListener('touchend', e => { e.preventDefault(); state.fireHeld = false; }, { passive: false });
fireBtn.addEventListener('mousedown', () => { state.fireHeld = true; if (running) fireBullet(); });
fireBtn.addEventListener('mouseup', () => { state.fireHeld = false; });

window.addEventListener('keydown', e => {
  if (!running) return;
  const spd = 1;
  if (e.key === 'ArrowLeft') state.joy.dx = -spd;
  if (e.key === 'ArrowRight') state.joy.dx = spd;
  if (e.key === 'ArrowUp') state.joy.dy = -spd;
  if (e.key === 'ArrowDown') state.joy.dy = spd;
  if (e.key === ' ') fireBullet();
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') state.joy.dx = 0;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') state.joy.dy = 0;
});

try {
  resizeCanvas();
  initState();
} catch (err) {
  errorBox.style.display = 'block';
  errorBox.textContent = '⚠️ Gagal load game: ' + err.message;
}
</script>

</body>
</html>
