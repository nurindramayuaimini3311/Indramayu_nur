<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALWIbook — Feed Video & Komentar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1877F2">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js")});</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
:root{--bg:#18191a;--card:#242526;--teks:#e4e6eb;--redup:#b0b3b8;--biru:#1877F2;--biru2:#2d88ff;--hijau:#2ea043;--garis:#3e4042;--hover:#3a3b3c}
html,body{background:var(--bg);color:var(--teks)}
body{padding-bottom:90px}
a{color:var(--biru2);text-decoration:none}

/* ═══ HEADER ═══ */
#topbar{position:sticky;top:0;z-index:900;background:var(--card);border-bottom:1px solid var(--garis);display:flex;align-items:center;gap:12px;padding:10px 14px}
#topbar .logo{font-size:22px;font-weight:800;color:var(--biru);letter-spacing:-.5px}
#topbar .logo span{color:#C9A84C}
#userChip{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--hover);border-radius:20px;padding:5px 12px 5px 5px;cursor:pointer;border:1px solid var(--garis)}
#userChip:hover{filter:brightness(1.15)}
.avat{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#1877F2,#27ae60);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex:none;text-transform:uppercase}
#userChip small{font-size:13px;font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{max-width:620px;margin:0 auto;padding:14px 10px}

/* ═══ COMPOSER ═══ */
.buat{background:var(--card);border-radius:12px;border:1px solid var(--garis);box-shadow:0 1px 4px rgba(0,0,0,.4);margin-bottom:14px;overflow:hidden}
.buat .atas{display:flex;gap:10px;padding:12px 14px 4px}
.buat textarea{flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--teks);font-size:16px;padding:8px 0;min-height:44px;max-height:160px}
.buat textarea::placeholder{color:var(--redup)}
#mediaPrev{display:none;padding:0 14px 10px}
#mediaPrev video,#mediaPrev img{width:100%;max-height:340px;object-fit:contain;border-radius:10px;background:#000}
#mediaPrev .info{font-size:12px;color:var(--redup);padding:6px 2px;display:flex;justify-content:space-between;align-items:center}
#mediaPrev .hapusMedia{color:#ff7a7a;cursor:pointer;font-weight:700}
.buat .bawah{display:flex;align-items:center;border-top:1px solid var(--garis);padding:6px 8px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:none;border:none;color:var(--redup);font-size:14px;font-weight:600;padding:9px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.kirim{flex:none;background:var(--biru);color:#fff;padding:9px 22px;margin-left:4px}
.btn.kirim:disabled{opacity:.45;cursor:not-allowed}

/* ═══ FEED CARD ═══ */
.post{background:var(--card);border-radius:12px;border:1px solid var(--garis);box-shadow:0 1px 4px rgba(0,0,0,.4);margin-bottom:14px;overflow:hidden}
.post .kepala{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.post .kepala .siapa b{font-size:15px;display:block}
.post .kepala .siapa small{color:var(--redup);font-size:12.5px}
.post .teksPost{padding:0 14px 10px;font-size:15.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.post .mediaWrap{background:#000}
.post .mediaWrap video,.post .mediaWrap img{width:100%;max-height:520px;object-fit:contain;display:block}
.post .aksiBar{display:flex;border-top:1px solid var(--garis);margin-top:4px}
.post .aksiBar .btn{font-size:13.5px;padding:8px}
.post .aksiBar .btn.aktif{color:var(--biru2);font-weight:800}
.jmlBar{display:flex;justify-content:space-between;padding:8px 14px;font-size:13px;color:var(--redup);border-bottom:1px solid var(--garis)}

/* ═══ KOMENTAR ═══ */
.komentarBox{display:none;padding:10px 14px}
.post.komentarTerbuka .komentarBox{display:block}
.komentarItem{display:flex;gap:8px;margin-bottom:8px}
.komentarItem .gelembung{background:var(--hover);border-radius:16px;padding:7px 12px;max-width:100%}
.komentarItem .gelembung b{font-size:13px;display:block}
.komentarItem .gelembung p{font-size:14px;word-break:break-word}
.komentarItem .gelembung small{color:var(--redup);font-size:11px}
.formKomen{display:flex;gap:8px;align-items:center;margin-top:10px}
.formKomen input{flex:1;background:var(--hover);border:none;border-radius:18px;outline:none;color:var(--teks);padding:9px 14px;font-size:14px}
.formKomen button{background:none;border:none;color:var(--biru2);font-weight:700;font-size:14px;cursor:pointer;padding:6px}
.kosong{text-align:center;color:var(--redup);padding:40px 0;font-size:14px}

/* ═══ STATUS ═══ */
#statusLine{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--garis);border-radius:20px;padding:8px 18px;font-size:13px;display:none;z-index:950;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#refreshFab{position:fixed;bottom:76px;right:16px;width:46px;height:46px;border-radius:50%;background:var(--biru);color:#fff;border:none;font-size:19px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:940}
#refreshFab.putar{animation:spin .7s linear}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══ ALWI NAVIGASI ═══ */
#alwiNavWrap{position:fixed;bottom:14px;left:14px;z-index:999999990}
#alwiNavBtn{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#1d6b3a,#27ae60);color:#fff;border:2px solid #C9A84C;
 border-radius:24px;padding:10px 18px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.45);transition:.25s;font-family:inherit}
#alwiNavBtn:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(201,168,76,.5)}
#alwiNavMenu{display:none;position:absolute;bottom:52px;left:0;min-width:230px;background:#0a2e1c;border:2px solid #C9A84C;border-radius:14px;
 overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.6)}
#alwiNavWrap.buka #alwiNavMenu{display:block}
.alwiNavJdl{padding:9px 14px 7px;font-size:10px;letter-spacing:2px;color:#C9A84C;font-weight:900;border-bottom:1px solid rgba(201,168,76,.25)}
#alwiNavMenu a{display:flex;align-items:center;gap:8px;padding:11px 14px;color:#e8f5ec;text-decoration:none;font-size:12.5px;font-weight:700;transition:.15s}
#alwiNavMenu a:hover{background:rgba(201,168,76,.18);color:#f0c040;padding-left:18px}
</style>
</head>
<body>

<header id="topbar">
  <div class="logo">alwi<span>book</span></div>
  <div id="userChip" title="ganti nama"><div class="avat" id="myAvat">?</div><small id="myNama">Member ALWI</small></div>
</header>

<main>
  <!-- COMPOSER -->
  <div class="buat">
    <div class="atas">
      <div class="avat" id="composerAvat">?</div>
      <textarea id="teksBuat" rows="1" placeholder="Apa yang sedang kamu pikirkan, tulis atau unggah videomu..."></textarea>
    </div>
    <div id="mediaPrev">
      <div id="mediaTampil"></div>
      <div class="info"><span id="mediaNama"></span><span class="hapusMedia" id="buangMedia">✕ buang</span></div>
    </div>
    <div class="bawah">
      <button class="btn" id="pilihFile">🎬 Video/Foto</button>
      <input type="file" id="fileInput" accept="video/*,image/*" hidden>
      <button class="btn kirim" id="tombolKirim" disabled>Kirim</button>
    </div>
  </div>

  <!-- FEED -->
  <div id="feed"><div class="kosong">Memuat feed...</div></div>
</main>

<div id="statusLine"></div>
<button id="refreshFab" title="muat ulang">⟳</button>

<!-- ══════════ ALWI NAVIGASI ══════════ -->
<div id="alwiNavWrap">
  <button id="alwiNavBtn">🧭 ALWI NAVIGASI ▲</button>
  <div id="alwiNavMenu">
    <div class="alwiNavJdl">✦ HALAMAN PROMOSI ✦</div>
    <a href="index.html">🏠 Pusat Halaman (Index)</a>
    <a href="nur_promosi_gabungan.html">🎭 Promosi Gabungan + Kamera Live</a>
    <a href="live-promosi.html">📡 Live Promosi 4 Slot</a>
    <div class="alwiNavJdl">✦ TEMPLATE ✦</div>
    <a href="template-1.html">📄 Template 1 — Sapaan</a>
    <a href="template-2.html">📄 Template 2 — Promosi</a>
    <a href="template-3.html">📄 Template 3 — Buku Tamu</a>
    <div class="alwiNavJdl">✦ BUKU TAMU ✦</div>
    <a href="buku-tamu1.html">📖 Buku Tamu 1</a>
    <a href="buku-tamu2.html">📖 Buku Tamu 2</a>
    <a href="buku-tamu3.html">📖 Buku Tamu 3</a>
  </div>
</div>

<script>
/* ═══════════ KONFIG ═══════════ */
var API='http://34.170.37.50:4000';
var MAKS_FILE=40*1024*1024; // 40 MB

/* ═══════════ IDENTITAS ═══════════ */
function devId(){var i=localStorage.getItem('alwi-dev');if(!i){i='dev-'+Date.now();localStorage.setItem('alwi-dev',i)}return i}
function nama(){return localStorage.getItem('alwi-nama')||'Member ALWI'}
function tanyaNama(){var n=prompt('Siapa namamu?',nama());if(n&&n.trim()){localStorage.setItem('alwi-nama',n.trim().slice(0,40))}pasangNama()}
function pasangNama(){document.getElementById('myNama').textContent=nama();
 document.getElementById('myAvat').textContent=nama().charAt(0);
 document.getElementById('composerAvat').textContent=nama().charAt(0)}
document.getElementById('userChip').onclick=tanyaNama;

/* ═══════════ UTIL ═══════════ */
var $=function(s){return document.querySelector(s)};
function status(pesan,ms){var e=$('#statusLine');e.textContent=pesan;e.style.display='block';
 clearTimeout(e._t);if(ms)e._t=setTimeout(function(){e.style.display='none'},ms)}
function waktuRel(iso){var d=new Date(iso),s=(Date.now()-d.getTime())/1e3;
 if(s<60)return'baru saja';if(s<3600)return Math.floor(s/60)+' mnt yang lalu';
 if(s<86400)return Math.floor(s/3600)+' jam yang lalu';return Math.floor(s/86400)+' hari yang lalu'}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function api(jalur,opsi){return fetch(API+jalur,opsi).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}

/* ═══════════ NAVIGASI ═══════════ */
(function(){var w=$('#alwiNavWrap'),b=$('#alwiNavBtn');
 b.onclick=function(e){e.stopPropagation();w.classList.toggle('buka');
  b.textContent=w.classList.contains('buka')?'🧭 ALWI NAVIGASI ▼':'🧭 ALWI NAVIGASI ▲'};
 document.addEventListener('click',function(e){if(!w.contains(e.target)){w.classList.remove('buka');
  b.textContent='🧭 ALWI NAVIGASI ▲'}})})();

/* ═══════════ COMPOSER ═══════════ */
var filePilih=null;
$('#teksBuat').addEventListener('input',function(){this.style.height='auto';
 this.style.height=Math.min(this.scrollHeight,160)+'px';cekSiap()});
function cekSiap(){$('#tombolKirim').disabled=!(($('#teksBuat').value.trim())||filePilih)}
$('#pilihFile').onclick=function(){$('#fileInput').click()};
$('#fileInput').addEventListener('change',function(){var f=this.files[0];if(!f)return;
 if(f.size>MAKS_FILE){alert('File terlalu besar (maks 40 MB)');this.value='';return}
 filePilih=f;tampilPreview(f);cekSiap();this.value=''});
function tampilPreview(f){var v=f.type.indexOf('video')===0;
 $('#mediaTampil').innerHTML=v?'<video src="'+URL.createObjectURL(f)+'" controls muted></video>'
  :'<img src="'+URL.createObjectURL(f)+'">';
 $('#mediaNama').textContent=f.name+' ('+(f.size/1048576).toFixed(1)+' MB)';
 $('#mediaPrev').style.display='block'}
$('#buangMedia').onclick=function(){filePilih=null;$('#mediaPrev').style.display='none';
 $('#mediaTampil').innerHTML='';cekSiap()};
$('#tombolKirim').onclick=kirim;

async function kirim(){
 var teks=$('#teksBuat').value.trim();
 if(!teks&&!filePilih)return;
 var btn=$('#tombolKirim');btn.disabled=true;btn.textContent='Mengunggah...';
 try{
  var media=null;
  if(filePilih){
   status('⬆️ Mengunggah '+filePilih.name+'...');
   var b64=await new Promise(function(selesai,gagal){var r=new FileReader();
    r.onload=function(){selesai(r.result.split(',')[1])};r.onerror=gagal;r.readAsDataURL(filePilih)});
   var up=await api('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({nama:filePilih.name,data:b64})});
   if(!up.ok)throw new Error(up.galat||'upload gagal');
   media={url:up.url,tipe:filePilih.type.indexOf('video')===0?'video':'gambar',nama:filePilih.name};
  }
  btn.textContent='Mengirim...';
  await api('/api/posting',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({nama:nama(),teks:teks,media:media})});
  $('#teksBuat').value='';$('#teksBuat').style.height='auto';
  $('#buangMedia').click();status('✅ Terkirim!',2000);muatFeed(true);
 }catch(e){status('❌ '+e.message,4000)}
 btn.textContent='Kirim';cekSiap();
}

/* ═══════════ FEED ═══════════ */
var cacheFeed={posting:[],memori:null};
async function muatFeed(janganPutar){
 var fab=$('#refreshFab');fab.classList.add('putar');setTimeout(function(){fab.classList.remove('putar')},700);
 try{
  var hasil=await Promise.all([
   api('/api/posting'),
   api('/api/memori').catch(function(){return{komentar:{},suka:{}}})
  ]);
  cacheFeed.posting=(hasil[0].posting||[]).slice().reverse();
  cacheFeed.memori=hasil[1];
  renderFeed();
 }catch(e){$('#feed').innerHTML='<div class="kosong">❌ Gagal memuat: '+esc(e.message)+'</div>'}
}
$('#refreshFab').onclick=function(){muatFeed(true)};

function renderFeed(){
 var f=$('#feed');
 if(!cacheFeed.posting.length){f.innerHTML='<div class="kosong">Belum ada postingan.<br>Jadilah yang pertama mengunggah! 🎬</div>';return}
 f.innerHTML=cacheFeed.posting.map(renderPost).join('');
 pasangAksi();
}

function renderPost(p){
 var suka=(cacheFeed.memori&&cacheFeed.memori.suka[p.id])||{jumlah:0,penyuka:{}};
 var sayaSuka=!!suka.penyuka[devId()];
 var komentar=(cacheFeed.memori&&cacheFeed.memori.komentar[p.id])||[];
 var mediaHtml='';
 if(p.media){
  mediaHtml=p.media.tipe==='video'
   ?'<div class="mediaWrap"><video src="'+esc(p.media.url)+'" controls preload="metadata"></video></div>'
   :'<div class="mediaWrap"><img src="'+esc(p.media.url)+'" loading="lazy"></div>';
 }
 return '<div class="post" data-id="'+esc(p.id)+'">'
 +'<div class="kepala"><div class="avat">'+esc((p.nama||'?').charAt(0))+'</div>'
 +'<div class="siapa"><b>'+esc(p.nama||'Anonim')+'</b><small>'+waktuRel(p.waktu)+(p.media?' · 📎 '+esc(p.media.nama||''):'')+'</small></div></div>'
 +(p.teks?'<div class="teksPost">'+esc(p.teks)+'</div>':'')
 +mediaHtml
 +'<div class="jmlBar"><span>👍 '+suka.jumlah+' suka</span><span>'+komentar.length+' komentar</span></div>'
 +'<div class="aksiBar">'
 +'<button class="btn btnSuka'+(sayaSuka?' aktif':'')+'">'+(sayaSuka?'❤️ Suka':'👍 Suka')+'</button>'
 +'<button class="btn btnKomen">💬 Komentar</button>'
 +'</div>'
 +'<div class="komentarBox">'
 +komentar.map(function(k){return '<div class="komentarItem"><div class="avat" style="width:28px;height:28px;font-size:12px">'+esc(k.nama.charAt(0))+'</div>'
  +'<div class="gelembung"><b>'+esc(k.nama)+'</b><p>'+esc(k.teks)+'</p><small>'+waktuRel(k.waktu)+'</small></div></div>'}).join('')
 +'<div class="formKomen"><input placeholder="Tulis komentar..." maxlength="500"><button>Kirim</button></div>'
 +'</div></div>';
}

function pasangAksi(){
 document.querySelectorAll('.post').forEach(function(el){
  var id=el.dataset.id;
  el.querySelector('.btnSuka').onclick=function(){
   api('/api/suka',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({postId:id,penyuka:devId()})}).then(function(){muatFeed()})
    .catch(function(){status('❌ gagal menyukai',2500)})};
  el.querySelector('.btnKomen').onclick=function(){el.classList.toggle('komentarTerbuka');
   var inp=el.querySelector('.formKomen input');if(el.classList.contains('komentarTerbuka'))inp.focus()};
  var form=el.querySelector('.formKomen'),inp=form.querySelector('input');
  function kirimK(){
   var t=inp.value.trim();if(!t)return;
   api('/api/komentar',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({postId:id,nama:nama(),teks:t})}).then(function(){inp.value='';muatFeed()})
    .catch(function(){status('❌ gagal berkomentar',2500)})}
  form.querySelector('button').onclick=kirimK;
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')kirimK()});
 });
}

/* ═══════════ MULAI ═══════════ */
if(window.self!==window.top){document.getElementById('alwiNavWrap').style.display='none'} /* sembunyi kalau dalam iframe */
pasangNama();
muatFeed();
setInterval(muatFeed,30000);
</script>
<!-- ══════════ /ALWIBOOK ══════════ -->
</body>
</html>
