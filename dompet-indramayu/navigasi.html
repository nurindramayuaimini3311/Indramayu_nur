<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alwi — Navigasi & Poin BRI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{min-height:100vh;background:linear-gradient(180deg,#0a0a0a 0%,#0f172a 100%);color:#e2e8f0;text-align:center;padding:20px}
h1{color:#00BFFF;font-size:20px;font-weight:900;letter-spacing:1px;margin-bottom:6px}
.sub{color:#64748b;font-size:12px;margin-bottom:20px}
a{color:#38bdf8;text-decoration:none;font-weight:700}
.wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px;text-align:left}
.panel{background:#0f172a;border:1px solid #1e293b;border-radius:14px;padding:16px;box-shadow:0 8px 24px rgba(0,191,255,.12)}
.panel h2{color:#00BFFF;font-size:13px;font-weight:800;margin-bottom:12px;border-bottom:1px dashed #334155;padding-bottom:8px;letter-spacing:.5px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0}
.row b{color:#facc15}
.bar{height:12px;background:#1e293b;border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00BFFF,#facc15);border-radius:99px;transition:width .6s}
.persen{font-size:11px;color:#64748b;text-align:right}
.btn{display:block;width:100%;padding:11px 12px;border:none;border-radius:10px;font-weight:800;font-size:12px;cursor:pointer;color:#fff;margin-top:8px;text-align:left}
.btn:active{transform:scale(.98)}
.b1{background:linear-gradient(135deg,#0284c7,#0e7490)}
.b2{background:linear-gradient(135deg,#16a34a,#0f766e)}
.b3{background:linear-gradient(135deg,#7f1d1d,#b91c1c)}
.navlink{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:99px;padding:8px 14px;font-size:11px;font-weight:700}
.chip.home{background:#0891b2;border-color:#38bdf8;color:#fff}
</style>
</head>
<body>
  <h1>📂 NAVIGASI & POIN BRI</h1>
  <div class="sub">INDRAMAYU CLUB • Alwi AI Hub</div>

  <div class="wrap">

    <div class="panel">
      <h2>⭐ POIN ALWI → BANK BRI</h2>
      <div class="row"><span>💰 Poin</span><b id="p-poin">0</b></div>
      <div class="row"><span>🎯 Target tukar</span><b id="p-target">1000</b></div>
      <div class="row"><span>💵 Nilai tukar</span><b id="p-nilai">0</b></div>
      <div class="row" style="font-size:11px;color:#64748b;display:none"><span>👤 UID</span><span id="p-uid" style="color:#94a3b8"></span></div>
      <div class="bar"><i id="p-bar"></i></div>
      <div class="persen" id="p-persen">0%</div>
      <button class="btn b1" onclick="cekPoinWA()">📊 Cek Poin (Kirim ke WA Admin)</button>
      <button class="btn b2" onclick="tukarPoinWA()">🏦 Tukar Poin → Bank BRI</button>
      <button class="btn b3" onclick="window.open('http://34.170.37.50:8000/','_blank')">💳 Cek Saldo BRI</button>
    </div>

    <div class="panel">
      <h2>🧭 PINDAH HALAMAN</h2>
      <div class="navlink">
        <a class="chip home" href="/">🏠 Halaman Utama</a>
        <a class="chip" href="../bola_bayangan.html">⚽ Main & Ngodrol</a>
      </div>
    </div>

  </div>

<script>
!function(){
var API='http://34.170.37.50:8000';
var TARGET=1000, NILAI=10000, WA_ADMIN='6282147573665';
function uid(){var u=localStorage.getItem('alwi_uid');if(!u){u='U'+Date.now().toString(36)+Math.random().toString(36).substr(2,4);localStorage.setItem('alwi_uid',u);}return u;}
function poin(){return parseInt(localStorage.getItem('alwi_poin')||'0',10)||0;}
function $id(i){return document.getElementById(i);}
function notif(msg){var d=document.createElement('div');d.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#00BFFF;color:#000;padding:12px 24px;border-radius:30px;font-weight:900;font-size:13px;z-index:999999999;box-shadow:0 4px 20px rgba(0,191,255,.6)';d.textContent='⭐ '+msg;document.body.appendChild(d);setTimeout(function(){d.style.opacity='0';d.style.transition='.3s';},1800);setTimeout(function(){d.remove();},2300);}
function gambar(){
  var p=poin();
  $id('p-poin').textContent=p;
  $id('p-target').textContent=TARGET;
  $id('p-nilai').textContent='Rp '+NILAI.toLocaleString();
  $id('p-uid').textContent=uid();
  var persen=Math.min(100,Math.round(p/TARGET*100));
  $id('p-bar').style.width=persen+'%';
  $id('p-persen').textContent=persen+'%';
  window.infoPoin&&(window.infoPoin.data={uid:uid(),poin:p,target:TARGET,progress:persen+'%'});
}
window.cekPoinWA=function(){
  var p=poin(),sisa=Math.max(0,TARGET-p);
  var m='⭐ *POIN ALWI* ⭐\n\n💰 Poin: *'+p+'*\n🎯 Target: '+TARGET+'\n📊 Progress: '+Math.round(p/TARGET*100)+'%\n';
  m+=p>=TARGET?'\n✅ *Siap tukar!*':'\n🔄 Kurang '+sisa+' poin';
  window.open('https://wa.me/'+WA_ADMIN+'?text='+encodeURIComponent(m),'_blank');
};
window.tukarPoinWA=function(){
  var p=poin();
  if(p<TARGET){notif('Belum cukup! Minimal '+TARGET);return;}
  var m='🎉 *TUKAR POIN → BANK BRI*\n\n👤 User: '+uid()+'\n💰 Ditukar: '+TARGET+' poin\n💵 Nilai: Rp '+NILAI.toLocaleString()+'\n\nKlaim hadiah ke admin!';
  window.open('https://wa.me/'+WA_ADMIN+'?text='+encodeURIComponent(m),'_blank');
};
window.infoPoin=function(){return{uid:uid(),poin:poin(),target:TARGET,progress:Math.round(poin()/TARGET*100)+'%'};};
function sync(){
  try{
    fetch(API+'/api/poin/sync',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({uid:uid(),poin:poin(),name:'Player',account_no:''})}).then(function(r){return r.json();}).catch(function(){});
  }catch(e){}
}
function cekServer(){
  try{
    fetch(API+'/api/poin?uid='+encodeURIComponent(uid())).then(function(r){return r.json();}).then(function(d){
      if(d&&d.poin!=null){localStorage.setItem('alwi_poin',String(d.poin));gambar();}
    }).catch(function(){});
  }catch(e){}
}
gambar();
sync();
setTimeout(cekServer,800);
window.addEventListener('alwiPoinUpdate',gambar);
setInterval(gambar,2000);
}();
</script>
</body>
</html>
