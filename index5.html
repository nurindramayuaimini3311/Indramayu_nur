<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartu Gabungan — Nur Lab & Tanya Jawab</title>
<meta name="theme-color" content="#ffffff">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen">
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between gap-2 sticky top-0 z-20">
    <div class="leading-tight">
      <div class="font-bold tracking-[3px] text-sm">🕌 INDRAMAYU CLUB</div>
      <div class="text-[10px] tracking-[2px] text-slate-500">NUR SYSTEM • MAKRIFAT DIGITAL</div>
    </div>
    <div class="flex gap-2 text-[10px]">
      <button onclick="setTab('lab')" id="tab-lab" class="px-3 py-1.5 rounded-lg font-bold border transition-colors border-indigo-600 bg-indigo-600 text-white">⚡ Nur Lab</button>
      <button onclick="setTab('tj')" id="tab-tj" class="px-3 py-1.5 rounded-lg font-bold border border-slate-300 bg-white text-slate-600">💬 Tanya Jawab</button>
    </div>
  </header>

  <main class="p-3 space-y-3">
    <section id="card-lab" class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
      <div class="flex items-center justify-between px-3 py-2 border-b border-slate-100">
        <span class="text-[11px] font-bold text-slate-700">⚡ NUR LAB — Kreatif & AI</span>
        <span class="text-[10px] text-slate-400">nurindramayuaimini3311.github.io/Indramayu_nur/index4.html</span>
      </div>
      <iframe id="fr-lab" class="w-full h-[75vh] block bg-white" src="https://nurindramayuaimini3311.github.io/Indramayu_nur/index4.html"></iframe>
    </section>

    <section id="card-tj" class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm hidden">
      <div class="flex items-center justify-between px-3 py-2 border-b border-slate-100">
        <span class="text-[11px] font-bold text-slate-700">💬 TANYA JAWAB</span>
        <span class="text-[10px] text-slate-400">nurindramayuaimini3311.github.io/Indramayu_nur/tanya_jawab_v3.html</span>
      </div>
      <iframe id="fr-tj" class="w-full h-[75vh] block bg-white" src="https://nurindramayuaimini3311.github.io/Indramayu_nur/tanya_jawab_v3.html"></iframe>
    </section>
  </main>

  <footer class="text-center text-[10px] text-slate-400 pb-4 mt-2">
    INDRAMAYU CLUB NUR SYSTEM • MAKRIFAT DIGITAL © 2026
  </footer>

  <script>
    function setTab(t){
      const lab = document.getElementById('card-lab');
      const tj  = document.getElementById('card-tj');
      const bl = document.getElementById('tab-lab');
      const bt = document.getElementById('tab-tj');
      if (t === 'lab'){
        lab.classList.remove('hidden');
        tj.classList.add('hidden');
        bl.className = 'px-3 py-1.5 rounded-lg font-bold border transition-colors border-indigo-600 bg-indigo-600 text-white';
        bt.className = 'px-3 py-1.5 rounded-lg font-bold border border-slate-300 bg-white text-slate-600';
      } else {
        tj.classList.remove('hidden');
        lab.classList.add('hidden');
        bt.className = 'px-3 py-1.5 rounded-lg font-bold border transition-colors border-indigo-600 bg-indigo-600 text-white';
        bl.className = 'px-3 py-1.5 rounded-lg font-bold border border-slate-300 bg-white text-slate-600';
      }
    }
  </script>
</body>
</html>
