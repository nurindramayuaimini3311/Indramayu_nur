<!DOCTYPE html>
<html lang="id">
<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>
(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {
        options = Object.assign({}, options, { passive: true });
      }
    }
    return origAdd.call(this, type, listener, options);
  };
})();
</script><script>window.Intl=window.Intl||{};Intl.t=function(s){return(Intl._locale&&Intl._locale[s])||s;};</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Joglo Horror - Indramayu Club</title>
<style>
body{margin:0;background:#050508;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:12px}
.box{max-width:500px;width:100%;background:#111118;border-radius:14px;overflow:hidden;border:1px solid #222}
.head{background:linear-gradient(135deg,#1a0000,#330000);padding:14px;text-align:center;border-bottom:2px solid #ff0000}
.head h1{margin:0;color:#ff5555;font-size:16px} .head p{font-size:10px;color:#888}
.content{padding:16px}
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px}
.grid img{width:100%;height:80px;object-fit:cover;border-radius:8px;border:1px solid #333;filter:brightness(0.6)}
.grid img.reveal{filter:brightness(1) drop-shadow(0 0 8px red)}
.q{font-weight:bold;font-size:14px;margin:12px 0}
.opt{background:#1e1e28;border:1px solid #333;color:#fff;padding:11px;border-radius:8px;margin-bottom:7px;width:100%;text-align:left;cursor:pointer}
.opt.correct{background:#0a3d0a;border-color:#2ecc71} .opt.wrong{background:#3d0a0a;border-color:#e74c3c}
.jumpscare{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:99}
.jumpscare.show{display:flex;animation:shake 0.3s}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-5px,5px)}75%{transform:translate(5px,-5px)}}
</style>
</head>
<body>
<div class="box">
<div class="head"><h1>🏚️ JOGLO HORROR QUIZ</h1><p>hantu1-4.webp + alwi_ghost_bug + nur_light - Berani?</p></div>
<div class="content">
<div class="grid">
<img src="../img/hantu1.webp" id="h1"><img src="../img/hantu2.webp" id="h2">
<img src="../img/hantu3.webp" id="h3"><img src="../img/hantu4.webp" id="h4">
</div>
<div id="level" style="font-size:11px;color:#666">Level 1/10</div>
<div class="q" id="q">Loading...</div>
<div id="opts"></div>
<div style="font-size:10px;color:#555;margin-top:12px">Pakai <code>nur_light.png</code> sebagai senter. Jika salah, hantu muncul!</div>
</div>
</div>
<div class="jumpscare" id="jump"><img id="jumpImg" src="" style="max-width:80%;max-height:80%;border-radius:12px"></div>
<script>
const soal=[
{q:"Hantu yang sering di rumah joglo Indramayu disebut?", o:["Wewe Gombel","Drakula","Zombie","Vampire"], a:0},
{q:"Agar hantu tidak masuk joglo, biasanya dipasang?", o:["Nur Light / lampu terang","Cermin retak","Buku kosong","Kipas angin"], a:0},
{q:"Agent Alwi di img/agent_alwi_icon.png tugasnya?", o:["Berburu hantu bug","Jualan cilok","Ngaji saja","Tidur"], a:0},
{q:"hantu1.webp kalau di-tap di game Joglo Panic akan?", o:["Ketangkep + skor","Meledak HP","Keluar iklan","Error"], a:0},
{q:"Rumah joglo atapnya berbentuk?", o:["Tajug / tinggi menjulang","Datar","Bulat","Miring sebelah"], a:0},
{q:"Guru Nur di guru_nur1.webp mengajari apa biar hantu takut?", o:["Doa & Nur Light","Cara joget","Cara masak","Cara nangis"], a:0},
{q:"Waktu paling angker di joglo?", o:["Maghrib - Tengah malam","Siang bolong","Pagi-pagi","Jam makan siang"], a:0},
{q:"Kalau ketemu alwi_ghost_bug.png harus?", o:["Tangkap pakai combo","Diemin aja","Di-Chat","Di-Follow"], a:0},
{q:"Keluarga Alwi di keluarga_Alwi.webp tinggal di?", o:["Rumah Joglo","Apartemen","Kapal","Goa"], a:0},
{q:"Akhir dari game horror yang bagus?", o:["Semua hantu ketangkep & jadi teman","HP rusak","Game crash","Lupa save"], a:0}
];
let idx=0, skor=0;
function load(){
  document.getElementById('level').textContent=`Soal ${idx+1}/10 - Skor ${skor}`;
  document.getElementById('q').textContent=soal[idx].q;
  const c=document.getElementById('opts'); c.innerHTML='';
  soal[idx].o.forEach((t,i)=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=t; b.onclick=()=>cek(i,b); c.appendChild(b);
  });
  document.querySelectorAll('.grid img').forEach(im=>im.classList.remove('reveal'));
}
function cek(p,b){
  document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  if(p===soal[idx].a){ b.classList.add('correct'); skor++; setTimeout(next,700); }
  else { 
    b.classList.add('wrong');
    // jumpscare
    const jump=document.getElementById('jump');
    const img=document.getElementById('jumpImg');
    const rand=Math.floor(Math.random()*4)+1;
    img.src=`../img/hantu${rand}.webp`;
    jump.classList.add('show');
    setTimeout(()=>{ jump.classList.remove('show'); next(); },1200);
  }
}
function next(){ idx++; if(idx<soal.length) load(); else { alert(`Horor selesai! Skor ${skor}/10 - ${skor>=7?'Pemberani Joglo!':'Masih penakut, latihan di rumah joglo lagi!'}`); idx=0; skor=0; load(); } }
load();
</script>


<!-- NAV FINAL ALWI - 1x ONLY -->
<div id="alwi-rl" style="position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;z-index:9999999;padding:0 12px;pointer-events:none"><a id="rlL" style="pointer-events:auto;width:56px;height:56px;background:#FFD700;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;text-decoration:none;border:3px solid #000;box-shadow:0 4px 12px rgba(0,0,0,.5)">←</a><a id="rlR" style="pointer-events:auto;width:56px;height:56px;background:#FFD700;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;text-decoration:none;border:3px solid #000;box-shadow:0 4px 12px rgba(0,0,0,.5)">→</a></div>
<script>
(function(){
const PAGES=["/","/setting/","/alwiSD/","/fiturBARU/","/game/","/kamera-hantu/","/konten/","/kuis/","/netflix/","/pencuri/","/peta/","/peta/peta-cod.html"];
let p=location.pathname; let i=PAGES.indexOf(p);
if(i==-1) i=PAGES.findIndex(x=>p.includes(x.replace(/\//g,'').replace('.html','')));
if(i<0) i=0;
let prev=PAGES[(i-1+PAGES.length)%PAGES.length], next=PAGES[(i+1)%PAGES.length];
let L=document.getElementById('rlL'), R=document.getElementById('rlR');
L.href=prev; R.href=next;
let ctx; function tuk(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.setValueAtTime(700,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(150,ctx.currentTime+0.12);g.gain.setValueAtTime(0.6,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.14);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.14);if(navigator.vibrate)navigator.vibrate(40);}catch(e){}}
[L,R].forEach(b=>b.addEventListener('click',()=>{tuk();b.style.transform='scale(0.8)';setTimeout(()=>b.style.transform='',120);}));
let sx=0;
document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>70){tuk(); setTimeout(tuk,70); if(dx>0) location.href=prev; else location.href=next;}},{passive:true});
if(location.pathname.includes('alwiSD')){
 let s=document.createElement('style');s.innerHTML="#alwi-rl a{animation:bob 0.7s infinite alternate} @keyframes bob{0%{transform:translateY(0)}100%{transform:translateY(-8px) scale(1.1)}}";document.head.appendChild(s);
}
})();
</script>
</body>
</html>
