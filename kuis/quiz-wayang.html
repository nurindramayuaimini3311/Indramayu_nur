<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Punakawan - Indramayu Club</title>
<style>
body{margin:0;background:#121212;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:15px}
.box{max-width:500px;width:100%;background:#1e1e1e;border-radius:14px;overflow:hidden;border:1px solid #333}
.head{background:linear-gradient(135deg,#3e2723,#795548);padding:16px;text-align:center}
.head h1{margin:0;font-size:18px;color:#ffd700} .head p{font-size:11px;color:#bbb;margin-top:4px}
.content{padding:18px}
.char-row{display:flex;gap:8px;margin-bottom:15px}
.char-row img{width:60px;height:60px;border-radius:10px;object-fit:cover;border:2px solid #444}
.char-row img.active{border-color:#ffd700;box-shadow:0 0 10px #ffd700}
.q{font-size:15px;font-weight:bold;margin-bottom:12px;min-height:40px}
.opt{background:#2a2a2a;border:1px solid #444;color:#fff;width:100%;padding:12px;border-radius:8px;margin-bottom:8px;text-align:left;cursor:pointer}
.opt:hover{border-color:#ffd700} .opt.correct{background:#1b5e20;border-color:#4caf50} .opt.wrong{background:#b71c1c;border-color:#f44336}
.hint{font-size:11px;color:#aaa;margin-top:10px;background:#252525;padding:8px;border-radius:6px;border-left:3px solid #ffd700}
</style>
</head>
<body>
<div class="box">
<div class="head"><h1>🎭 TEBAK PUNAKAWAN</h1><p>Gareng - Bagong - Petruk - Semar | dari aset img kamu</p></div>
<div class="content">
<div class="char-row">
<img id="imgGareng" src="../img/Gareng.webp" onerror="this.src='https://via.placeholder.com/60'" >
<img id="imgBagong" src="../img/bagong.webp" onerror="this.src='https://via.placeholder.com/60'">
<img id="imgPetruk" src="../img/petruk.webp" onerror="this.src='https://via.placeholder.com/60'">
<img src="../img/rumah_joglo.webp" style="margin-left:auto;width:60px;height:60px;border-radius:10px;object-fit:cover;opacity:0.6">
</div>
<div id="level" style="font-size:11px;color:#888;margin-bottom:8px">Soal 1/10</div>
<div class="q" id="q">Loading...</div>
<div id="opts"></div>
<div class="hint" id="hint">Pilih karakter Punakawan favoritmu!</div>
</div>
</div>
<script>
const soal=[
{q:"Siapa Punakawan yang kakinya pincang dan tangannya cacat?", o:["Gareng","Bagong","Petruk","Semar"], a:0, h:"Gareng = simbol kebijaksanaan, cacat fisik tapi hati sempurna. Lihat img/Gareng.webp"},
{q:"Bagong itu anaknya siapa di cerita wayang?", o:["Semar","Arjuna","Petruk","Gareng"], a:0, h:"Bagong adalah anak bungsu Semar, paling nakal lucu. Cek bagong.webp"},
{q:"Petruk cirinya hidung panjang dan paling jangkung, sifatnya?", o:["Suka bercanda & cerdas","Pendiam","Pemarah","Suka tidur"], a:0, h:"Petruk = tukang ngocol tapi pinter, sering jadi juru bicara."},
{q:"Di rumah joglo Indramayu, Punakawan biasanya dipasang di?", o:["Sasana wayang / pajangan","Dapur","Kandang ayam","Sumur"], a:0, h:"Joglo = rumah adat, wayang jadi hiasan sakral. Lihat rumah_joglo.webp"},
{q:"Jika Gareng, Petruk, Bagong bersatu, guru mereka siapa?", o:["Semar","Gatotkaca","Bima","Kresna"], a:0, h:"Semar = dewa yang jadi abdi, bapaknya Punakawan."},
{q:"Gareng melambangkan penolakan terhadap?", o:["Sifat iri & rakus","Sifat malas","Sifat sombong saja","Sifat pelit"], a:0, h:"Filosofi: kaki pincang = jangan iri, tangan cacat = jangan rakus."},
{q:"Bagong dalam lakon sering jadi apa?", o:["Penengah yang jujur & ceplas-ceplos","Raja","Musuh","Dalang"], a:0, h:"Bagong ceplas-ceplos tapi jujur, makanya disukai warga."},
{q:"Petruk pernah jadi raja dengan gelar?", o:["Petruk Kanthong Bolong jadi Ratu","Petruk Raja Jawa","Petruk Presiden","Petruk Lurah"], a:0, h:"Lakon populer: Petruk Dadi Ratu - rakyat kecil jadi pemimpin!"},
{q:"Pasangan Punakawan di Indramayu biasanya tampil dengan bahasa?", o:["Jawa Dermayu + Indonesia","Jawa Kromo Inggil saja","Sunda","Inggris"], a:0, h:"Dermayu = campuran Jawa-Sunda, lucu kalau ngobrol!"},
{q:"Kuis ini pakai aset apa saja dari folder img?", o:["Gareng.webp, bagong.webp, petruk.webp, rumah_joglo.webp","Cuma hantu","Cuma icon","Tidak pakai aset"], a:0, h:"Semua aset Punakawan kamu kepakai di game ini!"}
];
let idx=0, skor=0;
function load(){
  const s=soal[idx];
  document.getElementById('level').textContent=`Soal ${idx+1}/10 - Skor ${skor}`;
  document.getElementById('q').textContent=s.q;
  document.getElementById('hint').textContent='💡 '+s.h;
  document.querySelectorAll('.char-row img').forEach(i=>i.classList.remove('active'));
  if(idx%3===0) document.getElementById('imgGareng').classList.add('active');
  if(idx%3===1) document.getElementById('imgBagong').classList.add('active');
  if(idx%3===2) document.getElementById('imgPetruk').classList.add('active');
  const c=document.getElementById('opts'); c.innerHTML='';
  s.o.forEach((t,i)=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=t; b.onclick=()=>cek(i,b); c.appendChild(b);
  });
}
function cek(p,b){
  const s=soal[idx];
  document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  if(p===s.a){ b.classList.add('correct'); skor++; setTimeout(next,800); }
  else { b.classList.add('wrong'); document.querySelectorAll('.opt')[s.a].classList.add('correct'); setTimeout(next,1200); }
}
function next(){ idx++; if(idx<soal.length) load(); else { alert(`Selesai! Skor ${skor}/10 - ${skor>=7?'Dalang Wayang Sejati!':'Belajar lagi tentang Punakawan ya!'}`); idx=0; skor=0; load(); } }
load();
</script>
