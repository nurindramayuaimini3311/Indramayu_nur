<html lang="id">
<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Alwi Rank - Indramayu Club</title>
<style>
body{margin:0;background:#0a1f1c;color:#f2ead3;font-family:'Segoe UI',sans-serif;display:flex;justify-content:center;padding:15px}
.box{max-width:500px;width:100%;background:#0f2b26;border:1px solid #2a5049;border-radius:14px;overflow:hidden}
.head{background:linear-gradient(135deg,#d4af37,#8c6a00);color:#000;padding:16px;text-align:center}
.head h1{margin:0;font-size:17px} .head p{font-size:11px;margin-top:3px}
.content{padding:18px}
.input{width:100%;padding:10px;border-radius:8px;border:1px solid #2a5049;background:#0a1f1c;color:#fff;margin-bottom:12px}
.q{font-weight:600;margin-bottom:12px}
.opt{width:100%;padding:11px;border:1px solid #2a5049;border-radius:8px;background:#132e28;color:#f2ead3;margin-bottom:8px;text-align:left;cursor:pointer}
.opt:hover{border-color:#d4af37} .opt.correct{background:#0f3d20;border-color:#2ecc71} .opt.wrong{background:#3d0f0f;border-color:#e74c3c}
.rank{margin-top:15px;padding:12px;border-radius:10px;background:#0a1f1c;border:1px dashed #d4af37;text-align:center}
</style>
</head>
<body>
<div class="box">
<div class="head"><h1>⛑️ AGENT ALWI RANK TEST</h1><p>Ujian masuk Indramayu Club - ID Member</p></div>
<div class="content">
<input class="input" id="nama" placeholder="Nama Member (contoh: Abdul Kohar)">
<input class="input" id="idmember" placeholder="ID Member (contoh: IMC-001)">
<div id="level" style="font-size:11px;color:#b9b39d;margin-bottom:8px">Soal 1/10</div>
<div class="q" id="q">Loading...</div>
<div id="opts"></div>
<div class="rank" id="rankBox" style="display:none"></div>
</div>
</div>
<script>
const soal=[
{q:"Portal utama Indramayu Club dijaga siapa?", o:["Bot Alwi","Pak Lurah","Mbah Google","Admin FB"], a:0},
{q:"Jika ada member baru, harus lewat?", o:["login_member.html","langsung masuk","bobol","teleport"], a:0},
{q:"Tugas Agent Alwi icon?", o:["Jaga peta, kuis, komentar","Jualan pulsa","Ngoding 24 jam","Tidur"], a:0},
{q:"Komentar member disimpan di?", o:["komentar.html","kulkas","dompet","awan"], a:0},
{q:"Peta COD buat apa?", o:["Titik temu COD member","Main bola","Cari jodoh","Cari hantu"], a:0},
{q:"Wali Alwi di wali_Alwi.webp adalah?", o:["Sesepuh penjaga klub","Tukang parkir","Youtuber","Gamers"], a:0},
{q:"Syarat jadi Agent Alwi?", o:["Lulus 3 kuis + hafal Tangga Hikmah","Bayar 1M","Punya KTP saja","Bisa joget"], a:0},
{q:"Folder img berisi apa?", o:["Aset wayang & hantu & Alwi","Kosong","Virus","Lagu"], a:0},
{q:"Kuis yang paling susah?", o:["Tangga Hikmah Level 15","Tebak gorengan","Tebak warna","Tebak umur"], a:0},
{q:"Motto Indramayu Club?", o:["Guyub, Rukun, Manfaat","Makan, Tidur, Main","Cari Cuan Terus","Hidup Suka-suka"], a:0}
];
let idx=0, skor=0;
function load(){
  document.getElementById('level').textContent=`Soal ${idx+1}/10 - Skor ${skor}`;
  document.getElementById('q').textContent=soal[idx].q;
  const c=document.getElementById('opts'); c.innerHTML='';
  soal[idx].o.forEach((t,i)=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=t; b.onclick=()=>cek(i,b); c.appendChild(b);
  });
}
function cek(p,b){
  document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  if(p===soal[idx].a){ b.classList.add('correct'); skor++; setTimeout(next,600); }
  else { b.classList.add('wrong'); setTimeout(next,900); }
}
function next(){
  idx++; if(idx<soal.length) load(); else finish();
}
function finish(){
  const nama=document.getElementById('nama').value||'Member';
  const id=document.getElementById('idmember').value||'IMC-???';
  let rank='Pemula'; 
  if(skor>=9) rank='WALI ALWI - Level Tertinggi!'; else if(skor>=7) rank='Agent Alwi Senior'; else if(skor>=5) rank='Anggota Tetap'; else rank='Calon Member - Belajar lagi';
  const box=document.getElementById('rankBox'); box.style.display='block';
  box.innerHTML=`<b style="color:#d4af37">HASIL UJIAN</b><br>${nama} (${id})<br>Skor ${skor}/10<br><br><span style="font-size:18px">🏅 ${rank}</span><br><br><button onclick="location.reload()" style="padding:8px 12px;border-radius:6px;border:none;background:#d4af37;font-weight:bold;cursor:pointer">Ulangi Tes</button>`;
  document.getElementById('q').textContent='Ujian selesai!';
  document.getElementById('opts').innerHTML='';
}
load();
</script>

<script>
(function(){
const PAGES=["/","/setting/","/alwiSD/","/fiturBARU/","/game/","/kamera-hantu/","/konten/","/kuis/","/netflix/","/pencuri/","/peta/","/peta/peta-cod.html"];
let p=location.pathname; let i=PAGES.indexOf(p);
if(i==-1) i=PAGES.findIndex(x=>p.includes(x.replace(/\//g,'').replace('.html','')));
if(i<0) i=0;
let prev=PAGES[(i-1+PAGES.length)%PAGES.length], next=PAGES[(i+1)%PAGES.length];
let L=document.getElementById('rlL'), R=document.getElementById('rlR');
L.href=prev; R.href=next;
let ctx; function tuk(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.setValueAtTime(700,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(150,ctx.currentTime+0.12);g.gain.setValueAtTime(0.6,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.14);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.14);if(navigator.vibrate)navigator.vibrate(40);}catch(e){}}
[L,R].forEach(b=>b.addEventListener('click',()=>{tuk();b.style.transform='scale(0.8)';setTimeout(()=>b.style.transform='',120);}));
let sx=0;
document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>70){tuk(); setTimeout(tuk,70); if(dx>0) location.href=prev; else location.href=next;}},{passive:true});
if(location.pathname.includes('alwiSD')){
 let s=document.createElement('style');s.innerHTML="#alwi-rl a{animation:bob 0.7s infinite alternate} @keyframes bob{0%{transform:translateY(0)}100%{transform:translateY(-8px) scale(1.1)}}";document.head.appendChild(s);
}
})();
</script>
</body>
</html>
