<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Form & Log Komentar Member | Indramayu Club</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0a0a0a; color: #fff; min-height: 100vh; padding: 15px; }
        .container { max-width: 650px; margin: 0 auto; background: #111; border: 1px solid rgba(201,168,76,0.4); border-radius: 14px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        h2 { color: #FFD700; text-align: center; margin-bottom: 5px; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { text-align: center; font-size: 12px; color: #aaa; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #FFD700; margin-bottom: 6px; }
        input[type="text"], textarea { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
        input[type="text"]:focus, textarea:focus { border-color: #FFD700; box-shadow: 0 0 8px rgba(255,215,0,0.3); }
        textarea { resize: vertical; min-height: 90px; }
        
        .btn-kirim { width: 100%; padding: 12px; background: linear-gradient(135deg, #C9A84C, #FFD700); color: #000; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; text-transform: uppercase; transition: 0.2s; }
        .btn-kirim:hover { background: #FFD700; opacity: 0.9; transform: translateY(-1px); }
        
        .log-section { margin-top: 25px; border-top: 1px solid #222; padding-top: 15px; }
        .log-title { font-size: 15px; font-weight: 700; color: #FFD700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .badge-count { background: rgba(201,168,76,0.2); border: 1px solid #FFD700; color: #FFD700; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        
        .komentar-list { display: flex; flex-direction: column; gap: 10px; max-height: 350px; overflow-y: auto; padding-right: 5px; }
        .komentar-card { background: #181818; border-left: 4px solid #FFD700; padding: 12px; border-radius: 6px; font-size: 13px; }
        .komentar-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .nama-member { font-weight: 700; color: #34A853; }
        .waktu { font-size: 10px; color: #777; }
        .isi-pesan { color: #ddd; line-height: 1.4; word-break: break-word; }
        
        /* Custom Scrollbar */
        .komentar-list::-webkit-scrollbar { width: 6px; }
        .komentar-list::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>💬 Portal Komentar Member</h2>
    <p class="subtitle">Indramayu Club Digital Ecosystem</p>
    
    <form id="commentForm">
        <div class="form-group">
            <label for="nama">Nama Member / ID:</label>
            <input type="text" id="nama" placeholder="Contoh: Kang Alwi / Member 01" required>
        </div>
        <div class="form-group">
            <label for="komentar">Pesan / Komentar / Pertanyaan:</label>
            <textarea id="komentar" placeholder="Tuliskan komentar atau instruksi di sini..." required></textarea>
        </div>
        <button type="submit" class="btn-kirim">🚀 Kirim Komentar</button>
    </form>

    <div class="log-section">
        <div class="log-title">
            <span>📋 Log Komentar Masuk</span>
            <span class="badge-count" id="totalKomentar">0 Pesan</span>
        </div>
        <div class="komentar-list" id="komentarContainer">
            <!-- Komentar akan dipopulasikan lewat JS -->
        </div>
    </div>
</div>

<script>
    // Ambil data komentar dari localStorage saat pertama dimuat
    document.addEventListener("DOMContentLoaded", muatKomentar);

    const form = document.getElementById("commentForm");
    form.addEventListener("submit", function(e) {
        e.preventDefault();
        
        const namaInput = document.getElementById("nama").value.trim();
        const komentarInput = document.getElementById("komentar").value.trim();
        
        if (!namaInput || !komentarInput) return;

        const dataKomentar = {
            nama: namaInput,
            komentar: komentarInput,
            waktu: new Date().toLocaleString("id-ID")
        };

        simpanKomentar(dataKomentar);
        
        // Reset form
        document.getElementById("komentar").value = "";
        muatKomentar();
    });

    function simpanKomentar(data) {
        let listKomentar = JSON.parse(localStorage.getItem("log_komentar_member")) || [];
        listKomentar.unshift(data); // Tambahkan ke paling atas
        localStorage.setItem("log_komentar_member", JSON.stringify(listKomentar));
    }

    function muatKomentar() {
        let listKomentar = JSON.parse(localStorage.getItem("log_komentar_member")) || [];
        const container = document.getElementById("komentarContainer");
        const countBadge = document.getElementById("totalKomentar");
        
        countBadge.innerText = `${listKomentar.length} Pesan`;
        container.innerHTML = "";

        if (listKomentar.length === 0) {
            container.innerHTML = `<div style="text-align:center; color:#555; padding:20px; font-size:12px;">Belum ada komentar tersimpan.</div>`;
            return;
        }

        listKomentar.forEach(item => {
            const card = document.createElement("div");
            card.className = "komentar-card";
            card.innerHTML = `
                <div class="komentar-header">
                    <span class="nama-member">👤 ${escapeHTML(item.nama)}</span>
                    <span class="waktu">${item.waktu}</span>
                </div>
                <div class="isi-pesan">${escapeHTML(item.komentar)}</div>
            `;
            container.appendChild(card);
        });
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }
</script>
<script>
(function(){
const PAGES=["/","/setting/","/alwiSD/","/fiturBARU/","/game/","/kamera-hantu/","/konten/","/kuis/","/netflix/","/pencuri/","/peta/","/peta/peta-cod.html"];
let p=location.pathname; let i=PAGES.indexOf(p);
if(i==-1) i=PAGES.findIndex(x=>p.includes(x.replace(/\//g,'').replace('.html','')));
if(i<0) i=0;
let prev=PAGES[(i-1+PAGES.length)%PAGES.length], next=PAGES[(i+1)%PAGES.length];
let L=document.getElementById('rlL'), R=document.getElementById('rlR');
L.href=prev; R.href=next;
let ctx; function tuk(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.setValueAtTime(700,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(150,ctx.currentTime+0.12);g.gain.setValueAtTime(0.6,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.14);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.14);if(navigator.vibrate)navigator.vibrate(40);}catch(e){}}
[L,R].forEach(b=>b.addEventListener('click',()=>{tuk();b.style.transform='scale(0.8)';setTimeout(()=>b.style.transform='',120);}));
let sx=0;
document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>70){tuk(); setTimeout(tuk,70); if(dx>0) location.href=prev; else location.href=next;}},{passive:true});
if(location.pathname.includes('alwiSD')){
 let s=document.createElement('style');s.innerHTML="#alwi-rl a{animation:bob 0.7s infinite alternate} @keyframes bob{0%{transform:translateY(0)}100%{transform:translateY(-8px) scale(1.1)}}";document.head.appendChild(s);
}
})();
</script>
</body>
</html>
