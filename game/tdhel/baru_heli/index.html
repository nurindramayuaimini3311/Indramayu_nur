  var AU=null;
  function au(){ if(AU)return; try{var a=new(window.AudioContext||window.webkitAudioContext),s=a.createGain();
    s.gain.value=.25;var dm=a.createDynamicsCompressor();dm.connect(a.destination);s.connect(dm);AU={ctx:a,m:s};}catch(e){AU={ctx:null,m:null};} }
  function sfx(f,d,ty,gv,sl){var M=AU;if(!M||!M.ctx||!M.m)return;try{var t=M.ctx.currentTime,o=M.ctx.createOscillator(),
    fg=M.ctx.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),t+d);
    fg.gain.setValueAtTime(.0001,t);fg.gain.exponentialRampToValueAtTime(gv,t+.01);fg.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(fg);fg.connect(M.m);o.start(t);o.stop(t+d+.05);}catch(e){} }

  // primitif: gambar sisi-banyak akan keliling lingkaran (fill penuh)
  function poly(cx,cy,r,n,rot,color){
    g.beginPath();
    for(var i=0;i<n;i++){
      var ag=rot+i/n*6.2832;
      var px=cx+Math.cos(ag)*r, py=cy+Math.sin(ag)*r;
      if(i===0)g.moveTo(px,py); else g.lineTo(px,py);
    }
    g.closePath();
    if(color){g.fillStyle=color;g.fill();}
  }
  function disc(cx,cy,r,color){
    g.beginPath();g.arc(cx,cy,r,0,6.2832);g.fillStyle=color;g.fill();
  }

    document.getElementById('skor').textContent='SKOR '+skor;
    var t;
    if(bossFase){ t=bosses.some(function(b){return b.life;})?'BOSS!':'BOSS!'; }
    else { var s=Math.max(0,LEVELS[level]-levelTime);t=Math.floor(s/60)+':'+('0'+Math.floor(s%60)).slice(-2); }
    document.getElementById('tim').textContent=t;
  }

  function spawnEnemy(n){
    for(var i=0;i<n;i++){
      enemies.push({x:20+Math.random()*(innerWidth-70),y:-50-Math.random()*80,w:44,h:44,
        vy:1.1+Math.random()*1.3,cd:40+Math.random()*80,life:1,type:Math.random()<.15?2:0});
    }
  }

  // ==== UPDATE ====
  function update(){
    if(!playing||over)return;
    frame++;
    levelTime+=1/60;
    if(cloudMode){
      clouds.forEach(function(cl){ cl.y+=cl.sp; cl.x+=Math.sin(frame*0.005+cl.y*0.01)*0.6; if(cl.y>innerHeight+100){cl.y=-120; cl.x=Math.random()*innerWidth;} });
      if(Math.random()<0.003){ lightningT=8; sfx(30,.3,'sawtooth',.2,-50); }
      if(lightningT>0) lightningT--;
    }


    if(keys['w']||keys['arrowup'])hero.ty-=hero.speed;
    if(keys['s']||keys['arrowdown'])hero.ty+=hero.speed;
    if(keys['a']||keys['arrowleft'])hero.tx-=hero.speed;
    if(keys['d']||keys['arrowright'])hero.tx+=hero.speed;
    hero.x+=(hero.tx-hero.x)*.22;
    hero.y+=(hero.ty-hero.y)*.22;
    hero.x=Math.max(0,Math.min(innerWidth-hero.w,hero.x));
    hero.y=Math.max(0,Math.min(innerHeight-hero.h,hero.y));

    // AUTO-FIRE HUJAN PELURU (7 spread)
    mycd--;
    if(mycd<=0){
      mycd=bossFase?9:11;
      for(var s=-3;s<=3;s++){ mb.push({x:hero.x+hero.w/2+s*7,y:hero.y-6,w:5,h:16,vy:-11}); }
      sfx(90,.09,'square',.14,18);
    }

    // SPAWN gelombang musuh selama durasi
    if(!bossFase){
      spawnCd--;
      if(spawnCd<=0){
        spawnCd=Math.max(38,110-level*4);
        spawnEnemy(2+Math.floor(level*0.8));
      }
    } else {
      spawnB--;
      if(spawnB<=0){ spawnB=95; spawnEnemy(1+Math.floor(level/3)); }
    }

    // BOSS FASE: muncul setelah durasi
    if(!bossFase && levelTime>=LEVELS[level]){
      bossFase=true;
      var cfg=BCFG[level];
      var bw=Math.min(255,innerWidth*.5), bh=bw/BOSSR;
      for(var i=0;i<cfg.count;i++){
        var px=innerWidth/2-bw/2+(i-(cfg.count-1)/2)*(bw+12);
        bosses.push({x:px,dir:1,y:-bh-40*(i),w:bw,h:bh,hp:cfg.hp,maxhp:cfg.hp,cfg:cfg,
          cd:50+i*24,vy:.5,life:1,inv:cfg.inv,t:0,pattern:cfg.pats[i],spA:0});
      }
      sfx(60,.4,'sawtooth',.3,-100);
    }

    // boss gerak + tembak
    bosses.forEach(function(b){
      b.t+=1/60;
      if(b.inv>0)b.inv-=1/60;
      if(b.y<innerHeight*0.18)b.y+=b.vy;
      // DISCO(3) bergerak zig-zag
      if(b.pattern===3){
        b.spA=(b.spA||0)+0.005;
        b.x+=Math.sin(b.spA*20)*2.2;
        b.x=Math.max(10,Math.min(innerWidth-b.w-10,b.x));
      }
      b.cd--;
      if(b.cd<=0){
        b.cd=34;
        var cx=b.x+b.w/2,cy=b.y+b.h/2;
        function aim(off,sp){
          var dx=hero.x+hero.w/2-cx+off,dy=hero.y+hero.h/2-cy;
          var len=Math.hypot(dx,dy)||1;
          eb.push({x:cx-4,y:cy-4,w:8,h:8,vx:dx/len*sp,vy:dy/len*sp});
        }
        if(b.pattern===1){  // BIG BOSS: aimed spread + beam bawah
          for(var a=-1;a<=1;a++)aim(a*110,4.4);
          for(var k=0;k<3;k++)eb.push({x:cx-3+(k-1)*28,y:cy,w:6,h:14,vx:0,vy:4.8});
        } else if(b.pattern===2){ // CRAB UFO: capit shotgun + ring plasma kepiting + laser mata
          // tembakan capit kiri kanan
          var sideX = b.w*0.45;
          eb.push({x:cx-sideX-4,y:cy+10,w:10,h:10,vx:-1.5+ (Math.random()-0.5),vy:3.2});
          eb.push({x:cx+sideX-4,y:cy+10,w:10,h:10,vx:1.5+ (Math.random()-0.5),vy:3.2});
          // ring plasma kepiting
          var n=16;
          for(var i=0;i<n;i++){var ag=i/n*6.2832+ b.spA;eb.push({x:cx-4,y:cy-4,w:9,h:9,vx:Math.cos(ag)*2.6,vy:Math.sin(ag)*2.6});}
          b.spA+=0.18;
          // spiral cakar 3 arah
          for(var i2=0;i2<6;i2++){var ag2=b.spA*1.3+i2*1.047;eb.push({x:cx-4,y:cy-4,w:8,h:8,vx:Math.cos(ag2)*3.4,vy:Math.sin(ag2)*3.4});}
          // aimed laser dari mata alien (setiap 2 tembakan)
          if(Math.floor(b.spA*10)%2==0){
            var dx=hero.x+hero.w/2-cx,dy=hero.y+hero.h/2-cy;
            var len=Math.hypot(dx,dy)||1;
            eb.push({x:cx-3,y:cy-15,w:7,h:12,vx:dx/len*5.0,vy:dy/len*5.0});
          }
        } else if(b.pattern===3){ // DISCO: spiral berputar + aimed
          for(var i3=0;i3<5;i3++){var ag3=b.spA+i3*1.26;eb.push({x:cx-4,y:cy-4,w:8,h:8,vx:Math.cos(ag3)*3.2,vy:Math.sin(ag3)*3.2});}
          b.spA+=0.22;
          aim(0,4.2);aim(-80,3.8);aim(80,3.8);
        }
      }
    });

    // gerak peluru
    enemies.forEach(function(m){
      m.y+=m.vy+m.type*0.4;
      m.cd--;
      if(m.cd<=0&&m.y>0&&m.y<innerHeight){
        m.cd=60+Math.random()*40;
        var dx=hero.x+hero.w/2-(m.x+m.w/2),dy=hero.y+hero.h/2-(m.y+m.h/2);
        var len=Math.hypot(dx,dy)||1,sp=3.6;
        eb.push({x:m.x+m.w/2-3,y:m.y+m.h/2-3,w:7,h:7,vx:dx/len*sp,vy:dy/len*sp});
      }
    });
    mb.forEach(function(b){b.y+=b.vy;});
    eb.forEach(function(b){b.x+=b.vx;b.y+=b.vy;});
    enemies=enemies.filter(function(m){return m.y<innerHeight+60;});
    mb=mb.filter(function(b){return b.y>-20;});
    eb=eb.filter(function(b){return b.y>-30&&b.y<innerHeight+30&&b.x>-30&&b.x<innerWidth+30;});

    // peluru pemain -> musuh & boss
    mb.forEach(function(b){
      enemies.forEach(function(m){
        if(m.life&&hit(b,m)){m.life=0;b.y=-99;skor+=20;sfx(200,.18,'sawtooth',.2,-80);}
      });
      bosses.forEach(function(B){
        if(B.life&&hit(b,B)){
          if(B.inv<=0){B.hp--;if(B.hp<=0){B.life=0;skor+=300;sfx(120,.4,'sawtooth',.3,-60);}}
          b.y=-99;
        }
      });
    });
    enemies=enemies.filter(function(m){return m.life;});
    mb=mb.filter(function(b){return b.y>-20;});

    // peluru musuh -> hero
    eb.forEach(function(b){if(hit(b,hero)){b.y=99999;hero.hp--;sfx(150,.2,'square',.25,-100);}});
    eb=eb.filter(function(b){return b.y<innerHeight+30;});
    enemies.forEach(function(m){if(hit(m,hero)){m.life=0;hero.hp--;}});
    enemies=enemies.filter(function(m){return m.life;});
    bosses.forEach(function(B){if(B.life&&hit(B,hero))hero.hp--;});
    hud();

    // bossFase selesai => naik level
    if(bossFase && bosses.every(function(B){return !B.life;})){
      level++;
      if(level>=LEVELS.length){ over=true; playing=false; gameOverMsg('* * * MENANG! * * *  Skor '+skor,true); }
      else { reset(); sfx(880,.12,'square',.2,300); }
    }
    if(hero.hp<=0){over=true;playing=false;gameOverMsg('GAME OVER - Skor '+skor,false);}
  }

  // ==== DRAW (clearRect => tidak menumpuk) ====
  function draw(){
    // background gradient berubah kalau mode awan
    if(cloudMode){
      var sky = g.createLinearGradient(0,0,0,innerHeight);
      sky.addColorStop(0,'#0a1a3a');
      sky.addColorStop(0.4,'#162e5c');
      sky.addColorStop(0.8,'#0d1a33');
      sky.addColorStop(1,'#050a18');
      g.fillStyle=sky; g.fillRect(0,0,innerWidth,innerHeight);
    } else {
      g.clearRect(0,0,innerWidth,innerHeight);
    }
    g.globalAlpha=.5;g.fillStyle='#fff';
    for(var i=0;i<40;i++){g.globalAlpha=.3+((i*13)%5)*.12;g.fillRect((i*137)%innerWidth,(i*97+frame*.5)%innerHeight,2,2);}
    g.globalAlpha=1;

    // DRAW AWAN
    if(cloudMode){
      clouds.forEach(function(cl){
        // bayangan awan
        g.fillStyle='rgba(0,0,0,0.18)';
        g.beginPath();
        for(var p=0;p<cl.puff;p++){
          var px = cl.x + (p/cl.puff-0.5)*cl.w*0.8 + Math.sin(frame*0.01+p)*10;
          var py = cl.y + Math.cos(p*1.7)*cl.h*0.2;
          var pr = cl.h*0.6 + Math.sin(p)*cl.h*0.2;
          g.ellipse(px+6, py+8, pr, pr*0.65, 0,0,6.2832);
        }
        g.fill();
        // awan utama putih keabu
        var grad = g.createRadialGradient(cl.x, cl.y, 10, cl.x, cl.y, cl.w*0.5);
        grad.addColorStop(0,'rgba(255,255,255,'+(cl.op+0.25)+')');
        grad.addColorStop(0.5,'rgba(210,225,255,'+cl.op+')');
        grad.addColorStop(1,'rgba(120,140,180,0)');
        g.fillStyle=grad;
        g.beginPath();
        for(var p=0;p<cl.puff;p++){
          var px = cl.x + (p/cl.puff-0.5)*cl.w*0.8 + Math.sin(frame*0.01+p)*10;
          var py = cl.y + Math.cos(p*1.7)*cl.h*0.2;
          var pr = cl.h*0.6 + Math.sin(p)*cl.h*0.2;
          g.ellipse(px, py, pr, pr*0.65, 0,0,6.2832);
        }
        g.fill();
      });
      // kabut bawah
      g.fillStyle='rgba(120,160,200,0.07)';
      g.fillRect(0, innerHeight*0.65, innerWidth, innerHeight*0.35);
      // petir
      if(lightningT>0){
        g.fillStyle='rgba(180,220,255,'+(lightningT*0.04)+')';
        g.fillRect(0,0,innerWidth,innerHeight);
        if(lightningT>5){
          g.strokeStyle='#fff'; g.lineWidth=2; g.shadowColor='#8af'; g.shadowBlur=15;
          g.beginPath();
          var lx = innerWidth*0.2+Math.random()*innerWidth*0.6;
          g.moveTo(lx,0);
          for(var ly=0; ly<innerHeight; ly+=30){ g.lineTo(lx+(Math.random()-0.5)*40, ly); }
          g.stroke(); g.shadowBlur=0;
        }
      }
    }


    // BOSS (gambar big_boss)
    bosses.forEach(function(B){
      if(!B.life)return;
      g.fillStyle='#700';g.fillRect(B.x,B.y-18,B.w,10);
      g.fillStyle='#f22';g.fillRect(B.x,B.y-18,B.w*(B.hp/B.maxhp),10);
      g.textAlign='center';g.textBaseline='middle';
      g.font='bold 13px monospace';g.fillStyle='#0ff';
      g.fillText(BOSSNAME[B.pattern]||'BOSS',B.x+B.w/2,B.y-30);
      if(B.pattern===1){ g.drawImage(imgBoss,B.x,B.y,B.w,B.h); }
      else {
        var bxc=B.x+B.w/2,byc=B.y+B.h/2,br=Math.min(B.w,B.h)/2-4;
        if(B.pattern===2){
          // CRAB UFO ALIEN - UPGRADE GANAS
          var t=B.t||0;
          // bayangan bawah
          g.fillStyle='rgba(0,0,0,0.45)';
          g.beginPath(); g.ellipse(bxc, byc+br*0.9, br*1.15, br*0.28, 0,0,6.2832); g.fill();
          
          // kaki kepiting 8 kaki (4 kiri 4 kanan) animasi jalan
          g.lineCap='round'; g.lineJoin='round';
          for(var side=-1; side<=1; side+=2){
            for(var leg=0; leg<4; leg++){
              var legT = t*3 + leg*0.9 + (side>0?0:1);
              var baseX = bxc + side*br*0.55;
              var baseY = byc + br*0.15 + leg*br*0.12 - br*0.18;
              var joint1X = baseX + side*(br*0.35 + Math.sin(legT)*br*0.15);
              var joint1Y = baseY + br*0.25 + Math.cos(legT*1.5)*br*0.12;
              var tipX = joint1X + side*(br*0.35 + Math.sin(legT+0.6)*br*0.18);
              var tipY = joint1Y + br*0.32;
              // kaki segmen 1
              g.strokeStyle='#2a2a2a'; g.lineWidth=br*0.14;
              g.beginPath(); g.moveTo(baseX,baseY); g.lineTo(joint1X,joint1Y); g.stroke();
              g.strokeStyle='#ff3c00'; g.lineWidth=br*0.09;
              g.beginPath(); g.moveTo(baseX,baseY); g.lineTo(joint1X,joint1Y); g.stroke();
              // kaki segmen 2
              g.strokeStyle='#1a1a1a'; g.lineWidth=br*0.11;
              g.beginPath(); g.moveTo(joint1X,joint1Y); g.lineTo(tipX,tipY); g.stroke();
              g.strokeStyle='#ff6a2d'; g.lineWidth=br*0.06;
              g.beginPath(); g.moveTo(joint1X,joint1Y); g.lineTo(tipX,tipY); g.stroke();
              // ujung cakar kecil
              g.fillStyle='#ffd'; g.beginPath(); g.arc(tipX,tipY,br*0.06,0,6.2832); g.fill();
            }
          }
          // body UFO utama - piring terbang
          // outer rim metalik
          var grad = g.createRadialGradient(bxc, byc, br*0.3, bxc, byc, br*1.05);
          grad.addColorStop(0, '#7af2ff');
          grad.addColorStop(0.3, '#3a8fb7');
          grad.addColorStop(0.7, '#1a3a4a');
          grad.addColorStop(1, '#08141a');
          g.fillStyle=grad;
          g.beginPath(); g.ellipse(bxc, byc+br*0.18, br*1.05, br*0.62, 0,0,6.2832); g.fill();
          
          // lampu pinggir UFO
          for(var li=0; li<10; li++){
            var la = li/10*6.2832 + t*2;
            var lx = bxc + Math.cos(la)*br*0.88;
            var ly = byc + br*0.18 + Math.sin(la)*br*0.38;
            var col = (li%2==0)? '#00ffea' : '#ff006a';
            g.shadowColor=col; g.shadowBlur=12;
            g.fillStyle=col; g.beginPath(); g.arc(lx,ly,br*0.08,0,6.2832); g.fill();
            g.shadowBlur=0;
          }
          
          // capit raksasa kepiting (kiri kanan depan)
          for(var cs=-1; cs<=1; cs+=2){
            var clawX = bxc + cs*br*0.95;
            var clawY = byc + br*0.05;
            var open = Math.sin(t*4 + (cs>0?0:2))*0.3+0.5;
            g.save(); g.translate(clawX,clawY); g.rotate(cs*0.35 + Math.sin(t*3)*0.2);
            // lengan capit
            g.fillStyle='#2b0a00';
            g.fillRect(-br*0.18, -br*0.12, br*0.36, br*0.55);
            g.fillStyle='#ff4000';
            g.fillRect(-br*0.14, -br*0.08, br*0.28, br*0.45);
            // capit atas bawah
            g.fillStyle='#ff1a1a';
            g.beginPath(); g.moveTo(-br*0.14, br*0.37); g.lineTo(br*0.14, br*0.37); g.lineTo(br*0.22*open, br*0.37+br*0.38); g.lineTo(-br*0.22*open, br*0.37+br*0.38); g.closePath(); g.fill();
            g.beginPath(); g.moveTo(-br*0.14, br*0.37); g.lineTo(br*0.14, br*0.37); g.lineTo(br*0.18*open, br*0.37-br*0.28); g.lineTo(-br*0.18*open, br*0.37-br*0.28); g.closePath(); g.fill();
            g.fillStyle='#fff'; g.fillRect(-br*0.04, br*0.42, br*0.08, br*0.12);
            g.restore();
          }
          
          // kubah alien transparan di atas
          var domeGrad = g.createRadialGradient(bxc-br*0.12, byc-br*0.18, br*0.05, bxc, byc-br*0.08, br*0.62);
          domeGrad.addColorStop(0, 'rgba(170,255,210,0.95)');
          domeGrad.addColorStop(0.4, 'rgba(50,255,130,0.55)');
          domeGrad.addColorStop(0.8, 'rgba(20,120,70,0.35)');
          domeGrad.addColorStop(1, 'rgba(0,40,20,0.05)');
          g.fillStyle=domeGrad;
          g.beginPath(); g.ellipse(bxc, byc-br*0.08, br*0.62, br*0.55, 0,0,Math.PI,true); g.fill();
          g.strokeStyle='rgba(120,255,200,0.8)'; g.lineWidth=2;
          g.beginPath(); g.ellipse(bxc, byc-br*0.08, br*0.62, br*0.55, 0,0,Math.PI,true); g.stroke();
          
          // kepala alien kepiting di dalam kubah
          var alienY = byc - br*0.18 + Math.sin(t*2.5)*br*0.06;
          // kepala
          g.fillStyle='#7fff9e';
          g.beginPath(); g.ellipse(bxc, alienY, br*0.26, br*0.30, 0,0,6.2832); g.fill();
          // mata besar alien (2 mata samping + 1 di dahi)
          g.fillStyle='#000'; 
          g.beginPath(); g.ellipse(bxc-br*0.12, alienY-br*0.02, br*0.11, br*0.15, -0.25,0,6.2832); g.fill();
          g.beginPath(); g.ellipse(bxc+br*0.12, alienY-br*0.02, br*0.11, br*0.15, 0.25,0,6.2832); g.fill();
          // pupil hijau nyala
          g.shadowColor='#0f0'; g.shadowBlur=10;
          g.fillStyle='#00ff66';
          g.beginPath(); g.ellipse(bxc-br*0.12, alienY, br*0.05, br*0.08,0,0,6.2832); g.fill();
          g.beginPath(); g.ellipse(bxc+br*0.12, alienY, br*0.05, br*0.08,0,0,6.2832); g.fill();
          g.shadowBlur=0;
          // mulut kepiting alien (mandibula)
          g.strokeStyle='#0a3a1a'; g.lineWidth=2;
          g.beginPath(); g.moveTo(bxc-br*0.07, alienY+br*0.15); g.lineTo(bxc-br*0.03, alienY+br*0.22); g.stroke();
          g.beginPath(); g.moveTo(bxc+br*0.07, alienY+br*0.15); g.lineTo(bxc+br*0.03, alienY+br*0.22); g.stroke();
          // antena
          g.strokeStyle='#6effa0'; g.lineWidth=2;
          for(var an=-1; an<=1; an+=2){
            g.beginPath(); g.moveTo(bxc+an*br*0.08, alienY-br*0.22); g.quadraticCurveTo(bxc+an*br*0.18, alienY-br*0.42, bxc+an*br*0.12, alienY-br*0.52); g.stroke();
            g.fillStyle='#ff0'; g.beginPath(); g.arc(bxc+an*br*0.12, alienY-br*0.55, br*0.05,0,6.2832); g.fill();
          }
        } else {
          // DISCO: bola + garis putar + titik
          g.strokeStyle='#000';g.lineWidth=1;
          for(var dg=0;dg<8;dg++){var ag=B.spA*14+dg*Math.PI/4;
            g.beginPath();g.moveTo(bxc,byc);g.lineTo(bxc+Math.cos(ag)*br,byc+Math.sin(ag)*br);g.stroke();}
          disc(bxc,byc,br,'#c8c8cd');
          g.strokeStyle='#fff';g.lineWidth=2.5;
          for(var dl=0;dl<6;dl++){var al=B.spA*20+dl*1.047;
            g.beginPath();g.moveTo(bxc+Math.cos(al)*br*0.2,byc+Math.sin(al)*br*0.2);g.lineTo(bxc+Math.cos(al)*br,byc+Math.sin(al)*br);g.stroke();}
          for(var db2=0;db2<9;db2++){var ab=B.spA*30+db2*0.7;
            disc(bxc+Math.cos(ab)*br*0.9,byc+Math.sin(ab)*br*0.9,br*0.07,'#fff3e0');}
        }
      }
      if(B.inv>0){
        var blink=B.t%0.6<0.3;
        if(blink){g.fillStyle='rgba(0,200,255,.35)';g.fillRect(B.x,B.y,B.w,B.h);}
        g.fillStyle='#ff0';g.font='bold 15px monospace';
        g.fillText('TAHAN '+Math.ceil(B.inv)+'s',B.x+B.w/2,B.y+B.h/2-40);
      }
    });
    // musuh
    enemies.forEach(function(m){
      var cx=m.x+m.w/2,cy=m.y+m.h/2,r=m.w/2-2;
      if(m.type===2){
        // "tangan" = segitiga runcing agresif (oranye)
        poly(cx,cy,r,3,(m.y*0.05)+3.14,'#ff4d00');
        disc(cx,cy,r*0.28,'#ffe');
      } else {
        // musuh kecil = hexagon berwarna + inti
        poly(cx,cy,r,6,frame*0.08,'rgba(20,40,80,.25)');
        poly(cx,cy,r*0.95,6,frame*0.08+Math.PI/6,MCOL[Math.floor((m.x+m.y)*0.7)%6]);
        disc(cx,cy,r*0.3,'#fff');
      }
    });
    // peluru pemain (laser hujan)
    g.shadowColor='#0ff';g.shadowBlur=9;
    mb.forEach(function(b){g.fillStyle='#8ff';g.fillRect(b.x,b.y,b.w,b.h);g.fillStyle='#fff';g.fillRect(b.x+1.5,b.y,b.w-3,b.h);});
    g.shadowBlur=0;
    // peluru musuh
    g.fillStyle='#fd4';g.shadowColor='#f40';g.shadowBlur=10;
    eb.forEach(function(b){g.beginPath();g.arc(b.x,b.y,b.w/2-1,0,6.2832);g.fill();});
    g.shadowBlur=0;
    // hero
    g.drawImage(imgHero,hero.x,hero.y,hero.w,hero.h);
  }

  function loop(){update();draw();requestAnimationFrame(loop);}
  loop();
})();
</script>
</body>
</html>
