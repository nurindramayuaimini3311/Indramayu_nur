<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>THUNDER HELI - TOUCH HIJAU</title>
<style>
  html,body{margin:0;padding:0;background:#050810;overflow:hidden;height:100%;font-family:Arial,system-ui}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;background:#060a18}
  .hud{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;
       color:#7df9ff;font:bold 14px monospace;text-shadow:0 0 6px #00f;z-index:5;pointer-events:none}
  #msg{position:fixed;top:44%;left:0;right:0;text-align:center;color:#fff;font:bold 26px monospace;
       text-shadow:0 0 10px #f00;z-index:6;pointer-events:none;display:none}
  .btn{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:7;
       background:#0a3;color:#fff;border:0;padding:12px 22px;border-radius:22px;font:bold 16px Arial;
       box-shadow:0 4px 14px #000;display:none}
  #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#3fa9f5;font:12px monospace;
       opacity:.7;text-align:center;pointer-events:none;z-index:5}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <span id="lvl">LEVEL 0</span>
  <span id="hp">HP █████</span>
  <span id="skor">SKOR 0</span>
</div>
<div id="msg"></div>
<button class="btn" id="playBtn"></button>
<div id="hint">GESER JARI √ heli ikut • Tembakan = otomatis • Hindari peluru musuh</div>

<script>
// ===== CANVAS + GAME LOOP (TAHAP 1) =====
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; }
resize(); addEventListener('resize',resize);

// ===== GAMBAR =====
const imgHero=new Image(); imgHero.src='img/hero1.png';
const imgEnemy=new Image(); imgEnemy.src='img/hero2.png';
const imgBoss=new Image(); imgBoss.src='img/boss.png';

// ===== SUARA (dari contohHELI.html): audio kontek murni, tanpa file =====
let AUDIO=null;
function initAudio(){
  if(AUDIO) return;
  try{
    const g=new(window.AudioContext||window.webkitAudioContext), s=g.createGain();
    s.gain.value=0.28;
    const T=g.createDynamicsCompressor(); T.connect(g.destination); s.connect(T);
    AUDIO={ctx:g, master:s};
  }catch(e){ AUDIO={ctx:null, master:null}; }
}
function sfxM(freq,dur,type,gainn,slide){
  const M=AUDIO; if(!M||!M.ctx||!M.master) return;
  try{
    const t=M.ctx.currentTime, C=M.ctx.createOscillator(), f=M.ctx.createGain();
    C.type=type; C.frequency.setValueAtTime(freq,t);
    if(slide) C.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
    f.gain.setValueAtTime(0.0001,t); f.gain.exponentialRampToValueAtTime(gainn,t+0.01);
    f.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    C.connect(f); f.connect(M.master); C.start(t); C.stop(t+dur+0.05);
  }catch(e){}
}
const SFX={
  shoot: ()=>sfxM(90,0.2,'square',0.18,30),      // tembakan pemain
  hit:   ()=>sfxM(180,0.25,'sawtooth',0.25,-120), // musuh/boss kena
  boom:  ()=>sfxM(120,0.35,'sawtooth',0.35,-80), // ledakan
  win:   ()=>sfxM(880,0.12,'square',0.22,400),   // menang level
  lose:  ()=>sfxM(90,0.5,'sawtooth',0.3,-150),   // game over
};

// ===== HERO: mengikuti jari (seperti StickNaga) =====
const hero={ x:innerWidth/2, y:innerHeight-90, w:56, h:56, hp:5, maxhp:5,
             tx:innerWidth/2, ty:innerHeight-90, fireCd:0 };

// ===== DATA LEVEL (12 level siap) =====
const LEVELS=[
  {gen:3,  boss:false, name:'TAHAP 1'},
  {gen:5,  boss:false, name:'TAHAP 2'},
  {gen:7,  boss:false, name:'TAHAP 3'},
  {gen:9,  boss:false, name:'TAHAP 4'},
  {gen:6,  boss:true,  name:'TAHAP 5'},
  {gen:11, boss:false, name:'TAHAP 6'},
  {gen:10, boss:true,  name:'TAHAP 7'},
  {gen:8,  boss:true,  name:'TAHAP 8'},
  {gen:12, boss:true,  name:'TAHAP 9'},
  {gen:14, boss:true,  name:'TAHAP 10'},
];
let level=0, skor=0, playing=false, over=false;
let enemies=[], enemyBullets=[], myBullets=[], boss=null;

// ===== TEMBAKAN PELURU (otomatis) =====
let entCd=[], bossCd=0, myCd=0;

function resetLevel(){
  const L=LEVELS[level];
  document.getElementById('lvl').textContent=L.name;
  enemies=[]; enemyBullets=[]; myBullets=[]; boss=null;
  let n=L.gen;
  for(let i=0;i<n;i++){
    enemies.push({
      x:40+Math.random()*(innerWidth-80), y:-40-i*30,
      w:44,h:44, vy:1.1+Math.random()*1.3, cd:60+i*13, life:true
    });
  }
  if(L.boss){ boss={x:innerWidth/2-150, y:-150, w:300,h:147, hp:25, maxhp:25, cd:80, life:true}; }
}

function start(){
  initAudio();
  level=0; skor=0; hero.hp=hero.maxhp; over=false; playing=true;
  document.getElementById('msg').style.display='none'; document.getElementById('playBtn').style.display='none';
  resetLevel(); hud();
}
document.getElementById('playBtn').onclick=start;

// ===== INPUT: GESER JARI => heli ikut (StickNaga style) =====
function pointer(e){
  hero.tx=e.clientX; hero.ty=e.clientY;
}
canvas.addEventListener('pointermove', e=>{ e.preventDefault(); pointer(e); });
canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); pointer(e); });
canvas.addEventListener('touchmove', e=>{ e.preventDefault(); const t=e.touches[0]; hero.tx=t.clientX; hero.ty=t.clientY; },{passive:false});
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.touches[0]; hero.tx=t.clientX; hero.ty=t.clientY; },{passive:false});

// ===== UPDATE =====
function rectHit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function hud(){
  let bar='█'.repeat(hero.hp)+'░'.repeat(Math.max(0,hero.maxhp-hero.hp));
  document.getElementById('hp').textContent='HP '+bar;
  document.getElementById('skor').textContent='SKOR '+skor;
}
function msg(t,win){
  const d=document.getElementById('msg'); d.style.display='block'; d.textContent=t;
  const btn=document.getElementById('playBtn'); btn.style.display='block';
  btn.textContent=win?'MULAI ULANG':'MULAI';
}

function update(){
  if(!playing||over) return;

  // hero halus ikut jari
  hero.x += (hero.tx-hero.x)*0.25;
  hero.y += (hero.ty-hero.y)*0.25;
  hero.x=Math.max(0,Math.min(innerWidth-hero.w,hero.x));
  hero.y=Math.max(0,Math.min(innerHeight-hero.h,hero.y));

  // AUTO-FIRE pemain (ke atas)
  myCd--;
  if(myCd<=0){ myCd=12; myBullets.push({x:hero.x+hero.w/2-3,y:hero.y-4,w:5,h:14,vy:-10}); SFX.shoot(); }

  // musuh bergerak + tembak otomatis ke arah pemain
  enemies.forEach((m,i)=>{
    m.y+=m.vy; m.cd--;
    if(m.cd<=0 && m.y>0 && m.y<innerHeight){
      m.cd=70+Math.random()*40;
      // peluru menuju posisi hero
      const dx=hero.x+hero.w/2 - (m.x+m.w/2), dy=hero.y+hero.h/2 - (m.y+m.h/2);
      const len=Math.hypot(dx,dy)||1; const sp=4;
      enemyBullets.push({x:m.x+m.w/2-3,y:m.y+m.h/2-3,w:7,h:7,vx:dx/len*sp,vy:dy/len*sp});
    }
  });
  // boss tembak lebih cepat (hujan)
  if(boss&&boss.life){
    boss.y+=Math.max(0,boss.vy?boss.vy:0); boss.cd--;
    if(boss.cd<=0){
      boss.cd=55; const sp=5;
      for(let a=-1;a<=1;a++){
        const dx=hero.x+hero.w/2-(boss.x+140)+a*120, dy=hero.y+hero.h/2-(boss.y+70);
        const len=Math.hypot(dx,dy)||1;
        enemyBullets.push({x:boss.x+140-4,y:boss.y+70-4,w:10,h:10,vx:dx/len*sp,vy:dy/len*sp});
      }
    }
    if(boss.y>innerHeight-200){ boss.vy=0; }
  }

  // gerak peluru
  myBullets.forEach(b=>b.y+=b.vy);
  enemyBullets.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; });
  myBullets=myBullets.filter(b=>b.y>-20);
  enemyBullets=enemyBullets.filter(b=>b.y>-30&&b.y<innerHeight+30&&b.x>-30&&b.x<innerWidth+30);

  // peluru pemain kena musuh
  myBullets.forEach(b=>{
    enemies.forEach(m=>{ if(m.life&&rectHit(b,m)){m.life=false;b.y=-99;skor+=20;SFX.hit();} });
    if(boss&&boss.life&&rectHit(b,boss)){boss.hp--;b.y=-99;if(boss.hp<=0){boss.life=false;skor+=250;SFX.boom();}}
  });
  enemies=enemies.filter(m=>m.life);
  myBullets=myBullets.filter(b=>b.y>-20);

  // peluru musuh kena hero
  enemyBullets.forEach(b=>{ if(rectHit(b,hero)){b.y=9999;hero.hp--;SFX.hit();} });
  enemyBullets=enemyBullets.filter(b=>b.y<innerHeight+30);
  // hero nabrak musuh/boss
  enemies.forEach(m=>{ if(rectHit(m,hero)){m.life=false;hero.hp--;} });
  enemies=enemies.filter(m=>m.life);
  if(boss&&boss.life&&rectHit(boss,hero)){ hero.hp--; }
  hud();

  // clear level
  const L=LEVELS[level];
  const cb=L.boss?(boss&&!boss.life):true;
  if(enemies.length===0&&cb&&playing){ level++; if(level>=LEVELS.length){over=true;msg('🏆 MENANG! Skor '+skor,true);SFX.win();} else {resetLevel(); SFX.win();} }
  if(hero.hp<=0){ over=true; msg('💀 GAME OVER - Skor '+skor,false); SFX.lose(); }
}

// ===== DRAW =====
function draw(){
  // backdrop boss di belakang atas
  if(boss&&boss.life){ ctx.globalAlpha=.18; ctx.drawImage(imgBoss, innerWidth/2-240, 10, 480,235); ctx.globalAlpha=1; }
  // boss (besar)
  if(boss&&boss.life){
    // bar HP boss
    ctx.fillStyle='#900'; ctx.fillRect(boss.x, boss.y-18, boss.w, 10);
    ctx.fillStyle='#f00'; ctx.fillRect(boss.x, boss.y-18, boss.w*(boss.hp/boss.maxhp), 10);
    ctx.drawImage(imgBoss,boss.x,boss.y,boss.w,boss.h);
  }
  // musuh
  enemies.forEach(m=>{ ctx.drawImage(imgEnemy,m.x,m.y,m.w,m.h); });
  // peluru pemain (cyan)
  ctx.fillStyle='#0ff'; myBullets.forEach(b=>{ ctx.shadowColor='#0ff'; ctx.shadowBlur=12; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.shadowBlur=0; });
  // peluru musuh (merah/oranye)
  ctx.fillStyle='#fd0'; enemyBullets.forEach(b=>{ ctx.shadowColor='#f00'; ctx.shadowBlur=12; ctx.beginPath(); ctx.arc(b.x,b.y,b.w/2,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; });
  // hero
  ctx.drawImage(imgHero,hero.x,hero.y,hero.w,hero.h);
}

// ===== LOOP =====
function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();

// tombol mulai awal
(function(){ const b=document.getElementById('playBtn'); b.style.display='block'; b.style.background='#0a3'; b.textContent='MULAI'; document.getElementById('msg').style.display='block'; document.getElementById('msg').textContent='THUNDER HELI'; b.style.bottom='120px'; })();
</script>
</body>
</html>
