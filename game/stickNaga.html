(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {
        options = Object.assign({}, options, { passive: true });
      }
    }
    return origAdd.call(this, type, listener, options);
  };
})();

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">

<title>Naga Jari - Tanpa Stik</title>
<style>
  html, body { margin:0; padding:0; background:#050810; overflow:hidden; height:100%; }
  canvas { display:block; width:100vw; height:100vh; touch-action:none; }
  #hint { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); color:#3fa9f5; font:13px monospace; opacity:0.7; text-align:center; pointer-events:none; }
  #score { position:fixed; top:12px; left:12px; color:#facc15; font:bold 18px monospace; text-shadow:0 0 8px #000; }
  #koinBox { position:fixed; top:12px; right:12px; text-align:right; color:#ffd700; font:bold 18px monospace; text-shadow:0 0 8px #000; }
  #countdown { font-size:12px; color:#3fa9f5; font-weight:normal; }
  #fireBtn {
    position:fixed; right:14px; bottom:calc(60px + env(safe-area-inset-bottom, 0px));
    width:64px; height:64px; border-radius:50%; font-size:30px;
    background:rgba(250,204,21,.15); border:2px solid #facc15; cursor:pointer;
  }
  #fireBtn:active { transform:scale(.9); }
  #toast {
    position:fixed; top:22%; left:50%; transform:translateX(-50%);
    color:#ffd700; font:bold 22px monospace; text-shadow:0 0 12px #000;
    opacity:0; transition:opacity .4s; pointer-events:none; text-align:center;
  }

<body>
<canvas id="game"></canvas>
<div id="score">Skor: 0</div>
<div id="koinBox">🪙 <span id="koin">0</span><br><span id="countdown">🎁 1:00</span></div>
<div id="toast"></div>
<button id="fireBtn" title="Kembang api">🎆</button>
<div id="hint">GERAKKAN JARI DI LAYAR • NAGA IKUT JARI • LEPAS = PETIR • 2 JARI = 2 NAGA</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; }
resize(); addEventListener('resize',resize);

let score=0;
const fingers={}; // pointerId -> {x,y, tail:[], active}

class NagaJari {
  constructor(id){
    this.id=id;
    this.x=0; this.y=0;
    this.tail=[];
    for(let i=0;i<18;i++) this.tail.push({x:0,y:0});
    this.color=`hsl(${200+Math.random()*60},100%,60%)`;
  }
  update(tx,ty){
    this.x=tx; this.y=ty;
    this.tail[0].x+= (tx - this.tail[0].x)*0.4;
    this.tail[0].y+= (ty - this.tail[0].y)*0.4;
    for(let i=1;i<this.tail.length;i++){
      this.tail[i].x+= (this.tail[i-1].x - this.tail[i].x)*0.35;
      this.tail[i].y+= (this.tail[i-1].y - this.tail[i].y)*0.35;
    }
  }
}

const nagas={};
let particles=[];
let rockets=[];   // roket kembang api yang meluncur
let koinHujan=[]; // koin berjatuhan (visual)

/* ---- KOIN: tiap 1 menit main dapat 1 koin ---- */
const KOIN_KEY='stickNagaKoin';
let koin=0, detikMain=0, detikTampil=-1;
try { koin=parseInt(localStorage.getItem(KOIN_KEY)||'0',10)||0; } catch(e) {}
function tampilKoin(){
  document.getElementById('koin').textContent=koin;
  const sisa=Math.max(0, 60-Math.floor(detikMain));
  document.getElementById('countdown').textContent='🎁 '+Math.floor(sisa/60)+':'+String(sisa%60).padStart(2,'0');
}
tampilKoin();

function toast(teks){
  const el=document.getElementById('toast');
  el.textContent=teks; el.style.opacity='1';
  clearTimeout(el._t);
  el._t=setTimeout(()=>{ el.style.opacity='0'; }, 2200);
}

/* ---- SUARA RINGAN (tanpa file) ---- */
const Suara=(function(){
  let ctx=null, master=null;
  function init(){
    if(ctx){ if(ctx.state==='suspended')ctx.resume(); return; }
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      ctx=new AC();
      master=ctx.createGain(); master.gain.value=0.4; master.connect(ctx.destination);
    }catch(e){}
  }
  function blip(f,dur,tipe,vol,f2){
    if(!ctx)return;
    try{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=tipe; o.frequency.setValueAtTime(f,ctx.currentTime);
      if(f2)o.frequency.exponentialRampToValueAtTime(f2,ctx.currentTime+dur);
      g.gain.setValueAtTime(vol,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
      o.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime+dur);
    }catch(e){}
  }
  return {
    init,
    koin:()=>{ blip(1320,0.12,'sine',0.2); setTimeout(()=>blip(1760,0.2,'sine',0.2),90); },
    boom:()=>blip(120,0.5,'sawtooth',0.18,40),
    desis:()=>blip(3000,0.3,'sine',0.04,5000)
  };
})();

/* ---- BUNGA API (kembang api) ---- */
function luncurkanApi(x){
  Suara.init(); Suara.desis();
  rockets.push({
    x: x ?? (Math.random()*canvas.width*0.8+canvas.width*0.1),
    y: canvas.height+10,
    vy: -(9+Math.random()*4),
    targetY: canvas.height*(0.15+Math.random()*0.35),
    warna: `hsl(${Math.floor(Math.random()*360)},100%,60%)`
  });
}
function ledakkanApi(r){
  Suara.boom();
  const n=50;
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2 + Math.random()*0.2;
    const sp=2+Math.random()*5;
    particles.push({x:r.x, y:r.y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:50+Math.random()*20, max:70, color:r.warna, api:true});
  }
  // kilatan tengah
  for(let i=0;i<10;i++){
    particles.push({x:r.x, y:r.y,
      vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*2,
      life:20, max:20, color:'#ffffff', api:true});
  }
}
function hujanKoin(n){
  for(let i=0;i<(n||12);i++){
    koinHujan.push({x:Math.random()*canvas.width, y:-20-Math.random()*100,
      vy:2+Math.random()*3, putar:Math.random()*Math.PI*2});
  }
}
/* hadiah 1 menit */
function hadiahMenit(){
  koin++;
  try{ localStorage.setItem(KOIN_KEY,String(koin)); }catch(e){}
  tampilKoin();
  toast('🪙 +1 KOIN!\n🎆 BUNGA API! 🎆');
  Suara.koin();
  for(let i=0;i<5;i++) setTimeout(()=>luncurkanApi(), i*250);
  hujanKoin(16);
}
document.getElementById('fireBtn').addEventListener('click',()=>{ luncurkanApi(); });

function spawnParticles(x,y,color){
  for(let i=0;i<12;i++){
    particles.push({x,y, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, life:30, color});
  }
  score++;
  document.getElementById('score').textContent='Skor: '+score;
}

canvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  const n = new NagaJari(e.pointerId);
  n.x=e.clientX; n.y=e.clientY;
  nagas[e.pointerId]=n;
  fingers[e.pointerId]={x:e.clientX,y:e.clientY};
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e=>{
  if(!nagas[e.pointerId]) return;
  fingers[e.pointerId]={x:e.clientX,y:e.clientY};
  nagas[e.pointerId].update(e.clientX,e.clientY);
});

canvas.addEventListener('pointerup', e=>{
  const n=nagas[e.pointerId];
  if(n){
    // petir ledakan pas lepas
    spawnParticles(n.x,n.y,n.color);
    // efek petir garis
    ctx.strokeStyle=n.color;
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(n.x,n.y);
    ctx.lineTo(n.x+(Math.random()-0.5)*200, -20);
    ctx.stroke();
  }
  delete nagas[e.pointerId];
  delete fingers[e.pointerId];
});

function loop(){
  ctx.fillStyle='rgba(5,8,16,0.25)';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // pewaktu 1 menit -> koin + bunga api
  detikMain += 1/60;
  if(Math.floor(detikMain) !== detikTampil){ detikTampil=Math.floor(detikMain); tampilKoin(); }
  if(detikMain >= 60){ detikMain = 0; hadiahMenit(); }

  // roket meluncur ke atas
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];
    r.y += r.vy;
    // jejak api
    particles.push({x:r.x+(Math.random()-0.5)*4, y:r.y+8,
      vx:(Math.random()-0.5)*1.5, vy:2+Math.random()*2,
      life:15, max:15, color:'#ffcc66', api:true});
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(r.x,r.y,3,0,Math.PI*2); ctx.fill();
    if(r.y <= r.targetY){ rockets.splice(i,1); ledakkanApi(r); }
  }

  // koin berjatuhan
  for(let i=koinHujan.length-1;i>=0;i--){
    const k=koinHujan[i];
    k.y += k.vy; k.putar += 0.15;
    if(k.y > canvas.height+20){ koinHujan.splice(i,1); continue; }
    const rx=Math.abs(Math.cos(k.putar))*10;
    ctx.fillStyle='#ffd700';
    ctx.beginPath(); ctx.ellipse(k.x,k.y,Math.max(rx,2),10,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#a07000';
    ctx.font='bold 10px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('Rp',k.x,k.y);
  }
  // gambar naga jari
  Object.values(nagas).forEach(n=>{
    // ekor
    for(let i=n.tail.length-1;i>=0;i--){
      const t=n.tail[i];
      const s= 14*(1-i/n.tail.length);
      ctx.fillStyle=n.color;
      ctx.globalAlpha=0.8*(1-i/n.tail.length);
      ctx.beginPath();
      ctx.arc(t.x,t.y,s,0,Math.PI*2);
      ctx.fill();
      // glow
      ctx.shadowColor=n.color;
      ctx.shadowBlur=15;
      ctx.fill();
      ctx.shadowBlur=0;
    }
    // kepala
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(n.x,n.y,16,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle=n.color;
    ctx.beginPath();
    ctx.arc(n.x,n.y,10,0,Math.PI*2);
    ctx.fill();
  });
  
  // particles
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.life--;
    if(p.api){ p.vy+=0.06; p.vx*=0.985; } // bunga api melengkung jatuh
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life/(p.max||30)));
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fill();
  });
  particles=particles.filter(p=>p.life>0);
  ctx.globalAlpha=1;
  
  requestAnimationFrame(loop);
}
loop();
</script>

<script>
(function(){
const PAGES=["/","/setting/","/alwiSD/","/fiturBARU/","/game/","/kamera-hantu/","/konten/","/kuis/","/netflix/","/pencuri/","/peta/","/peta/peta-cod.html"];
let p=location.pathname; let i=PAGES.indexOf(p);
if(i==-1) i=PAGES.findIndex(x=>p.includes(x.replace(/\//g,'').replace('.html','')));
if(i<0) i=0;

[L,R].forEach(b=>b.addEventListener('click',()=>{tuk();b.style.transform='scale(0.8)';setTimeout(()=>b.style.transform='',120);}));

 let s=document.createElement('style');s.innerHTML="#alwi-rl a{animation:bob 0.7s infinite alternate} @keyframes bob{0%{transform:translateY(0)}100%{transform:translateY(-8px) scale(1.1)}}";document.head.appendChild(s);
}
})();
</script>
<script>if(window.poinGame)poinGame()</script>
