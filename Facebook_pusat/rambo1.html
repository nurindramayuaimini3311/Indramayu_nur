<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ALWI - Level 1 Mario World</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#5C94FC;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;overflow-x:hidden;overflow-y:auto;padding-top:8px;font-family:'Press Start 2P',monospace;}
  #gameWrap{position:relative;width:100%;max-width:960px;aspect-ratio:16/9;background:#5C94FC;box-shadow:0 0 0 4px #000,0 12px 0 #0005;image-rendering:pixelated}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated;background:#5C94FC}
  #hud{position:absolute;top:0;left:0;right:0;height:52px;background:linear-gradient(#000 0 70%,#0000);color:#fff;display:flex;justify-content:space-between;padding:8px 14px;font-size:10px;line-height:14px;z-index:5;pointer-events:none;text-shadow:2px 2px 0 #000}
  #hud b{color:#FFD800}
  #controls{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;max-width:960px;margin-top:10px;padding:10px 14px;z-index:10;touch-action:none;background:rgba(0,0,0,.28);border-radius:18px;border:3px solid #000}
  .dpad{display:flex;gap:6px}
  .btn{width:56px;height:56px;background:rgba(255,255,255,.9);border:3px solid #000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;user-select:none;box-shadow:0 4px 0 #000;active:translateY(2px)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
  #btnJump{width:72px;height:72px;background:#FF3B30;color:#fff}
  #btnShoot{background:#00D84A;color:#000;width:62px;height:62px}
  .topBtns{display:flex;gap:8px;align-items:flex-end}
  #msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(92,148,252,.85);z-index:20;flex-direction:column;color:#fff;text-align:center}
  #msg h1{font-size:22px;margin-bottom:12px;text-shadow:4px 4px 0 #000}
  #msg p{font-size:10px;max-width:320px;line-height:16px}
  #msg button{margin-top:18px;padding:12px 18px;font-family:'Press Start 2P';font-size:12px;border:3px solid #000;background:#FFD800;box-shadow:0 4px 0 #000;cursor:pointer}
  @media(min-width:800px){#controls{opacity:.25;pointer-events:none} #controls:hover{opacity:1;pointer-events:auto} body{cursor:auto} #gameWrap:hover #controls{opacity:.6}}
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="hud">
    <div>ALWI<br><b id="score">00000</b> <span style="font-size:8px">x</span><b id="coins">0</b></div>
    <div style="text-align:center">WORLD<br><b>1-1</b><br><span id="time" style="color:#fff">400</span></div>
    <div style="text-align:right">LIVES<br><b id="lives">♥♥♥</b><br><span style="font-size:8px">LEVEL 1</span></div>
  </div>
  <div id="msg">
    <h1 id="msgTitle">ALWI LEVEL 1</h1>
    <p id="msgText">Capai PIPA HIJAU di kanan! Lompat tabrak bata dari bawah untuk hancurkan & dapat koin.<br><br>A/D atau ◀▶ gerak, W/↑ lompat, SPASI tembak!</p>
    <button id="msgBtn">MULAI MAIN!</button>
  </div>
</div>
<div id="controls">
  <div class="dpad">
    <div class="btn" id="btnL">◀</div>
    <div class="btn" id="btnR">▶</div>
  </div>
  <div class="topBtns">
    <div class="btn" id="btnShoot">●</div>
    <div class="btn" id="btnJump">JUMP</div>
  </div>
</div>
<script>
// ALWI LEVEL 1 - Mario 1-1 style
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=960,H=540, TILE=32;
let keys={}, score=0, coins=0, lives=3, timeLeft=400, gameState='menu';
let camera=0, particles=[], bullets=[], coinAnims=[], fragments=[];

const player={
  x:100,y:350,w:28,h:36,vx:0,vy:0,onGround:false,dir:1,shootCD:0,
  reset(){this.x=100;this.y=350;this.vx=0;this.vy=0}
};

const worldWidth=3200;

// Level design like Mario 1-1 photo
let solids=[]; // {x,y,w,h,type} type: ground,brick,question,pipe
let coinsMap=[]; // {x,y,active}
function buildLevel(){
  solids=[]; coinsMap=[]; fragments=[]; particles=[]; bullets=[]; coinAnims=[];
  // ground
  for(let x=0;x<worldWidth;x+=TILE){
    // gaps? classic 1-1 has 2 small gaps but we keep 1 near pipe
    if(x>1200 && x<1280) continue; // pit
    if(x>2100 && x<2180) continue;
    solids.push({x,y:H-48,w:TILE,h:48,type:'ground'});
    solids.push({x,y:H-80,w:TILE,h:32,type:'ground_top'}); // grass top? actually brown but we draw
  }
  // classic brick platforms
  const plats=[
    {x:320,y:H-160, w:5,h:1, t:'brick'}, // first question bricks
    {x:400,y:H-240, w:1,h:1, t:'question'},
    {x:620,y:H-160, w:1,h:1, t:'brick'},
    {x:660,y:H-160, w:1,h:1, t:'question'},
    {x:700,y:H-160, w:1,h:1, t:'brick'},
    {x:820,y:H-210, w:4,h:1, t:'brick'},
    {x:1000,y:H-160, w:4,h:1, t:'brick'},
    {x:1100,y:H-210, w:1,h:1, t:'question'},
    {x:1350,y:H-160-32, w:3,h:1, t:'brick'},
    {x:1620,y:H-160, w:6,h:1, t:'brick'},
    {x:1800,y:H-240, w:1,h:1, t:'question'},
    {x:1840,y:H-240, w:1,h:1, t:'question'},
    {x:1880,y:H-240, w:1,h:1, t:'brick'},
    {x:2000,y:H-160, w:3,h:1, t:'brick'},
    {x:2280,y:H-200, w:4,h:1, t:'brick'},
    {x:2460,y:H-160, w:5,h:1, t:'brick'},
  ];
  plats.forEach(p=>{
    for(let i=0;i<p.w;i++){
      solids.push({x:p.x+i*TILE, y:p.y, w:TILE,h:TILE,type:p.t, hit:false, used:false});
      if(p.t==='brick' && Math.random()<0.35) coinsMap.push({x:p.x+i*TILE+8,y:p.y-24,active:true});
    }
  });
  // extra coins floating
  [500,760,1100,1500,1660,2320,2500].forEach(x=>coinsMap.push({x,y:H-220,active:true}));
  // pipes - finish pipe at far right like in photo
  solids.push({x:worldWidth-180,y:H-48-96,w:64,h:96+48,type:'pipe'}); // green pipe finish
  solids.push({x:880,y:H-48-64,w:64,h:64+48,type:'pipe'});
  solids.push({x:1680,y:H-48-96,w:64,h:96+48,type:'pipe'});
  solids.push({x:2300,y:H-48-64,w:64,h:64+48,type:'pipe'});
}

function rectCollide(a,b){return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y}

function breakBrick(b){
  if(b.used) return;
  b.used=true;
  score+=50;
  // fragments
  for(let i=0;i<4;i++) fragments.push({x:b.x+(i%2)*16,y:b.y+Math.floor(i/2)*16,w:14,h:14,vx:(Math.random()-0.5)*6,vy:-4-Math.random()*3,life:60});
  // coin pop
  coins++; score+=200;
  coinAnims.push({x:b.x+8,y:b.y,t:0});
  // particles
  for(let i=0;i<6;i++) particles.push({x:b.x+16,y:b.y+8,vx:(Math.random()-0.5)*5,vy:-3-Math.random()*3,life:20,color:'#FFD800'});
}

function hitQuestion(b){
  if(b.used) return;
  b.used=true; b.hit=true;
  coins++; score+=200;
  coinAnims.push({x:b.x+8,y:b.y-10,t:0, big:true});
  particles.push({x:b.x+16,y:b.y,vx:0,vy:-4,life:18,color:'#fff'});
}

function spawnBullet(){
  if(player.shootCD>0) return;
  bullets.push({x:player.x+player.w/2+player.dir*10,y:player.y+12,w:10,h:6,vx:player.dir*9,vy:0,life:90});
  player.shootCD=12;
  // muzzle flash
  particles.push({x:player.x+player.w/2+player.dir*18,y:player.y+14,vx:player.dir*2,vy:(Math.random()-0.5)*2,life:8,color:'#00FFFF'});
}

function update(){
  if(gameState!=='play') return;
  // input
  let move=0;
  if(keys['ArrowLeft']||keys['a']||keys['A']) move=-1;
  if(keys['ArrowRight']||keys['d']||keys['D']) move=1;
  player.dir = move!==0? (move>0?1:-1): player.dir;
  player.vx = move*4.2;
  if(!keys['ArrowLeft']&&!keys['ArrowRight']&&!keys['a']&&!keys['d']&&!keys['A']&&!keys['D']) player.vx*=0.72; // friction

  // gravity
  player.vy+=0.62;
  if(player.vy>11) player.vy=11;

  // horizontal move & collision
  player.x+=player.vx;
  for(let s of solids){
    if(s.used && s.type==='brick') continue;
    if(rectCollide(player,s)){
      if(player.vx>0) player.x=s.x-player.w;
      else if(player.vx<0) player.x=s.x+s.w;
    }
  }

  // vertical move & collision
  player.y+=player.vy;
  player.onGround=false;
  for(let s of solids){
    if(s.used && s.type==='brick') continue;
    if(rectCollide(player,s)){
      if(player.vy>0){ // landing
        player.y=s.y-player.h;
        player.vy=0;
        player.onGround=true;
      }else if(player.vy<0){ // hit from below
        player.y=s.y+s.h;
        player.vy=1;
        if(s.type==='brick') breakBrick(s);
        else if(s.type==='question') hitQuestion(s);
      }
    }
  }

  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    let b=bullets[i];
    b.x+=b.vx; b.y+=b.vy; b.life--;
    if(b.life<=0){bullets.splice(i,1);continue}
    for(let s of solids){
      if(s.used && s.type==='brick') continue;
      if(s.type==='pipe'||s.type==='ground'||s.type==='ground_top') continue;
      if(rectCollide(b,s)){
        if(s.type==='brick') breakBrick(s);
        if(s.type==='question') hitQuestion(s);
        particles.push({x:b.x,y:b.y,vx:0,vy:0,life:12,color:'#FF6A00'});
        bullets.splice(i,1); break;
      }
    }
  }

  // coins
  for(let c of coinsMap){
    if(!c.active) continue;
    if(Math.abs(player.x - c.x)<28 && Math.abs(player.y - c.y)<36){ c.active=false; coins++; score+=100; coinAnims.push({x:c.x,y:c.y,t:0}); }
  }

  // fragments & particles
  fragments.forEach(f=>{f.x+=f.vx; f.y+=f.vy; f.vy+=0.4; f.life--;});
  fragments=fragments.filter(f=>f.life>0);
  particles.forEach(p=>{p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--;});
  particles=particles.filter(p=>p.life>0);
  coinAnims.forEach(a=>{a.y-=1.5; a.t++;});
  coinAnims=coinAnims.filter(a=>a.t<40);

  // camera follow
  camera=player.x - W*0.35;
  if(camera<0) camera=0;
  if(camera>worldWidth-W) camera=worldWidth-W;

  // win condition - reach green finish pipe
  let finish = solids.find(s=>s.type==='pipe' && s.x>worldWidth-200);
  if(finish && rectCollide(player,{x:finish.x+8,y:finish.y,w:48,h:120})){
    win();
  }

  // pit death
  if(player.y > H+40){
    lives--; if(lives<=0) gameOver(); else {player.reset(); camera=0}
  }

  if(player.shootCD>0) player.shootCD--;

  // time
  timeLeft-=1/60;
  if(timeLeft<=0) gameOver();

  updateHUD();
}

function updateHUD(){
  document.getElementById('score').textContent=String(score).padStart(5,'0');
  document.getElementById('coins').textContent=coins;
  document.getElementById('lives').textContent='♥'.repeat(lives);
  document.getElementById('time').textContent=Math.ceil(timeLeft);
}

// DRAW
function drawPixelAlwi(px,py,dir){
  // hero based on provided images: orange shirt, red headband/hat, blue jeans, mustache
  ctx.save();
  ctx.translate(px,py);
  ctx.scale(dir,1);
  // shadow
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.fillRect(-2,34,32,4);
  // boots
  ctx.fillStyle='#6B3A1F'; ctx.fillRect(2,28,10,8); ctx.fillRect(18,28,10,8);
  // pants blue
  ctx.fillStyle='#4A7DBF'; ctx.fillRect(2,18,24,12);
  // belt
  ctx.fillStyle='#8B4513'; ctx.fillRect(2,18,24,4); ctx.fillStyle='#ddd'; ctx.fillRect(11,18,6,4);
  // shirt orange
  ctx.fillStyle='#FF7A00'; ctx.fillRect(1,6,26,14); // body
  ctx.fillStyle='#FF9A3C'; ctx.fillRect(3,8,12,2); // highlight
  // arms muscular
  ctx.fillStyle='#E8B894'; ctx.fillRect(-2,8,6,12); ctx.fillRect(24,8,6,12);
  ctx.fillStyle='#FF7A00'; ctx.fillRect(-2,7,6,5); ctx.fillRect(24,7,6,5);
  // head
  ctx.fillStyle='#E8B894'; ctx.fillRect(6,0,16,10);
  // headband red (topi)
  ctx.fillStyle='#E11D1D'; ctx.fillRect(5,-2,18,5); ctx.fillRect(22,1,8,2);
  // mustache
  ctx.fillStyle='#4A2C0B'; ctx.fillRect(10,6,10,2);
  // eye
  ctx.fillStyle='#000'; ctx.fillRect(14,2,2,2); ctx.fillRect(18,2,2,2);
  // gun on chest when shooting
  if(bullets.length>0 || player.shootCD>5){
    ctx.fillStyle='#5A6A7A'; ctx.fillRect(8,-2,22,5);
    ctx.fillStyle='#00E5FF'; ctx.fillRect(28,-1,6,2);
  }
  ctx.restore();
}

function draw(){
  // bg sky bright
  ctx.fillStyle='#5C94FC'; ctx.fillRect(0,0,W,H);
  // clouds like Mario 1-1
  ctx.save(); ctx.translate(-camera*0.25,0);
  function cloud(x,y,s){
    ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.fillRect(x,y,s*3,s); ctx.fillRect(x+s,y-s/2,s*3,s); ctx.fillRect(x+s*0.5,y+s*0.5,s*2,s*0.6);
    ctx.fillRect(x-s*0.2,y+s*0.2,s*1.2,s*0.6);
    // outline pixel
    ctx.strokeRect(x,y,s*3,s);
  }
  for(let i=0;i<12;i++){
    let cx=(i*460)%worldWidth; cloud(80+cx,70+(i%3)*26,18);
  }
  ctx.restore();

  // hills/mountains faint like in first image
  ctx.fillStyle='#6ACB68'; ctx.save(); ctx.translate(-camera*0.4,0);
  for(let i=0;i<20;i++){
    let hx=(i*300)%worldWidth;
    ctx.fillRect(hx,H-80-30,80,40); ctx.fillStyle='#8FE089'; ctx.fillRect(hx+10,H-80-40,20,10); ctx.fillStyle='#6ACB68';
  }
  ctx.restore();

  ctx.save(); ctx.translate(-camera,0);

  // draw solids
  for(let s of solids){
    if(s.used && s.type==='brick') continue;
    let x=s.x,y=s.y;
    if(x+64<camera || x>camera+W+64) continue;
    if(s.type==='ground' || s.type==='ground_top'){
      // brown bricks like Mario
      ctx.fillStyle=s.type==='ground_top' ? '#B84A1A' : '#8D3A12';
      ctx.fillRect(x,y,s.w,s.h);
      ctx.fillStyle='#D46A2A'; ctx.fillRect(x,y,s.w,4);
      ctx.strokeStyle='#5A1F0A'; ctx.lineWidth=1; ctx.strokeRect(x,y,s.w,s.h);
      // mortar lines
      ctx.fillStyle='#5A1F0A'; ctx.fillRect(x,y+16,s.w,2);
    }else if(s.type==='brick'){
      ctx.fillStyle='#C85A20'; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle='#E07A3A'; ctx.fillRect(x+3,y+3,26,6);
      ctx.fillStyle='#7A2F14'; ctx.fillRect(x+3,y+18,10,6); ctx.fillRect(x+16,y+18,13,6);
      ctx.strokeStyle='#000'; ctx.strokeRect(x,y,TILE,TILE);
    }else if(s.type==='question'){
      let col=s.used?'#7A5A1A':'#FFC800';
      ctx.fillStyle=col; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle=s.used?'#5A4510':'#FFF04A'; ctx.fillRect(x+4,y+4,TILE-8,4);
      ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.strokeRect(x,y,TILE,TILE);
      if(!s.used){ctx.fillStyle='#000'; ctx.font='bold 18px monospace'; ctx.fillText('?',x+10,y+22);}
    }else if(s.type==='pipe'){
      ctx.fillStyle='#00C040'; ctx.fillRect(x,y,TILE*2,TILE*3+48);
      ctx.fillStyle='#00FF60'; ctx.fillRect(x+6,y+4,8,TILE*3+40);
      ctx.fillStyle='#007A2A'; ctx.fillRect(x+TILE*2-10,y+4,8,TILE*3+40);
      ctx.fillRect(x-8,y,80,20); // top lip
      ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.strokeRect(x-8,y,80,20); ctx.strokeRect(x,y+20,TILE*2,TILE*3+28);
    }
  }

  // coins
  for(let c of coinsMap){ if(!c.active) continue; if(c.x<camera-40||c.x>camera+W+40) continue;
    ctx.fillStyle='#FFD800'; ctx.fillRect(c.x,c.y,16,16);
    ctx.fillStyle='#FFF566'; ctx.fillRect(c.x+2,c.y+2,10,3);
    ctx.strokeStyle='#8A5A00'; ctx.strokeRect(c.x,c.y,16,16);
    // $?
    ctx.fillStyle='#8A5A00'; ctx.font='bold 10px monospace'; ctx.fillText('$',c.x+4,c.y+12);
  }

  // fragments (broken bricks)
  fragments.forEach(f=>{
    ctx.fillStyle='#C85A20'; ctx.fillRect(f.x,f.y,f.w,f.h);
    ctx.strokeStyle='#000'; ctx.strokeRect(f.x,f.y,f.w,f.h);
  });

  // player
  drawPixelAlwi(player.x,player.y,player.dir);

  // bullets
  ctx.fillStyle='#00FFFF'; bullets.forEach(b=>{
    ctx.fillRect(b.x,b.y,b.w,b.h); ctx.fillStyle='#fff'; ctx.fillRect(b.x+6,b.y+1,3,2); ctx.fillStyle='#00FFFF';
  });

  // particles & coin anims
  coinAnims.forEach(a=>{
    ctx.save(); ctx.globalAlpha=1-a.t/40;
    ctx.fillStyle='#FFD800'; ctx.fillRect(a.x,a.y,16,16);
    ctx.fillStyle='#000'; ctx.font='bold 10px Press Start 2P'; ctx.fillText('+100',a.x-6,a.y-4);
    ctx.restore();
  });
  particles.forEach(p=>{
    ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,4,4);
  });

  // destination arrow
  let finish = solids.find(s=>s.type==='pipe' && s.x>worldWidth-200);
  if(finish){
    let dx=finish.x - (player.x+80);
    if(dx>200){
      ctx.fillStyle='#fff'; ctx.font='bold 12px monospace'; ctx.fillText('PIPA → '+Math.floor(dx/32)+'m',player.x+60,player.y-40);
    }
  }

  ctx.restore();

  // vignette pixel border
  ctx.strokeStyle='#000'; ctx.lineWidth=8; ctx.strokeRect(0,0,W,H);
}

function loop(){
  update(); draw(); requestAnimationFrame(loop);
}

function resetGame(){
  buildLevel(); player.reset(); score=0; coins=0; lives=3; timeLeft=400; camera=0;
}

function win(){
  gameState='won';
  document.getElementById('msgTitle').textContent='MENANG! ALWI HEBAT!';
  document.getElementById('msgText').innerHTML=`Kamu sampai di pipa hijau! <br><br>Skor: ${score} | Koin: ${coins} <br><br>LANJUT LEVEL 2?`;
  document.getElementById('msgBtn').textContent='MAIN LAGI';
  document.getElementById('msg').style.display='flex';
}
function gameOver(){
  gameState='over';
  document.getElementById('msgTitle').textContent='GAME OVER';
  document.getElementById('msgText').textContent=`Waktu habis / jatuh! Skor ${score}`;
  document.getElementById('msgBtn').textContent='COBA LAGI';
  document.getElementById('msg').style.display='flex';
}

// input handling
window.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if([' ','ArrowUp','ArrowDown','w','W'].includes(e.key)) e.preventDefault();
  if(e.key===' '||e.code==='Space') spawnBullet();
  if((e.key==='w'||e.key==='W'||e.key==='ArrowUp') && player.onGround){player.vy=-12; player.onGround=false;}
});
window.addEventListener('keyup',e=>{keys[e.key]=false});
document.getElementById('msgBtn').onclick=()=>{
  resetGame(); gameState='play'; document.getElementById('msg').style.display='none';
  setTimeout(()=>{if(player.onGround) player.vy=-8},100);
};

// touch
function bindTouch(id,key){
  const el=document.getElementById(id);
  let k=key;
  el.addEventListener('touchstart',e=>{e.preventDefault(); keys[k]=true; if(k==='shoot') spawnBullet(); if((k==='w'||k==='ArrowUp') && player.onGround){player.vy=-12}}, {passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault(); keys[k]=false}, {passive:false});
  el.addEventListener('mousedown',()=>{keys[k]=true; if(k==='shoot') spawnBullet();});
  el.addEventListener('mouseup',()=>{keys[k]=false});
}
bindTouch('btnL','ArrowLeft'); bindTouch('btnR','ArrowRight'); bindTouch('btnJump','ArrowUp'); bindTouch('btnShoot','shoot');
document.getElementById('btnJump').addEventListener('touchstart',e=>{e.preventDefault(); if(player.onGround){player.onGround=false; player.vy=-12}},{passive:false});
