    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

        }
        body {
            background-color: #f7f9fc;
            display: flex;

        /* Canvas Background / Animasi */
        #bgCanvas {
            position: fixed;
            top: 0;

            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1;
        }
        /* Header / Sapaan ala UI sebelumnya */

            border-radius: 20px;
            padding: 16px;

            display: flex;
            align-items: center;
            gap: 12px;
            border: 3px solid #ffcc00;
        }
        .avatar {
            width: 50px;
            height: 50px;
            background: #ffe680;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        .speech-bubble {

            color: #333;
            font-weight: bold;
        }
        /* Tombol Menu */

            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.1s ease;
        }
        .menu-btn:active {
            transform: scale(0.97);
        }
        .menu-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .menu-icon {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .arrow-badge {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        /* Warna-warni Menu */
        .bg-green { background-color: #4CAF50; }
        .bg-orange { background-color: #FF9800; }
        .bg-blue { background-color: #03A9F4; }
        .bg-purple { background-color: #9C27B0; }
        .bg-yellow { background-color: #FFEB3B; color: #333 !important; }

    <script>
        // Skrip Sederhana untuk Animasi Latar Belakang Canvas (Efek Bola / Bintang Bergerak)
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const colors = ['#ffcc00', '#4CAF50', '#03A9F4', '#FF9800', '#E91E63'];

        for (let i = 0; i < 20; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 15 + 5,
                color: colors[Math.floor(Math.random() * colors.length)],
                speedY: Math.random() * 1 - 0.5,
                speedX: Math.random() * 1 - 0.5
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = 0.2; // Semi transparan agar tidak mengganggu tombol
                ctx.fill();

                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
