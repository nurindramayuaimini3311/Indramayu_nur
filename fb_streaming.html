<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>META AI</title>
<link rel="icon" href="img/icon-512.png">
<meta name="theme-color" content="#0084FF">
<meta property="og:image" content="https://alwigrandle-bit.github.io/INDRAMAYU_CLUB/img/icon-512.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
iframe{width:100%;height:100vh;border:0;display:block}
.messenger-btn{position:fixed;bottom:20px;right:20px;z-index:9999;background:#0084FF;color:#fff;padding:14px 20px;border-radius:30px;text-decoration:none;font-family:Arial;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,132,255,.6);animation:pulse 2s infinite}
.messenger-btn img{width:32px;height:32px;border-radius:50%;border:2px solid #fff}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.loader{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;transition:.5s}
.loader img{width:120px;height:120px;border-radius:50%;border:4px solid #0084FF}
.loader h1{color:#fff;margin-top:16px;font-family:Arial;font-size:22px}
</style>
</head>
<body>

<div class="loader" id="load">
<img src="img/icon-512.png">
<h1>META AI</h1>
<p style="color:#0084FF;font-size:12px;margin-top:6px">Loading...</p>
</div>

<iframe src="https://alwigrandle-bit.github.io/INDRAMAYU_CLUB/" allowfullscreen
onload="document.getElementById('load').style.opacity=0;setTimeout(()=>document.getElementById('load').remove(),500)"></iframe>

<!-- TOMBOL MESSENGER AI -->

</body>
