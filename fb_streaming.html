<script>
function toggleDrop(e){e.stopPropagation();document.getElementById('navDrop').classList.toggle('active');tuk();}
document.addEventListener('click',()=>document.getElementById('navDrop').classList.remove('active'));
let ctx;
function tuk(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.setValueAtTime(700,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(150,ctx.currentTime+0.12);g.gain.setValueAtTime(0.6,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.14);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.14);if(navigator.vibrate)navigator.vibrate(40);}catch(e){}}
function loadUrl(u){document.getElementById('frame').src=u;document.getElementById('navDrop').classList.remove('active');document.getElementById('st').textContent=u.split('/').pop()||'Pusat';tuk();}
function ganti(){let s=document.getElementById('srv');loadUrl(s.value);}
function reloadFrame(){document.getElementById('frame').contentWindow.location.reload();tuk();}
</script>

<script>(function(){const PAGES=["/","/setting/","/alwiSD/","/fiturBARU/","/game/","/kamera-hantu/","/konten/","/kuis/","/netflix/","/pencuri/","/peta/"];let p=location.pathname,i=PAGES.indexOf(p);if(i==-1)i=PAGES.findIndex(x=>p.includes(x.replace(/\//g,'').replace('.html','')));if(i<0)i=0;let prev=PAGES[(i-1+PAGES.length)%PAGES.length],next=PAGES[(i+1)%PAGES.length];let L=document.getElementById('rlL'),R=document.getElementById('rlR');L.href=prev;R.href=next;let ctx;function tuk(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.setValueAtTime(700,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(150,ctx.currentTime+0.12);g.gain.setValueAtTime(0.6,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.14);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.14);if(navigator.vibrate)navigator.vibrate(40);}catch(e){}}[L,R].forEach(b=>b.addEventListener('click',()=>{tuk();b.style.transform='scale(0.8)';setTimeout(()=>b.style.transform='',120);}));let sx=0;document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70){tuk();setTimeout(tuk,70);if(dx>0)location.href=prev;else location.href=next;}},{passive:true});})();</script>
