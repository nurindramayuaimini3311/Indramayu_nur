<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IFRAME 1 — Dashboard & Online</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#fff;height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#2563eb,#7c3aed);padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:15px;font-weight:900;margin-right:auto}
.chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:800;cursor:pointer;transition:.15s}
.chip:active{transform:scale(.94)}
.chip.on{background:#fbbf24;color:#000;border-color:#fbbf24}
iframe{flex:1;width:100%;border:0;background:#fff}
.badge{font-size:10px;background:#fbbf24;color:#000;border-radius:6px;padding:2px 7px;font-weight:900}
</style>
</head>
<body>
<header>
  <h1>📡 IFRAME 1 <span class="badge">Dashboard & Online</span></h1>
  <button class="chip on" onclick="b('online.html')">📡 online</button>
  <button class="chip" onclick="b('alwi_pusat_live.html')">⛑️ Pusat Live</button>
  <button class="chip" onclick="b('NURgenerator/')">🗄️ NURgenerator</button>
  <button class="chip" onclick="b('NURgenerator/meta/')">🧩 Meta Index</button>
  <button class="chip" onclick="b('pengaturan/')">⚙️ Pengaturan</button>
</header>
<iframe id="f" src="https://pushing-dept-headset-rep.trycloudflare.com/online.html" allow="camera;microphone;geolocation;autoplay;clipboard-read;clipboard-write"></iframe>
<script>
var BASE="https://pushing-dept-headset-rep.trycloudflare.com/";
var chips=document.querySelectorAll('.chip');
function b(u){
  chips.forEach(function(c){ c.classList.remove('on'); });
  event.currentTarget.classList.add('on');
  var f=document.getElementById('f');
  f.style.opacity='.4';
  f.src=BASE+u;
  f.onload=function(){ f.style.opacity='1'; };
}
</script>
</body>
</html>
