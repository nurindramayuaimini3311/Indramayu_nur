        .portal-header{text-align:center;padding:36px 24px 28px;position:relative;z-index:1}

          border:3px solid var(--emas-terang);margin-bottom:16px;
          box-shadow:0 0 30px rgba(212,175,55,0.5);

          font-size:42px;
        }
        .portal-header h1{
          font-family:'Cinzel',serif;font-weight:900;
          font-size:clamp(1.4rem,4.5vw,2.2rem);

        .kartu{

          transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275),box-shadow 0.3s ease;
          position:relative;border:1px solid rgba(212,175,55,0.4);

        .kartu-strip{height:5px;background:linear-gradient(90deg,var(--emas) 0%,var(--emas-terang) 50%,var(--emas) 100%);background-size:200% 100%;animation:geser 2.5s linear infinite}
        .kartu-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 12px}
        .kartu-head h3{font-family:'Cinzel',serif;font-size:1.02rem;color:var(--emas-muda);letter-spacing:0.03em;text-shadow:0 0 10px rgba(212,175,55,0.5)}
