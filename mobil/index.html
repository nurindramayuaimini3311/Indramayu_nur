<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indramayu Nur — Mobil Hub</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0a0a0f;
    min-height:100vh;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    color:#eee;
    padding:32px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  h1 {
    font-size:20px;
    font-weight:700;
    margin-bottom:6px;
    text-align:center;
    color:#0ff;
  }
  .sub {
    font-size:13px;
    color:#888;
    margin-bottom:28px;
    text-align:center;
  }
  .grid {
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%;
    max-width:360px;
  }
  a.card {
    display:flex;
    align-items:center;
    gap:12px;
    background:#14141c;
    border:1px solid #23232f;
    border-radius:10px;
    padding:14px 16px;
    text-decoration:none;
    color:#eee;
    transition:border-color .15s, background .15s;
  }
  a.card:active {
    border-color:#0ff;
    background:#1a1a24;
  }
  .icon {
    font-size:20px;
    width:28px;
    text-align:center;
    flex-shrink:0;
  }
  .label {
    display:flex;
    flex-direction:column;
  }
  .label .name {
    font-size:14px;
    font-weight:600;
  }
  .label .file {
    font-size:11px;
    color:#666;
    font-family:monospace;
  }
  footer {
    margin-top:32px;
    font-size:11px;
    color:#555;
    text-align:center;
  }
</style>
</head>
<body>
  <h1>🚗 Mobil Hub</h1>
  <div class="sub">Indramayu_nur / mobil</div>

  <div class="grid">
    <a class="card" href="mobil.html">
      <div class="icon">🚙</div>
      <div class="label">
        <span class="name">Mobil</span>
        <span class="file">mobil.html</span>
      </div>
    </a>

    <a class="card" href="mobil2.html">
      <div class="icon">🚕</div>
      <div class="label">
        <span class="name">Mobil 2</span>
        <span class="file">mobil2.html</span>
      </div>
    </a>

    <a class="card" href="bonus_mobil.html">
      <div class="icon">🎁</div>
      <div class="label">
        <span class="name">Bonus Mobil</span>
        <span class="file">bonus_mobil.html</span>
      </div>
    </a>

    <a class="card" href="yin_yang.html">
      <div class="icon">☯️</div>
      <div class="label">
        <span class="name">Yin Yang Spin Demo</span>
        <span class="file">yin_yang.html</span>
      </div>
    </a>

    <a class="card" href="mobil3.html">
      <div class="icon">🏁mobil🚘</div>
      <div class="label">
        <span class="name">level 1234</span>
        <span class="file">index2.html</span>
      </div>
    </a>

    <a class="card" href="lucu/lucu1.html">
      <div class="icon">📁</div>
      <div class="label">
        <span class="name">Lucu</span>
        <span class="file">lucu/</span>
      </div>
    </a>
  </div>

  <footer>Panggung Sultan · dibuat via Termux</footer>
</body>
</html>
