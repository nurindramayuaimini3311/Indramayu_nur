<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕹️ Indramayu Club — Game Center</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(circle at 50% 0%, #1a0a2e, #0a0a0f 70%);
    min-height:100vh;
    font-family: 'Courier New', monospace;
    color:#eee;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 18px 60px;
  }
  header { text-align:center; margin-bottom:22px; }
  .kicker { color:#0ff; font-size:11px; letter-spacing:3px; margin-bottom:6px; }
  h1 {
    font-size:22px; color:#ff2d55;
    text-shadow:0 0 10px #ff2d55, 0 0 24px #ff2d5555;
    letter-spacing:1px;
  }
  .sub { color:#888; font-size:12px; margin-top:6px; }

  /* ---- Tombol pilih acak ---- */
  #randomBtn {
    background: linear-gradient(180deg,#ffcc00,#ff8a3d);
    color:#111; border:none; padding:16px 36px; font-size:16px;
    font-weight:bold; letter-spacing:2px; border-radius:10px;
    box-shadow:0 0 26px rgba(255,204,0,0.45), inset 0 -3px 0 rgba(0,0,0,0.25);
    font-family:inherit; cursor:pointer; margin:18px 0 8px;
  }
  #randomBtn:active { transform:translateY(2px); }
  #randomBtn:disabled { opacity:0.6; }

  #pickPanel {
    display:none; flex-direction:column; align-items:center;
    background:#000; border:1px solid #ffcc00; border-radius:10px;
    padding:16px 22px; margin-bottom:22px; min-width:240px;
    box-shadow:0 0 24px rgba(255,204,0,0.15);
  }
  #pickLabel { color:#666; font-size:11px; letter-spacing:2px; margin-bottom:6px; }
  #pickName { color:#0ff; font-size:16px; font-weight:bold; min-height:22px; text-align:center; }
  #goBtn {
    margin-top:12px; background:linear-gradient(180deg,#39ff88,#1fae5c);
    color:#052; border:none; padding:10px 26px; font-size:13px;
    font-weight:bold; border-radius:6px; cursor:pointer; display:none;
    font-family:inherit;
  }

  /* ---- Grid daftar game ---- */
  .grid {
    display:grid; grid-template-columns:1fr; gap:14px;
    width:100%; max-width:420px;
  }
  .card {
    display:flex; align-items:center; gap:14px;
    background:#111319; border:1px solid #2a2a35; border-radius:10px;
    padding:14px 16px; text-decoration:none; color:#eee;
    transition:border-color .15s, transform .1s;
    position:relative; overflow:hidden;
  }
  .card:active { transform:scale(0.98); }
  .card .emoji { font-size:30px; width:42px; text-align:center; flex-shrink:0; }
  .card .title { font-size:14px; font-weight:bold; color:#fff; margin-bottom:3px; }
  .card .desc { font-size:11px; color:#999; line-height:1.4; }
  .card.mobil   { border-color:#ff2d5555; }
  .card.bonus   { border-color:#ffcc0088; }
  .card.mobil2  { border-color:#0ff5; }
  .card.lucu    { border-color:#39ff8855; }
  .card.yinyang { border-color:#a06bff77; }
  .badge {
    position:absolute; top:8px; right:10px;
    font-size:9px; letter-spacing:1px; font-weight:bold;
    padding:3px 7px; border-radius:20px;
  }
  .badge.baru    { background:#ffcc00; color:#111; }
  .badge.rahasia { background:#39ff88; color:#052; }
  .badge.sains   { background:#a06bff; color:#fff; }

  footer { margin-top:26px; font-size:10px; color:#555; text-align:center; max-width:340px; }
</style>
</head>
<body>

  <header>
    <div class="kicker">INDRAMAYU CLUB PRESENTS</div>
    <h1>🕹️ GAME CENTER</h1>
    <div class="sub">Panggung Sultan Arcade — pilih game atau serahkan ke nasib</div>
  </header>

  <button id="randomBtn">🎲 PILIH ACAK</button>

  <div id="pickPanel">
    <div id="pickLabel">MENGUNDI...</div>
    <div id="pickName">_</div>
    <button id="goBtn">▶ MAIN SEKARANG</button>
  </div>

  <div class="grid" id="grid"></div>

  <footer>Semua game jalan lokal di HP kamu — nggak butuh koneksi internet buat main.</footer>

<script>
  // ⚠️ Sesuaikan "file" di bawah ini kalau struktur foldermu beda,
  // misal lucu1.html ternyata ada di dalam folder lucu/ atau di root.
  const GAMES = [
    {
      key:'mobil', cls:'mobil', emoji:'🏎️',
      title:'Road Fighter Klasik',
      desc:'Versi original — hindari & tabrak lalu lintas jalanan.',
      file:'mobil.html', badge:null
    },
    {
      key:'bonus', cls:'bonus', emoji:'☯️',
      title:'Road Fighter: Boss & Roda Gila',
      desc:'Lawan Raja Yin-Yang yang nembak + bonus spin roda warna-warni.',
      file:'bonus_mobil.html', badge:'BARU'
    },
    {
      key:'mobil2', cls:'mobil2', emoji:'🚗',
      title:'Road Fighter 2',
      desc:'Varian lain balapan jalanan Indramayu Club.',
      file:'mobil2.html', badge:null
    },
    {
      key:'lucu', cls:'lucu', emoji:'😈',
      title:'Situs Rahasia Jahat',
      desc:'Easter egg iseng buat hiburan — aman 100% dibuka.',
      file:'lucu/lucu1.html', badge:'RAHASIA'
    },
    {
      key:'yinyang', cls:'yinyang', emoji:'☯️',
      title:'Demo Spin Yin-Yang',
      desc:'Kenapa yin-yang keliatan kayak bola pas diputar cepat?',
      file:'yin_yang.html', badge:'SAINS'
    }
  ];

  const grid = document.getElementById('grid');
  GAMES.forEach(g => {
    const a = document.createElement('a');
    a.href = g.file;
    a.className = 'card ' + g.cls;
    a.innerHTML = `
      ${g.badge ? `<div class="badge ${g.badge==='BARU'?'baru':g.badge==='RAHASIA'?'rahasia':'sains'}">${g.badge}</div>` : ''}
      <div class="emoji">${g.emoji}</div>
      <div>
        <div class="title">${g.title}</div>
        <div class="desc">${g.desc}</div>
      </div>
    `;
    grid.appendChild(a);
  });

  // ---- Fitur pilih acak ala roda gila ----
  const randomBtn = document.getElementById('randomBtn');
  const pickPanel = document.getElementById('pickPanel');
  const pickLabel = document.getElementById('pickLabel');
  const pickName = document.getElementById('pickName');
  const goBtn = document.getElementById('goBtn');
  let chosen = null;

  randomBtn.addEventListener('click', () => {
    randomBtn.disabled = true;
    goBtn.style.display = 'none';
    pickPanel.style.display = 'flex';
    pickLabel.textContent = 'MENGUNDI...';

    let ticks = 0;
    const maxTicks = 16 + Math.floor(Math.random()*6);
    const shuffle = setInterval(() => {
      const g = GAMES[Math.floor(Math.random()*GAMES.length)];
      pickName.textContent = g.emoji + ' ' + g.title;
      ticks++;
      if (ticks >= maxTicks) {
        clearInterval(shuffle);
        chosen = GAMES[Math.floor(Math.random()*GAMES.length)];
        pickName.textContent = chosen.emoji + ' ' + chosen.title;
        pickLabel.textContent = 'TERPILIH!';
        goBtn.style.display = 'inline-block';
        randomBtn.disabled = false;
      }
    }, 70);
  });

  goBtn.addEventListener('click', () => {
    if (chosen) window.location.href = chosen.file;
  });
</script>

</body>
</html>
