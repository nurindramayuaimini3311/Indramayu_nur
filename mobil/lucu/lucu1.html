<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Evil Secret Website 😈</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(circle at 50% 20%, #1a0a2e, #0a0a0f 70%);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: 'Courier New', monospace;
    color:#39ff88; text-align:center; padding:24px;
    overflow:hidden;
  }
  h1 {
    font-size:28px; color:#ff2d55;
    text-shadow: 0 0 12px #ff2d55, 0 0 30px #ff2d5566;
    margin-bottom:10px; letter-spacing:1px;
  }
  .skull { font-size:50px; margin-bottom:16px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }
  .terminal {
    background:#000; border:1px solid #39ff88; border-radius:8px;
    padding:18px 22px; max-width:420px; width:100%; text-align:left;
    box-shadow: 0 0 30px rgba(57,255,136,0.15);
    margin-bottom:20px;
  }
  .terminal p { font-size:13px; line-height:1.9; }
  .terminal .prompt { color:#0ff; }
  .terminal .comment { color:#666; }
  #plan {
    color:#ffcc00; font-weight:bold; min-height:20px;
  }
  .cursor { display:inline-block; width:8px; background:#39ff88; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .btn {
    background: linear-gradient(180deg,#ff2d55,#c4003a);
    color:#fff; border:none; padding:12px 26px; font-size:14px;
    font-weight:bold; letter-spacing:1px; border-radius:6px;
    box-shadow: 0 0 20px rgba(255,45,85,0.5);
    font-family: inherit; cursor:pointer;
  }
  .btn:active { transform: translateY(2px); }
  footer { margin-top:22px; font-size:11px; color:#555; max-width:340px; }
</style>
</head>
<body>

  <div class="skull">😈</div>
  <h1>SUPER EVIL SECRET WEBSITE</h1>

  <div class="terminal">
    <p class="comment">// system.log</p>
    <p><span class="prompt">&gt;</span> loading malware.js... <span style="color:#39ff88;">[BLOCKED — cuma bercanda kok]</span></p>
    <p><span class="prompt">&gt;</span> applying freakysheet.css... <span style="color:#39ff88;">OK</span></p>
    <p><span class="prompt">&gt;</span> initiating world domination plan...</p>
    <p id="plan">_</p>
  </div>

  <button class="btn" id="btn">🚀 JALANKAN RENCANA JAHAT</button>

  <footer>psst — ini cuma parodi meme programmer, nggak ada yang beneran jahat di sini. Aman 100% dibuka.</footer>

<script>
  const plans = [
    "Rencana 1: Minum kopi sambil ngoding sampai subuh ☕",
    "Rencana 2: Push ke branch main tanpa testing 😅",
    "Rencana 3: Bikin komentar kode 'TODO: fix later' selamanya",
    "Rencana 4: Nge-deploy hari Jumat sore 🔥",
    "Rencana 5: Menguasai dunia... nanti kalau bug udah kelar 👑"
  ];
  const planEl = document.getElementById('plan');
  const btn = document.getElementById('btn');
  let idx = 0;

  function typeText(text, cb) {
    planEl.innerHTML = '';
    let i = 0;
    const interval = setInterval(() => {
      planEl.innerHTML = text.slice(0, i) + '<span class="cursor">&nbsp;</span>';
      i++;
      if (i > text.length) { clearInterval(interval); if (cb) cb(); }
    }, 25);
  }

  btn.addEventListener('click', () => {
    typeText(plans[idx % plans.length]);
    idx++;
  });

  typeText(plans[0]);
</script>

</body>
</html>
