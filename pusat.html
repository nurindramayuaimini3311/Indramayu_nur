<!DOCTYPE html>
<html lang="id">
<head>
  <script>
  // Patch touch listener agar responsif & bebas warning di WebView Termux / Mobile
  (function(){if(window.__playableTouchPatchInstalled)return;window.__playableTouchPatchInstalled=true;var origAdd=EventTarget.prototype.addEventListener;var blocked={touchstart:1,touchmove:1,wheel:1};EventTarget.prototype.addEventListener=function(t,l,o){if(blocked[t]){if(o==null)o={passive:true};else if(typeof o==='boolean')o={capture:o,passive:true};else o=Object.assign({},o,{passive:true});}return origAdd.call(this,t,l,o);}})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ALWI ⛑️ LASTER - VPS PORTAL</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #fff; }
    
    /* Header Ringkas */
    header {
      height: 48px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #38bdf8;
    }
    .status-badge {
      font-size: 10px;
      background: #065f46;
      color: #34d399;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid #059669;
    }
    .actions button {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .actions button:active { background: #0369a1; }

    /* Frame Utama Alwi Laster */
    .container {
      width: 100%;
      height: calc(100vh - 48px);
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>⛑️</span>
      <span>ALWI LASTER</span>
      <span id="badge" class="status-badge">ONLINE</span>
    </div>
    <div class="actions">
      <button onclick="reloadAlwi()">🔄 Refresh Laster</button>
    </div>
  </header>

  <div class="container">
    <iframe 
      id="alwiFrame" 
      src="http://34.170.37.50:3000/index-ollama-backup.html" 
      allow="clipboard-read; clipboard-write; autoplay; microphone; camera">
    </iframe>
  </div>

  <script>
    const iframe = document.getElementById('alwiFrame');
    const badge = document.getElementById('badge');

    function reloadAlwi() {
      badge.textContent = "CONNECTING...";
      badge.style.background = "#92400e";
      badge.style.color = "#fcd34d";
      iframe.src = 'http://34.170.37.50:3000/index-ollama-backup.html?t=' + Date.now();
    }

    iframe.onload = () => {
      badge.textContent = "READY / ACTIVE";
      badge.style.background = "#065f46";
      badge.style.color = "#34d399";
    };
  </script>
</body>
</html>
