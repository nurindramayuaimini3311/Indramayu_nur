<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksi Gambar Horor</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #e63946;
            margin-bottom: 20px;
        }

        .img-container {
            border: 2px solid #333;
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.4);
            border-radius: 8px;
            overflow: hidden;
            max-width: 90%;
            margin-bottom: 20px;
        }

        .img-container img {
            display: block;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <h1>Koleksi Gambar Horor</h1>

    <div class="img-container">
        <img src="hantu3.jpg" alt="Gambar Hantu">
    </div>

    <div class="img-container">
        <img src="hantu4.webp" alt="Gambar Hantu 2">
    </div>

    <div class="img-container">
        <img src="hantuKEMBAR.jpg" alt="Gambar Hantu 3">
    </div>

</body>
</html>
