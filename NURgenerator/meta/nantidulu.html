<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>META ALWI — Pusat Halaman</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f59e0b">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js")});</script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --emas:#d97706; --emas-terang:#f59e0b;
  --border:#3b82f6; --border-sub:#cbd5e1;
  --text-utama:#0f172a; --text-biru:#1e40af; --hijau:#16a34a;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:linear-gradient(180deg,#ffffff 0%,#eef6ff 100%);color:var(--text-utama)}
#topbar{position:sticky;top:0;z-index:900;background:#fff;border-bottom:2px solid var(--border-sub);padding:8px 8px 0}
#topbar .judul{text-align:center;color:var(--text-biru);font-family:'Cinzel',serif;font-weight:900;font-size:16px;padding:2px 0 8px}
#tabBar{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
#tabBar::-webkit-scrollbar{display:none}
.tab{flex:none;border:none;background:none;color:#64748b;font-size:13px;font-weight:800;padding:10px 14px;cursor:pointer;border-radius:10px 10px 0 0;white-space:nowrap;transition:.15s}
.tab:hover{background:#eff6ff;color:var(--text-biru)}
.tab.aktif{color:var(--text-biru);background:#fff;box-shadow:inset 0 -3px 0 var(--border)}
#bingkai{width:100%;height:calc(100vh - 92px);border:none;display:block;background:#fff}
#memuat{position:fixed;top:52%;left:50%;transform:translate(-50%,-50%);color:#64748b;font-size:14px;display:none;z-index:5}

/* ═══ ALWI NAVIGASI ═══ */
#alwiNavWrap{position:fixed;bottom:14px;left:14px;z-index:999999990}
#alwiNavBtn{display:flex;align-items:center;gap:6px;background:var(--emas-terang);color:#fff;border:2px solid var(--emas);
 border-radius:24px;padding:10px 18px;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 4px 12px rgba(245,158,11,.35);transition:.25s}
#alwiNavBtn:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(245,158,11,.45)}
#alwiNavMenu{display:none;position:absolute;bottom:52px;left:0;min-width:230px;background:#fff;border:2px solid var(--border-sub);border-radius:14px;
 overflow:hidden;box-shadow:0 12px 30px rgba(15,23,42,.18)}
#alwiNavWrap.buka #alwiNavMenu{display:block}
.alwiNavJdl{padding:9px 14px 7px;font-size:10px;letter-spacing:2px;color:var(--emas);font-weight:900;border-bottom:1px solid #fde68a;background:#fffbeb}
#alwiNavMenu a{display:flex;align-items:center;gap:8px;padding:11px 14px;color:var(--text-utama);text-decoration:none;font-size:12.5px;font-weight:700;transition:.15s}
#alwiNavMenu a:hover{background:#fff7ed;color:var(--emas);padding-left:18px}
@media (max-width:400px){#alwiNavBtn{font-size:11px;padding:8px 13px}}
</style>
</head>
<body>

<div id="topbar">
  <div class="judul">🌐 META ALWI — PUSAT HALAMAN</div>
  <div id="tabBar">
    <button class="tab aktif" data-hal="alwibook.html">📘 Feed AlwiBook</button>
    <button class="tab" data-hal="template-komentar.html">💬 Komentar & Properti</button>
    <button class="tab" data-hal="gambar-streaming/index.html">🖼️ Gambar Streaming</button>
    <button class="tab" data-hal="promosi-streaming/index.html">📺 Promosi Streaming</button>
  </div>
</div>

<iframe id="bingkai" src="alwibook.html" title="halaman"></iframe>
<div id="memuat">Memuat…</div>

<!-- ══════════ ALWI NAVIGASI ══════════ -->
<div id="alwiNavWrap">
  <button id="alwiNavBtn">🧭 ALWI NAVIGASI ▲</button>
  <div id="alwiNavMenu">
    <div class="alwiNavJdl">✦ HALAMAN UTAMA ✦</div>
    <a href="index.html">🏠 Pusat Halaman (ini)</a>
    <a href="alwibook.html" target="_blank">📘 Feed AlwiBook (penuh)</a>
    <div class="alwiNavJdl">✦ STREAMING ✦</div>
    <a href="template-komentar.html">💬 Komentar & Properti Terbang</a>
    <a href="gambar-streaming/index.html">🖼️ Gambar Streaming — 4 Slot</a>
    <a href="promosi-streaming/index.html">📺 Promosi Streaming — 4 Slot</a>
    <div class="alwiNavJdl">✦ LAINNYA ✦</div>
    <a href="video-drive.html">🎬 Video Drive</a>
  </div>
</div>

<script>
var bingkai=document.getElementById('bingkai'),memuat=document.getElementById('memuat');
var terpasang={};

document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('aktif')});
    t.classList.add('aktif');
    var hal=t.dataset.hal;
    if(!terpasang[hal]){ // iframe hanya dimuat sekali per tab (biar ringan)
      memuat.style.display='block';
      bingkai.src=hal;
    }else{
      bingkai.src=hal;
    }
  });
});

bingkai.addEventListener('load',function(){memuat.style.display='none';terpasang[bingkai.getAttribute('src')]=1});

/* dukung link ?hal=template-2.html dari luar */
(function(){var h=new URLSearchParams(location.search).get('hal');
 if(h){var t=document.querySelector('.tab[data-hal="'+h+'"]');if(t)t.click()}})();

/* navigasi */
(function(){var w=document.getElementById('alwiNavWrap'),b=document.getElementById('alwiNavBtn');
 b.addEventListener('click',function(e){e.stopPropagation();w.classList.toggle('buka');
  b.textContent=w.classList.contains('buka')?'🧭 ALWI NAVIGASI ▼':'🧭 ALWI NAVIGASI ▲'});
 document.addEventListener('click',function(e){if(!w.contains(e.target)){w.classList.remove('buka');
  b.textContent='🧭 ALWI NAVIGASI ▲'}})})();
</script>


<!-- ===== TANYA ALWI AI (Ollama via :3000) ===== -->
<div id="alwiAiBox" style="max-width:480px;margin:16px auto;background:#fff;border:2px solid #bfdbfe;border-radius:14px;padding:12px;font-family:'Inter',sans-serif">
  <div style="font-size:.75rem;font-weight:900;color:var(--hijau);margin-bottom:6px">🤖 TANYA ALWI AI <span style="color:#94a3b8;font-weight:400">• model Alwi • port 3000</span></div>
  <div style="display:flex;gap:6px">
    <input id="aiQ" placeholder="Mau tanya apa?" style="flex:1;padding:10px;border-radius:9px;border:1.5px solid var(--border-sub);background:#f8fafc;color:var(--text-utama);font-size:.85rem;outline:none">
    <button onclick="alwiTanya()" style="padding:10px 14px;border:none;border-radius:9px;background:var(--emas-terang);color:#fff;font-weight:900;cursor:pointer">KIRIM</button>
  </div>
  <div id="aiA" style="margin-top:8px;font-size:.85rem;line-height:1.55;color:#334155;display:none"></div>
</div>
<script>
function API8080(){return (location.protocol==='file:'?'http:':location.protocol)+'//'+(location.hostname||'136.85.74.104')+':8080';}
async function alwiTanya(){
  var q=document.getElementById('aiQ').value.trim();
  if(!q)return;
  var a=document.getElementById('aiA');
  a.style.display='block'; a.style.color='#1e40af'; a.textContent='⏳ Alwi berpikir...';
  try{
    var r=await fetch(API8080()+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Jawab singkat padat Bahasa Indonesia: '+q})});
    var d=await r.json();
    a.style.color='#334155'; a.textContent=d.reply?('Alwi: '+d.reply.trim()):('⚠️ '+(d.galat||'gagal'));
  }catch(e){ a.style.color='#dc2626'; a.textContent='⚠️ Server AI tak terjangkau'; }
}
document.getElementById('aiQ').addEventListener('keydown',function(e){if(e.key==='Enter')alwiTanya();});
(function(){var q=new URLSearchParams(location.search).get('q');
  if(q){document.getElementById('aiQ').value=q;setTimeout(alwiTanya,500);}
})();
</script>

<script src="/alwi_bubble2.js"></script>
</body>
</html>
