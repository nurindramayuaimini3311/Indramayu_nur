<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slot Live — Komentar & Properti</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f172a; --white:#ffffff;
  --diamond:#00c2ff; --rose:#ff3d81; --fire:#ff8a00; --rocket:#8b5cf6;
  --merah:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Baloo 2',sans-serif;
  background:radial-gradient(circle,#e5e7eb 1.5px,transparent 1.5px) 0 0/16px 16px,var(--white);
  min-height:100vh;color:var(--ink);padding:10px;
}
.card{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:10px;margin-bottom:10px}

/* NAMA + IDENTITAS */
.title{font-family:'Bangers',cursive;font-size:16px;letter-spacing:1px;text-align:center;transform:rotate(-1deg);margin-bottom:6px}
.field-label{font-family:'Bangers',cursive;font-size:11px;letter-spacing:1px;display:block;margin-bottom:4px}
#inputNama{width:100%;padding:8px 10px;border:2.5px solid var(--ink);border-radius:9px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13px;outline:none}

/* KAMERA */
.avatar-tag{position:relative}
.slot-media{width:100%;aspect-ratio:4/3;background:#f1f5f9;border:2.5px solid var(--ink);border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.slot-media img,.slot-media video{width:100%;height:100%;object-fit:cover}
.avatar{font-size:40px}
.live-tag{position:absolute;top:6px;right:6px;background:var(--merah);color:#fff;font-size:9px;padding:3px 8px;border-radius:6px;font-weight:900;display:none}
.off-tag{position:absolute;top:6px;right:6px;background:#64748b;color:#fff;font-size:9px;padding:3px 8px;border-radius:6px;font-weight:800}
.ctrl-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ctrl-btn{padding:9px 4px;border-radius:9px;border:2.5px solid var(--ink);font-family:'Bangers',cursive;font-size:12px;letter-spacing:0.5px;cursor:pointer;text-align:center;background:#fff}
.ctrl-btn.on{background:var(--merah);color:#fff}
.ctrl-btn:active{transform:translate(2px,2px)}

/* KOMENTAR */
.komentar-list{max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px;margin-bottom:8px}
.balon{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:6px 10px;max-width:88%;align-self:flex-start;font-size:12px;font-weight:700;animation:pop .2s ease-out}
.balon .nm{font-family:'Bangers',cursive;font-size:12px;color:var(--diamond);-webkit-text-stroke:0.4px var(--ink)}
.balon .tx{color:var(--ink);margin-top:1px}
@keyframes pop{0%{transform:scale(0.7);opacity:0}100%{transform:scale(1);opacity:1}}
.komentar-input-row{display:flex;gap:6px}
#inputKomentar{flex:1;padding:8px 10px;border:2.5px solid var(--ink);border-radius:9px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:12px;outline:none}
.btn-kirim{background:var(--ink);color:#fff;border:2.5px solid var(--ink);border-radius:9px;padding:0 14px;font-family:'Bangers',cursive;font-size:12px;letter-spacing:1px;cursor:pointer}

/* PROPERTI */
.gift-title{font-family:'Bangers',cursive;font-size:12px;letter-spacing:1px;text-align:center;margin-bottom:6px}
.gift-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn-gift{background:#fff;border:2.5px solid var(--ink);border-radius:11px;box-shadow:3px 3px 0 var(--ink);padding:8px 2px 6px;text-align:center;cursor:pointer}
.btn-gift:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn-gift .ic{font-size:20px;display:block}
.btn-gift .lb{font-family:'Bangers',cursive;font-size:9px;margin-top:2px;display:block}
.btn-gift.diamond{color:var(--diamond)}.btn-gift.rose{color:var(--rose)}.btn-gift.fire{color:var(--fire)}.btn-gift.rocket{color:var(--rocket)}

/* EFEK TERBANG */
.fly{position:fixed;font-size:26px;z-index:9999;pointer-events:none;filter:drop-shadow(2px 3px 0 var(--ink))}
@keyframes terbang{0%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1}55%{transform:translate(calc(var(--tx)*0.55),calc(var(--ty)*0.55 - 50px)) scale(1.4) rotate(180deg);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0.6) rotate(360deg);opacity:0.9}}
.fly.run{animation:terbang .9s cubic-bezier(.25,1,.5,1) forwards}
@keyframes bursts{0%{transform:scale(0.2) rotate(0deg);opacity:1}100%{transform:scale(2) rotate(30deg);opacity:0}}
.burst{position:fixed;z-index:9997;pointer-events:none;font-size:34px;animation:bursts .5s ease-out forwards}
.pow{position:fixed;z-index:10000;pointer-events:none;font-family:'Bangers',cursive;font-size:14px;color:#fff;-webkit-text-stroke:1.5px var(--ink);background:var(--fire);border:2.5px solid var(--ink);border-radius:50%;padding:5px 8px;transform:translate(-50%,-50%) scale(0);animation:powpop .5s ease-out forwards}
@keyframes powpop{0%{transform:translate(-50%,-50%) scale(0)}40%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
</style>
</head>
<body>

<div class="card">
  <div class="title" id="judul">Slot Live</div>
  <label class="field-label">NAMA KAMU</label>
  <input id="inputNama" placeholder="Isi nama sendiri...">
</div>

<div class="card">
  <div class="slot-media" id="media">
    <div class="avatar" id="avatar">🙂</div>
    <video id="video" autoplay muted playsinline style="display:none"></video>
    <div class="live-tag" id="liveTag">🔴 LIVE</div>
    <div class="off-tag" id="offTag">⚫ Standby</div>
  </div>
</div>

<div class="card">
  <div id="kotakKomentarAlwi"></div>
</div>

<div class="card">
  

<script>
const q = new URLSearchParams(location.search);
const ID = q.get('id') || 'slot';
const NAMA_DEFAULT = q.get('nama') || 'Member';
const AVA = q.get('ava') || '🙂';

document.getElementById('judul').textContent = AVA + ' ' + NAMA_DEFAULT;
document.getElementById('avatar').textContent = AVA;
document.getElementById('inputNama').value = NAMA_DEFAULT;

function namaAktif(){ return (document.getElementById('inputNama').value || '').trim() || 'Member ALWI'; }

/* fitur kamera dihapus */

/* komentar lama diganti widget server: komentar/komentar.js */

/* ===== PROPERTI TERBANG ===== */
function lempar(e, emoji, nama, warna){
  const btn = e.currentTarget;
  const target = document.getElementById('komentarList');
  const bR = btn.getBoundingClientRect(), tR = target.getBoundingClientRect();
  const x0=bR.left+bR.width/2, y0=bR.top+bR.height/2;
  const x1=tR.left+tR.width/2, y1=tR.top+tR.height/2;

  for(let i=0;i<3;i++) setTimeout(()=>{
    const f=document.createElement('div');
    f.className='fly'; f.textContent=emoji;
    f.style.left=(x0-13)+'px'; f.style.top=(y0-13)+'px';
    f.style.setProperty('--tx',(x1-x0)+'px'); f.style.setProperty('--ty',(y1-y0)+'px');
    document.body.appendChild(f);
    requestAnimationFrame(()=>f.classList.add('run'));
    setTimeout(()=>f.remove(),950);
  }, i*140);

  setTimeout(()=>{
    const b=document.createElement('div');
    b.className='burst'; b.textContent='✨'; b.style.left=(x1-17)+'px'; b.style.top=(y1-17)+'px'; b.style.color=warna;
    document.body.appendChild(b); setTimeout(()=>b.remove(),550);

    const p=document.createElement('div');
    p.className='pow'; p.textContent='POW!'; p.style.left=x1+'px'; p.style.top=y1+'px'; p.style.background=warna;
    document.body.appendChild(p); setTimeout(()=>p.remove(),550);

    const balon=document.createElement('div');
    balon.className='balon';
    balon.innerHTML=`<div class="nm">${namaAktif()}</div><div class="tx">Ngirim ${emoji} ${nama}!</div>`;
    target.appendChild(balon); target.scrollTop=target.scrollHeight;
  }, 850);
}
</script>
<script>window.KOMENTAR_POSTID='komentar-alwi-bersama';</script>
<script src="../komentar/komentar.js"></script>
<script src="/alwi_bubble2.js"></script>
</body>
</html>
