<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initialial-scale=1">
<title>👥 Kartu Member</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:linear-gradient(180deg,#0a1428,#0d6efd15);color:#0f356e;min-height:100vh;padding:16px}
.wrap{max-width:720px;margin:0 auto}
h1{text-align:center;font-size:22px;color:#0b5ed7;margin-bottom:4px}
p.sub{text-align:center;font-size:12px;color:#6b8ab8;margin-bottom:18px}
a.home{display:block;width:max-content;margin:0 auto 18px;background:#0d6efd;color:#fff;text-decoration:none;border-radius:10px;padding:9px 16px;font-weight:800;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.card{background:#fff;border:1.6px solid #cfe2ff;border-radius:18px;padding:16px 12px;text-align:center;box-shadow:0 4px 14px rgba(13,110,253,.08)}
.avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;object-fit:cover;background:#eaf4ff;display:block;border:3px solid #0d6efd20}
.up{display:block;font-size:11px;font-weight:800;color:#0b5ed7;cursor:pointer;margin-bottom:8px}
input{width:100%;padding:8px;border:1.4px solid #cfe2ff;border-radius:9px;font-size:12px;margin-bottom:6px;font-weight:700;color:#0f356e;outline:none}
input:focus{border-color:#0d6efd}
select{width:100%;padding:8px;border:1.4px solid #cfe2ff;border-radius:9px;font-size:12px;font-weight:700;color:#0f356e;background:#fff;margin-bottom:10px}
.save{width:100%;padding:9px;border:none;border-radius:10px;background:#0d6efd;color:#fff;font-weight:800;font-size:12px;cursor:pointer}
.saved{font-size:10px;color:#059669;margin-top:6px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="/">🏠 Dashboard Utama</a>
  <h1>👥 KARTU MEMBER</h1>
  <p class="sub">Unggah Foto + Biodata 4 Member</p>
  <div class="grid" id="grid"></div>
</div>

<script>
const SLOTS = [
  { id: 'anda', nama: 'ANDA' },
  { id: 'imah', nama: 'IMAH' },
  { id: 'nur', nama: 'NUR' },
  { id: 'club', nama: 'CLUB' }
];

function kartu(s, i) {
  const st = JSON.parse(localStorage.getItem('member_' + s.id) || '{}');
  const genOpt = ['', 'Laki-laki', 'Perempuan'].map(g =>
    '<option value="' + g + '"' + (st.jk === g ? ' selected' : '') + '>' + (g || 'Pilih JK') + '</option>'
  ).join('');
  return `
  <div class="card">
    <img class="avatar" id="av${i}" src="${st.foto || ''}">
    <label class="up">📷 Unggah Foto<input type="file" accept="image/*" style="display:none" onchange="foto(${i},this)"></label>
    <input placeholder="Nama" value="${st.nama || ''}" id="nama${i}">
    <input type="number" placeholder="Umur" value="${st.umur || ''}" id="umur${i}">
    <select id="jk${i}">${genOpt}</select>
    <button class="save" onclick="simpan(${i})">💾 SIMPAN</button>
    <div class="saved" id="ok${i}"></div>
  </div>`;
}

SLOTS.forEach((s, i) => {
  const el = document.createElement('div');
  document.getElementById('grid').appendChild(el);
  setTimeout(() => { el.outerHTML = kartu(s, i); }, 0);
});

function foto(i, inp) {
  const f = inp.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      const S = 150;
      c.width = S; c.height = S;
      const cx = c.getContext('2d');
      const min = Math.min(img.width, img.height);
      const sx = (img.width - min) / 2, sy = (img.height - min) / 2;
      cx.imageSmoothingQuality = 'high';
      cx.drawImage(img, sx, sy, min, min, 0, 0, S, S);
      const data = c.toDataURL('image/jpeg', .7);
      document.getElementById('av' + i).src = data;
      const st = JSON.parse(localStorage.getItem('member_' + SLOTS[i].id) || '{}');
      st.foto = data;
      localStorage.setItem('member_' + SLOTS[i].id, JSON.stringify(st));
      document.getElementById('ok' + i).textContent = '✅ Foto kecil tersimpan';
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
}

function simpan(i) {
  const s = SLOTS[i];
  const st = JSON.parse(localStorage.getItem('member_' + s.id) || '{}');
  st.nama = document.getElementById('nama' + i).value;
  st.umur = document.getElementById('umur' + i).value;
  st.jk = document.getElementById('jk' + i).value;
  localStorage.setItem('member_' + s.id, JSON.stringify(st));
  document.getElementById('ok' + i).textContent = '✅ Tersimpan';
  setTimeout(() => document.getElementById('ok' + i).textContent = '', 1500);
}
</script><script src="../alwi_bubble2.js"></script>
</body>
</html>
