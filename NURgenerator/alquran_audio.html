<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎧 Al-Quran Audio — Download Murottal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:linear-gradient(180deg,#04140f,#064e3b);color:#e2e8f0;min-height:100vh;padding:16px}
.wrap{max-width:620px;margin:0 auto}
h1{text-align:center;font-size:20px;color:#34d399;margin-bottom:4px}
p.sub{text-align:center;font-size:11px;color:#94a3b8;margin-bottom:14px}
a.home{display:block;width:max-content;margin:0 auto 14px;background:#059669;color:#fff;text-decoration:none;border-radius:10px;padding:8px 14px;font-weight:800;font-size:11px}
.box{background:rgba(255,255,255,.06);border:1px solid rgba(52,211,153,.3);border-radius:14px;padding:16px}
label{display:block;font-size:12px;font-weight:800;color:#6ee7b7;margin-bottom:8px}
.row{display:flex;gap:8px;margin-bottom:12px}
select{flex:1;padding:11px;border-radius:10px;border:1px solid #365314;background:#052e16;color:#fff;font-size:13px;font-weight:700}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;text-align:center;display:block;text-decoration:none}
.btn-main{background:#059669;color:#fff}
.btn-play{background:#0e7490;color:#fff;margin-top:10px}
audio{width:100%;height:42px;margin-top:10px}
.info{font-size:12px;color:#6ee7b7;margin-top:10px;word-break:break-all}
.load{text-align:center;color:#34d399;font-size:13px;margin:20px 0}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="/">🏠 Dashboard Utama</a>
  <h1>🎧 AL-QURAN AUDIO</h1>
  <p class="sub">Download & Putar Murottal Alafasy — 114 Surah</p>
  <div class="box">
    <label>Pilih Surah</label>
    <div class="row">
      <select id="surahSel"></select>
    </div>
    <a class="btn btn-main" id="dlBtn" download>⬇️ DOWNLOAD MP3 SURAH</a>
    <button class="btn btn-play" onclick="main()">▶️ PUTAR / PAUSE</button>
    <audio id="audio" controls></audio>
    <div class="info" id="info">Pilih surah untuk melihat audio & tombol download.</div>
  </div>
  <div class="load" id="load">Memuat daftar surah...</div>
</div>

<script>
const SURAHS = [
"Al-Fatihah","Al-Baqarah","Ali 'Imran","An-Nisa'","Al-Ma'idah","Al-An'am","Al-A'raf","Al-Anfal","At-Tawbah","Yunus","Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Ta-Ha","Al-Anbiya","Al-Hajj","Al-Mu'minun","An-Nur","Al-Furqan","Ash-Shu'ara","An-Naml","Al-Qasas","Al-'Ankabut","Ar-Rum","Luqman","As-Sajdah","Al-Ahzab","Saba'","Fatir","Ya-Sin","As-Saffat","Sad","Az-Zumar","Ghafir","Fussilat","Ash-Shura","Az-Zukhruf","Ad-Dukhan","Al-Jathiyah","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf","Adh-Dhariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah","Al-Hadid","Al-Mujadila","Al-Hashr","Al-Mumtahanah","As-Saff","Al-Jumu'ah","Al-Munafiqun","At-Taghabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij","Nuh","Al-Jinn","Al-Muzzammil","Al-Muddaththir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","'Abasa","At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Inshiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Ghashiyah","Al-Fajr","Al-Balad","Ash-Shams","Al-Layl","Ad-Duha","Ash-Sharh","At-Tin","Al-'Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-'Adiyat","Al-Qari'ah","At-Takathur","Al-'Asr","Al-Humazah","Al-Fil","Quraysh","Al-Ma'un","Al-Kawthar","Al-Kafirun","An-Nasr","Al-Masad","Al-Ikhlas","Al-Falaq","An-Nas"
];

const surahSel = document.getElementById('surahSel');
SURAHS.forEach((n, i) => {
  const o = document.createElement('option');
  o.value = i + 1;
  o.textContent = (i + 1) + '. ' + n;
  surahSel.appendChild(o);
});
document.getElementById('load').style.display = 'none';

function getUrl() {
  return 'https://cdn.islamic.network/quran/audio/128/ar.alafasy/' + surahSel.value + '.mp3';
}

function update() {
  const s = SURAHS[surahSel.value - 1];
  const url = getUrl();
  document.getElementById('info').textContent = '🕌 ' + surahSel.value + '. ' + s + '\n' + url;
  document.getElementById('audio').src = url;
  document.getElementById('dlBtn').href = url;
}
surahSel.addEventListener('change', update);
update();

function main() {
  const a = document.getElementById('audio');
  if (a.paused) a.play(); else a.pause();
}
</script>
<script src="/alwi_bubble2.js"></script>
</body>
</html>
