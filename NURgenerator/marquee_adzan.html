<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📢 TEKS BERJALAN ADZAN — Indramayu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0a0a0a;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#111;border-bottom:2px solid #ffd70044}
.top b{color:#ffd700;font-size:15px}
a.home{background:#ffd700;color:#000;text-decoration:none;font-weight:900;font-size:12px;padding:9px 16px;border-radius:10px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden}
marquee{width:100%;font-size:34px;font-weight:900;color:#ffd700;text-shadow:0 0 12px rgba(255,215,0,.7);letter-spacing:1px}
.info{position:absolute;top:10px;left:0;right:0;text-align:center;color:#aaa;font-size:12px}
.badge{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#888;font-size:11px}
#unlockBtn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;background:linear-gradient(180deg,#3a2d00,#1a1500);border:3px solid #ffd700;border-radius:20px;padding:22px 26px;cursor:pointer;text-align:center;box-shadow:0 0 30px rgba(255,215,0,.5);animation:denyut 1.2s infinite}
@keyframes denyut{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.06)}}
#unlockBtn.terbuka{display:none}
#audioHidden{display:none}
</style>
</head>
<body>
<div class="top">
  <b>📢 TEKS BERJALAN ADZAN</b>
  <a class="home" href="/">🏠 HOME</a>
</div>
<div class="stage">
  <div class="info" id="status">Memuat jadwal adzan...</div>
  <button id="unlockBtn" onclick="bukaSuara()">
    <div style="font-size:52px;line-height:1">🔊</div>
    <div id="unlockTxt" style="font-size:20px;font-weight:900;color:#ffd700;margin-top:6px">TEKAN TOMBOL INI</div>
    <div style="font-size:15px;font-weight:700;color:#fff;margin-top:4px" id="unlockSub">2 Menit Lagi Adzan Akan Berkumandang</div>
  </button>
  <marquee id="mq" behavior="scroll" direction="left" scrollamount="12">🕌 MENUNGGU JADWAL ADZAN...</marquee>
  <div class="badge" id="countdown">--:--:--</div>
</div>
<audio id="audioHidden" preload="none"></audio>

<script>
var JADWAL = null;
var JAM_ADZAN = [];
var MASAK_ARRAY = ['Subuh','Dzuhur','Ashar','Maghrib','Isya'];
const KOTA = 'Indramayu';

async function loadJadwal(){
  try{
    const tgl = new Date().toISOString().slice(0,10).replace(/-/g,'/');
    const res = await fetch('https://api.aladhan.com/v1/timingsByCity/'+tgl+'?city='+KOTA+'&country=Indonesia&method=20');
    const d = await res.json();
    JADWAL = d.data.timings;
    JAM_ADZAN = MASAK_ARRAY.map(m=>({nama:m, jam:JADWAL[m]}));
    document.getElementById('status').textContent = '🕌 ALWI ADZAN — Indramayu • Jadwal dimuat';
  }catch(e){
    document.getElementById('status').textContent = '⚠️ API jadwal gagal — pakai cadangan';
    // cadangan
    JAM_ADZAN = [{nama:'Subuh',jam:'04:31'},{nama:'Dzuhur',jam:'11:48'},{nama:'Ashar',jam:'15:07'},{nama:'Maghrib',jam:'17:47'},{nama:'Isya',jam:'18:57'}];
  }
}

function keDetik(jam){ // 'HH:MM' -> detik
  const p=jam.split(':');
  return parseInt(p[0],10)*3600+parseInt(p[1],10)*60;
}
function fmt(d){
  d=Math.max(0,d);
  const h=String(Math.floor(d/3600)).padStart(2,'0');
  const m=String(Math.floor((d%3600)/60)).padStart(2,'0');
  const s=String(d%60).padStart(2,'0');
  return h+':'+m+':'+s;
}

function tick(){
  const now = new Date();
  const detikSkr = now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
  const mq = document.getElementById('mq');
  const cd = document.getElementById('countdown');
  const st = document.getElementById('status');

  if(!JAM_ADZAN.length) return;

  // Cari adzan berikutnya (termasuk wrap tengah malam)
  let next = null, menitKe = null;
  for(const a of JAM_ADZAN){
    const d0 = keDetik(a.jam);
    if(d0 > detikSkr){ next=a; menitKe=(d0-detikSkr); break; }
  }
  if(!next){ // semua sudah lewat -> adzan pertama besok (Subuh)
    next = JAM_ADZAN[0];
    menitKe = 86400 - detikSkr + keDetik(next.jam);
  }
  const jamDatang = new Date(Date.now()+menitKe*1000);

  // Masa adzan aktif: 15 menit sejak adzan masuk
  let masaAktif = false;
  for(const a of JAM_ADZAN){
    const start = keDetik(a.jam);
    if(detikSkr>=start && detikSkr<=start+15*60){ masaAktif = true; }
  }

  // Peringatan: 2 menit sebelum adzan
  const peringatan = menitKe<=120; // <= 2 menit

  let msg, stTxt;
  if(masaAktif){
    stTxt = '🔊 ADZAN SEDANG BERKUMANDANG — HORMATI WAKTU ANDA (15 MENIT)';
    msg = '🔊 ASTAGFIRULLAH — ADZAN SEDANG BERKUMANDANG. MOHON HORMATI WAKTU TUAN GURU & SELURUH MEMBER SELAMA 15 MENIT. SILAKAN BERHENTI SEJENAK, RASAKAN KEMBALI KE FITRAH. 🕌';
  }
  else if(peringatan){
    const mm = Math.ceil(menitKe/60);
    stTxt = '⏰ 2 MENIT MENUJU ADZAN '+next.nama.toUpperCase();
    msg = '⏰ MENJELANG ADZAN '+next.nama.toUpperCase()+' ('+next.jam+') — PERSIAPKAN DIRI, 2 MENIT LAGI. 🕌 INDRAMAYU';
  }
  else{
    stTxt = '📢 ADZAN SELANJUTNYA: '+next.nama+' • '+next.jam;
    msg = '🕌 ADZAN '+next.nama.toUpperCase()+' ('+next.jam+') MENJELANG — INDRAMAYU. PERSIAPKAN IBADAH ANDA.';
  }

  mq.textContent = msg;
  cd.textContent = '⏳ Mundur: '+fmt(menitKe)+' → '+next.nama+' '+next.jam;
  document.getElementById('status').textContent = (peringatan||masaAktif) ? '🔴 '+stTxt : '🕌 '+stTxt;

  // ---- SUARA OTOMATIS (setelah unlocked) ----
  if(SUARA_AKTIF){
    // mainkan adzan saat waktu adzan masuk (dalam 20 detik)
    for(const a of JAM_ADZAN){
      const start = keDetik(a.jam);
      if(detikSkr>=start && detikSkr<=start+5){ mulaiAdzan(); }
    }
    // stop adzan setelah 5 menit berkumandang
    for(const a of JAM_ADZAN){
      const start = keDetik(a.jam);
      if(detikSkr>=start+300 && detikSkr<=start+310){ stopAdzan(); }
    }
    // bunyi peringatan 2 menit sebelum adzan: beep 3x
    if(peringatan && detikSkr%60===0){ beep(); }
  }
}

var SUARA_AKTIF = false;
var audioAdzan = document.getElementById('audioHidden');

function bukaSuara(){
  SUARA_AKTIF = true;
  document.getElementById('unlockBtn').classList.add('terbuka');
  if(audioAdzan && audioAdzan.paused) audioAdzan.play().catch(function(){});
  // coba unlock context
  try{ if(window.AudioContext){ new AudioContext().resume(); } }catch(e){}
}

function mulaiAdzan(){
  if(!audioAdzan)return;
  audioAdzan.src = 'ADZAN/Adzan-Bosnia.mp3';
  audioAdzan.currentTime=0;
  audioAdzan.play().catch(function(){});
}

function stopAdzan(){
  if(audioAdzan) audioAdzan.pause();
}

function beep(){
  try{
    var c = new (window.AudioContext||window.webkitAudioContext)();
    for(var i=0;i<3;i++){
      setTimeout(function(){
        var o=c.createOscillator(), g=c.createGain();
        o.connect(g); g.connect(c.destination);
        o.frequency.value=880; o.type='sine';
        g.gain.setValueAtTime(.3,c.currentTime);
        o.start(); o.stop(c.currentTime+0.15);
      }, i*250);
    }
  }catch(e){}
}

loadJadwal().then(()=>{ tick(); setInterval(tick,1000); });
</script><script src="../alwi_bubble2.js"></script>
</body>
</html>
