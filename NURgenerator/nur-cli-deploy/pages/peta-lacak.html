<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Peta Lacak + Find DNS - NUR</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overscroll-behavior: none; }
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; }

    .header { text-align: center; padding: 10px 10px 6px; }
    .header h1 { color: #ffd700; font-size: 18px; margin-bottom: 3px; }
    .header p { color: #a0a0a0; font-size: 12px; }

    .panel { padding: 8px 10px; background: #1e1e1e; border-top: 1px solid #333; border-bottom: 1px solid #333; }
    .panel-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .btn { flex: 1; min-width: 110px; padding: 10px 8px; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }
    .btn-wa { background: #25D366; color: #000; }
    .btn-reset { background: #444; color: #fff; }
    .btn-dns { background: #00bfff; color: #000; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .row { display: flex; gap: 6px; margin-bottom: 8px; }
    .row input { flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid #333; background: #161616; color: #e0e0e0; font-size: 13px; outline: none; }

    .info-box { background: #161616; border: 1px dashed #444; border-radius: 8px; padding: 8px; font-size: 12px; color: #ccc; line-height: 1.5; max-height: 110px; overflow-y: auto; }
    .info-box b { color: #ffd700; }
    .status { font-size: 11px; color: #a0a0a0; margin-top: 5px; }

    #map { flex: 1; width: 100%; }
    .leaflet-popup-content-wrapper { background: #1e1e1e; color: #fff; border-radius: 8px; border: 1px solid #ffd700; }
    .leaflet-popup-tip { background: #1e1e1e; }
    .tag { display: inline-block; background: #0a3a5a; color: #ffd700; border: 1px solid #ffd700; border-radius: 6px; padding: 1px 8px; font-size: 10px; margin-left: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🗺️ Peta Lacak + Find DNS <span class="tag">v2 peta</span></h1>
    <p>Tanpa GPS — tandai lewat peta & lacak domain via DNS</p>
  </div>

  <div class="panel">
    <div class="row">
      <input id="dnsInput" type="text" placeholder="host.ddns.net / domain" autocomplete="off" />
      <button class="btn btn-dns" onclick="findDNS()">🔍 Find DNS</button>
    </div>
    <div class="panel-row">
      <button class="btn btn-wa" onclick="kirimWA()">🟢 Kirim ke WA</button>
      <button class="btn btn-reset" onclick="resetTitik()">🔄 Reset</button>
    </div>
    <div class="info-box" id="infoBox">Tap di peta untuk menandai lokasi. Lalu Find DNS untuk lacak domain.</div>
    <div class="status" id="statusText">Cara pakai: tap peta → tandai → resolusi DNS untuk menemukan posisi domain.</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: true }).setView([-6.3262, 108.32], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    let titik = null; // { lat, lng, label, ip, marker }

    function renderInfo() {
      const box = document.getElementById('infoBox');
      if (!titik) {
        box.textContent = "Tap di peta untuk menandai lokasi.";
        return;
      }
      box.innerHTML =
        `<div><b>${titik.label || 'Titik'}:</b> ${titik.lat.toFixed(5)}, ${titik.lng.toFixed(5)}</div>` +
        (titik.ip ? `<div style="color:#00bfff">🌐 IP/DNS: <b>${titik.ip}</b></div>` : '') +
        (titik.waktu ? `<div style="color:#999">🕐 ${titik.waktu}</div>` : '');
      renderRiwayatBox();
    }

    function setTitik(lat, lng, label, opt) {
      opt = opt || {};
      titik = { lat, lng, label, ip: opt.ip || null, waktu: new Date().toLocaleTimeString('id-ID') };
      const warna = opt.warna || '#ffd700';
      const icon = L.divIcon({
        className: '', html: `<div style="background:${warna};width:26px;height:26px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:13px;">${opt.emoji || '📍'}</div>`,
        iconSize: [26, 26]
      });
      if (titik.marker) map.removeLayer(titik.marker);
      titik.marker = L.marker([lat, lng], { icon }).addTo(map)
        .bindPopup(`<b>${label}</b>${opt.ip ? '<br>🌐 IP: ' + opt.ip : ''}<br>${titik.waktu}`)
        .openPopup();
      map.setView([lat, lng], 15);
      simpanRiwayat(lat, lng, label, opt.ip);
      renderInfo();
    }

    // ===== Find DNS: resolve domain → IP via DoH, lalu petakan lokasi IP =====
    async function findDNS() {
      const host = document.getElementById('dnsInput').value.trim();
      const st = document.getElementById('statusText');
      if (!host) { st.textContent = "⚠️ Tulis dulu nama host/domain."; return; }
      st.textContent = "⏳ Men-resolve " + host + " ...";
      try {
        const r = await fetch('https://dns.google/resolve?name=' + encodeURIComponent(host) + '&type=A');
        const d = await r.json();
        const ipv4 = (d.Answer || []).filter(a => a.type === 1 && a.data).map(a => a.data);
        if (!ipv4.length) {
          st.textContent = "❌ DNS tidak menemukan A-record untuk " + host + ".";
          return;
        }
        // IP → koordinat via ipapi.co (tanpa GPS)
        let lat, lng, nama;
        try {
          const g = await fetch('https://ipapi.co/' + ipv4[0] + '/json/');
          const j = await g.json();
          lat = parseFloat(j.latitude); lng = parseFloat(j.longitude);
          nama = [j.city, j.region, j.country_name].filter(Boolean).join(', ') || 'Lokasi IP';
        } catch (e) {
          lat = -6.3262; lng = 108.32; nama = 'Lokasi IP (' + ipv4[0] + ')';
        }
        setTitik(lat, lng, '🌐 ' + host, { ip: ipv4.join(', '), emoji: '🌐', warna: '#00bfff' });
        st.textContent = "✅ " + host + ' → ' + ipv4.join(', ') + ' @ ' + nama + ' (' + lat.toFixed(4) + ',' + lng.toFixed(4) + ')';
      } catch (e) {
        st.textContent = "❌ Gagal resolve: " + e.message;
      }
    }

    // Tandai titik di peta (kebalikan dari GPS — user pilih langsung di peta)
    map.on('click', function(e) {
      setTitik(e.latlng.lat, e.latlng.lng, '📍 Manual', { emoji: '📍', warna: '#ffd700' });
      document.getElementById('statusText').textContent = "✅ Titik dipilih di peta.";
    });

    function resetTitik() {
      if (titik && titik.marker) map.removeLayer(titik.marker);
      titik = null;
      renderInfo();
      document.getElementById('statusText').textContent = "🔄 Titik direset.";
    }

    function kirimWA() {
      if (!titik) { document.getElementById('statusText').textContent = "⚠️ Belum ada titik untuk dikirim."; return; }
      const gmaps = `https://www.google.com/maps?q=${titik.lat},${titik.lng}`;
      let pesan = `🗺️ *LACAK POSISI*\n\n📌 ${titik.label || 'Titik'}\n📍 ${titik.lat.toFixed(6)}, ${titik.lng.toFixed(6)}`;
      if (titik.ip) pesan += `\n🌐 IP: ${titik.ip}`;
      pesan += `\n🕐 ${titik.waktu}\n\nBuka: ${gmaps}`;
      window.open('https://wa.me/?text=' + encodeURIComponent(pesan), '_blank');
    }

    // ===== Riwayat (localStorage) =====
    function simpanRiwayat(lat, lng, label, ip) {
      let ri = JSON.parse(localStorage.getItem('petaLacakRiwayat') || '[]');
      ri.push({ lat, lng, label, ip, waktu: new Date().toISOString() });
      if (ri.length > 30) ri = ri.slice(-30);
      localStorage.setItem('petaLacakRiwayat', JSON.stringify(ri));
    }
    function renderRiwayatBox() {
      if (!titik) return;
      const ri = JSON.parse(localStorage.getItem('petaLacakRiwayat') || '[]').reverse().slice(0, 5);
      const el = document.getElementById('infoBox');
      el.innerHTML =
        `<div><b>${titik.label || 'Titik'}:</b> ${titik.lat.toFixed(5)}, ${titik.lng.toFixed(5)}</div>` +
        (titik.ip ? `<div style="color:#00bfff">🌐 IP/DNS: <b>${titik.ip}</b></div>` : '') +
        (titik.waktu ? `<div style="color:#999">🕐 ${titik.waktu}</div>` : '') +
        (ri.length ? '<div style="border-top:1px dashed #444;margin-top:6px;padding-top:6px">📜 Riwayat:<br>' +
          ri.map(r => `<div style="color:#8fd3ff">${(r.waktu||'').slice(0,16)} • ${r.label} ${r.ip ? '(' + r.ip + ')' : ''}</div>`).join('') + '</div>' : '');
    }
  </script>

<script src="../alwi_bubble4_3000.js"></script>
</body>
</html>
