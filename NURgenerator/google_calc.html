<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🧮 Kalkulator Google</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;font-family:system-ui,sans-serif;min-height:100vh}
.bar{background:#0d6efd;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.bar b{font-size:15px}
.bar a{background:#fff;color:#0d6efd;text-decoration:none;font-weight:800;font-size:11px;padding:7px 12px;border-radius:9px}
iframe{width:100vw;height:calc(100vh - 50px);border:none;display:block}
</style>
</head>
<body>
<div class="bar">
  <b>🧮 KALKULATOR GOOGLE</b>
  <a href="/">🏠 Dashboard</a>
</div>
<iframe id="gk" src="https://www.google.com/search?q=kalkulator"></iframe>

<script>
// Google sering menolak iframe (X-Frame-Options). Deteksi blokir => fallback.
var fr = document.getElementById('gk');
var gagal = 0;
fr.addEventListener('load', function(){
  try {
    var doc = fr.contentDocument || fr.contentWindow.document;
    var body = doc.body;
    if (body && body.innerHTML.replace(/\s/g,'').length < 200) blokir();
  } catch(e){ blokir(); }
});
function blokir(){
  document.title = 'Kalkulator (fallback)';
  fr.style.display='none';
  var bar = document.querySelector('.bar');
  var d = document.createElement('div');
  d.style.cssText='padding:40px;text-align:center;color:#0f356e;font-weight:800;font-family:system-ui';
  d.innerHTML='Google memblokir iframe kalkulator di chrome.<br><br><a style="color:#0d6efd" target="_blank" href="https://www.google.com/search?q=kalkulator">Buka di tab baru →</a>';
  document.body.appendChild(d);
}
setTimeout(blokir, 6000); // safety: kalau load diam, anggap blokir
</script><script src="../alwi_bubble2.js"></script>
</body>
</html>
