<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🎁 BONUS — Hujan Koin Berlimpah</title>
<style>
  /* BONUS HUJAN KOIN — HTML polos, gampang diedit.
     Atur: DURASI_DETIK, KOIN_PER_DETIK, NILAI_KOIN di KONFIG */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;height:100dvh;background:#0a0f1e;overflow:hidden;
    font-family:'Segoe UI',system-ui,sans-serif;color:#fff;
    display:flex;align-items:center;justify-content:center;
    touch-action:pan-x pan-y pinch-zoom;-webkit-text-size-adjust:100%;
    -webkit-user-select:none;user-select:none}
  #wrap{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;max-height:900px;
    background:radial-gradient(circle at top,#1a2a4a,#0a0f1e 70%);overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:pan-x pan-y}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:12px 14px;z-index:5;font-weight:bold;
    text-shadow:0 2px 6px #000;pointer-events:none}
  #hud .koin{color:#ffd700;font-size:22px}
  #hud .waktu{color:#8ab4ff;font-size:18px}
  #overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;text-align:center;
    padding:24px;background:rgba(5,8,16,.9)}
  #overlay.hide{display:none}
  #overlay h1{font-size:30px;color:#ffd700;text-shadow:0 0 24px #ffb70088}
  #overlay p{font-size:14px;line-height:1.8;opacity:.9;max-width:300px}
  #overlay p b{color:#ffd700}
  #btnMulai{background:linear-gradient(180deg,#ffe066,#ffb700);color:#1a1200;border:0;
    font-weight:bold;font-size:17px;padding:14px 30px;border-radius:14px;cursor:pointer;
    box-shadow:0 5px 0 #a06b00}
  #btnMulai:active{transform:translateY(4px);box-shadow:none}
  #rotHint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;
    transform:translateX(-50%);z-index:9;font-size:11px;color:#ffffff99;
    background:rgba(0,0,0,.5);padding:6px 12px;border-radius:20px;
    pointer-events:none;white-space:nowrap}
  @media (orientation:landscape){#wrap{max-width:800px}#rotHint{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="koin">🪙 <span id="skor">0</span></div>
    <div class="waktu">⏱️ <span id="waktu">60</span></div>
  </div>
  <div id="rotHint">👆 Geser keranjang • tangkap koin berlimpah!</div>
  <div id="overlay">
    <div style="font-size:70px">🎁</div>
    <h1>BONUS!</h1>
    <p><b>Hujan koin berlimpah!</b><br>Geser keranjang 🧺 ke kiri-kanan,<br>tangkap koin sebanyak-banyaknya<br>dalam <b>60 detik</b>. Tanpa kalah!</p>
    <button id="btnMulai">▶ MULAI PANEN</button>
  </div>
</div>

<script>
"use strict";
/* ================= KONFIG (edit di sini) ================= */
const DURASI_DETIK = 60;   // lama bonus
const KOIN_PER_DETIK = 6;  // makin besar = makin berlimpah
const NILAI_KOIN = 10;     // poin per koin

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');
let W = 0, H = 0;
function resize(){ W = canvas.width = wrap.clientWidth; H = canvas.height = wrap.clientHeight; }
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));

let keranjang, koinJatuh, partikel, skor, sisa, jalan, spawnAcc;

function reset(){
  keranjang = { x: W/2, w: Math.min(110, W*0.28), h: 26 };
  koinJatuh = []; partikel = [];
  skor = 0; sisa = DURASI_DETIK; jalan = true; spawnAcc = 0;
  document.getElementById('skor').textContent = '0';
  document.getElementById('waktu').textContent = DURASI_DETIK;
}

/* ---- suara ringan ---- */
const Suara = (function(){
  let c = null;
  function init(){
    if(c){ if(c.state==='suspended')c.resume(); return; }
    try{ c = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  function blip(f, dur){
    if(!c) return;
    try{
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.12, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + dur);
    }catch(e){}
  }
  return { init, tangkap: () => blip(1200 + Math.random()*600, 0.12),
           menang: () => { [523,659,784,1047].forEach((f,i) => setTimeout(() => blip(f,0.25), i*150)); } };
})();

/* ---- kontrol: geser ---- */
function gerakKe(clientX){
  const r = canvas.getBoundingClientRect();
  keranjang.x = Math.max(keranjang.w/2, Math.min(W - keranjang.w/2, (clientX - r.left) * (W / r.width)));
}
canvas.addEventListener('touchstart', e => gerakKe(e.touches[0].clientX), {passive:true});
canvas.addEventListener('touchmove', e => { e.preventDefault(); gerakKe(e.touches[0].clientX); }, {passive:false});
canvas.addEventListener('mousedown', e => gerakKe(e.clientX));
window.addEventListener('mousemove', e => { if(e.buttons) gerakKe(e.clientX); });

function update(dt){
  const dtk = dt / 1000;
  // hujan koin BERLIMPAH
  spawnAcc += KOIN_PER_DETIK * dtk;
  while(spawnAcc >= 1){
    spawnAcc -= 1;
    koinJatuh.push({
      x: 20 + Math.random()*(W-40), y: -20,
      vy: (2.2 + Math.random()*3) * (H/700),
      r: 11 + Math.random()*7, putar: Math.random()*6.28,
      emas: Math.random() < 0.12 // 12% koin EMAS besar x5
    });
  }
  const ky = H - 60;
  for(let i = koinJatuh.length-1; i >= 0; i--){
    const k = koinJatuh[i];
    k.y += k.vy * (dt*60/16.7); k.putar += 0.15;
    // masuk keranjang?
    if(k.y + k.r >= ky && k.y < ky + 40 && Math.abs(k.x - keranjang.x) < keranjang.w/2 + k.r*0.5){
      koinJatuh.splice(i, 1);
      const dpt = k.emas ? NILAI_KOIN*5 : NILAI_KOIN;
      skor += dpt;
      for(let j = 0; j < 8; j++) partikel.push({x:k.x, y:ky, vx:(Math.random()-0.5)*5, vy:-Math.random()*5, life:1, warna:'#ffd700'});
      Suara.tangkap();
      document.getElementById('skor').textContent = skor;
      continue;
    }
    if(k.y > H + 30) koinJatuh.splice(i, 1); // jatuh bebas, tidak apa (bonus!)
  }
  for(let i = partikel.length-1; i >= 0; i--){
    const p = partikel[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= dtk*2;
    if(p.life <= 0) partikel.splice(i, 1);
  }
  // waktu
  sisa -= dtk;
  document.getElementById('waktu').textContent = Math.max(0, Math.ceil(sisa));
  if(sisa <= 0) akhir();
}

function gambarKoin(x, y, r, putar, emas){
  const rx = Math.max(Math.abs(Math.cos(putar))*r, 2);
  ctx.fillStyle = emas ? '#ff9500' : '#ffd700';
  ctx.beginPath(); ctx.ellipse(x, y, rx, r, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = emas ? '#a04d00' : '#a07000';
  ctx.font = 'bold ' + Math.round(r) + 'px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if(rx > 6) ctx.fillText(emas ? '5x' : 'Rp', x, y);
}

function draw(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d1530'); g.addColorStop(1, '#05080f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for(const k of koinJatuh) gambarKoin(k.x, k.y, k.r, k.putar, k.emas);
  // keranjang
  const ky = H - 60;
  ctx.fillStyle = '#8a5a2a';
  ctx.fillRect(keranjang.x - keranjang.w/2, ky, keranjang.w, keranjang.h);
  ctx.fillStyle = '#a06a35';
  for(let i = 0; i < 5; i++) ctx.fillRect(keranjang.x - keranjang.w/2 + 6 + i*(keranjang.w-12)/4, ky + 3, 3, keranjang.h - 6);
  ctx.fillStyle = '#ffd700';
  ctx.font = '22px serif'; ctx.textAlign = 'center';
  ctx.fillText('🧺', keranjang.x, ky - 8);
  for(const p of partikel){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.warna;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function akhir(){
  jalan = false;
  Suara.menang();
  const ov = document.getElementById('overlay');
  ov.classList.remove('hide');
  ov.innerHTML = '<div style="font-size:70px">🏆</div><h1>PANEN SELESAI!</h1>'
    + '<p>Koin terkumpul: <b>🪙 ' + skor + '</b></p>'
    + '<button id="btnMulai">↻ PANEN LAGI</button>';
  document.getElementById('btnMulai').onclick = () => { ov.classList.add('hide'); Suara.init(); reset(); };
}

let last = 0;
function loop(ts){
  const dt = Math.min(50, ts - (last || ts));
  last = ts;
  if(jalan){ update(dt); }
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('btnMulai').onclick = () => {
  document.getElementById('overlay').classList.add('hide');
  Suara.init();
  reset();
};
setTimeout(() => { const h = document.getElementById('rotHint'); if(h) h.style.display = 'none'; }, 7000);

reset(); jalan = false;
draw();
requestAnimationFrame(loop);
</script>
</body>
</html>
