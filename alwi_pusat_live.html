<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALWI IFRAME BOT - DROPDOWN</title><style>
*{box-sizing:border-box}body{margin:0;background:#061106;color:#d4ffde;font-family:system-ui}
.top{background:#0f2210;border-bottom:2px solid #145a32;padding:8px;display:flex;gap:6px;align-items:center;position:sticky;top:0;z-index:99}
select,button{background:#0a1a0a;color:#2ecc71;border:1px solid #145a32;padding:10px 12px;border-radius:10px;font-weight:bold}
iframe{width:100%;height:calc(100vh - 48px);border:none;background:#000}
.badge{font-size:11px;color:#7fbf8f;margin-left:auto}
</style></head><body>
<div class="top">
<select id="server" onchange="ganti()">
<option value="https://affect-categories-exclusive-authorization.trycloudflare.com/">⛑️ ALWI PUSAT (VPS)</option>
<option value="https://carrying-flu-smallest-room.trycloudflare.com">🤖 OLLAMA VPS (2 model)</option>
<option value="hantu.html">👻 HANTU.HTML (2.1MB)</option>
<option value="ceritaHOROR.html">📖 CERITA HOROR</option>
<option value="pasarGAIB.html">🏚️ PASAR GAIB</option>
<option value="kilat.html">⚡ KILAT</option>
<option value="netflix/index.html">📁 NURFLIX</option>
<option value="index.html">🏠 INDEX HOROR DRIVE</option>
</select>
<button onclick="reload()">🔄 Reload</button>
<span class="badge" id="status">iframe bot bubble dropdown ON 🔊</span>
</div>
<iframe id="frame" src="https://affect-categories-exclusive-authorization.trycloudflare.com/" allow="clipboard-read; clipboard-write; autoplay"></iframe>
<script>
const f=document.getElementById('frame');
function ganti(){f.src=document.getElementById('server').value; document.getElementById('status').textContent='Loading '+f.src+'...';}
function reload(){f.contentWindow.location.reload();}
f.onload=()=>{document.getElementById('status').textContent='✅ Loaded: '+f.src;};
</script>
<script src="/alwi_bubble_v4_MENU.js"></script>
<script src="/alwi_bubble.js"></script>

<!-- ALWI NAV KIRI KANAN -->
<div id="alwi-rl" style="position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;z-index:9999999;padding:0 10px;pointer-events:none"><a id="rlL" style="pointer-events:auto;width:56px;height:56px;background:#FFD700;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;text-decoration:none;border:3px solid #000;box-shadow:0 4px 12px #000">←</a><a id="rlR" style="pointer-events:auto;width:56px;height:56px;background:#FFD700;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;text-decoration:none;border:3px solid #000;box-shadow:0 4px 12px #000">→</a></div>
<script>
(function(){
const PAGES=["/","/setting/","/alwiSD/","/fiturBARU/","/game/","/kamera-hantu/","/konten/","/kuis/","/netflix/","/pencuri/","/peta/","/peta/peta-cod.html","/peta/peta.html"];
let p=location.pathname;
let i=PAGES.indexOf(p);
if(i==-1){i=PAGES.findIndex(x=>p.includes(x.replace(/\//g,'').replace('.html','')));}
if(i<0)i=0;
let prev=PAGES[(i-1+PAGES.length)%PAGES.length];
let next=PAGES[(i+1)%PAGES.length];
document.getElementById('rlL').href=prev;
document.getElementById('rlR').href=next;
let sx=0;
document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>70){ if(dx>0) location.href=prev; else location.href=next; }},{passive:true});
})();
</script>

<script>
// SUARA TUK TUK - ALWI SD CERIA
let audioCtx;
function tuk(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    let o = audioCtx.createOscillator();
    let g = audioCtx.createGain();
    o.type='square';
    o.frequency.setValueAtTime(600, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime+0.12);
    g.gain.setValueAtTime(0.8, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.15);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.15);
    if(navigator.vibrate) navigator.vibrate(50);
  }catch(e){}
}
// pasang ke tombol RL
let cek = setInterval(()=>{
  let L=document.getElementById('rlL'), R=document.getElementById('rlR');
  if(L && R){
    clearInterval(cek);
    [L,R].forEach(b=>{
      b.addEventListener('click', (e)=>{
        tuk();
        // animasi kocak
        b.style.transform='scale(0.7) rotate(10deg)';
        setTimeout(()=>b.style.transform='',150);
      });
      b.addEventListener('touchstart', tuk, {passive:true});
    });
    // tuk tuk pas swipe
    let sx=0;
    document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
    document.addEventListener('touchend',e=>{
      let dx=e.changedTouches[0].clientX-sx;
      if(Math.abs(dx)>70){ tuk(); setTimeout(tuk,80); }
    },{passive:true});
  }
},300);
// style kuning goyang untuk SD
if(location.pathname.includes('alwiSD')){
  let s=document.createElement('style');
  s.innerHTML=`#alwi-rl a{animation:alwi-bounce 0.8s infinite alternate!important;background:#FFD700!important; border:3px solid #000!important;}
  #alwi-rl a:nth-child(2){animation-delay:0.4s!important;}
  @keyframes alwi-bounce{0%{transform:translateY(0)}100%{transform:translateY(-10px) scale(1.15);box-shadow:0 8px 20px rgba(255,215,0,.9)}}`;
  document.head.appendChild(s);
  // label lucu
  let lab=document.createElement('div');
  lab.style="position:fixed;bottom:85px;left:0;right:0;text-align:center;font-size:13px;color:#FFD700;font-weight:900;text-shadow:0 2px 4px #000;z-index:9999998;pointer-events:none";
  lab.innerHTML="👇 PENCET KUNING TUK TUK! 👇";
  document.body.appendChild(lab);
}
</script>
</body></html>
