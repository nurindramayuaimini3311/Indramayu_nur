<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kalkulator Edukasi –🌍 Pasar Indramayu Club Makrifat</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-dark:    #030914;
    --panel-bg:   rgba(10, 25, 47, 0.85);
    --cyan-glow:  #00f0ff;
    --blue-bright:#38b6ff;
    --text-light: #e2f1ff;
    --btn-num:    rgba(20, 40, 80, 0.6);
    --btn-op:     rgba(0, 180, 216, 0.35);
    --btn-eq:     linear-gradient(135deg, #00b4d8 0%, #00f0ff 100%);
  }

  body {
    min-height: 100vh;
    background: var(--bg-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    padding: 15px;
    overflow-x: hidden;
    position: relative;
  }

  /* Digital Grid Background Effect */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
    background-size: 30px 30px;
    pointer-events: none;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 360px; /* Ukuran pas standar layar HP */
  }

  /* Header dengan Maskot */
  .header {
    text-align: center;
    margin-bottom: 12px;
    animation: fadeDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .mascot-container {
    width: 70px;
    height: 70px;
    margin: 0 auto 6px auto;
    border-radius: 50%;
    border: 2px solid var(--cyan-glow);
    overflow: hidden;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
    background: #050c1c;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mascot-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .header .ornament {
    color: var(--cyan-glow);
    font-size: 0.9rem;
    letter-spacing: 4px;
    text-shadow: 0 0 8px var(--cyan-glow);
    opacity: 0.8;
  }

  .header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
    letter-spacing: 1px;
    line-height: 1.3;
    margin: 3px 0;
  }

  .header .sub {
    font-size: 0.7rem;
    color: var(--blue-bright);
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Calculator Glassmorphism Body */
  .calc {
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(0, 240, 255, 0.3);
    border-radius: 20px;
    padding: 16px;
    box-shadow:
      0 0 25px rgba(0, 240, 255, 0.15),
      0 15px 40px rgba(0,0,0,0.6),
      inset 0 1px 2px rgba(255,255,255,0.1);
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both 0.1s;
    position: relative;
  }

  .calc::before {
    content: '';
    position: absolute;
    top: -2px; left: 20%; right: 20%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan-glow), transparent);
    box-shadow: 0 0 10px var(--cyan-glow);
  }

  /* Display Layar HP */
  .display {
    background: rgba(5, 12, 28, 0.9);
    border: 1.5px solid rgba(0, 240, 255, 0.25);
    border-radius: 12px;
    padding: 14px 16px 10px;
    margin-bottom: 14px;
    min-height: 85px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
    position: relative;
  }

  .display::before {
    content: '📚 BELAJAR MATEMATIKA SERU ✏️';
    position: absolute;
    top: 6px; left: 16px;
    font-size: 0.5rem;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    color: rgba(0, 240, 255, 0.5);
  }

  .display .expr {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    color: rgba(56, 182, 255, 0.7);
    min-height: 18px;
    word-break: break-all;
    text-align: right;
  }

  .display .result {
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    font-weight: 500;
    color: #ffffff;
    text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
    word-break: break-all;
    text-align: right;
    line-height: 1.2;
    transition: all 0.15s;
  }

  .display .result.big { font-size: 1.5rem; }
  .display .result.bigger { font-size: 1.1rem; }

  /* Grid Tombol yang Pas di Jari HP */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  button {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    border: 1px solid rgba(0, 240, 255, 0.2);
    border-radius: 10px;
    cursor: pointer;
    height: 50px;
    color: var(--text-light);
    transition: all 0.12s ease;
    position: relative;
    overflow: hidden;
  }

  button:active { transform: scale(0.92); }

  .btn-num { background: var(--btn-num); }
  .btn-num:active { background: rgba(40, 80, 140, 0.8); color: #ffffff; }

  .btn-op { background: var(--btn-op); color: var(--cyan-glow); border-color: rgba(0, 240, 255, 0.3); }
  
  /* Tombol HAPUS khusus untuk anak-anak */
  .btn-clear { 
    background: rgba(255, 75, 75, 0.25); 
    color: #ff9999; 
    font-size: 0.85rem; 
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    border-color: rgba(255, 75, 75, 0.4); 
  }

  .btn-sp { background: rgba(15, 32, 67, 0.5); color: var(--blue-bright); font-size: 0.85rem; }
  .btn-eq { background: var(--btn-eq); color: var(--bg-dark); font-weight: 700; border: none; box-shadow: 0 0 12px rgba(0, 240, 255, 0.4); }

  .span2 { grid-column: span 2; }

  /* Tombol Suara Tambahan */
  .extra-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .btn-voice {
    flex: 1;
    background: rgba(0, 240, 255, 0.15);
    color: var(--cyan-glow);
    font-size: 0.8rem;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
    height: 38px;
    border-radius: 8px;
    border: 1px solid rgba(0, 240, 255, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
  }
  .btn-voice:active { background: rgba(0, 240, 255, 0.35); }

  .footer {
    text-align: center;
    margin-top: 12px;
    font-size: 0.6rem;
    color: rgba(56, 182, 255, 0.4);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Orbitron', sans-serif;
  }

  @keyframes fadeDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:none; } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(10px);  } to { opacity:1; transform:none; } }

  .pulse { animation: pulse 0.15s ease-out; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
</style>

<script src="./03_ADM_KEUANGAN/radar.js"></script>
</head>
<body>

<div class="wrapper">
  <div class="header">
    <!-- Gambar Ikon Maskot Robot dari folder img -->
    <div class="mascot-container">
      <img src="img/meta_alwi_transparent.png" alt="Maskot Alwi AI">
    </div>
    <div class="ornament">🌎</div>
    <h1>PASAR GLOBAL<br>CLUB MAKRIFAT</h1>
    <div class="sub">Kalkulator Edukasi SD 🔊</div>
  </div>

  <div class="calc">
    <div class="display">
      <div class="expr" id="expr"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="grid">
      <!-- Tombol AC diganti menjadi HAPUS -->
      <button class="btn-clear" id="btn-ac" onclick="clearAll(event)">HAPUS</button>
      <button class="btn-sp" onclick="toggleSign(event)">+/-</button>
      <button class="btn-sp" onclick="percent(event)">%</button>
      <button class="btn-op" onclick="setOp('÷', event)">÷</button>

      <button class="btn-num" onclick="num('7', event)">7</button>
      <button class="btn-num" onclick="num('8', event)">8</button>
      <button class="btn-num" onclick="num('9', event)">9</button>
      <button class="btn-op" onclick="setOp('×', event)">×</button>

      <button class="btn-num" onclick="num('4', event)">4</button>
      <button class="btn-num" onclick="num('5', event)">5</button>
      <button class="btn-num" onclick="num('6', event)">6</button>
      <button class="btn-op" onclick="setOp('−', event)">−</button>

      <button class="btn-num" onclick="num('1', event)">1</button>
      <button class="btn-num" onclick="num('2', event)">2</button>
      <button class="btn-num" onclick="num('3', event)">3</button>
      <button class="btn-op" onclick="setOp('+', event)">+</button>

      <button class="btn-num span2" onclick="num('0', event)">0</button>
      <button class="btn-num" onclick="dot(event)">.</button>
      <button class="btn-eq" onclick="calc(event)">=</button>
    </div>

    <!-- Tombol Khusus Ulangi Suara untuk Edukasi -->
    <div class="extra-actions">
      <button class="btn-voice" onclick="repeatLastVoice()">
        🔊 Ulangi Suara
      </button>
    </div>
  </div>

  <div class="footer">💫 Global Blessing System 💫</div>
</div>

<script>
  let cur = '0', prev = '', op = '';
  let isOpPressed = false;
  let hasEvaluated = false;
  let lastSpokenResult = '0';

  const disp = document.getElementById('result');
  const expr = document.getElementById('expr');

  // Fungsi Text-to-Speech (Suara Berbicara Bahasa Indonesia)
  function speakResult(textToSpeak) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();

    let cleanText = String(textToSpeak)
      .replace(/\./g, ' koma ')
      .replace(/−/g, 'minus ');

    let utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = 'id-ID';
    utterance.rate = 0.95; // Sedikit lebih pelan agar ramah anak-anak SD
    utterance.pitch = 1.1; // Nada ceria
    
    window.speechSynthesis.speak(utterance);
  }

  function repeatLastVoice() {
    speakResult(lastSpokenResult);
  }

  function updateDisplay(val) {
    let formatted = format(val);
    disp.textContent = formatted;

    const len = String(formatted).length;
    disp.className = 'result' + (len > 12 ? ' bigger' : len > 8 ? ' big' : '');
    disp.classList.remove('pulse');
    void disp.offsetWidth;
    disp.classList.add('pulse');
  }

  function format(n) {
    if (n === 'Error') return 'Error';
    const s = String(n);
    if (s.endsWith('.') || (s.includes('.') && s.endsWith('0'))) {
      return s.replace('.', ',');
    }
    const num = parseFloat(n);
    if (isNaN(num)) return s;
    if (Math.abs(num) >= 1e15) return num.toExponential(4);
    return num.toLocaleString('id-ID', { maximumFractionDigits: 10 });
  }

  function num(d, e) {
    if (e) rippleBtn(e);
    if (isOpPressed || hasEvaluated) {
      cur = d;
      isOpPressed = false;
      hasEvaluated = false;
    } else {
      if (cur === '0') {
        cur = d;
      } else if (cur.length < 16) {
        cur += d;
      }
    }
    updateDisplay(cur);
  }

  function dot(e) {
    if (e) rippleBtn(e);
    if (isOpPressed || hasEvaluated) {
      cur = '0.';
      isOpPressed = false;
      hasEvaluated = false;
    } else if (!cur.includes('.')) {
      cur += '.';
    }
    updateDisplay(cur);
  }

  function setOp(nextOp, e) {
    if (e) rippleBtn(e);
    if (cur === 'Error') return;

    if (op && isOpPressed) {
      op = nextOp;
      expr.textContent = format(prev) + ' ' + op;
      return;
    }

    if (prev === '') {
      prev = cur;
    } else if (op) {
      executeLogic();
    }

    op = nextOp;
    isOpPressed = true;
    hasEvaluated = false;
    expr.textContent = format(prev) + ' ' + op;
  }

  function executeLogic() {
    const a = parseFloat(prev);
    const b = parseFloat(cur);
    if (isNaN(a) || isNaN(b)) return;

    let res;
    switch (op) {
      case '+': res = a + b; break;
      case '−': res = a - b; break;
      case '×': res = a * b; break;
      case '÷': res = b === 0 ? 'Error' : a / b; break;
      default: return;
    }

    if (res === 'Error') {
      cur = 'Error';
      prev = '';
      op = '';
    } else {
      cur = String(Math.round(res * 1e12) / 1e12);
      prev = cur;
    }
  }

  function calc(e) {
    if (e) rippleBtn(e);
    if (!op || prev === '' || isOpPressed) return;

    let localPrev = prev;
    let localCur = cur;
    let localOp = op;

    executeLogic();

    if (cur !== 'Error') {
      expr.textContent = format(localPrev) + ' ' + localOp + ' ' + format(localCur) + ' =';
      prev = '';
      op = '';
      hasEvaluated = true;
      isOpPressed = false;
      
      // Simpan dan langsung suarakan hasilnya untuk anak-anak
      lastSpokenResult = cur;
      speakResult(cur);
    }
    updateDisplay(cur);
  }

  function clearAll(e) {
    if (e) rippleBtn(e);
    cur = '0'; prev = '', op = '';
    isOpPressed = false;
    hasEvaluated = false;
    expr.textContent = '';
    updateDisplay('0');
  }

  function toggleSign(e) {
    if (e) rippleBtn(e);
    if (cur === '0' || cur === 'Error') return;
    cur = String(-parseFloat(cur));
    updateDisplay(cur);
  }

  function percent(e) {
    if (e) rippleBtn(e);
    if (cur === 'Error' || cur === '0') return;
    cur = String(parseFloat(cur) / 100);
    updateDisplay(cur);
  }

  function rippleBtn(e) {
    const btn = e.currentTarget;
    if (!btn) return;
    const r = document.createElement('span');
    r.style.position = 'absolute';
    r.style.borderRadius = '50%';
    r.style.background = 'rgba(0, 240, 255, 0.4)';
    r.style.transform = 'scale(0)';
    r.style.animation = 'ripple 0.4s linear';
    r.style.pointerEvents = 'none';
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    r.style.width = size + 'px';
    r.style.height = size + 'px';
    r.style.left = (rect.width - size) / 2 + 'px';
    r.style.top = (rect.height - size) / 2 + 'px';
    btn.appendChild(r);
    setTimeout(() => r.remove(), 400);
  }
</script>
<script src="alwi-grandle-core.js"></script>
</body>
</html>
