<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#064e3b">
<meta name="description" content="Kompas arah kiblat akurat menggunakan GPS &amp; sensor kompas HP, bisa dipasang sebagai aplikasi Android.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>🧭 Kompas Kiblat — Alwi Club</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#064e3b,#065f46,#047857);min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#ecfdf5;padding:16px}
  h1{font-size:1.1rem;margin-bottom:4px}
  .sub{font-size:12px;color:#a7f3d0;margin-bottom:16px;text-align:center}
  .compass-wrap{position:relative;width:240px;height:240px;margin:0 auto 12px}
  .compass-dial{width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#f3f4f6 0%,#e5e7eb 100%);border:8px solid #10b981;position:relative;box-shadow:0 4px 20px rgba(0,0,0,0.3);transition:box-shadow .25s}
  .compass-dial.aligned{box-shadow:0 0 0 6px rgba(16,185,129,.55),0 4px 20px rgba(0,0,0,.3)}
  .mark{position:absolute;font-size:15px;font-weight:800;color:#374151}
  .mark.n{top:8px;left:50%;transform:translateX(-50%)}
  .mark.s{bottom:8px;left:50%;transform:translateX(-50%)}
  .mark.e{right:8px;top:50%;transform:translateY(-50%)}
  .mark.w{left:8px;top:50%;transform:translateY(-50%)}
  .needle{position:absolute;left:50%;top:50%;width:5px;height:100px;margin:-100px 0 0 -2.5px;background:linear-gradient(#10b981 0 50%,#dc2626 50% 100%);transform-origin:50% 100%;border-radius:3px;transition:transform 0.2s linear}
  .needle::before{content:'';position:absolute;left:50%;bottom:0;width:16px;height:16px;margin:0 0 -8px -8px;background:#d1d5db;border-radius:50%}
  .center{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;background:#10b981;border-radius:50%;z-index:2}
  .kaaba{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:18px;z-index:3}
  .reading{font-weight:800;font-size:20px;color:#d1fae5;margin:8px 0 4px}
  .aligned-text{font-size:13px;font-weight:800;color:#facc15;min-height:18px;margin-bottom:4px}
  .info{font-size:13px;color:#a7f3d0;margin-bottom:8px;text-align:center;line-height:1.5;white-space:pre-line}
  .warn{font-size:12px;color:#fbbf24;margin-bottom:12px;text-align:center}
  .status{background:rgba(255,255,255,0.15);border-radius:12px;padding:12px;margin-top:8px;width:100%;max-width:300px;font-size:12px;line-height:1.6}
  .status b{color:#d1fae5}
  .install-btn{display:none;margin-top:14px;background:linear-gradient(180deg,#f59e0b,#d97706);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(245,158,11,.4)}
  .retry-btn{margin-top:10px;background:rgba(255,255,255,.15);color:#ecfdf5;border:1.5px solid #6ee7b7;border-radius:10px;padding:8px 16px;font-weight:700;font-size:12px;cursor:pointer}
  footer{margin-top:auto;padding-top:16px;font-size:11px;color:#6ee7b7;text-align:center}
</style>
</head>
<body>
  <h1>🧭 Kompas Kiblat</h1>
  <div class="sub">Arahkan jarum ke arah Ka'bah — Makkah</div>

  <div class="compass-wrap">
    <div class="kaaba">🕋</div>
    <div class="compass-dial" id="dial">
      <span class="mark n">U</span>
      <span class="mark s">S</span>
      <span class="mark e">T</span>
      <span class="mark w">B</span>
      <div class="needle" id="needle"></div>
      <div class="center"></div>
    </div>
  </div>

  <div class="reading" id="reading">Mendapatkan arah…</div>
  <div class="aligned-text" id="alignedText"></div>
  <div class="info" id="info"></div>
  <div class="warn" id="warn"></div>

  <div class="status">
    <b>Status:</b> <span id="stGps">⏳ GPS...</span><br>
    <b>Kompas:</b> <span id="stKompas">⏳ Sensor...</span><br>
    <b>Kiblat:</b> <span id="stKiblat">—</span>
  </div>

  <button class="retry-btn" id="btnAktifkan" style="display:none">🔄 Aktifkan Sensor Kompas</button>
  <button class="install-btn" id="btnInstall">📲 Pasang sebagai Aplikasi</button>
  <a href="bagikan.html" style="margin-top:10px;font-size:12px;color:#6ee7b7;text-decoration:none">🔳 Bagikan lewat QR</a>

  <footer>Alwi Club — Indramayu 🌐</footer>

<script>
var K = { qibla: null, heading: null, gpsOk: false, kompasOk: false };

function hitungKiblat() {
  if (!navigator.geolocation) {
    document.getElementById('stGps').textContent = '❌ Tidak didukung';
    K.qibla = 295;
    updateInfo();
    return;
  }
  navigator.geolocation.getCurrentPosition(function(p) {
    var lat = p.coords.latitude, lng = p.coords.longitude;
    var klat = 21.422487, klng = 39.826206;
    var dLng = (klng - lng) * Math.PI / 180;
    var la1 = lat * Math.PI / 180, la2 = klat * Math.PI / 180;
    var y = Math.sin(dLng) * Math.cos(la2);
    var x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLng);
    var brg = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    K.qibla = brg;
    K.gpsOk = true;
    document.getElementById('stGps').textContent = '✅ ' + lat.toFixed(4) + ', ' + lng.toFixed(4);
    updateInfo();
  }, function() {
    K.qibla = 295;
    document.getElementById('stGps').textContent = '⚠️ GPS ditolak (fallback 295°)';
    updateInfo();
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}

function aktifkanKompas() {
  if ('DeviceOrientationEvent' in window && typeof DeviceOrientationEvent.requestPermission === 'function') {
    // iOS 13+
    document.getElementById('btnAktifkan').style.display = 'inline-block';
    document.getElementById('btnAktifkan').onclick = mintaIzinKompasIOS;
  } else if ('DeviceOrientationEvent' in window) {
    // Android & browser lain: langsung bisa listen tanpa prompt
    window.addEventListener('deviceorientationabsolute', onKompas, true);
    window.addEventListener('deviceorientation', onKompas, true);
    setTimeout(function() {
      if (K.heading != null) {
        K.kompasOk = true;
        document.getElementById('stKompas').textContent = '✅ Aktif';
      } else {
        document.getElementById('stKompas').textContent = '⚠️ Belum terdeteksi';
        document.getElementById('btnAktifkan').style.display = 'inline-block';
        document.getElementById('btnAktifkan').textContent = '🔄 Coba Lagi';
        document.getElementById('btnAktifkan').onclick = function(){ location.reload(); };
      }
    }, 2000);
  } else {
    document.getElementById('stKompas').textContent = '❌ Tidak didukung';
  }
  document.getElementById('warn').textContent = '💡 Putar/gerakkan HP membentuk angka 8 jika kompas belum akurat';
}

function mintaIzinKompasIOS() {
  DeviceOrientationEvent.requestPermission().then(function(s) {
    if (s === 'granted') {
      window.addEventListener('deviceorientation', onKompas, true);
      K.kompasOk = true;
      document.getElementById('stKompas').textContent = '✅ Aktif';
      document.getElementById('btnAktifkan').style.display = 'none';
    } else {
      document.getElementById('stKompas').textContent = '❌ Izin ditolak';
    }
  }).catch(function() {
    document.getElementById('stKompas').textContent = '❌ Gagal minta izin';
  });
}

function onKompas(e) {
  var hdg = e.webkitCompassHeading != null ? e.webkitCompassHeading : (e.alpha != null ? (360 - e.alpha) % 360 : null);
  if (hdg == null) return;
  K.heading = hdg;
  K.kompasOk = true;
  document.getElementById('stKompas').textContent = '✅ Aktif';
  updateJarum();
}

var getarTerakhir = 0;
function updateJarum() {
  if (K.qibla == null || K.heading == null) return;
  var rel = K.qibla - K.heading;
  var relNorm = ((rel + 180) % 360 + 360) % 360 - 180;
  document.getElementById('needle').style.transform = 'rotate(' + rel + 'deg)';
  document.getElementById('reading').textContent = 'Kiblat: ' + K.qibla.toFixed(1) + '°';
  document.getElementById('stKiblat').textContent = K.qibla.toFixed(1) + '° dari Utara';

  var dial = document.getElementById('dial');
  var alignedText = document.getElementById('alignedText');
  if (Math.abs(relNorm) <= 4) {
    dial.classList.add('aligned');
    alignedText.textContent = '✅ Sudah menghadap kiblat!';
    if ('vibrate' in navigator && Date.now() - getarTerakhir > 2000) {
      navigator.vibrate(120);
      getarTerakhir = Date.now();
    }
  } else {
    dial.classList.remove('aligned');
    alignedText.textContent = '';
  }
}

function updateInfo() {
  if (K.qibla != null) {
    document.getElementById('info').textContent =
      'Arah kiblat dari lokasi Anda: ' + K.qibla.toFixed(1) + '°\n(' + arahTeks(K.qibla) + ')';
  }
  updateJarum();
}

function arahTeks(d) {
  var dirs = ['Utara','Timur Laut','Timur','Tenggara','Selatan','Barat Daya','Barat','Barat Laut'];
  return dirs[Math.round(d / 45) % 8];
}

// === Install sebagai aplikasi Android (PWA) ===
var deferredPrompt;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('btnInstall').style.display = 'inline-block';
});
document.getElementById('btnInstall').addEventListener('click', function() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function() {
    deferredPrompt = null;
    document.getElementById('btnInstall').style.display = 'none';
  });
});
window.addEventListener('appinstalled', function() {
  document.getElementById('btnInstall').style.display = 'none';
});

// === Service worker (offline) ===
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

// === Mulai ===
hitungKiblat();
aktifkanKompas();
</script>
</body>
</html>
