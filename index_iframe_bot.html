<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALWI IFRAME BOT - DROPDOWN</title><style>
*{box-sizing:border-box}body{margin:0;background:#061106;color:#d4ffde;font-family:system-ui}
.top{background:#0f2210;border-bottom:2px solid #145a32;padding:8px;display:flex;gap:6px;align-items:center;position:sticky;top:0;z-index:99999}
select,button{background:#0a1a0a;color:#2ecc71;border:1px solid #145a32;padding:10px 12px;border-radius:10px;font-weight:bold;max-width:65vw}
iframe{width:100%;height:calc(100vh - 48px);border:none;background:#000}
.badge{font-size:10px;color:#7fbf8f;margin-left:auto}
</style></head><body>
<div class="top">
<select id="server" onchange="ganti()">
<option value="https://affect-categories-exclusive-authorization.trycloudflare.com/">⛑️ ALWI PUSAT (VPS)</option>
<option value="https://carrying-flu-smallest-room.trycloudflare.com">🤖 OLLAMA VPS (2 model)</option>
<option value="hantu.html">👻 HANTU.HTML</option>
<option value="ceritaHOROR.html">📖 CERITA HOROR</option>
<option value="pasarGAIB.html">🏚️ PASAR GAIB</option>
<option value="kilat.html">⚡ KILAT</option>
<option value="netflix/index.html">📁 NURFLIX</option>
<option value="index.html">🏠 INDEX HOROR DRIVE</option>
<option value="index2.html">🔀 LINE 2 - Ollama Local</option>
</select>
<button onclick="reload()">🔄</button>
<span class="badge" id="status">ON 🔊 TUK</span>
</div>
<iframe id="frame" src="https://affect-categories-exclusive-authorization.trycloudflare.com/" allow="clipboard-read; clipboard-write; autoplay"></iframe>
<script>
function ganti(){let s=document.getElementById('server'),f=document.getElementById('frame'),st=document.getElementById('status');f.src=s.value;st.textContent='Loading '+s.options[s.selectedIndex].text+'...';f.onload=()=>st.textContent='OK - '+s.options[s.selectedIndex].text;tuk();}
function reload(){document.getElementById('frame').contentWindow.location.reload();tuk();}
let ctx;function tuk(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.setValueAtTime(700,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(150,ctx.currentTime+0.12);g.gain.setValueAtTime(0.6,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.14);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.14);}catch(e){}}
</script>
<!-- NAV 1x only - z-index kecil biar gak nutup dropdown -->
<div id="alwi-rl" style="position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;z-index:8000;padding:0 12px;pointer-events:none"><a id="rlL" href="index.html" style="pointer-events:auto;width:48px;height:48px;background:#FFD700;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;text-decoration:none;border:2px solid #000">←</a><a id="rlR" href="index2.html" style="pointer-events:auto;width:48px;height:48px;background:#FFD700;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;text-decoration:none;border:2px solid #000">→</a></div>
</body></html>
