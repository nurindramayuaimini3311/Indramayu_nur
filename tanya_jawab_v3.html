*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 20% -10%,#123a2c 0%,#050811 55%,#01040a 100%);color:#e8f5e9;font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}

.bubbles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bubbles i{position:absolute;bottom:-140px;border-radius:50%;display:block;
  background:radial-gradient(circle at 30% 30%,#7cffb0,#1f9d55 70%);
  box-shadow:0 0 12px rgba(42,255,122,.45),inset -6px -8px 18px rgba(0,0,0,.25);
  animation:naik linear infinite;opacity:.85}
.bubbles i.gold{background:radial-gradient(circle at 30% 30%,#ffe08a,#d9a406 70%);
  box-shadow:0 0 14px rgba(255,215,0,.5),inset -6px -8px 18px rgba(0,0,0,.25)}
.bubbles i.blu{background:radial-gradient(circle at 30% 30%,#9ad6ff,#1d5fa6 70%);
  box-shadow:0 0 14px rgba(90,180,255,.5),inset -6px -8px 18px rgba(0,0,0,.25)}
@keyframes naik{
  0%{transform:translateY(0) translateX(0) scale(1);opacity:.9}
  50%{transform:translateY(-55vh) translateX(30px) scale(1.08);opacity:.75}
  100%{transform:translateY(-130vh) translateX(-35px) scale(1.18);opacity:0}}

.content,.nav{position:relative;z-index:1}

header{background:rgba(5,8,17,.75);border-bottom:1px solid rgba(42,255,122,.25);padding:14px 20px 12px;text-align:center;backdrop-filter:blur(6px)}
.bismillah{font-size:14px;color:#81c784;opacity:.7;margin-bottom:4px;letter-spacing:2px}
header h1{font-size:clamp(18px,5vw,26px);color:#66bb6a;letter-spacing:3px;font-weight:700}
.header-sub{font-size:10px;color:#81c784;opacity:.6;letter-spacing:4px;margin-top:3px}
.tab-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding-top:10px}
.tab{background:rgba(27,58,36,.5);color:#81c784;border:1px solid #2e7d32;padding:7px 14px;border-radius:20px;font-size:11px;cursor:pointer;transition:all .2s;letter-spacing:.5px}
.tab:hover{background:#2e7d32;color:#fff}
.tab.aktif{background:#66bb6a;color:#fff;border-color:#66bb6a}

.content{width:100%;max-width:680px;margin:0 auto;padding:16px;flex:1;display:flex;flex-direction:column}
.panel{display:none;flex:1;flex-direction:column;min-height:60vh}
.panel.aktif{display:flex}

.status-bar{color:#81c784;font-size:12px;margin:4px 0 10px;letter-spacing:1px;text-align:center}

.chat-wrap{flex:1;display:flex;flex-direction:column;background:rgba(10,26,18,.55);border:1px solid #1b3a24;border-radius:14px;overflow:hidden;backdrop-filter:blur(4px)}
.chat-area{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:280px;max-height:52vh}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.5;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#2e7d32;color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:rgba(27,58,36,.9);border:1px solid #2e7d32;border-bottom-left-radius:4px;color:#e8f5e9}
.msg .lbl{font-size:9px;color:#81c784;letter-spacing:1px;margin-bottom:3px}
.msg.kamus{border-left:3px solid #c9a84c}
.msg.dayak{border-left:3px solid #66bb6a}
.kick{text-align:center;font-size:10px;color:#81c784;opacity:.7;padding:2px 0}
.chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid #1b3a24;background:rgba(5,8,17,.6)}
.lang-row{display:flex;gap:8px;padding:8px 12px 0}
.lang-btn{flex:1;background:rgba(5,8,17,.6);color:#9ab8a4;border:1.5px solid #2d5a3a;border-radius:10px;padding:8px;font-weight:800;font-size:12px;cursor:pointer}
.lang-btn.aktif{background:#2e8b57;color:#fff;border-color:#2e8b57}
#chatInput{flex:1;background:#0a1a12;border:1px solid #2e7d32;color:#e8f5e9;font-size:14px;padding:11px 12px;border-radius:10px;outline:none}
#chatInput::placeholder{color:#81c784;opacity:.5}
.btn{background:#2e7d32;color:#fff;border:none;cursor:pointer;width:50px;height:50px;border-radius:10px;font-size:19px;transition:transform .2s;flex-shrink:0}
.btn:hover{transform:scale(1.05)}
.btn.recording{background:#e53935;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.voice-btn{background:transparent;border:1px solid #2e7d32;color:#81c784;cursor:pointer;font-size:11px;width:30px;height:30px;border-radius:50%;margin-top:6px;line-height:1;transition:all .2s;flex-shrink:0}
.voice-btn:hover{background:#2e7d32;color:#fff}
.voice-btn.playing{background:#66bb6a;color:#fff}

.samakan-wrap{display:flex;flex-direction:column;gap:10px;flex:1}
textarea{width:100%;flex:1;min-height:130px;background:#0a1a12;border:1px solid #2e7d32;color:#e8f5e9;font-size:14px;padding:12px;border-radius:10px;outline:none;resize:vertical;font-family:system-ui}
textarea::placeholder{color:#81c784;opacity:.5}
.samakan-btn{background:#2e7d32;color:#fff;border:none;padding:12px;border-radius:10px;font-size:14px;cursor:pointer;font-weight:700}
.samakan-btn:active{background:#1b5e20}
.hasil-samakan{flex:1;background:rgba(10,26,18,.55);border:1px solid #1b3a24;border-radius:14px;padding:14px;overflow-y:auto;min-height:220px}
.item-kata{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-bottom:1px solid #1b3a24;font-size:13px}
.item-kata:last-child{border-bottom:none}
.item-kata .d{color:#66bb6a;font-weight:700;min-width:110px}
.item-kata .i{color:#c9a84c}
.chip{display:inline-block;background:#1b3a24;color:#81c784;font-size:9px;padding:2px 8px;border-radius:10px;margin-left:8px;letter-spacing:1px}
.kosong{color:#81c784;text-align:center;padding:20px;font-size:12px}

.acak-wrap{display:flex;flex-direction:column;gap:10px;flex:1}
.acak-btn{background:#66bb6a;color:#fff;border:none;padding:14px;border-radius:10px;font-size:14px;cursor:pointer;font-weight:700}
.acak-btn:active{background:#2e7d32}
.kartu-acak{background:rgba(27,58,36,.6);border:1px solid #2e7d32;border-radius:14px;padding:22px;text-align:center}
.kartu-acak .dayak{font-size:30px;font-weight:700;color:#66bb6a;letter-spacing:1px;margin-bottom:6px}
.kartu-acak .arti{font-size:16px;color:#c9a84c;margin-bottom:4px}
.kartu-acak .kat{font-size:10px;color:#81c784;letter-spacing:2px}
.acak-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mirip-item{background:rgba(27,58,36,.4);border:1px solid #1b3a24;padding:10px;border-radius:10px;cursor:pointer;transition:all .2s}
.mirip-item:hover{border-color:#2e7d32;background:rgba(27,58,36,.8)}
.mi-kata{color:#66bb6a;font-weight:700;font-size:14px}
.mi-arti{color:#81c784;font-size:12px;margin-top:3px}

footer{text-align:center;padding:16px;color:#81c784;font-size:11px;letter-spacing:2px;border-top:1px solid #1b3a24;margin-top:auto;position:relative;z-index:1;background:rgba(5,8,17,.6)}

const kataKunciDermayu = ["kula", "isun", "sira", "reang", "ira", "sapa", "pira", "priben", "ngendi", "mlaku", "turu", "mangan", "nginum", "adus", "tuku", "tangi", "metu", "teka", "deleng", "ngomong", "lara", "seneng", "nesu", "wengi", "saiki", "banyu", "umah", "dalan", "batur", "iwak"];
const responsDermayu = ["Sugeng — jenengan mboten salah panggenan! Sistem Piramida Guard nampi kode jenengan ✅.", "Pemeriksaan rampung 🔍. Data jenengan sampun kasimpen kanthi aman ing server Indramayu Club.", "Sistem Piramida Guard 2026 ngamati aktivitas jenengan ⚡. Tetep jaga keamanan server utama.", "Matur nuwun wis nggunakake AI Nur! 🤖 Yen butuh bantuan, sesambung kaliyan Admin Dulkohar."];
const responsIndo = ["Kode Anda telah diterima oleh sistem Piramida Guard ✅. Saya mendeteksi struktur valid. Pastikan data aman.", "Analisis selesai 🔍. Sistem berfungsi normal, data telah tersinkronisasi ke server Indramayu Club.", "Sistem Piramida Guard 2026 mendeteksi aktivitas Anda ⚡. Tetap amankan koordinat server utama.", "Terima kasih telah menggunakan AI Nur! 🤖 Untuk bantuan sistem lebih lanjut, silakan hubungi Admin Dulkohar."];
const responsDayak = ["Kabar bahalap! Kode ikau uras jadi imasuk akan sistem Piramida Guard ✅. Struktur data basewut tutu, ela parah takutan salah.", "Pemeriksaan selesai 🔍. Amun tege parah tinai, aman melai layar, data jadi i-upload akan pangkalan data Indramayu Club ih?", "Sistem Piramida Guard 2026 manggawi instruksi ikau ⚡. Jagam tutu-tutu pangkalan data miar melai hureh.", "Terima kasih jadi hureh dengang AI Nur! 🤖 Amun tege pakat parah tinai, laku tolong dengang Abai Dulkohar ih."];
const kataKunciDayak = ["narai", "ikau", "yaku", "kabar", "gawi", "laok", "bahalap", "bahanyi", "andui", "atei", "aka", "ading", "buli", "dumah", "kuman", "tiruh", "mangat", "lewu", "oloh", "uluh"];

let idxIndo = 0, idxDayak = 0;
let bahasaTerpilih = 'dermayu';

function pilihBahasa(b){
  bahasaTerpilih = b;
  const live = document.querySelectorAll('.lang-btn');
  for (let i = 0; i < live.length; i++) live[i].classList.remove('aktif');
  const aktif = document.getElementById('lang-' + b);
  if (aktif) aktif.classList.add('aktif');
  const inp = document.getElementById('chatInput');
  if (inp) inp.placeholder = b === 'dermayu'
    ? 'Tanya AI Nur / ketik kata Dermayu…'
    : 'Tanya AI Nur / ketik kata Dayak…';
  setStatus('🌐 Bahasa: ' + (b === 'dermayu' ? 'Dermayu (Indramayu)' : 'Dayak Ngaju'), 'ok');
}

function kamusAktif(){ return bahasaTerpilih === 'dermayu' ? kamusDermayu : kamus; }

// ══════════════════════════════════════════════════════
// SERVER ALWI-BOT (VM3) — sama seperti index4.html
// ══════════════════════════════════════════════════════
const ALWI_BOT_URL = 'http://136.85.74.104:4500/api/chat';
const KALKULATOR_URL = 'http://136.85.74.104:4000/api/kalkulator';

function bersihkan(teks){
  return teks.toLowerCase().trim().replace(/['’]/g,'');
}

function cariBahasa(teks){
  const tb = bersihkan(teks);
  const k = kamusAktif();
  const nama = bahasaTerpilih === 'dermayu' ? 'Dermayu' : 'Dayak Ngaju';
  if (k[tb]) return { tipe:'kamus', pesan:"🤖 AI Nur (Kamus " + nama + "): Arti dari '" + teks + "' adalah: <b>" + k[tb] + "</b>" };
  const hasil = Object.keys(k).filter(function(x){ return k[x].toLowerCase().indexOf(tb) >= 0; });
  if (hasil.length) return { tipe:'kamus', pesan:"🤖 AI Nur (Kamus " + nama + "): Kata '" + teks + "' dalam bahasa " + nama + " berarti: <b>" + hasil.join(', ') + "</b>" };
  return null;
}

function samakanKata(){
  const ta = document.getElementById('inputArtikel');
  const v = ta.value;
  if (!v || !v.trim()){
    document.getElementById('hasilSamakan').innerHTML = '<div class="kosong">Masukkan teks dulu!</div>';
    return;
  }
  const kata2 = v.toLowerCase().replace(/[^a-zA-Z\s]/g,' ').split(/\s+/).filter(function(w){ return w.length >= 2; });
  let ketemu = {}, hasil = [];
  for (let i = 0; i < kata2.length; i++){
    const kata = kata2[i];
    if (ketemu[kata]) continue;
    if (kamus[kata]){
      hasil.push({ kata: kata, arah:'d', makna: kamus[kata] });
      ketemu[kata] = 1;
    } else {
      let jod = null;
      for (const dayak in kamus){
        const parts = kamus[dayak].toLowerCase().split(/[\s/]+/);
        if (parts.indexOf(kata) >= 0){ jod = dayak; break; }
      }
      if (jod){ hasil.push({ kata: kata, arah:'i', makna: jod }); ketemu[kata] = 1; }
    }
  }
  renderSamakan(hasil, kata2.length);
}

function renderSamakan(hasil, totalKata){
  const box = document.getElementById('hasilSamakan');
  if (!hasil.length){
    box.innerHTML = '<div class="kosong">❌ Tidak ditemukan kata dari teks yang ada di dalam kamus.</div>';
    setStatus('🔗 0 kata cocok dari ' + totalKata + ' kata dalam teks','');
    return;
  }
  setStatus('🔗 ' + hasil.length + ' kata cocok dari ' + totalKata + ' kata dalam teks','');
  let s = '<div class="item-kata" style="font-size:10px;color:#9a8050;letter-spacing:1px;padding-bottom:6px">KATA PERSAMAAN DITEMUKAN (' + hasil.length + ')</div>';
  for (let i = 0; i < hasil.length; i++){
    const h = hasil[i];
    s += h.arah === 'd'
      ? '<div class="item-kata"><span class="d">' + h.kata + '</span><span class="chip">Dayak</span><span class="i">➤ ' + h.makna + '</span></div>'
      : '<div class="item-kata"><span class="d">' + h.kata + '</span><span class="chip">Indo</span><span class="i">➤ Dayak: ' + h.makna + '</span></div>';
  }
  box.innerHTML = s;
}

function tambahMsg(tipe, teks, cls){
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg ' + tipe + (cls ? ' ' + cls : '');
  if (tipe === 'bot'){
    const bersih = new DOMParser().parseFromString(teks,'text/html').body.textContent;
    div.innerHTML = '<div class="lbl">🤖 AI NUR</div>' + teks
      + '<div style="text-align:right"><button class="voice-btn" data-bs="' + bersih.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;') + '" onclick="bacaSuara(this)" title="🔊 Baca suara">🔊</button></div>';
  } else {
    div.innerHTML = teks;
  }
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function kirim(){
  const inp = document.getElementById('chatInput');
  const v = inp.value.trim();
  if (!v) return;
  tambahMsg('user', v.replace(/</g,'&lt;'));
  inp.value = '';
  prosesBot(v);
}

function tempoProcessing(fn){
  setTimeout(fn, 500);
}

// ══════════════════════════════════════════════════════
// KALKULATOR (server :4000) — pola soal matematika
// ══════════════════════════════════════════════════════
const POLA_SOALIN = /^\s*\d+(?:[.,]\d+)?\s*[\+\-\*x/÷]\s*\d+(?:[.,]\d+)?\s*(?:[\+\-\*x/÷]\s*\d+(?:[.,]\d+)?)*\s*$/i;

function cobaKalkulator(prompt){
  return new Promise(function(resolve){
    try {
      if (!POLA_SOALIN.test(prompt.trim())) return resolve(null);
      const soal = prompt.trim().replace(/,/g,'.').replace(/x/gi,'*').replace(/÷/g,'/');
      fetch(KALKULATOR_URL + '?soal=' + encodeURIComponent(soal), { method:'GET' })
        .then(function(r){ return r.json(); })
        .then(function(data){
          if (data && data.ok && data.hasil !== undefined) resolve('🧮 ' + soal + ' = ' + data.hasil);
          else resolve(null);
        })
        .catch(function(){ resolve(null); });
    } catch(e){ resolve(null); }
  });
}

// ══════════════════════════════════════════════════════
// PENCARIAN WEB (Google News RSS) — seperti index4.html
// ══════════════════════════════════════════════════════
function cariBeritaWeb(q){
  return new Promise(function(resolve){
    try {
      const topik = (q || '').replace(/^(cari|berita)\s+/i,'').trim() || 'berita terbaru Indonesia hari ini';
      const bypassUrl = 'http://136.85.74.104:8081/ddg-json?q=' + encodeURIComponent(topik);
      const rssUrl = 'https://news.google.com/rss/search?q=' + encodeURIComponent(topik) + '&hl=id&gl=ID&ceid=ID:id';
      const matcher = function(b, tag){
        const mmm = b.match(new RegExp('<' + tag + '[^>]*>([\s\S]*?)</' + tag + '>', 'i'));
        return mmm ? mmm[1].replace(/<!\[CDATA\[|\]\]>/g,'').replace(/<[^>]+>/g,'').trim() : '';
      };
      fetch(bypassUrl, { headers: { 'User-Agent': 'AlwiBot/1.0' } })
        .then(function(r){ return r.text(); })
        .then(function(txt){
          let data = null;
          try { data = JSON.parse(txt); } catch(e){}
          const hasil = [];
          if (data && data.results){
            for (let i = 0; i < data.results.length && hasil.length < 5; i++){
              const h = data.results[i];
              if (h.title) hasil.push('🔎 ' + h.title + (h.snippet ? ' — ' + h.snippet.slice(0,90) : ''));
            }
          }
          if (hasil.length){
            const NL10 = String.fromCharCode(10);
            resolve('🔎 *HASIL PENCARIAN: ' + topik + '*' + NL10 + hasil.join(NL10) + NL10 + NL10 + '🌐 Portal: https://nurindramayuaimini3311.github.io/Indramayu_nur/');
          } else { return null; }
        })
        .then(function(fallbackHasil){
          if (fallbackHasil) { resolve(fallbackHasil); return; }
          return fetch(rssUrl, { headers: { 'User-Agent': 'AlwiBot/1.0' } }).then(function(r){ return r.text(); }).then(function(xml){
            const itemRegex = /<item>([\s\S]*?)<\/item>/gi;
            const hasil2 = [];
            let mm;
            while ((mm = itemRegex.exec(xml)) !== null && hasil2.length < 5){
              const block = mm[1];
              const title = matcher(block, 'title');
              const source = matcher(block, 'source');
              const pubDate = matcher(block, 'pubDate');
              if (title){
                let info = '📰 ' + title;
                if (source) info += ' — ' + source;
                if (pubDate){
                  const d = new Date(pubDate);
                  info += ' (' + d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }) + ')';
                }
                hasil2.push(info);
              }
            }
            const NL10 = String.fromCharCode(10);
            if (hasil2.length) return '📰 *HASIL BERITA: ' + topik + '*' + NL10 + hasil2.join(NL10) + NL10 + NL10 + '🌐 Portal: https://nurindramayuaimini3311.github.io/Indramayu_nur/';
            return null;
          });
        })
        .then(function(akhir){
          if (akhir) resolve(akhir);
          else resolve(null);
        })
        .catch(function(){ resolve(null); });
    } catch(e){ resolve(null); }
  });
}

// ══════════════════════════════════════════════════════
// CHAT SERVER Alwi-Bot (WA :4500) — seperti index4.html
// ══════════════════════════════════════════════════════
function tanyaServer(prompt){
  return fetch(ALWI_BOT_URL, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ message: prompt })
  }).then(function(res){
    if (!res.ok) throw new Error('Gagal tersambung ke Bot Alwi (WhatsApp)');
    return res.json();
  }).then(function(data){
    return data.reply || '(kosong)';
  });
}

function prosesBot(v){
  const low = v.toLowerCase();

  if (low === 'keluar' || low === 'exit'){
    tambahMsg('bot','🤖 AI Nur: Mengamankan sistem... Sampai jumpa!','dayak'); return;
  }

  if (low.indexOf('/baca ') === 0){
    setTimeout(function(){
      const k = kamusAktif();
      const nama = bahasaTerpilih === 'dermayu' ? '[Dermayu]' : '[Dayak]';
      const artikel = v.slice(6);
      const kata2 = artikel.toLowerCase().replace(/[^a-zA-Z\s]/g,' ').split(/\s+/).filter(function(w){ return w.length >= 2; });
      let ketemu = {}, hasil = [];
      for (let i = 0; i < kata2.length; i++){
        const kt = kata2[i];
        if (ketemu[kt]) continue;
        if (k[kt]){ hasil.push('🟢 ' + nama + ' ' + kt + ' ➤ ' + k[kt]); ketemu[kt] = 1; }
        else {
          for (const key in k){
            if (k[key].toLowerCase().split(/[\s/]+/).indexOf(kt) >= 0){
              hasil.push('🔵 [Indo] ' + kt + ' ➤ ' + nama + ': ' + key); ketemu[kt] = 1; break;
            }
          }
        }
      }
      tambahMsg('bot',
        hasil.length ? '📖 Ditemukan <b>' + hasil.length + '</b> kosakata dalam teks:<br>&nbsp;&nbsp;' + hasil.join('<br>&nbsp;&nbsp;')
                     : '❌ Tidak ditemukan kata dari teks yang ada di dalam kamus.', 'kamus');
    }, 450);
    return;
  }

  tempoProcessing(function(){
    const hasil = cariBahasa(v);
    if (hasil){ tambahMsg('bot', hasil.pesan, 'kamus'); return; }

    // 1) KALKULATOR — deteksi pola soal
    cobaKalkulator(v).then(function(kalk){
      if (kalk){ tambahMsg('bot', kalk, 'kamus'); return; }

      // 2) PENCARIAN WEB — cari/berita
      return cariBeritaWeb(v);
    }).then(function(berita){
      if (berita){ tambahMsg('bot', berita, 'kamus'); return; }

      // 3) DETEKSI BAHASA LOKAL (sesuai pilihan: Dayak/Dermayu)
      const kataKunci = bahasaTerpilih === 'dermayu' ? kataKunciDermayu : kataKunciDayak;
      let isLokal = false;
      for (let i = 0; i < kataKunci.length; i++){
        if (low.indexOf(kataKunci[i]) >= 0){ isLokal = true; break; }
      }
      if (isLokal){
        const responsLokal = bahasaTerpilih === 'dermayu' ? responsDermayu : responsDayak;
        const r = responsLokal[idxDayak % responsLokal.length]; idxDayak++;
        tambahMsg('bot', r, 'dayak'); return;
      }

      // 4) CHAT SERVER Alwi-Bot (WA :4500)
      return tanyaServer(v);
    }).then(function(jawabanServer){
      if (jawabanServer){ tambahMsg('bot', jawabanServer, 'server'); }
    }).catch(function(e){
      tambahMsg('bot', '❌ Error: ' + (e.message || 'terjadi kesalahan'), 'kamus');
    });
  });
}

function acakKata(){
  const k = kamusAktif();
  const keys = Object.keys(k);
  const x = keys[Math.floor(Math.random() * keys.length)];
  document.getElementById('kartuAcak').innerHTML =
    '<div class="kartu-acak"><div class="dayak">' + x + '</div><div class="arti">“' + k[x] + '”</div><div class="kat">' + (bahasaTerpilih === 'dermayu' ? 'DERMAYU · ACAK' : 'DAYAK NGAJU · ACAK') + '</div></div>';
  setStatus('🎲 ' + x + ' = ' + k[x], 'ok');
}

function lihatSemua(){
  const k = kamusAktif();
  const keys = Object.keys(k);
  let s = '';
  for (let i = 0; i < keys.length; i++){
    s += '<div class="mirip-item"><div class="mi-kata">' + keys[i] + '</div><div class="mi-arti">' + k[keys[i]] + '</div></div>';

function gantiTab(nama, el){
  const tabs = document.querySelectorAll('.tab');
  for (let i = 0; i < tabs.length; i++) tabs[i].classList.remove('aktif');
  const panels = document.querySelectorAll('.panel');
  for (let i = 0; i < panels.length; i++) panels[i].classList.remove('aktif');
  document.getElementById('panel-' + nama).classList.add('aktif');
  el.classList.add('aktif');
}

// ══════════════════════════════════════════════════════
// SUARA (TTS) — Web Speech API
// ══════════════════════════════════════════════════════
function ttsPlay(teks, btn){
  if (!('speechSynthesis' in window)){
    setStatus('⚠️ Browser tidak mendukung suara', 'err'); return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(teks);
  u.lang = 'id-ID'; u.rate = 0.9; u.pitch = 1.0;
  if (btn){
    document.querySelectorAll('.voice-btn').forEach(function(b){ b.classList.remove('playing'); });
    btn.classList.add('playing');
    u.onend = function(){ btn.classList.remove('playing'); };
  }
  setStatus('🔊 Memutar: "' + teks.slice(0,60) + '..."', 'info');
  window.speechSynthesis.speak(u);
}

function bacaSuara(btn){
  const t = btn.getAttribute('data-bs');
  if (t) ttsPlay(t.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>'), btn);
}

// ══════════════════════════════════════════════════════
// MIC (SPEECH RECOGNITION)
// ══════════════════════════════════════════════════════
let recognition = null;
function toggleMic(){
  const btn = document.getElementById('btnMic');
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
    setStatus('⚠️ Browser tidak mendukung input suara', 'err'); return;
  }
  if (recognition){
    recognition.stop(); recognition = null;
    btn.textContent = '🎤'; btn.classList.remove('recording'); return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'id-ID'; recognition.interimResults = false;
  recognition.onstart = function(){
    btn.textContent = '🔴'; btn.classList.add('recording');
    setStatus('🎤 Mendengarkan...', 'info');
  };
  recognition.onresult = function(e){
    const kata = e.results[0][0].transcript.trim();
    document.getElementById('chatInput').value = kata;
    kirim();
  };
  recognition.onerror = function(){
    btn.textContent = '🎤'; btn.classList.remove('recording'); recognition = null;
    setStatus('❌ Gagal menangkap suara', 'err');
  };
  recognition.onend = function(){
    btn.textContent = '🎤'; btn.classList.remove('recording'); recognition = null;
  };
  recognition.start();
}

function setStatus(msg, tipe){
  const el = document.getElementById('statusBar');
  el.textContent = msg;
  el.className = 'status-bar ' + (tipe || '');
}

window.onload = function(){
  pilihBahasa('dermayu');
  setStatus('Siap · ' + Object.keys(kamusAktif()).length + ' kata · ' + (bahasaTerpilih === 'dermayu' ? 'Dermayu' : 'Dayak Ngaju') + ' tersedia', 'ok');
  tambahMsg('bot','Halo! Aku <b>AI Nur · Piramida Guard 2026</b> 🤖<br>Pilih bahasa di atas (🌾 Dermayu / 🌀 Dayak), tanya kata, atau ketik <b>cari &lt;topik&gt;</b> untuk berita web.', 'dayak');
};

document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && document.activeElement.id === 'chatInput') kirim();
});
