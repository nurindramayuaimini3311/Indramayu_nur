<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>⛪ Gereja 3D - Indramayu</title><style>
*{box-sizing:border-box;margin:0}body{font-family:Arial;background:#0b0e14;color:#fff;overflow:hidden;touch-action:none}
#c{position:fixed;inset:0;display:block}.top{position:fixed;top:60px;left:10px;right:10px;display:flex;gap:8px;z-index:5;flex-wrap:wrap;justify-content:center}
a.back{background:#ccc;color:#000;font-weight:900;padding:10px 16px;border-radius:12px;text-decoration:none}
.pill{background:rgba(0,0,0,.6);border:1px solid #ccc;border-radius:12px;padding:10px 14px;font-weight:900}</style>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./addons/"}}</script></head>
<body><canvas id="c"></canvas>
<div class="top"><a class="back" href="index.html">← PETA</a><div class="pill">⛪ GEREJA INDRAMAYU</div></div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;
const s=new THREE.Scene();s.background=new THREE.Color(0x87b5e0);
const c=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);c.position.set(10,6,12);
const o=new OrbitControls(c,r.domElement);o.target.set(0,2.5,0);o.enableDamping=true;o.autoRotate=true;o.autoRotateSpeed=1;
s.add(new THREE.HemisphereLight(0xffffff,0x334455,.9));
const d=new THREE.DirectionalLight(0xffffff,1.5);d.position.set(10,15,8);d.castShadow=true;s.add(d);
const g=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x6fae6f}));g.rotation.x=-Math.PI/2;g.receiveShadow=true;s.add(g);
function B(w,h,dep,co,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,dep),new THREE.MeshStandardMaterial({color:co}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m;}
s.add(B(7,3.5,9,0xf2ede0,0,1.75,1)); // nave
const at=new THREE.Mesh(new THREE.CylinderGeometry(.1,3.6,2.6,4,1),new THREE.MeshStandardMaterial({color:0x5a3a20}));at.position.set(0,4.8,1);at.rotation.y=Math.PI/4;at.scale.z=1.28;at.castShadow=true;s.add(at);
// menara + salib
s.add(B(2.2,8,2.2,0xf2ede0,0,4,-3));
const mn=new THREE.Mesh(new THREE.ConeGeometry(1.8,2.4,4),new THREE.MeshStandardMaterial({color:0x5a3a20}));mn.position.set(0,9.2,-3);mn.rotation.y=Math.PI/4;s.add(mn);
const gold=new THREE.MeshStandardMaterial({color:0xffd700,emissive:0xffd700,emissiveIntensity:.5});
s.add(B(.25,1.6,.25,gold,0,11,-3),B(1,.25,.25,gold,0,10.8,-3)); // salib
for(const x of[-1.8,1.8])s.add(B(1,1.6,.2,new THREE.MeshStandardMaterial({color:0x9fd8ff,emissive:0x4477aa,emissiveIntensity:.4}),x,2,-3.55)); // kaca patri
s.add(B(1.6,2.4,.3,0x6b4a1f,0,1.2,-3.6)); // pintu
addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);});r.setSize(innerWidth,innerHeight);
(function l(){requestAnimationFrame(l);o.update();r.render(s,c);})();
</script>
</body></html>
