<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🏡 Desa Larangan 3D - Niaga &amp; Servis</title><style>
*{box-sizing:border-box;margin:0}body{font-family:Arial;background:#0b0e14;color:#fff;overflow:hidden;touch-action:none}
#c{position:fixed;inset:0;display:block}.top{position:fixed;top:60px;left:10px;right:10px;display:flex;gap:8px;z-index:5;flex-wrap:wrap;justify-content:center}
a.back{background:#ffcf40;color:#000;font-weight:900;padding:10px 16px;border-radius:12px;text-decoration:none}
.pill{background:rgba(0,0,0,.6);border:1px solid #ffcf40;border-radius:12px;padding:10px 14px;font-weight:900;font-size:13px}
.hint{position:fixed;bottom:64px;left:10px;right:10px;text-align:center;font-size:11px;opacity:.8;z-index:5;pointer-events:none}
#kartu{display:none;position:fixed;top:125px;right:10px;width:min(300px,86vw);background:#0a1414f2;border:2px solid #ffcf40;border-radius:16px;padding:12px;z-index:40;box-shadow:0 10px 30px rgba(255,207,64,.35)}
#kartu h3{font-size:13px;color:#ffcf40;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
#kartu h3 span{cursor:pointer;color:#888}
#isi{font-size:13px;line-height:1.55;max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
#isi .jasa{font-size:11px;color:#e2e8f0;border:1px solid #ffcf4055;border-radius:8px;padding:6px 8px}
#isi .jasa b{color:#ffcf40}
.b{padding:8px 10px;border-radius:12px;max-width:90%}
.bot{background:#0f2417;color:#e2e8f0;align-self:flex-start;border:1px solid #ffcf4055}
.me{background:#ffcf40;color:#000;align-self:flex-end;font-weight:700}
#menu{position:fixed;left:8px;right:8px;bottom:8px;display:flex;gap:6px;z-index:30;overflow-x:auto;padding:4px}
#menu button{flex:1;min-width:100px;padding:12px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.6);color:#fff;font-weight:800;font-size:12px}
#menu button.on{background:#ffcf40;color:#000}</style>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./addons/"}}</script></head>
<body><canvas id="c"></canvas>
<div class="top"><a class="back" href="index.html">← PETA</a><div class="pill">🏡 DESA LARANGAN · GERBANG 2</div><div class="pill" id="laris">💰 0 transaksi</div></div>
<div class="hint">ketuk kios bubble → dagangan & jasa + pesan lewat HP • 1 jari putar • 2 jari zoom</div>
<div id="kartu">
 <h3>🏡 <span id="judul">Kios Bubble</span> <span id="x">✕</span></h3>
 <div id="isi"></div>
</div>
<div id="menu">
 <button data-t="niaga">🛒 Niaga</button>
 <button data-t="servis">🔧 Servis</button>
 <button data-t="harga">💰 Harga</button>
 <button data-t="pesan">📱 Pesan HP</button>
 <button data-t="lucu">😂 Lucu</button>
</div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;
const s=new THREE.Scene();s.background=new THREE.Color(0x87b5e0);
const c=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);c.position.set(12,8,15);
const o=new OrbitControls(c,r.domElement);o.target.set(0,1,0);o.enableDamping=true;o.autoRotate=true;o.autoRotateSpeed=.7;
s.add(new THREE.HemisphereLight(0xffffff,0x334455,.9));
const d=new THREE.DirectionalLight(0xffffff,1.5);d.position.set(10,15,8);d.castShadow=true;s.add(d);
function M(co,r=.8,m=0){return new THREE.MeshStandardMaterial({color:co,roughness:r,metalness:m});}
function B(w,h,dep,co,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,dep),typeof co==='number'?M(co):co);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;return o;}
const g=new THREE.Mesh(new THREE.PlaneGeometry(60,44),M(0x8f9f6f,1));g.rotation.x=-Math.PI/2;g.receiveShadow=true;s.add(g);
// jalan desa + gapura
s.add(B(40,.1,5,0xcaa56a,0,.05,-6));
for(const x of[-5,5])s.add(B(1,7,1,0xdddddd,x,3.5,-12));
function papan(txt,bg){const cv=document.createElement('canvas');cv.width=512;cv.height=128;const x=cv.getContext('2d');
 x.fillStyle=bg;x.fillRect(0,0,512,128);x.fillStyle='#fff';x.font='bold 58px Arial';x.textAlign='center';x.fillText(txt,256,84);
 return new THREE.CanvasTexture(cv);}
const pp=new THREE.Mesh(new THREE.BoxGeometry(11,2.4,.4),new THREE.MeshStandardMaterial({map:papan('🏡 DESA LARANGAN','#8a6a20')}));pp.position.set(0,7.4,-12);s.add(pp);
// rumah-rumah desa
for(const i of[0,1,2,3]){const x=-14+i*9.4;const co=[0xd9c08a,0xc9a86a,0xe3cf9d,0xb4935a][i];
 s.add(B(3.4,2.6,3.2,co,x,1.3,-1));
 const atap=new THREE.Mesh(new THREE.ConeGeometry(2.6,1.6,4),M(0x8a4b23));atap.position.set(x,3.4,-1);s.add(atap);}
function orang(x,z,cbaju,hdg=0){const gr=new THREE.Group();
 const bd=new THREE.Mesh(new THREE.BoxGeometry(.5,.75,.3),M(cbaju));bd.position.y=.85;gr.add(bd);
 const kp=new THREE.Mesh(new THREE.SphereGeometry(.2,10,10),M(0xffdbac));kp.position.y=1.45;gr.add(kp);
 gr.position.set(x,0,z);gr.rotation.y=hdg;gr.traverse(o=>{o.castShadow=true;});s.add(gr);return gr;}
// ===== 6 KIOS BUBBLE: niaga + servis =====
function texWajah(e){const cv=document.createElement('canvas');cv.width=cv.height=128;
const x=cv.getContext('2d');x.font='64px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,64,70);
return new THREE.CanvasTexture(cv);}
const KIOS=[];
const DATA=[
 {n:'🛒 Warung Beras',  e:'🛒', w:0xFFCF40, jenis:'niaga', dag:['Beras 5kg 55.000','Beras 10kg 100.000','Beras ketan 70.000'],
  jasa:['Jual beras hasil petani tetangga','Bisa pesan banyak, diantar'], hp:'0812-000-001'},
 {n:'🐟 Penjual Ikan',  e:'🐟', w:0x4FC3F7, jenis:'niaga', dag:['Ikan asin 40.000/kg','Ikan segar 55.000/kg'],
  jasa:['Ikan dari tambak sekitar','Icip-icip bumbu sebelum beli'], hp:'0812-000-002'},
 {n:'🧰 Bengkel Motor', e:'🔧', w:0x81C784, jenis:'servis', dag:['Servis ringan 25.000','Ganti oli 45.000','Tune up 60.000'],
  jasa:['Bengkel paling rame se-Larangan','Jujur, cepat, bisa hutang selesai panen'], hp:'0812-000-003'},
 {n:'📱 Servis HP',     e:'📱', w:0xCE93D8, jenis:'servis', dag:['Ganti LCD mulai 200rb','Bersihin IC 100rb','Jual casing 15rb'],
  jasa:['Semua merk HP','Garansi servis 1 minggu'], hp:'0812-000-004'},
 {n:'🥗 Warung Sayur',  e:'🥗', w:0xFF8A65, jenis:'niaga', dag:['Sayur paket 30.000','Bumbu dapur lengkap 20.000'],
  jasa:['Sayur segar dari kebun','Pasok buat warung & penjual nasi'], hp:'0812-000-005'},
 {n:'🧵 Jahit & Servis',e:'🧵', w:0xF06292, jenis:'servis', dag:['Jahit baju mulai 20rb','Keliman 5rb','Bordir nama 10rb'],
  jasa:['Jahit perempuan berpengalaman','Cepat, rapi, ongkos bersahabat'], hp:'0812-000-006'}
];
function kiosBubble(i,x){
 const d=DATA[i];
 const gr=new THREE.Group();
 const bola=new THREE.Mesh(new THREE.SphereGeometry(.75,22,22),
  new THREE.MeshStandardMaterial({color:d.w,emissive:d.w,emissiveIntensity:.35,roughness:.4}));
 bola.position.y=1.8;bola.castShadow=true;gr.add(bola);
 const wajah=new THREE.Mesh(new THREE.PlaneGeometry(.75,.75),
  new THREE.MeshBasicMaterial({map:texWajah(d.e),transparent:true}));
 wajah.position.set(0,1.85,.72);gr.add(wajah);
 const meja=new THREE.Mesh(new THREE.BoxGeometry(2,1,.8),M(0x8a5a2a));meja.position.y=.5;gr.add(meja);
 for(const px of[-.9,.9]){const k=new THREE.Mesh(new THREE.BoxGeometry(.2,1,.2),M(0x6b4a1f));k.position.set(px,.5,0);gr.add(k);}
 gr.position.set(x,0,-6);s.add(gr);
 KIOS.push({g:gr,bola,data:d,lompat:0,ph:Math.random()*6});
}
for(let i=0;i<6;i++)kiosBubble(i,-15+i*6);
// pembeli bocil di sekitar kios
for(const i of[0,1,2])orang(-18+i*7,1+i,0xeeeeee,Math.PI+(Math.random()-.5)*.6);
// ===== KARTU INFO & OBROLAN =====
const kartu=document.getElementById('kartu'),isi=document.getElementById('isi'),judul=document.getElementById('judul');
document.getElementById('x').onclick=()=>kartu.style.display='none';
const PESAN={
 niaga:['Monggo Monggo! 🛒','Mau beli apa? Semua seger & harga kanca.'],
 servis:['Apa yang bisa dibantu? 🔧','Cepat, jujur, hasil memuaskan.'],
 harga:['Harga bisa kita omongin, Lur 💰','Asal nawar ojo sadis, nanti bakal nangis.'],
 pesan:['Pesan lewat HP aja, gampang 📱','Admin konfirmasi terus barang diantar.'],
 lucu:['Ini Desa Larangan, gerbang nomor 2! 😂','Kang gelem degan? sama-sama aja degan kon... 😄']
};
const HP={};
function tulis(t,me){const d=document.createElement('div');d.className='b '+(me?'me':'bot');d.textContent=t;isi.appendChild(d);isi.scrollTop=isi.scrollHeight;}
function bukaKios(k){
 judul.textContent=k.data.n;
 kartu.style.display='block';isi.innerHTML='';
 const j=k.data.jasa.map(x=>`<div class="jasa"><b>✔</b> ${x}</div>`).join('');
 const h=k.data.hp===''?'':`<div style="margin-top:6px" class="jasa" style="border-color:#ffcf40"><b>📱 WA: ${k.data.hp}</b></div>`;
 isi.innerHTML=`<div style="font-size:11px;color:#ccc">🏪 ${k.data.n} · Jenis: <b style="color:#ffcf40">${k.data.jenis.toUpperCase()}</b></div>${j}${h}`;
 setTimeout(()=>tulis(k.data.jasa[0]||'Monggo dicoba!',false),320);
}
function botBalas(kunci){
 const arr=PESAN[kunci]||PESAN.niaga;
 setTimeout(()=>tulis(arr[0]),250);
 setTimeout(()=>tulis(arr[1]),950);
}
document.querySelectorAll('#menu button').forEach(b=>{
 b.onclick=()=>{
  document.querySelectorAll('#menu button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  tulis(b.textContent,true);botBalas(b.dataset.t);
  const pk=KIOS.filter(k=>k.data.jenis===b.dataset.t||b.dataset.t==='harga'||b.dataset.t==='pesan'||b.dataset.t==='lucu');
  if(pk.length&&(b.dataset.t==='niaga'||b.dataset.t==='servis'))bukaKios(pk[0]);
 };
});
// ketuk kios → lompat + koin + kartu info
const ray2=new THREE.Raycaster(),ptr2=new THREE.Vector2();let qX=0,qY=0,qT=0;const COINS=[];let nTrx=0;
const larisEl=document.getElementById('laris');
r.domElement.addEventListener('pointerdown',e=>{qX=e.clientX;qY=e.clientY;qT=performance.now();});
r.domElement.addEventListener('pointerup',e=>{
 if(Math.hypot(e.clientX-qX,e.clientY-qY)>12||performance.now()-qT>500)return;
 ptr2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
 ray2.setFromCamera(ptr2,c);
 const hit=ray2.intersectObjects(KIOS.map(p=>p.bola));
 if(!hit.length)return;
 const k=KIOS.find(x=>x.bola===hit[0].object);
 k.lompat=1;
 for(let z=0;z<3;z++){
  const kn=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.06,12),
   new THREE.MeshStandardMaterial({color:0xffd700,emissive:0xffcc00,emissiveIntensity:.6,metalness:.7,roughness:.3}));
  kn.position.set(k.g.position.x+(Math.random()-.5)*2,1.5,(Math.random()-.5));
  s.add(kn);COINS.push({m:kn,vx:(Math.random()-.5)*3,vy:4+Math.random()*2,t:0});
 }
 nTrx++;larisEl.textContent='💰 '+nTrx+' transaksi';
 tulis('👆 Masuk ke '+k.data.n,true);
 bukaKios(k);
});
addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);});r.setSize(innerWidth,innerHeight);
(function l(){requestAnimationFrame(l);const t=performance.now()/1000;
const dt=.016;
for(const k of KIOS){
 if(k.lompat>0){k.lompat-=dt*1.6;const kk=Math.max(0,k.lompat);
  k.g.position.y=Math.sin(kk*Math.PI)*1.2;k.g.rotation.y+=dt*7;
  if(k.lompat<=0){k.g.position.y=0;k.g.rotation.y=0;}}
 else{k.g.position.y=Math.abs(Math.sin(t*3+k.ph))*.08;k.g.rotation.y=Math.sin(t+k.ph)*.25;}
}
for(let i=COINS.length-1;i>=0;i--){
 const cn=COINS[i];cn.t+=dt;cn.m.position.x+=cn.vx*dt;cn.m.position.y+=cn.vy*dt;cn.vy-=12*dt;
 cn.m.rotation.x+=8*dt;cn.m.rotation.y+=5*dt;
 if(cn.m.position.y<.1||cn.t>1.6){s.remove(cn.m);COINS.splice(i,1);}
}
o.update();r.render(s,c);})();
 </script><script src="alwi_bubble1.js"></script><script src="alwi_bubble2.js"></script><script src="alwi_bubble3.js"></script><script src="alwi_bubble4.js"></script>
  </div>
  <span onclick="document.getElementById(`km5`).style.display=`none`" style="cursor:pointer;color:#888;font-weight:900">✕</span>
 </div>
 </body></html>
