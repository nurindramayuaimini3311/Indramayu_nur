<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Game Petak Umpet 3D - Indramayu REAL MAP FIX</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
html,body{height:100%;margin:0;padding:0;background:#0f1215;color:#fff;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden}
.header{text-align:center;padding:10px;background:#161a20;border-bottom:2px solid #ffd700;position:relative}
.header h1{margin:0;font-size:18px;color:#ffd700;letter-spacing:1px}
.header p{margin:3px 0 0 0;font-size:11px;color:#aaa}
.stats{display:flex;gap:8px;padding:8px;background:#1c2128}
.stat{flex:1;background:#252b33;border-radius:8px;padding:8px;text-align:center;border:1px solid #333}
.stat b{display:block;color:#ffd700;font-size:16px}
.stat span{font-size:10px;color:#aaa;text-transform:uppercase}
#map{height:calc(100% - 145px);width:100%}
.panel{position:absolute;bottom:0;left:0;right:0;background:#161a20;border-top:2px solid #333;padding:10px;z-index:1000;border-radius:16px 16px 0 0}
.clue{font-size:13px;background:#1f242d;padding:10px;border-radius:10px;border-left:4px solid #ffd700;min-height:42px}
.clue.hot{border-left-color:#ff3b3b;animation:shake 0.3s}
.clue.cold{border-left-color:#00bfff}
.clue.win{border-left-color:#25D366;background:#123a22}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-weight:bold;font-size:13px;cursor:pointer}
.btn-gps{background:#ffd700;color:#000}
.btn-reset{background:#2a303a;color:#fff}
.btn-level{background:#25D366;color:#000}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pulse{width:22px;height:22px;border-radius:50%;background:rgba(255,215,0,0.6);border:2px solid #ffd700;animation:pulse 1.5s infinite}
@keyframes pulse{0%{transform:scale(0.8);opacity:1}100%{transform:scale(2.5);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px}
.modal.show{display:flex}
.modal-box{background:#1c2128;border:2px solid #ffd700;border-radius:16px;padding:20px;max-width:350px;width:100%;text-align:center}
.modal-box h2{color:#ffd700;margin:0 0 10px 0}
</style>
</head>
<body>
<div class="header">
<a href="index.html" style="position:absolute;left:10px;top:50px;background:#ffd700;color:#000;font-weight:bold;padding:8px 12px;border-radius:8px;text-decoration:none;font-size:12px">← PETA</a>
<h1>🫣 PETAK UMPET 3D - INDRAMAYU REAL</h1>
<p>FIX: Rute REAL Patrol→Larangan→Celeng→Jatibarang | Temukan → tap <b>LIHAT 3D</b></p>
</div>
<div class="stats">
<div class="stat"><b id="found">0/3</b><span>Ditemukan</span></div>
<div class="stat"><b id="attempt">0</b><span>Tebakan</span></div>
<div class="stat"><b id="timer">60</b><span>Detik</span></div>
</div>
<div id="map"></div>
<div class="panel">
<div class="clue" id="clueBox">👀 Jalur sudah REAL! Pilih level untuk mulai berburu!</div>
<div class="btn-row">
<button class="btn btn-gps" onclick="getHint()">💡 Petunjuk (-5s)</button>
<button class="btn btn-level" onclick="startGame()">▶️ Mulai Level</button>
<button class="btn btn-reset" onclick="resetGame()">🔄 Reset</button>
</div>
</div>

<div class="modal" id="modalWin">
<div class="modal-box">
<h2 id="modalTitle">🎉 KEREN!</h2>
<p id="modalText"></p>
<button class="btn btn-level" style="width:100%;margin-top:15px" onclick="nextLevel()">Lanjut Level Berikutnya ➡️</button>
<button class="btn btn-reset" style="width:100%;margin-top:8px" onclick="closeModal()">Tutup</button>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// === FIX: CENTER & RUTE SAMA PERSIS DENGAN INDEX.HTML UPGRADE ===
const CELENG = [-6.39514938,108.28548697];
const map = L.map('map',{zoomControl:false}).setView(CELENG, 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap - Jalur Real'}).addTo(map);
L.control.zoom({position:'topright'}).addTo(map);

// RUTE REAL DARI INDEX - FIX
const RUTE_A=[[-6.31421005,107.99739269],[-6.35,108.10],[-6.38,108.20],[-6.40458555,108.2670992],[-6.39514938,108.28548697],[-6.42,108.295],[-6.47293261,108.30617431]];
const RUTE_B=[[-6.31421005,107.99739269],[-6.33,108.15],[-6.36,108.22],[-6.385,108.28],[-6.39514938,108.28548697],[-6.42,108.295],[-6.47293261,108.30617431]];
const RUTE_C=[[-6.31421005,107.99739269],[-6.32,108.12],[-6.34,108.18],[-6.407979,108.256639],[-6.40458555,108.2670992],[-6.39514938,108.28548697],[-6.47293261,108.30617431]];
const RUTE_MERAH=[[-6.39514938,108.28548697],[-6.385,108.295],[-6.37,108.31],[-6.35,108.325],[-6.33585815,108.33462292],[-6.32920874,108.31571446]];

// Gambar rute
L.polyline(RUTE_A,{color:'#000',weight:7,opacity:.95}).addTo(map).bindPopup('A HITAM: Patrol → Larangan → CELENG → Jatibarang (30 menit)');
L.polyline(RUTE_A,{color:'#fff',weight:2,dashArray:'10,10',opacity:.9}).addTo(map);
L.polyline(RUTE_B,{color:'#ffcf40',weight:5,opacity:.9}).addTo(map).bindPopup('B KUNING: Sawah Shortcut via Celeng');
L.polyline(RUTE_C,{color:'#60a5fa',weight:5,opacity:.9}).addTo(map).bindPopup('C BIRU: Desa via Masjid Larangan');
L.polyline(RUTE_MERAH,{color:'#ff2222',weight:8,opacity:.95}).addTo(map).bindPopup('🔴 MERAH BARU: Celeng Lohbener → Terminal & Kota Indramayu (13 KM)');

let targets = [];
let foundMarkers = [];
let pulseMarkers = [];
let attempt = 0;
let found = 0;
let timeLeft = 60;
let timerInterval = null;
let level = 1;
let gameActive = false;

const levels = [
  { name:"Pemula - Celeng & Larangan", count:2, radius:0.02, time:90 },
  { name:"Siaga - Kota Jatibarang-Patrol", count:3, radius:0.05, time:75 },
  { name:"Pro - Se-Indramayu REAL", count:4, radius:0.12, time:70 }
];

function randOffset(r){ return (Math.random()-0.5)*r*2 }

function startGame(){
  resetGame(false);
  const cfg = levels[level-1];
  timeLeft = cfg.time;
  document.getElementById('timer').textContent = timeLeft;
  document.getElementById('clueBox').textContent = `🎯 Level ${level}: ${cfg.name} - Ada ${cfg.count} orang ngumpet di jalur REAL! Tap peta untuk cari.`;
  gameActive = true;

  // === FIX: TEMPAT SAMA PERSIS DENGAN INDEX.HTML ===
  const TEMPAT=[
    {n:'🏠 Rumah Jatibarang',f:'rumah.html',c:[-6.4780,108.3120]},
    {n:'🕌 Masjid Nurul Huda Larangan',f:'masjid.html',c:[-6.407979,108.256639]},
    {n:'⛪ Gereja Jatibarang',f:'gereja.html',c:[-6.4720,108.3150]},
    {n:'🏮 Klenteng Jatibarang',f:'klenteng.html',c:[-6.4700,108.3050]},
    {n:'🌾 Sawah Jatibarang',f:'sawah.html',c:[-6.4600,108.2800]},
    {n:'🌊 Laut Eretan',f:'laut.html',c:[-6.2730,108.0620]},
    {n:'🪦 Kuburan Hantu Lohbener',f:'kuburan.html',c:[-6.3980,108.3020]},
    {n:'🎣 Orang Mancing Eretan',f:'mancing.html',c:[-6.3480,108.1900]},
    {n:'⛽ SPBU Lohbener',f:'spbu.html',c:[-6.4030,108.2500]},
    {n:'🏡 Desa Larangan Real',f:'larangan.html',c:[-6.407979,108.256639]},
    {n:'🚏 Busstop Larangan Real',f:'larangan.html',c:[-6.40458555,108.2670992]},
    {n:'⭐ GERBANG CELENG LOHBENER',f:'larangan.html',c:[-6.39514938,108.28548697]},
    {n:'🏪 Pasar Patrol',f:'pasar.html',c:[-6.31421005,107.99739269]},
    {n:'🏪 Pasar Jatibarang',f:'pasar.html',c:[-6.47293261,108.30617431]},
    {n:'🚌 Terminal Indramayu',f:'patrol-jalan.html',c:[-6.33585815,108.33462292]},
    {n:'👨‍🌾 Petani 9 Orang',f:'sawah.html',c:[-6.4550,108.2720]},
    {n:'👨‍🌾 Petani Bubble Sawah',f:'sawah2.html',c:[-6.4490,108.2640]},
  ];
  for(let i=0;i<cfg.count;i++){
    const tp=TEMPAT[Math.floor(Math.random()*TEMPAT.length)];
    const rr=Math.max(cfg.radius*0.25,0.008);
    targets.push({
      lat: tp.c[0]+randOffset(rr),
      lng: tp.c[1]+randOffset(rr),
      found:false, tp:tp
    });
  }
  map.fitBounds(L.latLngBounds(targets.map(t=>[t.lat,t.lng])),{padding:[50,50]});
  startTimer();
}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    timeLeft--;
    document.getElementById('timer').textContent = timeLeft;
    if(timeLeft<=0){
      endGame(false);
    }
  },1000);
}

function resetGame(fullReset=true){
  clearInterval(timerInterval);
  targets=[]; found=0; attempt=0; gameActive=false;
  document.getElementById('found').textContent='0/'+(levels[level-1]?.count||3);
  document.getElementById('attempt').textContent='0';
  document.getElementById('timer').textContent= levels[level-1]?.time||60;
  foundMarkers.forEach(m=>map.removeLayer(m));
  pulseMarkers.forEach(m=>map.removeLayer(m));
  foundMarkers=[]; pulseMarkers=[];
  document.getElementById('clueBox').className='clue';
  if(fullReset){ document.getElementById('clueBox').textContent='👀 Jalur REAL sudah aktif! Tap Mulai Level.'; }
  closeModal();
}

map.on('click', function(e){
  if(!gameActive){ document.getElementById('clueBox').textContent='⚠️ Tekan Mulai Level dulu!'; return; }
  attempt++;
  document.getElementById('attempt').textContent=attempt;
  checkGuess(e.latlng.lat, e.latlng.lng);
});

function checkGuess(lat,lng){
  const guess = L.latLng(lat,lng);
  let minDist = Infinity;
  let nearestIdx = -1;
  targets.forEach((t,i)=>{
    if(t.found) return;
    const d = guess.distanceTo(L.latLng(t.lat,t.lng));
    if(d<minDist){ minDist=d; nearestIdx=i; }
  });

  const tap = L.circleMarker([lat,lng],{radius:6,color:'#fff',fillColor:'#ffd700',fillOpacity:0.8}).addTo(map);
  setTimeout(()=>map.removeLayer(tap),1500);

  if(minDist < 120){
    targets[nearestIdx].found=true;
    found++;
    document.getElementById('found').textContent=found+'/'+targets.length;
    const icon = L.divIcon({html:'<div style="font-size:24px">🧒</div>',iconSize:[24,24],className:''});
    const tp = targets[nearestIdx].tp;
    const m = L.marker([targets[nearestIdx].lat, targets[nearestIdx].lng],{icon}).addTo(map).bindPopup(`Ketemu di ${tp?tp.n:'Indramayu'}! 🎉<br><a href="${tp?tp.f:'index.html'}" style="display:inline-block;margin-top:6px;background:#ffd700;color:#000;font-weight:bold;padding:8px 14px;border-radius:8px;text-decoration:none">▶ LIHAT 3D</a>`).openPopup();
    foundMarkers.push(m);

    const box=document.getElementById('clueBox');
    box.textContent=`🎉 KETEMU di ${tp?tp.n:''}! Tap marker → LIHAT 3D! Tinggal ${targets.length-found} lagi!`;
    box.className='clue win';

    if(found===targets.length){ endGame(true); }
  } else {
    let msg='';
    let cls='clue';
    if(minDist < 300){ msg=`🔥 PANAS BANGET! ${Math.round(minDist)}m lagi!`; cls='clue hot'; }
    else if(minDist < 700){ msg=`🌡️ Hangat... ${Math.round(minDist)}m - dekat!`; cls='clue'; }
    else if(minDist < 1500){ msg=`❄️ Dingin... ${Math.round(minDist)}m`; cls='clue cold'; }
    else { msg=`🧊 BEKU! ${Math.round(minDist)}m - masih jauh`; cls='clue cold'; }
    const box=document.getElementById('clueBox');
    box.textContent=msg;
    box.className=cls;
  }
}

function getHint(){
  if(!gameActive || targets.filter(t=>!t.found).length===0) return;
  timeLeft = Math.max(0,timeLeft-5);
  const remaining = targets.filter(t=>!t.found);
  const t = remaining[Math.floor(Math.random()*remaining.length)];
  const pulseIcon = L.divIcon({html:'<div class="pulse"></div>',iconSize:[22,22],className:''});
  const pm = L.marker([t.lat,t.lng],{icon:pulseIcon}).addTo(map);
  pulseMarkers.push(pm);
  setTimeout(()=>{ map.removeLayer(pm); }, 3000);
  document.getElementById('clueBox').textContent='💡 Kilatan kuning 3 detik! (-5 detik)';
}

function endGame(win){
  clearInterval(timerInterval);
  gameActive=false;
  const modal=document.getElementById('modalWin');
  if(win){
    document.getElementById('modalTitle').textContent='🎉 MENANG!';
    document.getElementById('modalText').innerHTML=`Level ${level} selesai!<br>Ditemukan ${found} orang dalam ${attempt} tebakan<br>Sisa waktu: ${timeLeft}s`;
  } else {
    document.getElementById('modalTitle').textContent='⏰ WAKTU HABIS!';
    document.getElementById('modalText').innerHTML=`Kamu baru nemu ${found}/${targets.length}<br>Coba lagi!`;
    targets.filter(t=>!t.found).forEach(t=>{
      const icon = L.divIcon({html:'<div style="font-size:24px;opacity:0.6">👻</div>',iconSize:[24,24],className:''});
      const m = L.marker([t.lat,t.lng],{icon}).addTo(map).bindPopup('Di sini dia ngumpet!').openPopup();
      foundMarkers.push(m);
    });
  }
  modal.classList.add('show');
}

function nextLevel(){
  closeModal();
  if(found===targets.length && level < levels.length){
    level++;
  }
  startGame();
}

function closeModal(){ document.getElementById('modalWin').classList.remove('show'); }

resetGame();
</script>
</body>
</html>
