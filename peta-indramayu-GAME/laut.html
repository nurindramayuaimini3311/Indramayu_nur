   var B=['🐟 Ikan segar','🦐 Udang','🧂 Garam','🥥 Kelapa'];
   var w=document.getElementById('mbBarang');
   B.forEach(function(t){var s=document.createElement('span');s.textContent=t;w.appendChild(s);});
   var mbWA=document.getElementById('mbWA').textContent.replace(/-/g,'');
   var wa='62'+mbWA.replace(/^0?8/,'8');
   document.getElementById('mbWAbtn').href='https://wa.me/'+wa;
   // like (contoh, simpan lokal)
   var n=12;
   if(localStorage.getItem('mbLautLike')){n=parseInt(localStorage.getItem('mbLautLike'));}
   document.getElementById('mbLk').textContent=(n===12&&!localStorage.getItem('mbLautState'))?('12 suka'):(n+' suka');
   window.mbLike=function(){
     var st=localStorage.getItem('mbLautState');
     var n2=parseInt(localStorage.getItem('mbLautLike')||'12');
     if(st==='liked'){localStorage.setItem('mbLautLike',String(Math.max(0,n2-1)));localStorage.removeItem('mbLautState');document.getElementById('mbLikeBtn').textContent='🤍 Like';document.getElementById('mbLikeBtn').style.color='#aaa';}
     else{localStorage.setItem('mbLautLike',String(n2+1));localStorage.setItem('mbLautState','liked');document.getElementById('mbLikeBtn').textContent='💛 Like';document.getElementById('mbLikeBtn').style.color='#FFD700';}
     document.getElementById('mbLk').textContent=(parseInt(localStorage.getItem('mbLautLike')||'12'))+' suka';
   };
   window.mbHide=function(){document.getElementById('mb').style.display='none';};
 })();
</script>

<body><canvas id="c"></canvas>
<div class="top"><a class="back" href="index.html">← PETA</a><div class="pill">🌊 LAUT ERETAN - KANDANGHAUR</div></div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;
const s=new THREE.Scene();s.background=new THREE.Color(0x87b5e0);
const c=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);c.position.set(11,7,13);
const o=new OrbitControls(c,r.domElement);o.target.set(0,0,0);o.enableDamping=true;o.autoRotate=true;o.autoRotateSpeed=.8;
s.add(new THREE.HemisphereLight(0xffffff,0x334455,.9));
const d=new THREE.DirectionalLight(0xffffff,1.5);d.position.set(10,15,8);d.castShadow=true;s.add(d);
// pasir + laut
const ps=new THREE.Mesh(new THREE.PlaneGeometry(12,60),new THREE.MeshStandardMaterial({color:0xe8d8a0}));ps.rotation.x=-Math.PI/2;ps.position.set(-14,.02,0);ps.receiveShadow=true;s.add(ps);
const lt=new THREE.Mesh(new THREE.PlaneGeometry(48,60),new THREE.MeshStandardMaterial({color:0x1e90d6,roughness:.3}));lt.rotation.x=-Math.PI/2;lt.position.set(16,.03,0);lt.receiveShadow=true;s.add(lt);
// ombak
const om=[];for(let i=0;i<8;i++){const w=new THREE.Mesh(new THREE.PlaneGeometry(10+Math.random()*8,1),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.6}));
w.rotation.x=-Math.PI/2;w.position.set(-2+Math.random()*8,.06,-26+i*7);s.add(w);om.push(w);}
// perahu + nelayan
const pr=new THREE.Group();
const bd=new THREE.Mesh(new THREE.BoxGeometry(1.8,.7,5.5),new THREE.MeshStandardMaterial({color:0x2244aa}));bd.castShadow=true;pr.add(bd);
const ti=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,3,6),new THREE.MeshStandardMaterial({color:0x6b4a1f}));ti.position.y=1.8;pr.add(ti);
const ly=new THREE.Mesh(new THREE.PlaneGeometry(2.2,1.8),new THREE.MeshStandardMaterial({color:0xffffff,side:THREE.DoubleSide}));ly.position.y=2.2;pr.add(ly);
pr.position.set(8,.4,0);s.add(pr);
// ikan
const ik=[];for(let i=0;i<7;i++){const f=new THREE.Mesh(new THREE.ConeGeometry(.25,1,7),new THREE.MeshStandardMaterial({color:i%2?0xff8800:0xcccccc}));
f.rotation.z=-Math.PI/2;f.position.set(4+Math.random()*22,.3,-20+Math.random()*40);s.add(f);ik.push({m:f,cx:f.position.x,cz:f.position.z,r:2+Math.random()*3,sp:.6+Math.random(),ph:Math.random()*6});}
// mercusuar mini
const mc=new THREE.Mesh(new THREE.CylinderGeometry(.8,1.1,6,10),new THREE.MeshStandardMaterial({color:0xffffff}));mc.position.set(-10,3,-20);mc.castShadow=true;s.add(mc);
const lp=new THREE.Mesh(new THREE.SphereGeometry(.6,10,8),new THREE.MeshStandardMaterial({color:0xffff88,emissive:0xffdd33,emissiveIntensity:1}));lp.position.set(-10,6.4,-20);s.add(lp);
addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);});r.setSize(innerWidth,innerHeight);
(function l(){requestAnimationFrame(l);const t=performance.now()/1000;
om.forEach((w,i)=>{w.position.x=Math.sin(t*.8+i)*2+2;});
pr.position.y=.4+Math.sin(t*1.5)*.2;pr.rotation.z=Math.sin(t*1.5)*.06;
ik.forEach(f=>{f.ph+=.02*f.sp;f.m.position.x=f.cx+Math.cos(f.ph)*f.r;f.m.position.z=f.cz+Math.sin(f.ph)*f.r*.6;});
lp.material.emissiveIntensity=.5+Math.abs(Math.sin(t*3));o.update();r.render(s,c);})();
</script>
<script>
const MEMBER_DB = [
  { hp: "081234567890", nama: "Raden Agung Nur",    id: "M005", level: "SULTAN SUPREME ♂" },
  { hp: "082234567890", nama: "Ratu Arum Makrifat", id: "M006", level: "SULTAN SUPREME ♀" },

  { hp: "084234567890", nama: "Nyai Sekar",         id: "M008", level: "SULTAN VIP ♀"     },
  { hp: "085234567890", nama: "Pangeran Wijaya",    id: "M009", level: "SULTAN VIP ♂"     },
  { hp: "086234567890", nama: "Putri Larasati",     id: "M010", level: "SULTAN VIP ♀"     },
  { hp: "087234567890", nama: "Bang Jago Nur",      id: "M001", level: "PLATINUM ♂"       },
  { hp: "088234567890", nama: "Kang Alam",          id: "M002", level: "GOLD ♂"           },
  { hp: "089234567890", nama: "Neng Sinar",         id: "M003", level: "SILVER ♀"         },
  { hp: "081334567890", nama: "Teh Cahaya",         id: "M004", level: "BRONZE ♀"         },
];
const NOMOR = 2;
function normalHP(raw){ let n = String(raw).replace(/\D/g,''); if(n.indexOf('62')===0) n = '0'+n.slice(2); if(n.charAt(0)!=='0') n = '0'+n; return n; }
function formatHP(n){ n = normalHP(n); return n.slice(0,4)+'-'+n.slice(4,8)+'-'+n.slice(8); }
function poinMember(){ try{ return parseInt(localStorage.getItem('alwi_poin')||'0',10)||0; }catch(e){ return 0; } }
function renderKartuMember(nomor){
  const m = MEMBER_DB[nomor-1] || MEMBER_DB[0];
  if(!m) return;
  const hp = normalHP(m.hp);
  const wa = 'https://wa.me/' + hp.replace(/^0/,'62');
  const poin = poinMember();
  const nama = document.getElementById('rwNama') || document.getElementById('mb2Nama');
  const elHp = document.getElementById('rwHp');
  const level = document.getElementById('rwLevel');
  const waLink = document.getElementById('rwWa');
  const foto = document.getElementById('sitiFoto') || document.getElementById('rwFoto');
  if(nama) nama.textContent = m.nama;
  if(elHp) elHp.textContent = formatHP(hp) + (poin>0 ? ' · ' + poin + ' poin' : '');
  if(level) level.textContent = m.id + ' · ' + m.level + ' · No. ' + nomor;
  if(waLink){ waLink.href = wa; waLink.title = wa; }
  if(foto && foto.parentElement){ foto.parentElement.onclick = function(){ location.href = wa; }; }
  window.kartuMember = function(){ return m; };
}
renderKartuMember(NOMOR);
</script>
