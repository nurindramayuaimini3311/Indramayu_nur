function sndInit(){if(AC){AC.resume();return;}try{AC=new(window.AudioContext||window.webkitAudioContext)();osc=AC.createOscillator();flt=AC.createBiquadFilter();flt.type='lowpass';gn=AC.createGain();gn.gain.value=0;osc.connect(flt);flt.connect(gn);gn.connect(AC.destination);osc.start();sndSet(cur);}catch(e){}}
function sndSet(v){if(!osc)return;const m=MESIN[v]||MESIN.mobil;osc.type=m.w;flt.frequency.value=m.lp;osc.frequency.value=m.f;}
function sndRPM(rpm){if(!AC||!osc)return;const m=MESIN[cur]||MESIN.mobil;osc.frequency.setTargetAtTime(m.f+rpm*m.s*10,AC.currentTime,.05);gn.gain.setTargetAtTime(.08,AC.currentTime,.1);}
function sndStop(){if(!AC)return;try{gn.gain.setTargetAtTime(0,AC.currentTime,.1);}catch(e){}}
function beep(f,d=.2){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}

 const m=new THREE.Mesh(new THREE.PlaneGeometry(12,2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv)}));
 m.rotation.x=-Math.PI/2;m.position.set(x,.09,z);scene.add(m);}

 c2.fillStyle='#fff';c2.fillRect(0,0,512,128);
 for(let a=0;a<8;a++)for(let b=0;b<4;b++){c2.fillStyle=(a+b)%2?'#111':'#fff';c2.fillRect(a*64,b*32,64,32);}
 c2.fillStyle='#000';c2.font='900 60px Arial';c2.textAlign='center';c2.fillText(t,256,88);return new THREE.CanvasTexture(cv);}
function finishGate(x,z,t){
 const g=new THREE.Group();
 for(const sx of[-6,6]){const tiang=new THREE.Mesh(new THREE.BoxGeometry(.5,8,.5),M(0xeeeeee,.5,.3));tiang.position.set(sx,4,z);g.add(tiang);}

 const k=new THREE.Mesh(new THREE.SphereGeometry(.25,8,8),new THREE.MeshStandardMaterial({color:0xffdbac}));k.position.set(p.position.x,2+Math.random()*.3,p.position.z);scene.add(k);
 const dock=new THREE.Mesh(new THREE.BoxGeometry(9,.3,3.5),new THREE.MeshStandardMaterial({color:0x8a5a2b,roughness:1}));dock.position.set(p.position.x>0?15:-15,.15,p.position.z);dock.rotation.y=p.position.x>0?0:Math.PI/2;scene.add(dock);
 for(const dp of[-1.5,-.5,.5,1.5]){const bcp=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,10,6),M(0x6b4a1f,.9,.1));bcp.position.set(p.position.x>0?10.5:-10.5,-5,p.position.z+dp);scene.add(bcp);}}

for(let i=0;i<4;i++){const lm=new THREE.Mesh(new THREE.SphereGeometry(.5,12,12),

// ===== MOBIL 3D (upgrade ALWI-3D-speed: bukan kotak PNG) =====
function M(c,r=.6,m=.3){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});}
function box(w,h,d,c,x=0,y=0,z=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),c);o.position.set(x,y,z);return o;}
function cyl(rt,rb,h,c,x=0,y=0,z=0,rx=0,seg=14){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),c);o.position.set(x,y,z);o.rotation.x=rx;return o;}
function wheel(r,w,x,y,z){const g=new THREE.Group();
 const t=new THREE.Mesh(new THREE.CylinderGeometry(r,r,w,18),M(0x111111,.9,0));t.rotation.z=Math.PI/2;g.add(t);
 const v=new THREE.Mesh(new THREE.CylinderGeometry(r*.55,r*.55,w+.02,10),M(0xcccccc,.4,.8));v.rotation.z=Math.PI/2;g.add(v);
 g.position.set(x,y,z);g.userData.spin=t;return g;}
function kaca(w,h,d,x,y,z){return box(w,h,d,new THREE.MeshStandardMaterial({color:0x9fd8ff,roughness:.15,metalness:.5,transparent:true,opacity:.85}),x,y,z);}
const BUILD={
 mobil(c=0xcc0000){ // JEEP MERAH FERRARI
  const G=new THREE.Group(),B=M(0xd40000,.35,.6);
  G.add(box(1.9,.65,4.2,B,0,.75,0),box(1.7,.6,2.2,M(0xaa0000,.3,.5),0,1.25,-.2),kaca(1.72,.4,1.1,0,1.25,.55));

 bus(c=0xffcc00){ // LURAGUNG JAYA ALWI KUNING JINGGA + ALWI PUTIH BELAKANG + GARIS JINGGA ATAP

  const texB=new THREE.CanvasTexture(cvB);const back=new THREE.Mesh(new THREE.PlaneGeometry(2.2,1),new THREE.MeshBasicMaterial({map:texB}));back.position.set(0,1.6,5.01);back.rotation.y=Math.PI;G.add(back);

 truk(c=0xcc0000){ // PERTAMINA PUTIH SUSU + GARIS MERAH BENDERA + KEPALA MERAH GARIS JINGGA

 tebu(){ // TRUK TEBU LOHBENER overload

bSh.onclick=()=>{if(mode==='race'&&pS.g<5)setGear(pS.g+1);};

document.getElementById('btnStop').onclick=()=>location.reload();
addEventListener('keydown',e=>{if(e.key===' ')gas=true;if(e.key==='Shift')bSh.onclick();});
addEventListener('keyup',e=>{if(e.key===' ')gas=false;});
function setLamp(i,color){const ids=['L0','L1','L2','LG'];ids.forEach((id,k)=>{document.getElementById(id).style.background=k<=i?color:'#333';});
 lampMesh.forEach((m,k)=>{m.material.emissive.set(k<=i?color:'#111111');m.material.color.set(k<=i?color:'#333333');});}
document.getElementById('bStart').onclick=()=>{
 sndInit();spawn();
 document.getElementById('start').style.display='none';
 ['hud','rpmwrap','gear'].forEach(id=>document.getElementById(id).style.display='flex');
 document.getElementById('gear').style.display='block';
 document.getElementById('ctrl').style.display='flex';
 document.getElementById('lampu').style.display='flex';
 camera.position.set(-4.2,4.2,17);camera.lookAt(-4.2,1,-6);
 mode='count';phase='stage';phaseT=0;pS={v:0,d:0,g:1,rpm:0};foes.forEach(o=>{o.v=0;o.d=0;});hasil=false;
};
function finish(menang,alasan){
 if(hasil)return;hasil=true;mode='done';sndStop();
 document.getElementById('hJudul').textContent=menang?'🏆 MENANG!':'😅 KALAH';
 document.getElementById('hIsi').textContent=alasan+` Jarakmu ${Math.round(pS.d)}m.`;
 document.getElementById('hasil').style.display='flex';
 if(menang){beep(660,.15);setTimeout(()=>beep(880,.2),180);}else beep(220,.4);
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);
 const dt=Math.min(clock.getDelta(),.05);
 if(mode==='menu'){menuA+=dt*.4;camera.position.set(Math.sin(menuA)*11,4.5,4+Math.cos(menuA)*11);camera.lookAt(0,1,-4);}
 else if(mode==='count'){
  phaseT+=dt;
  const n=Math.floor(phaseT/.7);
  if(n<3){setLamp(n,'#ffdd33');if(phase!=='n'+n){phase='n'+n;beep(440,.15);}}
  else{setLamp(3,'#22ff55');beep(880,.4);mode='race';phaseT=0;
   document.getElementById('lampu').style.display='none';}
  if(gas&&n<3){finish(false,'JUMP START! Ngegas sebelum hijau. ');}
 }else if(mode==='race'){
  phaseT+=dt;
  // player
  const st=STAT[cur];
  pS.rpm=.25+(pS.v/(pS.g*13));
  if(gas){if(pS.rpm<1.05)pS.v+=(st.acc*(1.15-pS.g*.12))*dt*ST_DT;else pS.v-=4*dt;}
  else pS.v=Math.max(0,pS.v-6*dt);
  pS.v=Math.min(pS.v,st.top);
  pS.d+=pS.v*dt;
  player.position.z=4-pS.d*(2054/2000);
  player.traverse(o=>{if(o.userData.spin)o.rotation.x-=dt*pS.v;});
  sndRPM(Math.min(pS.rpm,1));
  // 3 MUSUH AI
  for(const o of foes){
   if(phaseT>o.react){o.v=Math.min(o.v+STAT[o.vk].acc*o.skill*dt*ST_DT*.45,STAT[o.vk].top*o.skill*.8);}
   o.d+=o.v*dt;
   o.mesh.position.z=4-o.d*(2054/2000);
   o.mesh.traverse(w=>{if(w.userData.spin)w.rotation.x-=dt*o.v;});
  }
  // HUD
  document.getElementById('spd').textContent=Math.round(pS.v*3.6)+' KMH';
  document.getElementById('jarak').textContent=Math.round(pS.d)+' M';
  const rank=1+foes.filter(o=>o.d>pS.d).length;
  // HAPUS PERINGKAT - ganti jadi jarak bebas
  document.getElementById('lawan').textContent=Math.round(pS.d)+'M / '+ROAD_LEN+'M BEBAS';
  document.getElementById('rpmfill').style.width=Math.min(100,pS.rpm*100)+'%';
  document.getElementById('gear').textContent=pS.g;
  // kamera ikut
  camera.position.lerp(new THREE.Vector3(player.position.x,4.2,player.position.z+13),1-Math.pow(.01,dt));
  camera.lookAt(player.position.x,1,player.position.z-10);
  // HAPUS TIMER & FINISH - jalan panjang bebas tanpa batas waktu
  if(pS.d>=ROAD_LEN){
   pS.d=0; // loop balik ke start biar bisa jalan terus tanpa finish
   // reset posisi lawan juga
   foes.forEach(o=>o.d=0);
  }
 }
 renderer.render(scene,camera);})();
window.__booted=true;
</script>
