<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🪦 Kuburan Angker 3D - Indramayu</title><style>
*{box-sizing:border-box;margin:0}body{font-family:Arial;background:#050508;color:#fff;overflow:hidden;touch-action:none}
#c{position:fixed;inset:0;display:block}.top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;z-index:5;flex-wrap:wrap}
a.btn{background:#222;color:#fff;font-weight:900;padding:10px 14px;border-radius:12px;text-decoration:none;border:1px solid #555;font-size:13px}
a.cam{background:#0f0;color:#000;border-color:#0f0}
.pill{background:rgba(0,0,0,.65);border:1px solid #888;border-radius:12px;padding:10px 14px;font-weight:900;font-size:13px}</style>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./addons/"}}</script></head>
<body><canvas id="c"></canvas>
<div class="top"><a class="btn" href="index.html">← PETA</a><a class="btn cam" href="kamera-hantu.html">📷 KAMERA HANTU</a><div class="pill">🪦 MAKAM WIRALODRA - SINDANG</div></div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;
const s=new THREE.Scene();s.background=new THREE.Color(0x05051a);
s.fog=new THREE.FogExp2(0x0a0a20,0.035);
const c=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);c.position.set(10,5,12);
const o=new OrbitControls(c,r.domElement);o.target.set(0,1,0);o.enableDamping=true;o.autoRotate=true;o.autoRotateSpeed=.7;
s.add(new THREE.HemisphereLight(0x8888ff,0x111122,.5));
const bl=new THREE.DirectionalLight(0x8899ff,.7);bl.position.set(-8,14,6);s.add(bl); // cahaya bulan
const hj=new THREE.PointLight(0x00ff66,1.2,25);hj.position.set(0,2,0);s.add(hj); // lampu hijau angker
const g=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color:0x0d2812,roughness:1}));g.rotation.x=-Math.PI/2;g.receiveShadow=true;s.add(g);
function B(w,h,dep,co,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,dep),new THREE.MeshStandardMaterial({color:co}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m;}
// nisan berderet + cungkup Wiralodra di tengah
const nisanM=new THREE.MeshStandardMaterial({color:0x9a9a9a,roughness:.9});
for(let ix=0;ix<5;ix++)for(let iz=0;iz<4;iz++){
 if(ix===2&&iz<2)continue;
 const x=-8+ix*4,z=-6+iz*4;
 s.add(B(2.2,.35,1.1,new THREE.MeshStandardMaterial({color:0x555555}),x,.18,z)); // makam
 const n=new THREE.Mesh(new THREE.BoxGeometry(.7,1.1,.25),nisanM);n.position.set(x,.9,z-.3);n.castShadow=true;s.add(n);
 const n2=n.clone();n2.position.z=z+.3;s.add(n2);
}
// cungkup makam utama
s.add(B(6,.5,5,new THREE.MeshStandardMaterial({color:0x777777}),0,.25,2));
s.add(B(5,2.6,4,new THREE.MeshStandardMaterial({color:0xeeeeee}),0,1.8,2));
const ku=new THREE.Mesh(new THREE.ConeGeometry(3.6,2.4,4),new THREE.MeshStandardMaterial({color:0x1a6a3a}));ku.position.set(0,4.3,2);ku.rotation.y=Math.PI/4;ku.castShadow=true;s.add(ku);
s.add(B(2.2,1,.4,new THREE.MeshStandardMaterial({color:0x333333}),0,1,-.1));
// pohon beringin besar + akar
const bt=new THREE.Mesh(new THREE.CylinderGeometry(.7,1.1,7,9),new THREE.MeshStandardMaterial({color:0x2a1a0a}));bt.position.set(-11,3.5,-6);bt.castShadow=true;s.add(bt);
const rn=new THREE.Mesh(new THREE.SphereGeometry(4.5,10,8),new THREE.MeshStandardMaterial({color:0x0a3a12}));rn.position.set(-11,8,-6);rn.scale.y=.7;s.add(rn);
// bulan sabit + bintang
const mo=new THREE.Mesh(new THREE.SphereGeometry(2,16,16),new THREE.MeshBasicMaterial({color:0xffffcc}));mo.position.set(-25,22,-40);s.add(mo);
const mo2=new THREE.Mesh(new THREE.SphereGeometry(1.7,16,16),new THREE.MeshBasicMaterial({color:0x05051a}));mo2.position.set(-24,22.6,-39);s.add(mo2);
// kunang-kunang
const kun=[];for(let i=0;i<25;i++){const k=new THREE.Mesh(new THREE.SphereGeometry(.09,6,6),new THREE.MeshStandardMaterial({color:0xaaff33,emissive:0x88ff00,emissiveIntensity:2}));k.position.set(-14+Math.random()*28,.5+Math.random()*3,-12+Math.random()*24);s.add(k);kun.push({m:k,ph:Math.random()*6,sp:.5+Math.random()});}
// pocong jaga (putih goyang)
const po=new THREE.Group();
const pb=new THREE.Mesh(new THREE.CylinderGeometry(.45,.55,2,10),new THREE.MeshStandardMaterial({color:0xf0f0f0}));pb.position.y=1;po.add(pb);
const pk=new THREE.Mesh(new THREE.SphereGeometry(.4,10,10),new THREE.MeshStandardMaterial({color:0xf0f0f0}));pk.position.y=2.2;po.add(pk);
po.position.set(7,0,7);s.add(po);
addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);});r.setSize(innerWidth,innerHeight);
(function l(){requestAnimationFrame(l);const t=performance.now()/1000;
kun.forEach(k=>{k.ph+=.02*k.sp;k.m.position.y+=Math.sin(t*2+k.ph)*.01;k.m.material.emissiveIntensity=1+Math.sin(t*3+k.ph);});
po.position.y=Math.abs(Math.sin(t*2))*.25;po.rotation.y+=.01;
hj.intensity=1+Math.sin(t*4)*.3;
o.update();r.render(s,c);})();
</script><script src="alwi_bubble4.js"></script></body></html>
