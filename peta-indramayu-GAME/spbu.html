<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>⛽ SPBU 3D - Indramayu</title><style>
*{box-sizing:border-box;margin:0}body{font-family:Arial;background:#0b0e14;color:#fff;overflow:hidden;touch-action:none}
#c{position:fixed;inset:0;display:block}.top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;z-index:5;flex-wrap:wrap}
a.back{background:#ff2222;color:#fff;font-weight:900;padding:10px 16px;border-radius:12px;text-decoration:none}
.pill{background:rgba(0,0,0,.6);border:1px solid #ff2222;border-radius:12px;padding:10px 14px;font-weight:900;font-size:13px}</style>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./addons/"}}</script></head>
<body><canvas id="c"></canvas>
<div class="top"><a class="back" href="index.html">← PETA</a><div class="pill">⛽ SPBU - MOTOR ISI BENSIN</div></div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;
const s=new THREE.Scene();s.background=new THREE.Color(0x87b5e0);
const c=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);c.position.set(11,7,13);
const o=new OrbitControls(c,r.domElement);o.target.set(0,1.5,0);o.enableDamping=true;o.autoRotate=true;o.autoRotateSpeed=.8;
s.add(new THREE.HemisphereLight(0xffffff,0x334455,.9));
const d=new THREE.DirectionalLight(0xffffff,1.5);d.position.set(10,15,8);d.castShadow=true;s.add(d);
function M(co,r=.6,m=.2){return new THREE.MeshStandardMaterial({color:co,roughness:r,metalness:m});}
function B(w,h,dep,co,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,dep),typeof co==='number'?M(co):co);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;return o;}
const g=new THREE.Mesh(new THREE.PlaneGeometry(60,44),M(0x999999,1));g.rotation.x=-Math.PI/2;g.receiveShadow=true;s.add(g);
// kanopi merah-putih
for(const x of[-6,6])for(const z of[-4,4])s.add(B(.5,5,.5,0xffffff,x,2.5,z));
s.add(B(15,.8,11,0xcc0000,0,5.2,0));
s.add(B(15.2,.35,11.2,0xffffff,0,4.7,0));
// 2 pompa + selang ke motor
const red=M(0xcc0000);
for(const x of[-3,3]){
 s.add(B(1.1,1.7,.8,red,x,1,0));
 const ly=new THREE.Mesh(new THREE.PlaneGeometry(.7,.5),new THREE.MeshBasicMaterial({color:0xffffff}));ly.position.set(x,1.2,.42);s.add(ly);
 const sl=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,2.4,6),M(0x111111));sl.position.set(x+1,1,-.6);sl.rotation.z=.5;sl.rotation.x=.4;s.add(sl);
}
// MOTOR + orang isi bensin (2 unit)
function motor(x,z,wm){
 const gr=new THREE.Group();
 const banM=new THREE.MeshStandardMaterial({color:0x111111,roughness:.9});
 for(const dz of[-.9,.9]){const w=new THREE.Mesh(new THREE.TorusGeometry(.32,.11,8,16),banM);w.position.set(0,.32,dz);w.castShadow=true;gr.add(w);}
 gr.add(B(.5,.5,1.6,wm,0,.75,0));
 gr.add(B(.45,.15,.9,0x111111,0,1.05,-.2));
 const st=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.9,6),M(0x888888,.4,.7));st.position.set(0,1.3,.8);st.rotation.x=.4;gr.add(st);
 const lamp=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),new THREE.MeshStandardMaterial({color:0xffffcc,emissive:0xffee88,emissiveIntensity:.8}));lamp.position.set(0,1.1,.95);gr.add(lamp);
 // orang berdiri isi bensin
 const org=new THREE.Group();
 const bd=new THREE.Mesh(new THREE.BoxGeometry(.5,.7,.3),M(0x2255cc));bd.position.y=.85;org.add(bd);
 const kp=new THREE.Mesh(new THREE.SphereGeometry(.2,10,10),M(0xffdbac));kp.position.y=1.4;org.add(kp);
 const l1=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.5),M(0x2255cc));l1.position.set(0,.35,0);org.add(l1);
 org.position.set(1.1,0,.2);gr.add(org);
 gr.position.set(x,0,z);gr.rotation.y=.25;gr.traverse(o=>{o.castShadow=true;});s.add(gr);return gr;
}
motor(-3,3.2,0xcc0000);motor(3,3.2,0x2255cc);
// petugas SPBU
const pt=new THREE.Group();
const pb=new THREE.Mesh(new THREE.BoxGeometry(.55,.75,.32),M(0xcc0000));pb.position.y=.9;pt.add(pb);
const pk=new THREE.Mesh(new THREE.SphereGeometry(.2,10,10),M(0xffdbac));pk.position.y=1.45;pt.add(pk);
const ph=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.1,10),M(0xcc0000));ph.position.y=1.62;pt.add(ph);
pt.position.set(0,0,-2.5);s.add(pt);
// papan SPBU + harga
function papan(txt,bg){const cv=document.createElement('canvas');cv.width=512;cv.height=160;const x=cv.getContext('2d');
 x.fillStyle=bg;x.fillRect(0,0,512,160);x.fillStyle='#fff';x.font='bold 64px Arial';x.textAlign='center';x.fillText(txt,256,80);
 x.font='bold 30px Arial';x.fillStyle='#ffdd33';x.fillText('PERTALITE 10.000 / PERTAMAX 12.500',256,125);
 return new THREE.CanvasTexture(cv);}
const pp=new THREE.Mesh(new THREE.BoxGeometry(9,2.8,.4),new THREE.MeshStandardMaterial({map:papan('SPBU PERTAMINA','#cc0000')}));pp.position.set(0,9.5,-6);s.add(pp);
const ti=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,9,6),M(0x333333));ti.position.set(-4,4.5,-6);s.add(ti);
const ti2=ti.clone();ti2.position.x=4;s.add(ti2);
addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);});r.setSize(innerWidth,innerHeight);
(function l(){requestAnimationFrame(l);const t=performance.now()/1000;
pt.position.y=Math.abs(Math.sin(t*2))*.08;
o.update();r.render(s,c);})();
</script><script src="alwi_bubble4.js"></script></body></html>
